[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "engineeringagent"
version = "0.1.0"
description = "Feature-driven harness for human-gated coding loops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2",
  "pydantic>=2.11.0",
]

[project.scripts]
engineeringagent = "engineeringagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineeringagent"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: tests requiring external tools or services",
]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "pyright>=1.1.405",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]
pypi = [
    "build>=1.4.0",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]

[tool.ruff.lint]
extend-select = [
    "D103", # undocumented public function
    "D417", # docstring arguments are not fully documented
    "C901", # function complexity threshold
    "PLR0912", # branch count threshold
    "PLR0913", # argument count threshold
    "PLR0915", # statement count threshold
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-branches = 32
max-args = 5
max-statements = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.project_urls]
Source  = "https://github.com/soetang/engineeringagent"
