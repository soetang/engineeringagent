[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "engineeringagent"
version = "0.4.0"
description = "A framework for running coding agents as long running tasks - with deterministic feedback loops and agent reviewers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pathspec>=0.12.1",
  "PyYAML>=6.0.2",
  "pydantic>=2.11.0",
  "typer>=0.16.0",
  "tomli>=2.0.1",
]

[project.scripts]
engineeringagent = "engineeringagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineeringagent"]
include = ["src/engineeringagent/**/*.md"]

[tool.pytest.ini_options]
addopts = "--cov=engineeringagent --cov-report= --cov-fail-under=95 -n 2"
markers = [
  "integration: tests requiring external tools or services",
]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "coverage>=7.10.0",
    "pylint>=3.0.0",
    "pyright>=1.1.405",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
    "twine>=6.2.0",
]
pypi = [
    "build>=1.4.0",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]

[tool.ruff.lint]
extend-select = [
  "D103",  # undocumented public function
  "D417",  # docstring arguments are not fully documented
  "C901",  # function complexity threshold
  "PLR0912",  # branch count threshold
  "PLR0913",  # argument count threshold
  "PLR0915",  # statement count threshold
]

[tool.ruff.lint.per-file-ignores]
"src/engineeringagent/cli.py" = [
  "PLR0913",
]
"src/engineeringagent/cli_typer.py" = [
  "PLR0913",
]
"src/engineeringagent/loop.py" = [
  "PLR0913",
]
"src/engineeringagent/opencode/client.py" = [
  "PLR0913",
]
"harness/fitness-functions/*.py" = [
  "D103",
  "D417",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 32
max-args = 5
max-statements = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pylint]
# Presence of this table signals pylint to read pyproject.toml.

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "missing-module-docstring", # C0114
  "line-too-long",            # C0301
]

[tool.pylint."BASIC"]
no-docstring-rgx = "^(_|test_)"

[tool.pylint."IMPORTS"]
allow-any-import-level = true

[tool.pylint."DESIGN"]
max-module-lines = 3500
max-args = 14
max-positional-arguments = 14
max-locals = 25
max-returns = 20
max-branches = 25
max-statements = 100
max-nested-blocks = 6
min-public-methods = 0

[tool.pylint."SIMILARITIES"]
min-similarity-lines = 200

[tool.setuptools.project_urls]
Source  = "https://github.com/soetang/engineeringagent"
