[project]
name = "developer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soetang", email = "benjamin@soetang.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[project.scripts]
developer = "developer.presentation.cli:app"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "pyrefly>=0.56.0",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
