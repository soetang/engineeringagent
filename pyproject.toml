[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "engineeringagent"
version = "0.1.0"
description = "Feature-driven harness for human-gated coding loops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
]

[project.scripts]
engineeringagent = "engineeringagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineeringagent"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: tests requiring external tools or services",
]
