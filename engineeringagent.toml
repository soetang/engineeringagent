[quality]
checks_path = "harness/checks.yaml"

[implementation]
max_iterations = 60

[prompts]
implementation_prompt_path = "harness/prompts/implementation_prompt.md"
commit_prompt_path = "harness/prompts/commit_message_prompt.md"
pull_request_prompt_path = "harness/prompts/pull_request_prompt.md"

[agents]
backend = "codex"
profile = "implementation"

[workspaces]
default_provider = "git_worktree"
state_dir = ".engineeringagent/state"
git_worktree_root_dir = "engineeringagent-workspaces"

[version_control]
enabled = true
[forge]
enabled = true
