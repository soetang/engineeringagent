contract_version: '1.0'
profiles:
  precommit:
  - yaml_validate
  - spec_validate
  - fitness_validate
  - mdformat_validate
  - ruff_validate
  - pyright_validate
  - pytest_validate
  loop_fast:
  - spec_validate
  - fitness_validate
gates:
  yaml_validate:
    run: uv run python harness/validate_yaml.py
  spec_validate:
    run: uv run python -m engineeringagent.cli validate
    on_change:
    - docs/spec/**/*.yaml
    - docs/spec/**/*.yml
    - docs/spec/**/*.json
  fitness_validate:
    run: uv run python -m engineeringagent.cli fitness run --format json
  mdformat_validate:
    run: uv run mdformat --check README.md AGENTS.md docs/references/docs-architecture-llms.md
  ruff_validate:
    run: uv run ruff check src/engineeringagent
    on_change:
    - src/**/*.py
    - tests/**/*.py
    - harness/**/*.py
  pyright_validate:
    run: uv run pyright src/engineeringagent tests harness
    on_change:
    - src/**/*.py
    - tests/**/*.py
    - harness/**/*.py
  pytest_validate:
    run: uv run pytest -q
    on_change:
    - src/**/*.py
    - tests/**/*.py
    - harness/**/*.py
  opencode_permission_probe:
    run: uv run python harness/permission_probe.py
