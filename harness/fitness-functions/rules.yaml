contract_version: "1.0"
rules:
  - rule_id: architecture.dep-directionality
    name: Dependency directionality
    summary: Enforce core module import direction boundaries.
    rationale: Keeps orchestration and contracts layered for reviewability.
    remediation: Refactor imports to follow the declared architecture boundaries.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_dependency_directionality.py
  - rule_id: architecture.harness-src-import-allowlist
    name: Harness-to-src import allowlist
    summary: Restrict harness fitness functions to a narrow supported engineeringagent surface.
    rationale: Prevents harness scripts from depending on orchestration/runtime internals that are not part of the supported authoring API.
    remediation: Replace forbidden imports with the supported helpers under engineeringagent.fitness.*.
    scope: harness/fitness-functions
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_harness_src_import_allowlist.py
  - rule_id: architecture.loop-subprocess-boundary
    name: Loop subprocess boundary
    summary: Enforce subprocess allowlist boundaries for command adapters/clients.
    rationale: Centralizes command execution paths for consistent control.
    remediation: Move OpenCode command execution to engineeringagent.opencode.client
      and Git command execution to engineeringagent.git.client.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_subprocess_boundary.py
  - rule_id: architecture.markdown-locality-reference-coverage
    name: Markdown locality and reference coverage
    summary: Restrict markdown to approved paths and require non-doc markdown files
      to be referenced in-repo.
    rationale: Prevents markdown sprawl and orphaned non-doc markdown assets across
      repository zones.
    remediation: Move markdown under approved roots and add at least one deterministic
      in-repo reference for each markdown file outside docs/.
    scope: repository markdown (*.md)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_markdown_locality_reference_coverage.py
  - rule_id: architecture.no-doc-content-tests
    name: No doc-content tests
    summary: Prevent pytest from asserting exact wording in README/docs markdown.
    rationale: Doc wording is intentionally flexible; tests should cover functionality instead.
    remediation: Delete or refactor tests that read README.md or docs/**/*.md and assert substrings.
    scope: tests
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_doc_content_tests.py
  - rule_id: architecture.prompt-locality
    name: Prompt locality
    summary: Keep canonical loop prompt content and template reads localized.
    rationale: Prevents prompt drift and duplicate canonical wording across modules.
    remediation: Move canonical prompt text and template reads to engineeringagent.prompts
      templates/renderer modules.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_prompt_locality.py
  - rule_id: architecture.retry-feedback-no-truncation
    name: Retry feedback no truncation
    summary: Block truncation-by-slicing in retry feedback prompt injection.
    rationale: Prevents prompt retries from losing the most relevant failure details.
    remediation: Remove truncation-by-slicing from retry feedback injection; bound retry
      feedback by contract caps and canonical re-serialization.
    scope: src/engineeringagent/prompts/renderer.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_retry_feedback_no_truncation.py
  - rule_id: architecture.progress-log-path-locality
    name: Progress log path locality
    summary: Centralize loop progress artifact paths and writes behind approved helpers.
    rationale: Prevents regressions that reintroduce inline progress/log path literals or direct file writes.
    remediation: Construct paths via engineeringagent.progress.paths and write loop log sinks via engineeringagent.progress.logging.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_progress_log_locality.py
  - rule_id: architecture.scaffold-template-locality
    name: Scaffold template locality
    summary: Keep scaffold template payloads in scaffold_templates assets.
    rationale: Prevents init scaffold regressions from drifting back to inline template
      payloads in source modules.
    remediation: Move scaffold template bodies to engineeringagent.scaffold_templates
      assets and load them via engineeringagent.init_scaffold.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_scaffold_template_locality.py
  - rule_id: architecture.scaffold-docs-exact-sync
    name: Scaffold docs exact sync
    summary: Enforce byte-for-byte sync between selected docs and scaffold templates.
    rationale: Prevents drift between canonical docs/ and init scaffold templates.
    remediation: Update scaffold template files to match canonical docs per harness/scaffold_policy.yaml.
    scope: docs and src/engineeringagent/scaffold_templates
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_scaffold_docs_exact_sync.py
  - rule_id: architecture.docs-allowlist-policy
    name: Docs allowlist policy
    summary: Require each docs_root markdown file to be listed in exactly one policy list.
    rationale: Keeps docs additions explicit and reviewable by classifying each file as human-facing or agent-facing.
    remediation: Add every docs markdown file to exactly one of human_docs or agent_docs in harness/scaffold_policy.yaml.
    scope: docs_root markdown (*.md) excluding docs_root/spec/**
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_docs_allowlist_policy.py
  - rule_id: architecture.scaffold-template-agents-doc-links
    name: Scaffold template AGENTS doc links
    summary: Require scaffolded reference docs to be linked from scaffold AGENTS.md.
    rationale: Keeps scaffolded reference docs discoverable and prevents drift between what init scaffolds and what AGENTS.md points users to.
    remediation: Add missing links and short descriptions for each scaffolded reference doc in src/engineeringagent/scaffold_templates/AGENTS.md.
    scope: src/engineeringagent/scaffold_templates/AGENTS.md
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_scaffold_template_agents_doc_links.py
  - rule_id: architecture.loop-facade-line-budget
    name: Loop facade line budget
    summary: Enforce a permanent line budget cap for the loop facade.
    rationale: Keeps engineeringagent.loop concise as the compatibility facade seam.
    remediation: Move non-control-flow internals into engineeringagent.loop_runtime modules.
    scope: src/engineeringagent/loop.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_facade_line_budget.py
  - rule_id: architecture.no-facade-varargs-shims
    name: No facade varargs shims
    summary: Block facade varargs shims, __signature__ masking, and hidden kwargs dropping.
    rationale: Keeps loop orchestration contracts explicit and typed instead of compatibility shims.
    remediation: Replace varargs facade wrappers with explicit typed contracts and remove hidden kwargs dropping.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_facade_varargs_shims.py
  - rule_id: architecture.source-first-loop-command-policy
    name: Source-first loop command policy
    summary: Enforce source-first workspace execution for loop command surfaces.
    rationale: Prevent stale cached package artifacts from bypassing current workspace source.
    remediation: Replace forbidden in-repo uvx self-invocations with source-first
      forms; prefer uv run engineeringagent ...
    scope: docs/spec/features/*.yaml and harness/checks.yaml
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_source_first_loop_commands.py
  - rule_id: architecture.harness-root-yaml-only
    name: Harness root YAML-only
    summary: Enforce YAML-only regular files directly under harness root.
    rationale: Keeps harness root manifest-only and prevents executable/policy file
      sprawl at repository root policy surfaces.
    remediation: Move non-YAML root files under harness/fitness-functions or another
      harness subdirectory; keep only *.yaml/*.yml files at harness root.
    scope: harness/ (regular files at root)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_harness_root_yaml_only.py
  - rule_id: architecture.no-stdlib-dataclasses-in-src
    name: No stdlib dataclasses in src
    summary: Block stdlib dataclasses usage in production source models.
    rationale: Enforces a single Pydantic BaseModel contract in src/engineeringagent.
    remediation: Replace stdlib dataclasses usage with pydantic.BaseModel models.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_stdlib_dataclasses_in_src.py
  - rule_id: architecture.no-non-ignorable-ruff-suppressions
    name: No non-ignorable Ruff suppressions
    summary: Block suppression directives for configured high-value Ruff rules.
    rationale: Keep lint policy enforceable by requiring refactor-first remediation.
    remediation: Remove inline/file-level ignore directives and refactor; for PLR0913,
      group related arguments into a NamedTuple or pydantic model.
    scope: src tests harness
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_non_ignorable_ruff_suppressions.py
      - --rule-id
      - architecture.no-non-ignorable-ruff-suppressions
      - --blocked-rule-id
      - D103
      - --blocked-rule-id
      - PLR0913
      - --scan-root
      - src
      - --scan-root
      - tests
      - --scan-root
      - harness
  - rule_id: smoke.opencode-real-hello-world
    name: Real OpenCode hello-world smoke
    summary: Validate the real agent loop end-to-end in an isolated temp repository.
    rationale: Catches regressions where the OpenCode subprocess/loop stops mid-implementation.
    remediation: Run with ENGINEERINGAGENT_REAL_OPENCODE_SMOKE=1 and resolve reported loop/setup errors.
    scope: repository (temp repo)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_real_opencode_hello_world_smoke.py
    timeout_seconds: 900
