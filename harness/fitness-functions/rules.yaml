contract_version: "1.0"
rules:
  - rule_id: architecture.dep-directionality
    name: Dependency directionality
    summary: >-
      Enforce ports-and-adapters dependency direction boundaries across
      presentation, application, ports, and domain seams.
    rationale: >-
      Keeps presentation, application, ports, and domain modules aligned with
      the target architecture while isolating bootstrap and adapters as outer
      layers.
    remediation: >-
      Refactor imports to preserve the declared layer boundaries: presentation
      depends inward, application uses ports/domain only, ports stay
      contract-only, and domain stays isolated.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/dependency_directionality.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_dependency_directionality.py
  - rule_id: architecture.module-statement-budget
    name: Module statement budget
    summary: Enforce AST-based non-doc statement caps for Python modules.
    rationale: Limits module sprawl using executable structure so review and retrieval stay cohesive as packages evolve.
    remediation: Reduce duplicated control-flow before splitting; extract cohesive concerns into existing folders first, or into a clearly named domain subpackage when needed; avoid root-level helper sprawl; for tests, prefer fixtures/builders/parametrization over repeated setup/assertions.
    scope: src/engineeringagent, harness, and tests
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/module_statement_budget_policy.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_module_statement_budget.py
  - rule_id: architecture.harness-src-import-allowlist
    name: Harness-to-src import allowlist
    summary: Restrict harness fitness functions to a narrow supported engineeringagent surface.
    rationale: Prevents harness scripts from depending on orchestration/runtime internals that are not part of the supported authoring API.
    remediation: Replace forbidden imports with the supported helpers under engineeringagent.checks.*.
    scope: harness/fitness-functions
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_harness_src_import_allowlist.py
  - rule_id: architecture.checks-import-surface
    name: Checks import surface
    summary: Enforce a narrow import surface for engineeringagent.checks.
    rationale: Prevents production modules from depending on checks submodule internals that are not part of the supported stable API.
    remediation: Replace engineeringagent.checks.<submodule> imports with allowed top-level names from engineeringagent.checks.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_checks_import_surface.py
  - rule_id: architecture.loop-subprocess-boundary
    name: Loop subprocess boundary
    summary: Enforce subprocess allowlist boundaries for command adapters/clients.
    rationale: Centralizes command execution paths for consistent control.
    remediation: Move OpenCode command execution to engineeringagent.agents.backends.opencode.client
      and Git command execution to engineeringagent.adapters.vcs.git_cli.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_subprocess_boundary.py
    config_file: policies/loop_subprocess_boundary_policy.yaml
  - rule_id: architecture.agents-backends-boundary
    name: Agents/backends boundary
    summary: Forbid direct backend package usage outside the agents boundary.
    rationale: Keeps backend implementations an internal detail behind engineeringagent.agents.run_agent.
    remediation: Replace direct engineeringagent.agents.backends imports with engineeringagent.agents.run_agent.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_agents_backends_boundary.py
  - rule_id: architecture.backend-literal-locality-budget
    name: Backend literal locality budget
    summary: Enforce a zero-budget backend literal locality boundary outside allowed packages.
    rationale: Keeps backend-coupling tokens localized to backend-owned modules and checks adapters.
    remediation: Remove backend-specific literals from core modules or move backend-specific behavior under engineeringagent.agents or engineeringagent.checks.
    scope: src/engineeringagent excluding src/engineeringagent/agents/** and src/engineeringagent/checks/**
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/backend_literal_locality_budget.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_backend_literal_locality_budget.py
  - rule_id: architecture.markdown-locality-reference-coverage
    name: Markdown locality and reference coverage
    summary: Restrict markdown to approved paths and require non-doc markdown files
      to be referenced in-repo (excluding prompt/scaffold template asset roots).
    rationale: Prevents markdown sprawl and orphaned non-doc markdown assets across
      repository zones while allowing internal template assets to remain self-contained.
    remediation: Move markdown under approved roots and add at least one deterministic
      in-repo reference for each eligible markdown file outside docs/ (excluding
      src/engineeringagent/prompts/templates/, src/engineeringagent/scaffold_templates/,
      and backend scaffold templates).
    scope: repository markdown (*.md)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_markdown_locality_reference_coverage.py
  - rule_id: architecture.no-doc-content-tests
    name: No doc-content tests
    summary: Prevent pytest from asserting exact wording in README/docs markdown.
    rationale: Doc wording is intentionally flexible; tests should cover functionality instead.
    remediation: Delete or refactor tests that read README.md or docs/**/*.md and assert substrings.
    scope: tests
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_doc_content_tests.py
  - rule_id: architecture.hermetic-fitness-test-isolation
    name: Hermetic fitness test isolation
    summary: Prevent tests/fitness from scanning the live repository checkout.
    rationale: Keeps pytest focused on synthetic fixture behavior while reserving real-repo compliance for harness and gate execution.
    remediation: Pass a synthetic temp fixture as the checker project root/cwd and keep any real-repo cases in the explicit integration allowlist.
    scope: tests/fitness
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/hermetic_fitness_test_isolation.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_hermetic_fitness_test_isolation.py
  - rule_id: architecture.no-env-key-reads
    name: No env-key reads
    summary: Forbid env-key reads (os.getenv, os.environ.get, os.environ['X'], 'X' in os.environ).
    rationale: Environment variable config is ad-hoc and hard to discover; configuration must come from engineeringagent.toml.
    remediation: Remove env-key reads; load configuration from engineeringagent.toml (with pyproject fallback) and pass explicit values through contracts.
    scope: src/ harness/ tests/
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_env_key_reads.py
  - rule_id: architecture.prompt-locality
    name: Prompt locality
    summary: Keep canonical loop prompt content and template reads localized.
    rationale: Prevents prompt drift and duplicate canonical wording across modules.
    remediation: Move canonical prompt text and template reads to engineeringagent.prompts
      templates/renderer modules.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_prompt_locality.py
  - rule_id: architecture.progress-log-path-locality
    name: Progress log path locality
    summary: Centralize loop progress artifact paths and writes behind approved helpers.
    rationale: Prevents regressions that reintroduce inline progress/log path literals or direct file writes.
    remediation: Construct paths via engineeringagent.progress.paths and write loop log sinks via engineeringagent.progress.logging.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_progress_log_locality.py
  - rule_id: architecture.iteration-pipeline-observer-decoupling
    name: Iteration pipeline observer decoupling
    summary: Keep iteration pipeline free of telemetry and console side effects.
    rationale: Preserves the report-plus-observer split so orchestration remains testable and side effects stay localized.
    remediation: Move telemetry and console output calls out of loop_runtime.iteration and into loop-wired observers that consume IterationReport.
    scope: src/engineeringagent/loop_runtime/iteration.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_iteration_pipeline_observer_decoupling.py
  - rule_id: architecture.scaffold-template-locality
    name: Scaffold template locality
    summary: Keep scaffold template payloads in scaffold_templates assets.
    rationale: Prevents init scaffold regressions from drifting back to inline template
      payloads in source modules.
    remediation: Move scaffold template bodies to engineeringagent.scaffold_templates
      assets and load them via engineeringagent.init_scaffold.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_scaffold_template_locality.py
  - rule_id: architecture.loop-facade-line-budget
    name: Loop facade line budget
    summary: Enforce a permanent line budget cap for the loop facade.
    rationale: Keeps engineeringagent.loop concise as the compatibility facade seam.
    remediation: Move non-control-flow internals into engineeringagent.loop_runtime modules.
    scope: src/engineeringagent/loop.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_facade_line_budget.py
  - rule_id: architecture.loop-checks-result-boundary
    name: Loop/checks result boundary
    summary: Fail when loop runtime branches on checks type/group semantics or parses checks-internal payloads.
    rationale: Keeps loop orchestration decoupled from checks internals so check-type-specific behavior stays in checks strategies.
    remediation: Consume only checks run result fields ok/output/prompt_feedback in loop runtime and remove checks-internal decision/payload parsing.
    scope: src/engineeringagent/loop_runtime/** and src/engineeringagent/loop.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_checks_result_boundary.py
  - rule_id: architecture.loop-checks-policy-ownership
    name: Loop/checks policy ownership
    summary: Fail when loop runtime encodes checks group/timing selection policy.
    rationale: Keeps loop runtime phase-driven while checks owns check-group and timing selection decisions.
    remediation: Remove loop-owned checks group maps/literals and explicit checks policy kwargs; call run_checks with phase context only.
    scope: src/engineeringagent/loop_runtime/** and src/engineeringagent/loop.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_loop_checks_policy_ownership.py
  - rule_id: architecture.checks-own-prompt-feedback-rendering
    name: Checks-owned prompt feedback rendering
    summary: Fail when loop/prompt code performs checks-specific feedback shaping outside checks strategies.
    rationale: Keeps checks failure feedback rendering owned by checks strategies so loop and prompt wiring only forward prompt_feedback.
    remediation: Remove loop/prompt checks-specific feedback builders and pass run_checks(...).prompt_feedback through unchanged.
    scope: src/engineeringagent/loop_runtime/**, src/engineeringagent/loop.py, and src/engineeringagent/prompts/renderer.py
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_checks_own_prompt_feedback_rendering.py
  - rule_id: architecture.no-facade-varargs-shims
    name: No facade varargs shims
    summary: Block facade varargs shims, __signature__ masking, and hidden kwargs dropping.
    rationale: Keeps loop orchestration contracts explicit and typed instead of compatibility shims.
    remediation: Replace varargs facade wrappers with explicit typed contracts and remove hidden kwargs dropping.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_facade_varargs_shims.py
  - rule_id: architecture.no-pure-wrapper-functions
    name: No pure wrapper functions
    summary: Block pure pass-through wrappers and keep wrapper exceptions explicit.
    rationale: Keeps architecture boundaries direct by default and prevents seam-only indirection.
    remediation: Remove pass-through wrappers, call canonical functions directly, and only add explicit allowlist exceptions with rationale when unavoidable.
    scope: src/engineeringagent and harness/fitness-functions
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/no_pure_wrapper_functions.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_pure_wrapper_functions.py
  - rule_id: architecture.source-first-loop-command-policy
    name: Source-first loop command policy
    summary: Enforce source-first workspace execution for loop command surfaces.
    rationale: Prevent stale cached package artifacts from bypassing current workspace source.
    remediation: Replace forbidden in-repo uvx self-invocations and legacy module-form
      CLI commands with source-first forms; prefer uv run engineeringagent ...
    scope: legacy spec verification, bundled plan.md phases/examples, packaged plan-session/research-session
      guidance, contributor approach docs, loop implementation prompt template,
      docs/fixtures/real_opencode_hello_world_plan_template.md, and harness/checks.yaml
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_source_first_loop_commands.py
  - rule_id: architecture.test-layout-module-mirroring
    name: Test layout module mirroring
    summary: Enforce module-mirroring test structure and explicit test-layout exceptions.
    rationale: Replaces per-topic migration assertions with a single deterministic
      policy that keeps tests aligned to source ownership boundaries.
    remediation: Move tests into mirrored module paths under tests/, or enumerate
      explicit exceptions for repository-level test policy surfaces.
    scope: tests
    severity: error
    side_effect_free: true
    adapter: command
    config_file: policies/test_layout_module_mirroring.yaml
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_test_layout_module_mirroring.py
  - rule_id: architecture.harness-root-yaml-only
    name: Harness root YAML-only
    summary: Enforce YAML-only regular files directly under harness root.
    rationale: Keeps harness root manifest-only and prevents executable/policy file
      sprawl at repository root policy surfaces.
    remediation: Move non-YAML root files under harness/fitness-functions or another
      harness subdirectory; keep only *.yaml/*.yml files at harness root.
    scope: harness/ (regular files at root)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_harness_root_yaml_only.py
  - rule_id: architecture.no-stdlib-dataclasses-in-src
    name: No stdlib dataclasses in src
    summary: Block stdlib dataclasses usage in production source models.
    rationale: Enforces a single Pydantic BaseModel contract in src/engineeringagent.
    remediation: Replace stdlib dataclasses usage with pydantic.BaseModel models.
    scope: src/engineeringagent
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_no_stdlib_dataclasses_in_src.py
  - rule_id: architecture.no-non-ignorable-ruff-suppressions
    name: No non-ignorable Ruff suppressions
    summary: Block suppression directives for configured high-value Ruff rules.
    rationale: Keep lint policy enforceable by requiring refactor-first remediation.
    remediation: Remove inline/file-level ignore directives and refactor; for PLR0913,
      group related arguments into a NamedTuple or pydantic model.
    scope: src tests harness
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_non_ignorable_ruff_suppressions.py
    config_file: policies/no_non_ignorable_ruff_suppressions.yaml
  - rule_id: smoke.opencode-real-hello-world
    name: Real OpenCode hello-world smoke
    summary: Validate the real agent loop end-to-end in an isolated temp repository.
    rationale: Catches regressions where the OpenCode subprocess/loop stops mid-implementation.
    remediation: Enable via engineeringagent.toml ([harness.fitness] opencode-real-smoke = true) and resolve reported loop/setup errors.
    scope: repository (temp repo)
    severity: error
    side_effect_free: true
    adapter: command
    command:
      - uv
      - run
      - python
      - harness/fitness-functions/check_real_opencode_hello_world_smoke.py
    timeout_seconds: 900
