rules:
  - name: "presentation-only-imports-presentation-or-application"
    paths:
      - "src/developer/presentation/**/*.py"
    allow:
      local_prefixes:
        - "developer.presentation"
        - "developer.application"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "orchestrators-only-import-orchestrators"
    paths:
      - "src/developer/orchestrators/**/*.py"
      - "!src/developer/orchestrators/loop/**/*.py"
      - "!src/developer/orchestrators/runs/**/*.py"
    allow:
      local_prefixes:
        - "developer.orchestrators"
        - "developer.tasks.protocol"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "orchestrator-loop-import-boundary"
    paths:
      - "src/developer/orchestrators/loop/**/*.py"
    allow:
      local_prefixes:
        - "developer.orchestrators.loop"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "orchestrator-runs-import-boundary"
    paths:
      - "src/developer/orchestrators/runs/**/*.py"
    allow:
      local_prefixes:
        - "developer.orchestrators.runs"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "workspaces-only-import-workspaces"
    paths:
      - "src/developer/workspaces/**/*.py"
    allow:
      local_prefixes:
        - "developer.workspaces"
        - "developer.tasks.models"
        - "developer.orchestrators.runs.protocols"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer.application"
        - "developer.orchestrators.loop"
        - "developer.orchestrators.runs"
  - name: "version-control-only-import-version-control"
    paths:
      - "src/developer/version_control/**/*.py"
    allow:
      local_prefixes:
        - "developer.version_control"
        - "developer.orchestrators.protocols"
        - "developer.orchestrators.runs.protocols"
        - "developer.agent_backends.protocol"
        - "developer.config"
        - "developer.prompts"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "forge-only-import-forge"
    paths:
      - "src/developer/forge/**/*.py"
    allow:
      local_prefixes:
        - "developer.forge"
        - "developer.orchestrators.protocols"
        - "developer.config"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "no-non-entrypoint-imports-from-presentation"
    paths:
      - "src/developer/agents/**/*.py"
      - "src/developer/application/**/*.py"
      - "src/developer/config/**/*.py"
      - "src/developer/forge/**/*.py"
      - "src/developer/orchestrators/**/*.py"
      - "src/developer/prompts/**/*.py"
      - "src/developer/quality/**/*.py"
      - "src/developer/tasks/**/*.py"
      - "src/developer/version_control/**/*.py"
      - "src/developer/workspaces/**/*.py"
    allow:
      local_prefixes: []
      relative_import_roots: []
    deny:
      local_prefixes:
        - "developer.presentation"
  - name: "application-must-not-import-presentation"
    paths:
      - "src/developer/application/**/*.py"
    allow:
      local_prefixes: []
      relative_import_roots: []
    deny:
      local_prefixes:
        - "developer.presentation"
  - name: "implementation-run-service-import-boundary"
    paths:
      - "src/developer/application/services/implementation_run_service.py"
    allow:
      local_prefixes:
        - "developer.agent_backends"
        - "developer.application"
        - "developer.config"
        - "developer.orchestrators.loop"
        - "developer.orchestrators.runs"
        - "developer.tasks"
        - "developer.version_control.adapters.git_adapter"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
  - name: "config-only-imports-config"
    paths:
      - "src/developer/config/**/*.py"
    allow:
      local_prefixes:
        - "developer.config"
      relative_import_roots:
        - "."
    deny:
      local_prefixes:
        - "developer"
