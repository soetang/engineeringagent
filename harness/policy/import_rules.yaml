rules:
  - name: "presentation-boundary"
    description: "Presentation is the CLI-facing layer and only depends on application entrypoints plus presentation-safe scaffolding models."
    targets:
      - "developer.presentation"
    mode: "allow_only"
    allow:
      - "developer.presentation"
      - "developer.application"
      - "developer.scaffolding.models"

  - name: "orchestrators-loop-boundary"
    description: "Loop orchestration stays isolated from other developer packages."
    targets:
      - "developer.orchestrators.loop"
    mode: "allow_only"
    allow:
      - "developer.orchestrators.loop"

  - name: "orchestrators-runs-boundary"
    description: "Run orchestration stays isolated from other developer packages."
    targets:
      - "developer.orchestrators.runs"
    mode: "allow_only"
    allow:
      - "developer.orchestrators.runs"

  - name: "workspaces-boundary"
    description: "Workspace execution owns its local abstractions and a narrow set of shared models."
    targets:
      - "developer.workspaces"
    mode: "allow_only"
    allow:
      - "developer.workspaces"
      - "developer.tasks.models"
      - "developer.orchestrators.runs.models"
      - "developer.orchestrators.runs.protocols"

  - name: "version-control-boundary"
    description: "Version-control integrations stay behind their package boundary plus shared prompts and config."
    targets:
      - "developer.version_control"
    mode: "allow_only"
    allow:
      - "developer.version_control"
      - "developer.agent_backends.protocol"
      - "developer.config"
      - "developer.prompts"

  - name: "forge-boundary"
    description: "Forge integrations depend only on their package boundary and shared orchestration contracts."
    targets:
      - "developer.forge"
    mode: "allow_only"
    allow:
      - "developer.forge"
      - "developer.orchestrators.protocols"
      - "developer.config"

  - name: "non-entrypoints-must-not-import-presentation"
    description: "Core packages stay independent from CLI presentation code."
    targets:
      - "developer.agent_backends"
      - "developer.application"
      - "developer.orchestrators"
      - "developer.prompts"
      - "developer.quality"
      - "developer.tasks"
    mode: "deny_only"
    deny:
      - "developer.presentation"

  - name: "implementation-run-service-boundary"
    description: "The implementation run service may orchestrate agents without pulling in broader workspace or version-control concrete code."
    targets:
      - "developer.application.services.implementation_run_service"
    mode: "allow_only"
    allow:
      - "developer.agent_backends"
      - "developer.application"
      - "developer.config"
      - "developer.orchestrators.loop"
      - "developer.orchestrators.runs"
      - "developer.tasks"
      - "developer.version_control.adapters.git_adapter"

  - name: "config-boundary"
    description: "Config code stays self-contained."
    targets:
      - "developer.config"
    mode: "allow_only"
    allow:
      - "developer.config"
