rules:
  - name: "presentation-boundary"
    description: "Presentation is the CLI-facing layer and only depends on application entrypoints plus presentation-safe scaffolding models."
    targets:
      - "engineeringagent.presentation"
    mode: "allow_only"
    allow:
      - "engineeringagent.presentation"
      - "engineeringagent.application"
      - "engineeringagent.scaffolding.models"

  - name: "orchestrators-loop-boundary"
    description: "Loop orchestration stays isolated from other engineeringagent packages."
    targets:
      - "engineeringagent.orchestrators.loop"
    mode: "allow_only"
    allow:
      - "engineeringagent.orchestrators.loop"

  - name: "orchestrators-runs-boundary"
    description: "Run orchestration stays isolated from other engineeringagent packages."
    targets:
      - "engineeringagent.orchestrators.runs"
    mode: "allow_only"
    allow:
      - "engineeringagent.orchestrators.runs"

  - name: "orchestrators-publication-boundary"
    description: "Publication orchestration owns workflow policy and stays isolated from infrastructure packages."
    targets:
      - "engineeringagent.orchestrators.publication"
    mode: "allow_only"
    allow:
      - "engineeringagent.orchestrators.publication"
      - "engineeringagent.orchestrators.loop"

  - name: "workspaces-boundary"
    description: "Workspace execution owns its local abstractions and a narrow set of shared models."
    targets:
      - "engineeringagent.workspaces"
    mode: "allow_only"
    allow:
      - "engineeringagent.workspaces"
      - "engineeringagent.tasks.models"
      - "engineeringagent.orchestrators.runs.models"
      - "engineeringagent.orchestrators.runs.protocols"

  - name: "version-control-boundary"
    description: "Version-control integrations stay behind their package boundary and config only."
    targets:
      - "engineeringagent.version_control"
    mode: "allow_only"
    allow:
      - "engineeringagent.version_control"
      - "engineeringagent.config"
      - "engineeringagent.orchestrators.publication"

  - name: "forge-boundary"
    description: "Forge integrations stay infrastructure-only and depend only on their package boundary and config."
    targets:
      - "engineeringagent.forge"
    mode: "allow_only"
    allow:
      - "engineeringagent.forge"
      - "engineeringagent.config"
      - "engineeringagent.orchestrators.publication"

  - name: "non-entrypoints-must-not-import-presentation"
    description: "Core packages stay independent from CLI presentation code."
    targets:
      - "engineeringagent.agent_backends"
      - "engineeringagent.application"
      - "engineeringagent.orchestrators"
      - "engineeringagent.prompts"
      - "engineeringagent.quality"
      - "engineeringagent.tasks"
    mode: "deny_only"
    deny:
      - "engineeringagent.presentation"

  - name: "implementation-run-service-boundary"
    description: "The implementation run service may orchestrate agents without pulling in broader workspace or version-control concrete code."
    targets:
      - "engineeringagent.application.services.implementation_run_service"
    mode: "allow_only"
    allow:
      - "engineeringagent.agent_backends"
      - "engineeringagent.application"
      - "engineeringagent.config"
      - "engineeringagent.orchestrators.loop"
      - "engineeringagent.orchestrators.runs"
      - "engineeringagent.tasks"
      - "engineeringagent.version_control.adapters.git_adapter"

  - name: "config-boundary"
    description: "Config code stays self-contained."
    targets:
      - "engineeringagent.config"
    mode: "allow_only"
    allow:
      - "engineeringagent.config"
