contract_version: "1.0"

defaults:
  when:
    phase: iteration_end

checks:
  fitness_all:
    type: fitness
    scope: all

  ruff_validate:
    type: command
    command: "uv run ruff check src/engineeringagent harness"
    when:
      on_change: ["src/**/*.py", "tests/**/*.py", "harness/**/*.py"]

  pyright_validate:
    type: command
    command: "uv run pyright src/engineeringagent tests harness"
    when:
      on_change: ["src/**/*.py", "tests/**/*.py", "harness/**/*.py"]

  pylint_validate:
    type: command
    command: "uv run pylint --score=n --reports=n src/engineeringagent tests harness"
    when:
      on_change: ["src/**/*.py", "tests/**/*.py", "harness/**/*.py"]

  pytest_validate:
    type: command
    command: "uv run pytest -q"
    when:
      on_change: ["src/**/*.py", "tests/**/*.py", "harness/**/*.py"]

  code_simplifier:
    type: reviewer
    prompt_file: "harness/reviewers/prompts/code_simplifier.md"
    when:
      phase: feature_done
      on_change: ["src/**/*.py", "tests/**/*.py"]
    approval:
      first_feature_approval: true

  test_reviewer:
    type: reviewer
    prompt_file: "harness/reviewers/prompts/test_reviewer.md"
    when:
      phase: feature_done
      on_change: ["tests/**/*.py"]
    approval:
      first_feature_approval: true

  intent_integrity_reviewer:
    type: reviewer
    prompt_file: "harness/reviewers/prompts/intent_integrity_reviewer.md"
    feedback_context: "Intent reviewer focuses on objective/acceptance outcomes and anti-gaming risk. Prefer implementation fixes for immediate gaps, and tighten fitness rules only when policy holes cause repeatable evasions."
    when:
      phase: feature_done
      on_change:
        - "src/**/*.py"
        - "src/engineeringagent/approach/docs/*.md"
        - "tests/**/*.py"
        - "harness/**/*.py"
        - "harness/**/*.md"
        - "docs/fixtures/**/*.md"
        - "docs/spec/features/**/spec.yaml"
        - "docs/spec/features/**/*.md"
    approval:
      first_feature_approval: true
