fail_fast: true

repos:
  - repo: local
    hooks:
      - id: engineeringagent-ruff-precommit
        name: engineeringagent-ruff-precommit
        entry: uv run engineeringagent checks run --checks commands --check-id ruff_validate --phase iteration_end
        language: system
        pass_filenames: false
        files: ^(src/engineeringagent/|harness/|pyproject\.toml|\.pre-commit-config\.yaml)
      - id: engineeringagent-precommit
        name: engineeringagent-precommit
        entry: uv run engineeringagent checks run --checks fitness --phase iteration_end
        language: system
        pass_filenames: false
        files: ^(src/engineeringagent/|harness/|tests/|pyproject\.toml|engineeringagent\.toml|\.pre-commit-config\.yaml)
      - id: engineeringagent-commit-msg
        name: engineeringagent-commit-msg
        entry: python harness/fitness_functions/validate_commit_messages.py --commit-msg-file
        language: system
        stages: [commit-msg]
