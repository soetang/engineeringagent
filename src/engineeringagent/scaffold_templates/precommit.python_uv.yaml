repos:
  - repo: local
    hooks:
      - id: engineeringagent-precommit
        name: engineeringagent-precommit
        entry: uv run python -m engineeringagent.cli validate
        language: system
        pass_filenames: false
      - id: engineeringagent-commit-msg
        name: engineeringagent-commit-msg
        entry: python harness/fitness-functions/validate_commit_messages.py --commit-msg-file
        language: system
        stages: [commit-msg]
