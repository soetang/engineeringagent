repos:
  - repo: local
    hooks:
      - id: engineeringagent-ruff-precommit
        name: engineeringagent-ruff-precommit
        entry: engineeringagent checks run --checks commands --check-id ruff_validate --phase iteration_end
        language: system
        pass_filenames: false
      - id: engineeringagent-precommit
        name: engineeringagent-precommit
        entry: engineeringagent checks run --checks fitness --phase iteration_end
        language: system
        pass_filenames: false
