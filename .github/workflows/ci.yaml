name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Validate commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_RANGE="$PR_BASE_SHA..$HEAD_SHA"
          else
            COMMIT_RANGE="$PUSH_BEFORE_SHA..$HEAD_SHA"
          fi

          if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="$HEAD_SHA^..$HEAD_SHA"
          fi

          uv run python harness/fitness-functions/validate_commit_messages.py --commit-range "$COMMIT_RANGE"

      - name: Lint (precommit profile)
        run: uv run python -m engineeringagent.cli checks run --phase iteration_end

      - name: Test
        run: pytest -q

      - name: Spec validation
        run: uv run python -m engineeringagent.cli validate
