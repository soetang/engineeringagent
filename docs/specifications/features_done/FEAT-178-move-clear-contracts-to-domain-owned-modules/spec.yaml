id: FEAT-178
title: Move clear contracts to domain-owned modules
type: spec
expected_commit_subject: 'spec: add FEAT-178 domain owned contracts'
planning_tier: planned
status: done
priority: high
objective: Reduce dependency-magnet modules by moving clearly owned contracts out
  of broad shared files and into the domain packages that define their semantics,
  starting with checks-owned contracts such as `HarnessCheckPhase`.
context: '`src/engineeringagent/specs.py` currently owns feature-spec schema, harness-check
  schema, reviewer-related config contracts, YAML I/O helpers, schema generation,
  and small shared enums. `pydeps` and direct import review show that several checks
  and CLI modules import `engineeringagent.specs` primarily to access narrow contracts
  like `HarnessCheckPhase`, which broadens coupling unnecessarily.

  We want contract ownership to follow semantic ownership: YAML persistence contracts
  stay with spec models, checks-owned runtime/check-selection contracts move under
  `engineeringagent.checks`, and only truly cross-domain contracts should ever justify
  a tiny dedicated shared module.'
constraints:
- 'In scope: identify clearly owned contracts that can move without creating awkward
  reverse dependencies or generic dumping-ground modules.'
- 'In scope: move checks-owned contracts needed by CLI/loop/checks internals into
  a narrow checks-owned module, starting with `HarnessCheckPhase`.'
- 'In scope: prefer concrete owner-local modules such as `engineeringagent.checks.contracts`
  or a small checks-owned contract package over broad top-level shared buckets.'
- 'In scope: update imports so CLI and loop code depend on narrow domain-owned contracts
  instead of broad modules like `engineeringagent.specs` when only checks-owned types
  are needed.'
- 'In scope: keep feature YAML models, schema emission, and YAML I/O in spec-owned
  modules unless ownership is clearly wrong.'
- 'In scope: preserve current runtime behavior and contract values exactly unless
  an explicit delta is documented.'
- 'Out of scope: a full repository-wide contract reorganization or a broad generic
  `shared/contracts.py` bucket.'
- 'Out of scope: moving contracts whose ownership is still ambiguous; those can remain
  in place until a stronger seam exists.'
- no fitness-function changes required; enforcement of the new ownership boundaries
  is handled by a separate directionality-focused spec.
implementation_notes: 'Contract change declaration


  Surface:

  - Internal contract/module ownership for CLI, checks, loop, and spec code.

  - Import paths for narrow shared enums and models used across domains.


  Old behavior:

  - Broad modules such as `engineeringagent.specs` own contracts that are semantically
  driven by checks behavior.

  - Consumers import large owner modules to access a few narrow contracts.


  New behavior:

  - Clearly owned contracts move to the domain packages that define their meaning.

  - Consumers import narrow domain-owned contracts rather than broad dependency-magnet
  modules when only those contracts are needed.

  - Generic shared contract buckets are avoided unless ownership is truly ambiguous.

  - The first target is a checks-owned contract module (for example `engineeringagent.checks.contracts`)
  that owns `HarnessCheckPhase` and any adjacent checks-owned enums/models proven
  to have the same semantic owner.


  Compatibility policy:

  - Runtime values and command behavior remain unchanged.

  - Internal import paths may change as part of ownership cleanup.


  Migration plan:

  1) Identify clearly owned narrow contracts starting with checks-owned phase enums.

  2) Create a focused checks-owned contract module, preferably `engineeringagent.checks.contracts`.

  3) Move imports in CLI/checks/loop from `engineeringagent.specs` to the new checks-owned
  module where only checks-owned contracts are needed.

  4) Keep `HarnessChecksDocument` and other persistence/schema contracts in spec-owned
  modules unless a narrower owner becomes clearly justified in a later spec.

  5) Add focused regression tests that lock the new ownership and protect against
  falling back to broad imports.


  Verification evidence:

  - Targeted CLI/checks/loop tests pass with unchanged behavior.

  - Schema validation passes after contract moves.

  '
acceptance:
- Clearly owned narrow contracts no longer live in broad dependency-magnet modules
  when a domain owner exists.
- '`HarnessCheckPhase` is owned by a narrow checks-domain contract module rather than
  the broad `engineeringagent.specs` surface.'
- The preferred initial owner module is `engineeringagent.checks.contracts` unless
  implementation reveals a smaller, clearly named checks-owned contract file is better.
- CLI, checks, and loop modules that only need checks-owned contracts import those
  contracts from checks-owned modules instead of importing the broader specs module.
- Feature-spec persistence/schema models remain under spec-owned modules unless ownership
  is explicitly justified for a move.
- No generic `shared/contracts.py` or `common_types.py` dumping-ground module is introduced.
- Runtime behavior, enum values, and command semantics remain unchanged.
- Targeted tests cover the moved contract ownership and import updates.
- 'Verification command passes: `uv run pytest -q tests/checks tests/cli tests/loop`.'
- 'Verification command passes: `uv run engineeringagent validate --schema-only`.'
artifacts:
