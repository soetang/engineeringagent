id: FEAT-060
title: Run readme_process reviewer in a clean-room harness sandbox with README-plus-CLI
  scope
type: feature
expected_commit_subject: 'feat: add FEAT-060 clean-room readme_process harness sandbox
  behavior'
planning_tier: planned
status: done
priority: medium
objective: Replace full-repository reviewer snapshots for readme_process with a harness-managed
  clean-room sandbox that exposes only README inputs and engineeringagent CLI execution
  surface.
context: The current temp snapshot mode copies the whole repository, which weakens
  clean-room validation for README onboarding quality. Product direction is to execute
  README-process review from an intentionally minimal workspace so failures are attributed
  to docs and bootstrap behavior, not incidental local repository state.
constraints:
- Keep readme_process lower priority than code_simplifier activation work.
- Sandbox preparation must be harness-managed and deterministic, not ad-hoc file copying
  inside reviewer business logic.
- Add an explicit sandbox interface mode `clean_room_readme_cli` under `reviewers.<id>.sandbox.mode`;
  keep existing `temp_worktree_snapshot` contract support for backward compatibility.
- Reviewer execution root for readme_process must be a clean temp workspace with README
  present.
- Reviewer sandbox must expose engineeringagent CLI execution capability while avoiding
  full source-tree snapshot.
- Do not copy src, tests, .git metadata, or unrelated repository files into the readme_process
  sandbox.
- Clean-room filesystem interface must include only README.md, optional explicitly-allowlisted
  docs paths, and deterministic CLI bootstrap helpers required to execute engineeringagent
  commands.
- Preserve reviewer decision envelope contract and blocking policy semantics.
- Preserve no-sandbox behavior for reviewers that do not request sandbox mode.
- Keep deterministic parser-failure behavior when sandbox setup fails.
implementation_notes: 'Introduce a harness sandbox builder pathway for readme_process
  that creates an empty temporary workspace, stages README.md (and explicitly required
  README-linked docs only when contractually needed), and wires a deterministic CLI
  access method for bootstrap commands.

  API/interface contract additions for this feature: - Extend reviewer sandbox mode
  enum validation to include `clean_room_readme_cli`. - Add a sandbox builder interface
  in runtime code that accepts `(project_root, reviewer_id, reviewer_config)` and
  returns execution root path plus cleanup ownership. - Preserve existing `run_reviewer(...)`
  call surface and decision envelope shape.

  Keep runtime orchestration simple: reviewer runtime requests a named sandbox mode,
  harness code builds it, then reviewer execution runs in that workspace. Preserve
  existing telemetry and retry semantics while updating sandbox provenance fields.'
acceptance:
- readme_process no longer executes against a full-repository copy by default.
- Clean-room sandbox for readme_process contains README content and engineeringagent
  CLI access but excludes full repo source and git metadata.
- harness/reviewers.yaml readme_process entry can select sandbox.mode=clean_room_readme_cli
  and validates through reviewer contract checks.
- Sandbox creation path is owned by harness code and is reusable by reviewer runtime.
- Existing blocking retry and exhaustion semantics for readme_process remain unchanged.
- Sandbox setup failures still produce deterministic request_changes parser-failure
  outcomes.
- Regression tests cover clean-room isolation boundaries and README-plus-CLI execution
  assumptions.
artifacts:
  plan: plan.md
