id: FEAT-080
title: Restructure tests into topic folders and have ruff_validate lint harness/
type: test
expected_commit_subject: 'test: restructure tests and lint harness'
planning_tier: planned
status: done
priority: medium
objective: 'Make the test suite easier to navigate by grouping test modules into

  topic-oriented folders under `tests/`, while keeping pytest discovery,

  fixtures, and gates behavior stable.


  Additionally, align the `ruff_validate` gate with its `on_change` triggers by

  ensuring the gate lints `harness/` code (without unintentionally forcing the

  full docstring/complexity policy onto harness fitness-function scripts).

  '
context: 'The repository currently has many flat test modules under `tests/`, which
  is

  hard to scan and discourages adding more tests.


  The current gate config already triggers `ruff_validate` on changes under

  `harness/**/*.py`, but the configured command only runs Ruff on

  `src/engineeringagent`. This is inconsistent and means harness changes can

  bypass lint checks.

  '
constraints:
- Keep `tests/conftest.py` and `tests/fixtures/` at `tests/` root (no move).
- Keep test topic folders only one level deep (e.g. `tests/cli/test_*.py`).
- After the move, update any tests that compute repo root via `Path(__file__).resolve().parents[1]`
  so they still resolve the repo root correctly.
- Preserve pytest collection via `uv run pytest -q` without adding a new `pytest.ini`
  file.
- Update this repo's `harness/gates.yaml` so `ruff_validate` lints `src/engineeringagent`
  and `harness/`.
- Update `DEFAULT_GATE_CONFIG` in `src/engineeringagent/gates.py` so scaffolded/missing-gates
  behavior matches the repository gate policy.
- Ensure `uv run ruff check harness` passes by using Ruff configuration (preferred)
  rather than scattering `noqa` suppressions.
- Record the exact move map in this spec and execute it deterministically.
