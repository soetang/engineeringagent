id: FEAT-073
title: Add init packs (slim|standard) with TTY prompt and demo failing rule
type: feature
expected_commit_subject: 'feat: add init slim and standard packs'
planning_tier: planned
status: done
priority: high
objective: 'Extend `engineeringagent init` with an explicit pack selection:

  - `engineeringagent init slim` (default)

  - `engineeringagent init standard` (includes a demo fitness rule that fails in pre-commit)


  When the pack is omitted and the command runs in an interactive TTY,

  prompt the user to pick a pack (default: slim). In non-interactive contexts,

  default to slim without prompting.

  '
context: "The current init scaffold is ambiguous about \"what kind of repo baseline\
  \ am I getting?\"\nand does not provide an obvious, visible example of fitness rules\
  \ failing.\n\nWe want:\n- a safe default (slim) that still runs real validations\
  \ (at least spec validation)\n- an opt-in \"standard\" pack that demonstrates the\
  \ failing-rule workflow immediately\n  by wiring an always-failing demo rule into\
  \ the pre-commit gate profile.\n"
constraints:
- 'Pack selection is a positional argument to `engineeringagent init`: `slim|standard`.'
- 'Backward-compatible default: `engineeringagent init` must remain valid.'
- If pack is omitted and stdout is a TTY, prompt for pack with default `slim`.
- If pack is omitted and stdout is not a TTY, do not prompt; default `slim`.
- If pack is explicitly provided, never prompt.
- Output must be ASCII-only.
- The final "init complete" line must include `pack=<slim|standard>`.
- Standard pack must clearly describe in terminal output that it wires a demo fitness
  function that always fails into pre-commit.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `engineeringagent\
  \ init` CLI.\n  - Old behavior: `engineeringagent init` has no pack concept.\n \
  \ - New behavior: `engineeringagent init [PACK]` where PACK is `slim` or `standard`.\n\
  \nCompatibility policy:\n- `engineeringagent init` with no pack remains valid and\
  \ defaults to `slim`.\n- In TTY usage, omission triggers a prompt; in non-TTY usage,\
  \ omission does not.\n\nImplementation approach notes:\n- Use a deterministic prompt\
  \ with fixed options and default slim.\n- Keep `--scaffold-profile` orthogonal;\
  \ it remains the \"toolchain profile\" axis.\n"
acceptance:
- '`engineeringagent init --help` documents the optional positional pack argument.'
- When pack is omitted and TTY is detected, init prompts to select slim|standard (default
  slim).
- When pack is omitted and TTY is not detected, init does not prompt and uses slim.
- When pack is provided (`init slim` or `init standard`), init never prompts.
- Init completion output includes `pack=...`.
- Standard pack prints a one-line explanation that it installs a demo failing fitness
  rule into pre-commit.
- The standard-pack demo failing rule includes a remediation that explains how to
  disable the demo failure (by switching to slim and/or removing the demo gate/manifest).
artifacts:
  plan: plan.md
