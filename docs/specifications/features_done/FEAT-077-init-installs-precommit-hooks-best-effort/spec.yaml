id: FEAT-077
title: Init best-effort installs pre-commit hooks when a git repo is present
type: feature
expected_commit_subject: 'feat: install pre-commit hooks during init'
planning_tier: planned
status: done
priority: medium
objective: 'Make `engineeringagent init` best-effort install pre-commit hooks so that
  scaffolding

  actually takes effect without requiring manual `pre-commit install`.


  The install behavior must be non-fatal and must not prompt.

  '
context: 'Users observe that init did not register the pre-commit hook. Writing

  `.pre-commit-config.yaml` is not sufficient; hooks must be installed.


  We want a smoother bootstrap where init completes the wiring when possible, but
  does

  not break when tools are missing.

  '
constraints:
- Only attempt hook installation if `${project_root}/.git/` exists.
- Only attempt hook installation if the `pre-commit` executable is available.
- Never fail init solely because hook install fails; print a deterministic warning
  instead.
- Add a flag to skip hook installation (e.g. `--no-precommit-install`) for automation.
- For python_uv scaffolds that include a commit-msg hook, also attempt to install
  the commit-msg hook type.
- No interactive prompting is allowed for this feature.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: side effects of\
  \ `engineeringagent init`.\n  - Old behavior: writes pre-commit config only.\n \
  \ - New behavior: may also run `pre-commit install` (and commit-msg where applicable)\n\
  \    when prerequisites are met.\n\nImplementation approach notes:\n- Use subprocess\
  \ execution with clear, minimal output and stable error messages.\n- Print remediation\
  \ commands when installation is skipped (missing git repo or missing pre-commit).\n"
acceptance:
- When run inside a git repo with pre-commit installed, init attempts to install hooks.
- When not in a git repo, init does not attempt to install hooks and prints a remediation
  hint.
- When pre-commit is not installed, init prints a remediation hint and still succeeds.
- Flag `--no-precommit-install` skips installation attempts.
artifacts:
  plan: plan.md
