id: FEAT-026
title: Add pre-run OpenCode permission precheck for default implementer
type: feature
expected_commit_subject: 'feat: add FEAT-026 pre-run opencode permission precheck'
planning_tier: planned
status: done
priority: high
objective: 'Fail fast before loop execution when the default OpenCode implement path
  does not have viable permissions, so operators get immediate actionable guidance
  instead of entering noisy implement retries.

  '
context: 'Current behavior detects permission rejection during the implement step
  and can also surface permission probe failures through loop gates. This still allows
  loop setup and feature iteration to begin before permission viability is known.

  User-confirmed scope for this feature: run a one-time precheck before loop iteration
  when using the default OpenCode implementer, stop immediately on failure, and remove
  permission probing from `loop_fast` so permission failure is treated as pre-run
  readiness rather than per-iteration loop feedback.

  '
constraints:
- Run the precheck only when `engineeringagent run` uses the default implement path
  (no `--implement-command` and no `--skip-implement`).
- Do not run the precheck for `--skip-implement` mode.
- Do not run the precheck for custom `--implement-command` mode.
- On precheck failure, exit before feature selection and before any loop iteration
  is executed.
- Precheck failure output must include actionable remediation guidance aligned with
  existing permission hints.
- Remove `opencode_permission_probe` from the default `loop_fast` profile so permission
  readiness is not enforced as an in-loop gate.
- Preserve existing behavior and contracts for non-default implement modes and existing
  gate command surfaces.
implementation_notes: 'Introduce a pre-run permission readiness check at run-loop
  entry after non-dry preconditions and before pending-feature selection/iteration.
  Reuse existing permission probe logic where possible to avoid duplicate marker detection.

  Keep precheck decisions explicit and deterministic: precheck required only for default
  OpenCode implement mode; otherwise bypassed.

  Update default gate profile wiring so `loop_fast` no longer runs the permission
  probe. The probe gate implementation may remain available for manual invocation
  if needed, but it should not be part of normal per-iteration loop execution.

  Add focused regression tests for fail-fast behavior and bypass conditions to prevent
  future drift back to in-loop permission probing.

  '
acceptance:
- '`engineeringagent run` performs a permission precheck before loop iteration only
  in default OpenCode implement mode.'
- When the precheck fails, the command exits non-zero before selecting a feature and
  before recording an iteration result.
- Precheck failure output contains clear remediation guidance for OpenCode permission
  setup.
- Runs using `--skip-implement` do not execute the permission precheck.
- Runs using `--implement-command` do not execute the permission precheck.
- Default `loop_fast` profile no longer includes `opencode_permission_probe`.
- Existing non-permission loop behavior remains unchanged for successful precheck
  and non-default implement modes.
- Targeted regressions and schema/gate validation pass.
artifacts:
  plan: plan.md
