id: FEAT-167
title: Feed failed command output into retry prompts
type: feature
expected_commit_subject: 'feat: feed failed command output into retry prompts'
planning_tier: planned
status: done
priority: high
objective: Reduce retry reruns by forwarding failed command output context into the
  next implement prompt for command failures.
context: 'Today, retries often include command identity but not enough failure output

  context, so the model reruns failing commands to recover diagnostics. Over long

  conversations, this increases token cost.


  This feature is specifically about feed-in context. Command output optimization

  itself is deferred.

  '
constraints:
- Forward failed command output context into retry feedback for command check failures
  in checks/gates command paths and for verification command failures.
- 'Include at minimum: exact command, return code, and a failure output excerpt.'
- Forward latest-only failure context for retry prompts (no accumulating history).
- Keep full raw command outputs in progress logs and telemetry for human debugging.
- Preserve loop/checks ownership boundaries for prompt feedback shaping.
- Preserve prompt renderer no-truncation policy (no truncation-by-slicing in renderer).
- 'Out of scope: command output minimization/tuning (for example pytest coverage table
  formatting or global command verbosity changes).'
implementation_notes: "Contract change declaration\n\nSurface:\n- checks command-failure\
  \ `prompt_feedback` content\n- verification failure feedback content forwarded into\
  \ the next implement prompt\n\nOld behavior:\n- Retry context often lacks concrete\
  \ failing output lines; the model reruns commands\n  to inspect diagnostics.\n\n\
  New behavior:\n- Retry context includes bounded failed-command output excerpts plus\
  \ command metadata.\n\nCompatibility policy:\n- Feedback enrichment only; no command\
  \ execution flow changes.\n\nFitness-function impact assessment\n- no fitness-function\
  \ changes required.\n"
acceptance:
- On command check failure, next retry feedback includes failed command output excerpt.
- On verification command failure, next retry feedback includes failed command output
  excerpt.
- Retry feedback includes exact command and return code with the excerpt.
- On repeated failures, only the latest failure context is forwarded.
- Existing progress logs retain full outputs for debugging.
- Existing feedback boundary and no-truncation rules remain satisfied.
- The feature spec validates with `uv run engineeringagent validate --schema-only`.
artifacts:
  plan: plan.md
