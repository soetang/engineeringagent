id: FEAT-126
title: Extract shared checks planner helper for phase and on_change decisions
type: chore
expected_commit_subject: 'chore: add FEAT-126 shared checks planning policy'
planning_tier: planned
status: done
priority: high
objective: 'Centralize duplicated checks planning logic (phase defaults, manual behavior,
  on_change matching, and fallback reasons) into a shared planner/helper module used
  by commands, fitness, and reviewers runtimes.

  '
context: 'Current checks planners in `commands/runtime.py`, `fitness/runtime.py`,
  and `reviewers/runtime.py` re-implement the same policy decisions with near-identical
  code.

  This duplication increases drift risk and makes incremental policy changes harder
  to apply consistently.

  We want one shared planning helper for decision policy only, with type-specific
  adapters so behavior remains deterministic while ownership and maintenance improve.

  This feature is explicitly not about coupling execution/subprocess behavior across
  check types.

  '
constraints:
- Preserve existing run/skip outcomes and reason strings for all three planners.
- Scope is planner/helper extraction only; do not merge or centralize command/fitness/reviewer
  execution implementations.
- Preserve existing manual-phase behavior (manual plans remain skip-only).
- Keep `engineeringagent.checks.run_checks(...)` external behavior unchanged.
- Keep check-specific runtime module public helpers available unless a direct replacement
  is introduced in the same change.
- Keep deterministic ordering of planned entries and output text unchanged.
- Keep compatibility with existing changed-path fallback behavior and reason propagation.
- Shared planner/helper module must remain execution-agnostic (no imports from command
  execution, fitness adapters, or reviewer engine execution surfaces).
- Command execution stays in `checks/commands/runtime.py`; fitness execution stays
  in `checks/fitness/runtime.py`; reviewer execution stays in `checks/reviewers/runtime.py`
  and `checks/reviewers/engine.py`.
- no fitness-function changes required; this refactor consolidates existing policy
  logic without changing architectural boundaries or check execution semantics.
implementation_notes: "Contract change declaration (internal-only)\n\nSurface:\n-\
  \ Internal checks planner/helper functions used by command, fitness, and reviewer\
  \ runtimes.\n- Internal phase/default resolution helpers currently duplicated per\
  \ runtime module.\n\nOld behavior:\n- Each runtime module implements local copies\
  \ of default/effective phase calculation\n  and on_change run/skip policy.\n- Reason\
  \ constants and manual/on_change branches are duplicated across modules.\n\nNew\
  \ behavior:\n- A shared planner/helper module owns default phase resolution and\
  \ run/skip decision\n  logic.\n- Runtime modules keep type-specific filtering/execution\
  \ but delegate policy decisions\n  to shared helpers.\n- Execution remains per-runtime\
  \ and is intentionally not centralized.\n- Existing reason values, ordering, and\
  \ planner outputs remain behaviorally equivalent.\n\nCompatibility policy:\n- No\
  \ user-facing CLI/API contract changes are intended.\n- Internal helper signatures\
  \ may change as part of consolidation, but runtime module\n  behavior must remain\
  \ stable.\n\nMigration plan:\n- Introduce shared planner/helper policy functions\
  \ under `src/engineeringagent/checks/`.\n- Migrate command planner first, then fitness\
  \ planner, then reviewer planner.\n- Add/adjust parity tests to lock decision equivalence\
  \ before removing duplicate helpers.\n\nVerification evidence:\n- Targeted checks\
  \ planner/runtime tests for commands, fitness, and reviewers.\n- checks API contract\
  \ tests and repository validation.\n"
acceptance:
- Shared planner/helper functions exist and are used by command, fitness, and reviewer
  runtime planners.
- Shared planner/helper module is execution-agnostic and does not own subprocess/agent
  execution behavior.
- Duplicated `_effective_default_phase(...)` and equivalent on_change policy branches
  are removed from per-type runtime modules.
- Existing reason labels remain unchanged (`always_run_no_on_change`, `matched_on_change`,
  `no_on_change_match`, manual/fallback reasons).
- Planner outputs remain deterministic and behaviorally equivalent across unchanged
  test fixtures.
- '`uv run pytest -q tests/checks/test_commands_runtime.py tests/checks/test_fitness_runtime.py
  tests/checks/test_checks_reviewers_runtime.py tests/checks/test_run_checks_contract.py`
  passes.'
- '`uv run engineeringagent validate` passes.'
artifacts:
  plan: plan.md
