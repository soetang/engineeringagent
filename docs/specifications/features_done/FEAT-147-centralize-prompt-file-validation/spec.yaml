id: FEAT-147
title: Centralize prompt_file schema validation across reviewer contracts
type: spec
expected_commit_subject: 'spec: add FEAT-147 shared prompt_file schema validator'
planning_tier: planned
status: done
priority: medium
objective: Remove duplicate `prompt_file` path validation logic from reviewer schema
  models while preserving exact behavior and validation outcomes.
context: 'The repository currently validates `prompt_file` in two separate schema
  models (`ReviewerDefinition` and `HarnessCheckReviewerDefinition`) using near-identical
  logic.

  This duplication increases drift risk and makes future policy updates harder to
  apply consistently. We want one shared validation path with unchanged behavior.'
constraints:
- 'In scope: deduplicate `prompt_file` validation used by reviewer schema models in
  `src/engineeringagent/specs.py`.'
- 'Out of scope: runtime reviewer execution/sandbox prompt-file handling in `src/engineeringagent/checks/reviewers/engine.py`.'
- Preserve existing `prompt_file` semantics and effective error behavior; this feature
  is an internal refactor, not a contract change.
- 'Keep policy unchanged: `prompt_file` must be repo-relative, cannot be absolute
  or contain `..`, and must be under `harness/reviewers/prompts/`.'
- Preserve strict-contract modeling conventions (Pydantic models, deterministic validation
  behavior).
implementation_notes: 'Contract change declaration


  Surface:

  - Schema validation implementation for reviewer `prompt_file` fields in `ReviewerDefinition`
  and `HarnessCheckReviewerDefinition`.


  Old behavior:

  - Both schema models enforce the same `prompt_file` policy via duplicated local
  validators.


  New behavior:

  - Both schema models call one shared validator helper that enforces the same policy.


  Compatibility policy:

  - No intentional behavior change; existing validation outcomes are preserved.


  Migration plan:

  - Extract a shared helper in `src/engineeringagent/specs.py` and route both model
  validators through it.

  - Update/add targeted contract tests to verify parity for both reviewer contract
  surfaces.


  Verification evidence:

  - Reviewer and checks contract tests covering allowed and rejected `prompt_file`
  paths pass with shared validation.

  - `uv run engineeringagent validate` passes.


  Fitness-function impact assessment:

  - no fitness-function changes required.

  - Rationale: this feature refactors schema-validator ownership only and does not
  alter architectural policy boundaries or runtime behavior that fitness rules evaluate.'
acceptance:
- '`ReviewerDefinition` and `HarnessCheckReviewerDefinition` use one shared `prompt_file`
  validation helper.'
- Valid repo-relative prompt paths under `harness/reviewers/prompts/` continue to
  pass for both reviewer contract surfaces.
- Invalid prompt paths (absolute paths, parent traversal, or paths outside `harness/reviewers/prompts/`)
  continue to fail for both surfaces.
- Contract-level tests verify parity and prevent future divergence between reviewer
  schema surfaces.
- 'Verification command passes: `uv run pytest -q tests/reviewers/test_reviewers_contract.py
  tests/harness/test_checks_contract.py`.'
- 'Verification command passes: `uv run engineeringagent validate`.'
artifacts:
  plan: plan.md
