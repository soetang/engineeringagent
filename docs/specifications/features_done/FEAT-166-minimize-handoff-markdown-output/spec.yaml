id: FEAT-166
title: Minimize handoff markdown output
type: feature
expected_commit_subject: 'feat: minimize handoff markdown output'
planning_tier: planned
status: done
priority: high
objective: Reduce per-iteration token growth by minimizing handoff markdown content,
  starting with removal of empty sections and placeholder bullets.
context: 'Small text reductions compound across repeated loop iterations. Handoff
  markdown is

  appended frequently and currently includes low-value empty-section noise.

  '
constraints:
- Scope is handoff markdown rendering only.
- Omit empty handoff sections from newly appended entries.
- Do not render placeholder bullets such as `- (none)`.
- Preserve existing section order and formatting for non-empty sections.
- Do not change the implement structured output schema.
- Do not change retry feedback or prompt injection behavior.
- 'Out of scope for FEAT-166: failed command output forwarding into retry prompts
  (covered by FEAT-167) and command output optimization.'
implementation_notes: 'Contract change declaration


  Surface:

  - `progress/features/<FEATURE_ID>/handoff.md` append rendering


  Old behavior:

  - Empty sections are rendered with placeholder list items.


  New behavior:

  - Empty sections are omitted entirely in new append entries.


  Compatibility policy:

  - Presentation-only change; no execution flow changes.


  Fitness-function impact assessment

  - no fitness-function changes required.

  '
acceptance:
- Newly appended handoff entries contain no `- (none)` placeholders.
- Empty sections are not rendered.
- Non-empty sections keep the current deterministic order and bullet style.
- Fallback handoff envelope behavior remains intact.
- Existing progress logging and telemetry behavior remains unchanged.
- The feature spec validates with `uv run engineeringagent validate --schema-only`.
artifacts:
  plan: plan.md
updated_at: '2026-03-03T19:32:08Z'
