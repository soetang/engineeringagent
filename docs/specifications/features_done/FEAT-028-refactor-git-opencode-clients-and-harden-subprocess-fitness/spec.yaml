id: FEAT-028
title: Refactor Git/OpenCode command clients and harden subprocess fitness remediation
type: feature
expected_commit_subject: 'feat: add FEAT-028 command clients and subprocess fitness
  hardening'
planning_tier: planned
status: done
priority: high
objective: 'Refactor loop command execution behind explicit Git and OpenCode client
  submodules, then harden subprocess fitness enforcement so bypass wrappers are rejected
  and failures return clear "what to do instead" remediation guidance.

  '
context: 'Current loop orchestration can satisfy subprocess fitness checks by moving
  direct calls into thin wrappers (for example process_runner), which preserves low-level
  coupling and weakens architectural intent. The user-confirmed goal is to make loop
  code call explicit high-level helpers (for example start_agent(...)) and to make
  fitness failures tell implementers exactly what architecture move to make next.

  Scope confirmed with user interview decisions: - subprocess hardening uses strict
  allowlist boundaries, - remediation guidance should use the existing metadata remediation
  field (no new schema field).

  '
constraints:
- Introduce explicit command clients for OpenCode and Git in dedicated subfolders
  (for example src/engineeringagent/opencode/client.py and src/engineeringagent/git/client.py)
  and route loop orchestration through those interfaces.
- Git/OpenCode helpers must live in their own package directories under src/engineeringagent/
  (not as flat top-level helper modules).
- Loop orchestration must not directly encode low-level OpenCode/Git subprocess invocation
  details.
- Remove or retire bypass-prone generic wrappers that hide subprocess calls without
  architectural intent.
- Harden architecture.loop-subprocess-boundary into strict allowlist behavior (only
  explicitly approved modules may call subprocess).
- Allowlist policy must be explicit and reviewable in code, with approved modules
  limited to command-adapter/client boundaries (for example fitness adapters, gates
  runner, commit message reader, and dedicated Git/OpenCode client modules).
- Harden detection for common alias patterns (`import subprocess as sp`) and direct-import
  call patterns (`from subprocess import run`).
- Keep fitness contract_version stable and reuse existing remediation field to represent
  "what to do instead" guidance.
- Do not change permission-policy semantics owned by FEAT-026 (pre-run permission
  precheck applicability and `loop_fast` profile composition); this feature may refactor
  call paths only.
- Fitness run output used by loop retries must include actionable remediation text
  for failing rules so retry prompts carry concrete direction.
- Keep changes low-complexity and deterministic; avoid broad command-framework rewrites.
implementation_notes: 'Add thin, explicit clients:

  - OpenCode client should own agent invocation details and expose an orchestration-level
  API (for example start_agent(project_root, prompt, agent="build")). - Git client
  should own status/head/add/commit operations used by loop flow.

  Refactor loop and permission-probe paths to call these clients instead of run_process/direct
  subprocess usage. Keep behavior stable for return codes and output shaping.

  Replace current file-scoped subprocess boundary check with package-level allowlist
  checking. The rule should parse imports to detect subprocess aliases and imported
  call symbols, then reject blocked usage outside allowlisted modules.

  Preserve the current fitness data contract; enrich CLI/gate-visible fitness output
  by joining failing result rows with rule metadata remediation text so retry feedback
  includes explicit next-action guidance.

  Update built-in rule remediation for architecture.loop-subprocess-boundary to explicitly
  direct implementers to move OpenCode calls to engineeringagent.opencode.client and
  Git calls to engineeringagent.git.client.

  '
acceptance:
- Loop orchestration and permission probe paths call explicit Git/OpenCode client
  helpers instead of raw subprocess invocation wrappers.
- New OpenCode client package under src/engineeringagent/opencode/ exposes a high-level
  start_agent-style function used by loop execution.
- New Git client package under src/engineeringagent/git/ exposes helpers for status/head/add/commit
  used by loop completion flow.
- architecture.loop-subprocess-boundary fails when subprocess is used in non-allowlisted
  modules, including alias/import bypass patterns.
- The subprocess boundary rule still reports deterministic file:line violations.
- '`engineeringagent fitness run --format json` includes remediation guidance for
  failing rules without introducing a new fitness contract field.'
- Failing fitness output must be easy to convert into retry guidance (deterministic
  pairing of `rule_id` and remediation text for each failed/error rule).
- Retry feedback derived from failed gates includes actionable remediation guidance
  for failed fitness rules.
- Fitness catalog remediation text for loop subprocess boundary explicitly states
  what to do instead (Git/OpenCode client modules).
- 'FEAT-026 behavior is preserved: this feature does not reintroduce permission probing
  as a default in-loop gate requirement.'
- Targeted tests and validation commands pass.
artifacts:
  plan: plan.md
