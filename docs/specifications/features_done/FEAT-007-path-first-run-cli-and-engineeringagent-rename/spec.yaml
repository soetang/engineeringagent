id: FEAT-007
title: Path-first run CLI and engineeringagent hard rename
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
planning_tier: planned
status: done
priority: high
objective: Replace ID-based loop invocation with a file-path-first run command and
  hard-rename the package, module, and CLI surface to engineeringagent.
context: 'Current usage requires `--feature-id` and a nested `loop run` command shape.
  This is slower to autocomplete and adds avoidable command depth. We want a simpler
  UX centered on explicit spec file paths, plus a full project rename from `agent-harness`/`agent_harness`
  to `engineeringagent` with no legacy compatibility layer.

  '
constraints:
- Primary run UX is `engineeringagent run <feature-spec-path> [feature-spec-path ...]`
  with positional file path input.
- Do not keep legacy `agent-harness` command, `agent_harness` module path, or `--feature-id`
  CLI contract.
- Feature selection candidates must be driven by explicit file paths, not FEAT ID
  lookup.
implementation_notes: 'Keep command behavior deterministic and explicit: resolve and
  validate the provided feature file path before execution. Update wrappers, docs,
  and tests so the new naming and run contract are the only supported public interface.

  '
acceptance:
- CLI supports `engineeringagent run <feature-spec-path> [feature-spec-path ...]`
  as the canonical run entrypoint.
- Run selection uses the provided feature YAML file path(s) directly and errors clearly
  for missing/invalid paths.
- Python package/module path is renamed to `engineeringagent` and imports/entrypoints
  are updated repo-wide.
- Legacy `agent-harness`/`agent_harness` naming and `--feature-id` run selection are
  removed from supported usage.
- Documentation and scripts reflect only the new naming and command contract.
artifacts:
  plan: plan.md
updated_at: '2026-02-12T20:45:00Z'
