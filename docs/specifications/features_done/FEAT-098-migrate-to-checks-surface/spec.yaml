id: FEAT-098
title: Migrate CLI + loop to engineeringagent.checks (grouped checks selection + reviewer
  CLI)
type: feature
expected_commit_subject: 'feat: migrate checks execution to engineeringagent.checks'
planning_tier: planned
status: done
priority: high
objective: 'Reduce cross-module coupling and enable smaller diffs by migrating the
  CLI and loop runtime to the canonical `engineeringagent.checks.run_checks(...)`
  contract, adding an explicit grouped selection interface for `engineeringagent checks
  run` (including reviewer execution), and removing legacy harness policing from `engineeringagent
  validate`.

  '
context: "Depends on FEAT-097.\nOrdering / dependencies (explicit): - FEAT-097 must\
  \ land before FEAT-098. - FEAT-098 must land before FEAT-099.\nSpec package (explicit):\
  \ - This larger refactor is intentionally split across multiple specs:\n  FEAT-097,\
  \ FEAT-098, FEAT-099.\n- You are here: FEAT-098.\nFEAT-097 introduces `src/engineeringagent/checks/**`\
  \ as the canonical home for check execution with a narrow supported surface. This\
  \ feature adopts that surface in the primary callsites (CLI checks runner and loop\
  \ runtime), extends the checks CLI to run reviewers via explicit group selection,\
  \ and begins deprecating legacy check execution modules by making them unused. Physical\
  \ deletions and broader package relocation are deferred to FEAT-099 to confirm parity\
  \ before removal.\n"
constraints:
- 'Default behavior must remain stable: when group selection is omitted, `engineeringagent
  checks run` executes commands+fitness only.'
- No boolean flags for reviewers; use explicit group selection via `--checks`.
- Reviewer checks in `engineeringagent checks run` require explicit `--feature-path`
  (no auto-detect).
- Checks code must not implement OpenCode/subagent logic; CLI and loop wire `start_agent_fn`
  from `engineeringagent.opencode.client.start_agent`.
- Remove legacy harness contract file policing from `engineeringagent validate` (do
  not fail validation solely because harness/gates.yaml or harness/reviewers.yaml
  exist).
- Do not delete legacy modules in this spec; they must become unused by production
  code, then deleted in FEAT-099.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `engineeringagent\
  \ checks run` CLI.\n  - Old behavior: executes command+fitness checks declared in\
  \ `harness/checks.yaml`.\n    Reviewers are not runnable from this command.\n  -\
  \ New behavior:\n    - `engineeringagent checks run` accepts repeatable `--checks`\
  \ group selection:\n      validate|commands|fitness|reviewers\n    - Default when\
  \ `--checks` is omitted remains [\"commands\", \"fitness\"].\n    - Reviewers can\
  \ be run from CLI by including reviewers in `--checks`, and require\n      `--feature-path\
  \ <path-to-feature-yaml>`.\n\n- Surface: internal callsites for check execution\
  \ (CLI + loop runtime).\n  - Old behavior: CLI and loop runtime call legacy modules\
  \ directly\n    (`engineeringagent.harness_checks_runtime.*`, `engineeringagent.reviewers.*`,\n\
  \    `engineeringagent.validator.validate`).\n  - New behavior: CLI and loop runtime\
  \ call `engineeringagent.checks.run_checks(...)`\n    with group selection and injected\
  \ dependencies.\n\n- Surface: spec/setup validation policy.\n  - Old behavior: `engineeringagent\
  \ validate` fails when legacy harness contract files\n    (`harness/gates.yaml`,\
  \ `harness/reviewers.yaml`) exist.\n  - New behavior: `engineeringagent validate`\
  \ no longer fails solely due to presence of\n    legacy harness contract files.\n\
  \nCompatibility policy:\n- Default user workflows remain stable:\n  - `engineeringagent\
  \ checks run` still runs commands+fitness by default.\n  - `engineeringagent run\
  \ --all` still runs gates + reviewers with the same phase semantics.\n- Reviewer\
  \ CLI support is additive and opt-in via explicit `--checks reviewers`.\n\nCLI contract\
  \ details (v1 additions):\n- `engineeringagent checks run` options:\n  - `--checks\
  \ <group>` repeatable (e.g. `--checks commands --checks fitness`).\n    Allowed\
  \ values: validate|commands|fitness|reviewers.\n  - `--check-id <id>` optional:\
  \ run only one check id within selected groups.\n  - `--feature-path <path>` required\
  \ when reviewers group is selected.\n  - Existing options preserved: `--phase`,\
  \ `--base`, `--head`, `--verbose-output`.\n\nPost-migration unused-by-production\
  \ goal (deletions in FEAT-099):\n- After FEAT-098, production code should not import\
  \ legacy check entrypoints:\n  - `engineeringagent.harness_checks_runtime`\n  -\
  \ `engineeringagent.validator`\n  - `engineeringagent.reviewers`\n\nFitness-function\
  \ impact assessment:\n- no fitness-function changes required.\n"
acceptance:
- 'CLI: `engineeringagent checks run` calls `engineeringagent.checks.run_checks(...)`.'
- 'CLI: `engineeringagent checks run` supports repeatable `--checks` group selection;
  default groups are [''commands'',''fitness''] when omitted.'
- 'CLI: reviewers are runnable via `engineeringagent checks run --checks reviewers
  --feature-path <feature.yaml>` and fail fast with deterministic remediation when
  `--feature-path` is missing.'
- 'CLI: optional `--check-id` runs only the selected check id (deterministic unknown-id
  failure).'
- Loop runtime uses `engineeringagent.checks.run_checks(...)` for gate execution (commands+fitness)
  and reviewer execution (reviewers) instead of direct imports from legacy executors.
- '`engineeringagent validate` no longer fails due to presence of legacy harness contract
  files (`harness/gates.yaml`, `harness/reviewers.yaml`).'
- 'After FEAT-098, production code does not import any legacy checks entrypoints:
  `engineeringagent.harness_checks_runtime`, `engineeringagent.validator`, or `engineeringagent.reviewers`
  (deletions follow in FEAT-099).'
- '`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass.'
artifacts:
  plan: plan.md
