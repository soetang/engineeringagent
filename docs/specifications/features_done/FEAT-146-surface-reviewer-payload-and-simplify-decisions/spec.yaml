id: FEAT-146
title: Surface full reviewer payload in verbose checks output and simplify reviewer
  decisions to two states
type: spec
expected_commit_subject: 'spec: add FEAT-146 reviewer verbose payload surfacing and
  two-state decisions'
planning_tier: planned
status: done
priority: high
objective: Improve reviewer failure usability by surfacing complete reviewer decision
  details in `checks run --verbose-output`, while simplifying reviewer decisions to
  a strict two-state contract (`approve` | `request_changes`) across reviewer schema/runtime/checks
  surfaces.
context: 'Reviewer decision payloads already support `required_actions` and `scope_notes`,
  but current checks runtime output mainly surfaces `decision` and `summary`, which
  hides actionable detail during terminal workflows.

  We also currently carry a third reviewer decision value (`warning`) in schema-level
  contracts. Team direction is to remove that option and keep reviewer outcomes binary:
  either changes are required or they are not.'
constraints:
- Default non-verbose checks output remains concise and stable.
- Verbose reviewer output must surface all keys present in the normalized reviewer
  decision payload, deterministically.
- When reviewer decision is non-approve and `required_actions` is empty, include deterministic
  fallback remediation guidance in surfaced output.
- Remove `warning` as a reviewer decision option from reviewer contracts and checks-owned
  reviewer handling.
- Apply two-state reviewer decision policy in checks module behavior, not only terminal
  formatting.
- Breaking contract changes are allowed for this repository; do not add compatibility
  shims for removed reviewer decision states.
implementation_notes: 'Contract change declaration


  Surface:

  - Reviewer decision schema in `checks/reviewers/engine`.

  - Reviewer decision normalization and terminal output shaping in `checks/reviewers/runtime`
  and checks strategies.

  - Reviewer retry-feedback decision typing/normalization in `prompts/retry_feedback`.

  - Reviewer-facing docs/tests that currently encode `warning` as a valid reviewer
  decision.


  Old behavior:

  - Reviewer output includes limited surfaced detail in checks runtime output (primarily
  decision + summary line).

  - Reviewer schema and retry-feedback contracts allow `warning`.

  - Runtime semantics are inconsistent with three-state intent (non-approve collapses
  behavior), creating ambiguity.


  New behavior:

  - `checks run --verbose-output` renders deterministic expanded reviewer detail including
  all normalized decision payload keys.

  - Non-approve reviewer output with empty `required_actions` includes explicit fallback
  remediation guidance.

  - Reviewer decisions are strict two-state (`approve`, `request_changes`) across
  schema/runtime/checks/prompt-feedback contracts.


  Compatibility policy:

  - Immediate break: `warning` is removed as a supported reviewer decision contract
  value.

  - No compatibility aliasing, no transitional dual-support paths.


  Migration plan:

  - Tighten reviewer decision literal types and normalization to two-state.

  - Update verbose reviewer output formatting in checks runtime path to include full
  decision payload deterministically.

  - Update tests and docs that currently assume `warning` support.

  - Ensure fallback guidance appears when required actions are missing for non-approve
  decisions.


  Verification evidence:

  - Reviewer runtime/contract tests assert verbose payload surfacing and fallback
  guidance behavior.

  - Retry-feedback contract tests assert two-state reviewer decision typing.

  - End-to-end checks API contracts remain deterministic.


  Fitness-function impact assessment:

  - no fitness-function changes required

  - Rationale: this feature changes reviewer decision/output contracts and tests/docs,
  but does not introduce a new architecture boundary or invalidate current fitness
  rule intent.

  '
acceptance:
- Default `checks run` reviewer output remains concise (no forced verbose expansion).
- '`checks run --verbose-output` includes deterministic expanded reviewer details
  for reviewer decisions and surfaces all normalized decision payload keys.'
- For non-approve reviewer outcomes with empty `required_actions`, terminal output
  includes deterministic fallback remediation guidance.
- Reviewer decision contracts in reviewer engine/runtime/checks/prompt-feedback are
  restricted to `approve` and `request_changes`.
- '`warning` is removed from reviewer decision schema/docs/tests and is no longer
  a valid reviewer decision contract value.'
- Reviewer-related checks outputs and payload handling remain deterministic and parse-safe
  after two-state decision simplification.
- '`uv run pytest -q tests/reviewers/test_reviewers_runtime.py tests/checks/test_checks_reviewers_runtime.py
  tests/checks/test_run_checks_contract.py tests/loop/test_retry_feedback_contracts.py
  tests/loop/test_loop_runtime_iteration.py tests/loop/test_loop_output.py` passes.'
- '`uv run engineeringagent validate` passes.'
artifacts:
  plan: plan.md
