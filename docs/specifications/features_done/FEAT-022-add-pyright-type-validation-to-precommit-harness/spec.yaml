id: FEAT-022
title: Add Pyright type validation to precommit harness
type: test
expected_commit_subject: 'test: add FEAT-022 pyright precommit type validation gate'
planning_tier: planned
status: done
priority: high
objective: 'Add deterministic Pyright-based type validation to the precommit harness
  so local quality gates catch type regressions before commit.

  '
context: 'Current precommit gates enforce YAML/spec validation, markdown formatting,
  Ruff linting, and pytest, but they do not run static type checking. This allows
  typing regressions to pass local precommit even when type contracts are violated.

  The requested rollout is precommit-only (no CI gate change) and should cover package
  code, tests, and harness scripts using Pyright at an initial basic-enforcement level.

  '
constraints:
- Keep `.pre-commit-config.yaml` on the stable single entrypoint `uvx --from . engineeringagent
  gates run --profile precommit`.
- Add Pyright gate coverage to `profiles.precommit`; do not add a CI commit/workflow
  gate in this feature.
- Type-check scope must include `src/engineeringagent`, `tests`, and `harness`.
- Start with Pyright basic mode for initial adoption; avoid strict-mode expansion
  in this feature.
- Keep `loop_fast` profile behavior unchanged.
- Use uv-native deterministic commands for install and execution.
implementation_notes: 'Add Pyright as a development dependency and introduce repository
  configuration for include paths, Python version alignment, and baseline basic checking
  mode. Wire a `pyright_validate` gate command into `harness/gates.yaml` and `src/engineeringagent/gates.py`
  default scaffolding so missing gate configuration still bootstraps correctly.

  Update tests that assert scaffold/default gate commands and profile contents, and
  add focused assertions for the new gate registration and execution path. Update
  contributor references that describe canonical precommit checks so Pyright expectations
  are explicit.

  '
acceptance:
- '`harness/gates.yaml` precommit profile includes a `pyright_validate` gate and executes
  it deterministically.'
- Default gate scaffolding in `src/engineeringagent/gates.py` includes `pyright_validate`
  with the same command contract.
- Pyright configuration exists and enforces basic mode across `src/engineeringagent`,
  `tests`, and `harness`.
- Existing codebase type issues in configured scope are resolved or intentionally
  narrowed so `uv run pyright` passes.
- Precommit profile succeeds end-to-end with Pyright included.
- No CI workflow/gate additions are introduced by this feature.
- Docs describing precommit quality workflow mention Pyright.
artifacts:
  plan: plan.md
updated_at: '2026-02-13T08:05:00Z'
