id: FEAT-011
title: Add engineeringagent init scaffold command with safe conflict handling
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
planning_tier: planned
status: done
priority: high
objective: Add a one-command `engineeringagent init` bootstrap flow that scaffolds
  a usable harness baseline, handles existing `docs/` and `AGENTS.md` conflicts safely,
  and generates agent guidance focused on setup/validation (not run execution).
context: 'New repositories need a consistent harness starting point without manual
  file-by-file setup. POT-001 captured this as an `agent-harness init` idea; this
  feature formalizes the implementation as `engineeringagent init` and closes critical
  UX gaps around existing repository content. The command must preserve user-owned
  docs and AGENTS material via explicit decisions, while still producing deterministic
  scaffold output and validation-first guidance.

  '
constraints:
- Command surface is `engineeringagent init` (no `agent-harness` naming).
- Support a single scaffold template only (no `--minimal`/`--full` variants).
- If `docs/` already exists, require an explicit user choice to either reuse existing
  docs structure or create a separate scaffold docs directory with a distinct name.
- 'If `AGENTS.md` already exists, provide interactive choices: overwrite, preserve-by-rename+create-scaffold-AGENTS
  with follow-up merge spec, or abort/do nothing.'
- Generated `AGENTS.md` must include setup and validation guidance only; do not mention
  `engineeringagent run`.
- Scaffold includes pre-commit hook wiring, but does not ship concrete gate run commands
  by default.
- When a gate profile has no configured gates, CLI output must be a clear user-friendly
  message (non-error) explaining that no gates are configured.
- Init must be idempotent and non-destructive unless the user explicitly selects overwrite
  behavior or passes a force-style option.
implementation_notes: 'Introduce an `init` CLI subcommand and scaffold generator that
  writes the baseline harness layout, docs/spec directories, schema/backlog starters,
  gate config stubs, and pre-commit hook entrypoint. Add conflict-resolution prompts
  for existing `docs/` and `AGENTS.md`, plus deterministic non-interactive flags for
  automation where needed. Update gate execution messaging so empty profiles are explicit
  and helpful. AGENTS template content should instruct agents how to bootstrap/repair
  harness assets and validate with CLI commands (`engineeringagent validate`, `engineeringagent
  gates ...`) without documenting `engineeringagent run`.

  '
acceptance:
- '`engineeringagent init` is available as a documented top-level CLI command.'
- Running init in an empty repo creates scaffolded spec/harness/pre-commit baseline
  with one default template.
- When `docs/` already exists, init requires an explicit reuse-vs-separate choice
  and applies the selected pathing behavior.
- When `AGENTS.md` already exists, init offers the three required outcomes (overwrite,
  preserve-by-rename + scaffold AGENTS + follow-up merge spec, or abort).
- Generated `AGENTS.md` includes harness bootstrap and validation instructions via
  CLI and contains no `engineeringagent run` guidance.
- Scaffolded pre-commit integration exists, and running gates for an empty profile
  returns a friendly no-gates-configured message with successful exit.
- Re-running init without force/overwrite is idempotent and reports skips/decisions
  clearly.
artifacts:
