id: FEAT-040
title: Surface per-iteration verification failures into retry feedback and loop status
type: bug
expected_commit_subject: 'fix: add FEAT-040 per-iteration verification feedback signaling'
planning_tier: planned
status: done
priority: high
objective: Ensure each loop iteration captures and reports subtask verification command
  results deterministically, and feeds failing test output back into the next implementation
  prompt for the same feature.
context: Recent FEAT-037 runs showed repeated retries where iteration telemetry reported
  `implement=passed` and `result=passed` while subtask verification logs still contained
  failing `uv run pytest -q` output. Because this failure context was not promoted
  into structured iteration status and retry feedback, the implementer kept repeating
  the same step without actionable guidance. Primary evidence is captured in `progress/run-feature-FEAT-037.txt`
  (see repeated `next_action=retry_same_feature` and recurring `tests/test_fitness_parallel_runner.py`
  failures near the file tail).
constraints:
- Do not rely on implementer narration to determine verification success/failure.
- Execute selected subtask verification commands in harness-controlled flow with deterministic
  pass/fail outcomes.
- When any verification command fails, iteration result must not be reported as pass.
- Failed verification output must be carried into the next retry prompt for the same
  feature path.
- Preserve existing gate execution behavior and failed-gate semantics for gate failures.
- Keep default output concise while preserving full details in progress logs.
implementation_notes: Add a dedicated verification phase in loop runtime that runs
  the selected subtask's `verification` commands after implement step and before completion
  transitions. Record structured verification status in iteration telemetry and progress
  logs, including the failing command id and captured output when failures occur.
  Reuse the existing retry feedback channel used for gate/commit failures so the next
  implementation prompt includes the latest verification failure evidence. Ensure
  loop action selection does not classify verification-failed iterations as passed.
acceptance:
- Selected subtask verification commands run under harness control on each non-dry
  iteration.
- Iteration output and telemetry include explicit verification status (`passed` or
  `failed:<command>`).
- A failing verification command causes non-pass iteration result and stable failure
  signaling.
- Next retry prompt for the same feature includes truncated latest verification failure
  output.
- Progress logs include a concise verification summary plus detailed failing command
  output.
- Existing gate and commit failure feedback behavior remains intact.
artifacts:
  plan: plan.md
