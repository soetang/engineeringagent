id: FEAT-103
title: Speed up slow fitness tests by avoiding repo-root scans and reducing semgrep
  invocations
type: test
expected_commit_subject: 'test: speed up slow fitness tests'
planning_tier: planned
status: done
priority: medium
objective: 'Reduce `uv run pytest -q` wall time by refactoring two slow test areas:
  (1) stop running the markdown locality checker against the full repository when
  asserting only the stable rule_id, and (2) reduce repeated semgrep subprocess startups
  in the loop subprocess boundary tests, and (3) avoid running the full repository
  validation path when checking that the validate check group executes.

  '
context: 'The harness fitness rule scripts are intentionally repo-scanning, but some
  tests are using repo_root as the cwd even when they assert only trivial invariants.
  This causes unnecessary full-repo scanning and dominates the test durations list.
  Separately, semgrep startup is expensive; current tests invoke the semgrep-based
  subprocess-boundary checker once per scenario, paying the startup cost repeatedly.
  We can keep coverage and confidence while making the tests much faster.

  '
constraints:
- Do not change production behavior of any harness fitness checker scripts (only tests
  refactoring).
- Keep assertions deterministic and maintain existing intent/coverage.
- Do not relax the semantics of the rules being tested (only reduce test runtime).
implementation_notes: "Target 1: markdown locality rule_id test\n\n- File: tests/fitness/test_fitness_rules_markdown_locality.py\n\
  - Current behavior: test_markdown_locality_rule_uses_expected_rule_id runs\n  the\
  \ checker with cwd=repo_root, which triggers full repository scans.\n- Change: run\
  \ the checker with cwd=tmp_path instead.\n  - Keep checker_path pointing at the\
  \ real script in repo_root.\n  - Create a minimal directory structure in tmp_path\
  \ if needed (e.g. an empty tree\n    is fine; the rule id is constant).\n  - Assert\
  \ only that:\n    - subprocess returncode is 0\n    - payload[\"rule_id\"] matches\
  \ the stable id\n  - Do not assert pass/fail status in this test; other tests already\
  \ cover behavior.\n\nTarget 2: reduce semgrep invocations in subprocess-boundary\
  \ tests\n\n- File: tests/fitness/test_fitness_rules_loop_subprocess_boundary.py\n\
  - Current behavior: multiple tests each call the checker, which spawns semgrep.\n\
  - Change: consolidate scenarios to reduce checker runs:\n  - Keep the existing rule_id\
  \ assertion test (it runs semgrep once).\n  - Add/keep one FAIL test that writes\
  \ multiple violating modules into the same tmp_path\n    (e.g. direct subprocess\
  \ use, alias module call, from-import alias call) then runs\n    the checker once\
  \ and asserts all expected violation strings are present.\n  - Add/keep one PASS\
  \ test that writes an allowlisted module invoking subprocess and\n    asserts status\
  \ pass and violations empty.\n- Delete or merge redundant tests so the file performs\
  \ at most ~3 checker runs total\n  (rule_id + consolidated fail + pass).\n- Preserve\
  \ deterministic violation matching by checking for stable substrings.\n\nTarget\
  \ 3: avoid repo-root validate execution in checks contract test\n\n- File: tests/checks/test_run_checks_contract.py\n\
  - Current behavior: test_run_checks_validate_group_executes(repo_root) calls\n \
  \ run_checks(repo_root, checks=[\"validate\"]). This exercises full repository\n\
  \  validation, which is integration-like and slower than necessary for the\n  contract\
  \ being asserted.\n- Change: run the validate group against a minimal temp repository\
  \ instead.\n  - Use tmp_path, scaffold only the minimal files needed for validate\
  \ to succeed.\n    Follow existing init scaffold conventions in tests (e.g., create\n\
  \    docs/spec/features/.gitkeep, docs/spec/features_done/.gitkeep, and\n    docs/spec/schemas/feature.schema.json\
  \ if required by validate).\n  - Write a minimal harness/checks.yaml suitable for\
  \ run_checks selection.\n  - Assert result.ok is True.\n  - Do not assert repo-specific\
  \ validate details in this test; other tests cover\n    validate semantics.\n"
acceptance:
- tests/fitness/test_fitness_rules_markdown_locality.py::test_markdown_locality_rule_uses_expected_rule_id
  no longer runs with cwd=repo_root.
- tests/fitness/test_fitness_rules_loop_subprocess_boundary.py invokes the semgrep-based
  checker fewer times by consolidating scenarios (no per-scenario semgrep subprocess).
- tests/checks/test_run_checks_contract.py::test_run_checks_validate_group_executes
  no longer runs validate against repo_root (it uses a minimal temp repo).
- uv run pytest -q passes.
- uv run pytest -q --durations=20 shows a material reduction in the top slowest durations
  (markdown locality rule_id test no longer appears as a multi-second outlier).
artifacts:
  plan: plan.md
