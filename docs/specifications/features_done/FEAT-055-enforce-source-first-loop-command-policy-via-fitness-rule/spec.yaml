id: FEAT-055
title: Enforce source-first loop command policy via harness fitness rule
type: feature
expected_commit_subject: 'feat: add FEAT-055 source-first loop command fitness enforcement'
planning_tier: planned
status: done
priority: medium
objective: Prevent stale package-artifact execution during loop iterations by enforcing
  source-first command usage for loop-executed commands.
context: We observed nondeterministic behavior when loop verification commands invoked
  `uvx --from . engineeringagent ...`, because `uvx` can execute a cached built artifact
  from `~/.cache/uv` instead of current workspace `src/` code. The policy for in-repo
  loop execution should be source-first (`uv run ...` or equivalent local workspace
  execution), with deterministic hard-fail enforcement implemented as a harness fitness
  rule.
constraints:
- Enforcement must be implemented as a harness fitness function rule (command adapter)
  declared in `harness/fitness_functions/rules.yaml`.
- 'Rule scope is loop-executed commands only: active feature verification commands
  under `docs/spec/features/*.yaml` and gate runner commands in `harness/gates.yaml`.'
- Policy must hard-fail on forbidden self-invocation patterns such as `uvx --from
  . engineeringagent ...`.
- Allowed in-repo loop command forms include `uv run ...` and direct local workspace
  execution forms (for example `.venv/bin/engineeringagent ...`) when deterministic.
- Checker command interface must be explicit and stable (`uv run python harness/fitness_functions/<script>.py`
  emitting one fitness result envelope JSON document to stdout).
- Rule output must be deterministic and machine-readable through the existing fitness
  result envelope contract.
- Violation messages must include actionable remediation guidance with direct replacement
  intent (prefer `uv run python -m engineeringagent.cli ...`).
- Existing repository violations in scoped files must be auto-migrated to policy-compliant
  commands as part of this feature.
- Enforcement is immediate (no warning phase) once feature is merged.
- Do not add or change package-artifact/release-lane policies in this feature.
implementation_notes: 'Implement a new command-based fitness checker script under
  `harness/fitness_functions/` that scans only policy-scoped command surfaces and
  emits deterministic pass/fail results. The checker should parse feature verification
  command arrays and gate command runner fields (`run` and structured `runner.command`),
  detect forbidden in-repo `uvx` self-invocation patterns, and report stable path-qualified
  violations.

  API/interface contract for this checker: - Input: repository root inferred from
  current working directory; no positional args required. - Output: strict JSON envelope
  compatible with `FitnessRuleResult` contract. - Exit code: 0 when status is pass,
  non-zero when status is fail/error.

  Register the rule in `harness/fitness_functions/rules.yaml` with `severity: error`
  so the existing `fitness_validate` gate blocks loop progression on policy regressions.
  Keep rule metadata and remediation text explicit for generated docs.

  Migrate existing scoped command entries to compliant source-first forms, preserving
  command intent while eliminating in-repo `uvx --from . engineeringagent ...` usage.
  Add regression coverage for both detection and migration expectations.'
acceptance:
- A new harness fitness rule exists that enforces source-first command policy for
  loop-executed command surfaces.
- The rule fails deterministically when a scoped command uses forbidden in-repo `uvx
  --from . engineeringagent ...` invocation.
- The rule does not flag allowed source-first forms such as `uv run ...` for equivalent
  commands.
- Rule violation output is deterministic and includes actionable remediation guidance.
- '`harness/fitness_functions/rules.yaml` registers the new rule with `severity: error`
  and command adapter wiring.'
- Existing scoped commands in active feature verification entries and `harness/gates.yaml`
  are migrated to policy-compliant forms.
- '`engineeringagent gates run --profile loop_fast` fails when violations are introduced
  and passes after remediation.'
- Fitness catalog/docs reflect the new rule metadata after regeneration.
- No package-lane behavior is introduced or modified by this feature.
