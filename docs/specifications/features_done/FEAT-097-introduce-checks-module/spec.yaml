id: FEAT-097
title: Introduce engineeringagent.checks module (canonical checks surface + contracts)
type: feature
expected_commit_subject: 'feat: introduce engineeringagent.checks module'
planning_tier: planned
status: done
priority: high
objective: 'Improve separation of concerns and refactorability by introducing a single,
  canonical `engineeringagent.checks` module that owns all functionality related to
  planning and running checks (spec/setup validation, harness/checks.yaml command+fitness+reviewers
  execution), with a narrow supported export surface.

  '
context: "Today, \"checks\" functionality is split across multiple modules (validator,\
  \ harness_checks_runtime, reviewers, loop_runtime orchestration, fitness helpers).\
  \ This increases cross-cutting changes and makes it harder to do incremental, low-diff\
  \ refactors. We want a dedicated checks package with stable top-level entrypoints,\
  \ while keeping legacy modules in place during an initial migration window (no deletions\
  \ in this feature).\nEnd-state direction (explicit): after migration completion,\
  \ the functionality currently implemented under the legacy check execution and feedback\
  \ subsystems will live under `src/engineeringagent/checks/**`.\nSpecifically, after\
  \ the FEAT-097 -> FEAT-098 -> FEAT-099 migration sequence: - Fitness framework code\
  \ moves from `src/engineeringagent/fitness/**` to\n  `src/engineeringagent/checks/**`.\n\
  - Retry-feedback code moves from `src/engineeringagent/retry_feedback/**` to\n \
  \ `src/engineeringagent/checks/**`.\n- Legacy check execution entrypoints become\
  \ unused by production code:\n  `src/engineeringagent/harness_checks_runtime.py`,\n\
  \  `src/engineeringagent/validator.py`,\n  `src/engineeringagent/reviewers.py`.\n\
  \nThe legacy paths above become unused by production code and eligible for deletion\
  \ (and are deleted as part of FEAT-099).\nSpec sequence (explicit): - FEAT-097 introduces\
  \ `engineeringagent.checks` and the stable contracts. - FEAT-098 migrates CLI +\
  \ loop runtime callsites to `engineeringagent.checks`. - FEAT-099 relocates remaining\
  \ legacy subsystems under `checks/**` and deletes\n  legacy modules/packages once\
  \ unused by production code.\n\nSpec package (explicit): - This larger refactor\
  \ is intentionally split across multiple specs:\n  FEAT-097, FEAT-098, FEAT-099.\n\
  - You are here: FEAT-097.\nOrdering / dependencies (explicit): - FEAT-097 must land\
  \ before FEAT-098. - FEAT-098 must land before FEAT-099.\n"
constraints:
- 'Spec A only: introduce the new checks package with real implementations under `src/engineeringagent/checks/**`,
  but do not delete legacy modules/files.'
- 'No callsite migration required in this feature: CLI and loop runtime may continue
  using legacy entrypoints until a later spec.'
- 'The supported `engineeringagent.checks` export surface must be intentionally small:
  `run_checks`, `emit_fitness_result`, and `emit_result_envelope` (alias).'
- 'Avoid OpenCode/subagent implementation inside checks: reviewer execution must call
  an injected callable (or a default imported from `engineeringagent.opencode.*`),
  but checks must not implement OpenCode protocol logic.'
- 'Determinism is required: stable run/skip decisions, stable ordering, stable JSON
  envelope emission, stable failure signaling.'
- No new enforcement rules in this feature restricting imports to `engineeringagent.checks`
  (enforcement is deferred until after migration).
- No behavior changes to validation policy in this feature (do not remove legacy harness-file
  policing from `engineeringagent validate` yet; that is a later spec).
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: supported check\
  \ execution API for internal callsites (CLI + loop runtime)\n  and supported harness\
  \ helper surface for fitness-rule scripts.\n\n- Old behavior (today):\n  - Repo-owned\
  \ checks execution is implemented across multiple modules:\n    - command+fitness\
  \ planning/execution in `engineeringagent.harness_checks_runtime.*`\n    - reviewer\
  \ execution in `engineeringagent.reviewers.*` orchestrated from\n      `engineeringagent.loop_runtime.phases.*`\n\
  \    - spec/setup validation in `engineeringagent.validator.validate`\n  - The supported\
  \ fitness envelope helper for harness fitness scripts is\n    `engineeringagent.fitness.envelope.emit_result_envelope(...)`.\n\
  \n- New behavior (after this feature):\n  - A new canonical checks module exists\
  \ at `engineeringagent.checks` with a narrow\n    supported surface:\n    - `engineeringagent.checks.run_checks(...)`\
  \ is the supported orchestration API.\n    - `engineeringagent.checks.emit_fitness_result(...)`\
  \ is the canonical helper for\n      emitting deterministic fitness-rule result\
  \ envelopes.\n    - `engineeringagent.checks.emit_result_envelope` is a compatibility\
  \ alias for\n      `emit_fitness_result`.\n  - The canonical implementation of the\
  \ fitness envelope emitter moves under\n    `src/engineeringagent/checks/**`.\n\
  \    - Old import path `engineeringagent.fitness.envelope.emit_result_envelope`\
  \ remains\n      supported as a shim delegating to `engineeringagent.checks.emit_fitness_result`\n\
  \      during the migration window.\n\nCompatibility policy:\n- Staged refactor\
  \ with temporary dual surfaces.\n- In this feature, existing modules and callsites\
  \ are not removed; old entrypoints remain\n  importable and behavior-stable while\
  \ the new `engineeringagent.checks` surface is added.\n- Deletion of legacy modules\
  \ and enforcement of import boundaries is deferred to later specs.\n\n`engineeringagent.checks.run_checks`\
  \ contract (v1):\n- `run_checks(project_root, *, phase, checks=None, check_id=None,\
  \ feature_path=None,\n             verbose_output=False, base=None, head=None, start_agent_fn=None)\
  \ -> ChecksRunResult`\n- Group selection:\n  - `checks` selects which check groups\
  \ run: \"validate\" | \"commands\" | \"fitness\" | \"reviewers\".\n  - Deterministic\
  \ group order is fixed: validate -> commands -> fitness -> reviewers.\n  - Default\
  \ when `checks is None`: [\"commands\", \"fitness\"] (matches current checks-run\
  \ behavior).\n- Single-check selection:\n  - If `check_id` is provided, only that\
  \ check id runs (within enabled groups), with deterministic\n    failure semantics\
  \ for unknown ids.\n- Reviewer requirements (no implicit discovery):\n  - If \"\
  reviewers\" is included in `checks`, `feature_path` is required (no auto-detect).\n\
  \    `feature_path` refers to the feature spec YAML file path being reviewed (active\
  \ or\n    archived). It is used to supply deterministic reviewer context (and may\
  \ be used to\n    derive `feature_id` by loading the YAML).\n  - Reviewer execution\
  \ must not implement OpenCode/subagent logic inside checks; it must accept an\n\
  \    injected `start_agent_fn` callable (or wire a default from `engineeringagent.opencode.*`).\n\
  \nFitness envelope helper contract (v1):\n- Canonical helper:\n  - `engineeringagent.checks.emit_fitness_result(result:\
  \ FitnessRuleResult) -> None`\n  - Emits exactly one compact JSON object to stdout\
  \ with deterministic encoding and includes\n    contract_version sourced from `engineeringagent.fitness.contracts.CONTRACT_VERSION`.\n\
  - Compatibility alias:\n  - `engineeringagent.checks.emit_result_envelope` must\
  \ be an alias of `emit_fitness_result`.\n- Shim:\n  - `engineeringagent.fitness.envelope.emit_result_envelope`\
  \ remains available and delegates to\n    the checks implementation during the migration\
  \ window.\n\nFitness-function impact assessment:\n- no fitness-function changes\
  \ required; harness fitness scripts may continue importing\n  `engineeringagent.fitness.envelope.emit_result_envelope`\
  \ during the migration window.\n"
acceptance:
- A new package `src/engineeringagent/checks/` exists with subpackages for validate,
  commands, fitness, and reviewers, and contains real implementations (not just wrappers).
- 'The supported export surface is available: `from engineeringagent.checks import
  run_checks, emit_fitness_result, emit_result_envelope`.'
- '`emit_result_envelope` exported from `engineeringagent.checks` is a compatibility
  alias of `emit_fitness_result`.'
- The canonical fitness envelope implementation lives under `src/engineeringagent/checks/**`,
  and `src/engineeringagent/fitness/envelope.py` remains importable as a shim delegating
  to checks.
- Reviewer execution under checks does not implement OpenCode/subagent logic; it calls
  an injected callable (or a default imported from `engineeringagent.opencode.*`).
- Deterministic behavior is preserved (stable ordering, stable JSON emission, deterministic
  failures), validated by tests.
- '`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass.'
artifacts:
