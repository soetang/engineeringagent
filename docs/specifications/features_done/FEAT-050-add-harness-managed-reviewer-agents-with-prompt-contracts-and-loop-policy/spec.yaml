id: FEAT-050
title: Add harness-managed reviewer agents with prompt contracts, approval policy,
  and loop integration
type: feature
expected_commit_subject: 'feat: add FEAT-050 harness reviewer agents contract and
  loop integration'
planning_tier: planned
status: done
priority: high
objective: Add a first-class reviewer-agent system managed under `harness/` so teams
  can run advisory or blocking reviewers with deterministic trigger and approval policy,
  repository-local prompt files, README-process sandbox checks, and clear tooling/docs
  for custom reviewers.
context: 'Reviewer-agent workflow is currently tracked as idea `POT-011`, while runtime
  and docs principles already position reviewers as a planned complement after deterministic
  checks. The requested design now needs concrete contract plus implementation flow:
  reviewers should support multiple scenarios (always-run-on-code-change simplification,
  README process review only when README changes in an isolated temp snapshot), communicate
  approval deterministically, and handle non-determinism via bounded retries and explicit
  exhausted-policy behavior.'
constraints:
- Keep deterministic command gates as the primary baseline; reviewer agents are complementary
  and must not replace spec/gate validation.
- Reviewer configuration must be repository-local and harness-managed in `harness/reviewers.yaml`.
- Reviewer prompt sources must be repository-local files under `harness/reviewers/prompts/`;
  do not require `.opencode/agents/*.md` files for reviewer setup in this feature.
- Reviewer execution must use shared OpenCode invocation (for example `agent=build`)
  with composed prompt input and strict machine-parse decision output.
- Default reviewer mode must be advisory unless explicitly configured otherwise.
- Advisory reviewer feedback must trigger at least one follow-up implement pass before
  completion commit is allowed for that feature iteration.
- Blocking reviewers must support `max_retries` and `continue_on_exhausted`; default
  exhausted behavior is continue with warning and telemetry.
- Support first-approval semantics per feature (first approval can be reused until
  relevant scoped paths change).
- Reviewer triggers must support phase-based execution (`iteration_end`, `feature_done`)
  and optional `on_change` path selectors.
- README process reviewers must support isolated execution using temp worktree snapshot
  sandbox mode.
- 'Preserve backward compatibility: repositories without `harness/reviewers.yaml`
  must keep current loop behavior unchanged.'
- Preserve current run-loop facade signatures and existing gate semantics unless explicitly
  extended by additive fields only.
implementation_notes: "Introduce a dedicated reviewer contract and runtime path similar\
  \ in structure to gates/fitness but isolated in purpose.\nContract layer:\n- Add\
  \ strict schema/model for `harness/reviewers.yaml` with `profiles`,\n  `reviewers`,\
  \ runner details, trigger phase, optional `on_change`, approval\n  policy, and optional\
  \ sandbox block.\n\n- Lock the v1 contract shape in this feature so implementation\
  \ and docs align:\n\n  - Top-level keys: `contract_version`, `profiles`, `reviewers`.\n\
  \n  - `contract_version`: exact string `1.0`.\n\n  - `profiles`: mapping of profile\
  \ name -> ordered list of reviewer ids.\n\n  - `reviewers`: mapping of reviewer\
  \ id -> reviewer definition.\n\n  - Reviewer definition required fields:\n\n   \
  \ - `prompt_file`: repo-relative path under\n      `harness/reviewers/prompts/`.\n\
  \n    - `trigger.phase`: enum `iteration_end` or `feature_done`.\n\n    - `approval.mode`:\
  \ enum `advisory` or `blocking`; default `advisory`.\n\n  - Reviewer definition\
  \ optional fields:\n\n    - `trigger.on_change`: list of path globs; when absent,\
  \ reviewer is\n      considered for all changes at its phase.\n\n    - `approval.first_feature_approval`:\
  \ bool; default `true`.\n\n    - `approval.max_retries`: integer >= 0; default `2`.\n\
  \n    - `approval.continue_on_exhausted`: bool; default `true`.\n\n    - `sandbox.mode`:\
  \ currently supports `temp_worktree_snapshot`.\n\n- Lock the v1 reviewer decision\
  \ envelope contract:\n\n  - Required JSON fields in reviewer output: `decision`,\
  \ `summary`.\n\n  - `decision` enum: `approve`, `request_changes`, `warning`.\n\n\
  \  - Optional JSON fields: `required_actions` (list of strings),\n    `confidence`\
  \ (0..1), `scope_notes` (string).\n\n  - Non-JSON or malformed output is treated\
  \ as `request_changes` with a\n    deterministic parser-failure reason.\n\n- Validate\
  \ reviewer contract from both `engineeringagent validate` and runtime\n  loading\
  \ path with deterministic issue formatting.\n\nRuntime layer:\n- Add reviewer planning\
  \ that evaluates trigger phase + changed paths +\n  prior-approval cache before\
  \ execution.\n\n- Add reviewer execution that runs OpenCode with shared agent and\
  \ renders\n  prompt from `harness/reviewers/prompts/<id>.md` plus deterministic\
  \ context\n  envelope (feature id/path, changed files, prior feedback).\n\n- Parse\
  \ a strict JSON decision envelope from reviewer output (for example\n  approve/request_changes/warning\
  \ with reason) and treat parse failures as\n  deterministic request_changes outcomes.\n\
  \n- Add an advisory follow-up latch so advisory `warning` or\n  `request_changes`\
  \ outcomes require at least one subsequent implement pass\n  before completion commit\
  \ can proceed.\n\n- Lock behavioral semantics for policy modes:\n\n  - `advisory`:\
  \ never hard-blocks completion forever, but any advisory advice\n    (`warning`\
  \ or `request_changes`) forces one implement follow-up pass before\n    completion\
  \ commit is eligible.\n\n  - `blocking`: `request_changes` causes retry flow until\
  \ approval or retry\n    exhaustion.\n\n  - blocking exhaustion + `continue_on_exhausted=true`:\
  \ continue with warning,\n    record non-approval in telemetry and reviewer state.\n\
  \n  - blocking exhaustion + `continue_on_exhausted=false`: fail iteration.\n\n \
  \ - `first_feature_approval=true`: reuse first approval while scoped files are\n\
  \    unchanged; invalidate cached approval when relevant `on_change` paths\n   \
  \ change.\n\n- Persist reviewer state in `progress/reviewers-state.json` to support\n\
  \  first-approval reuse and retry accounting.\n\n- Add reviewer phase to loop iteration\
  \ after deterministic gate pass and\n  before completion commit so blocking reviewers\
  \ can request targeted fixes\n  prior to feature completion commit.\n\nTooling layer:\n\
  - Add reviewer CLI surfaces for discoverability and ease of setup (for\n  example\
  \ `engineeringagent reviewers init|list|plan|run`).\n\n- Extend init scaffold to\
  \ optionally include baseline reviewer contract and\n  example prompt files under\
  \ harness.\n\nDocumentation layer:\n- Add an agent reference doc (for example\n\
  \  `docs/references/reviewer-agents.md`) covering contract, trigger\n  semantics,\
  \ approval policy, sandbox behavior, decision contract, and\n  troubleshooting.\n\
  \n- Include full JSON decision-envelope examples in docs for all v1 decisions\n\
  \  (`approve`, `request_changes`, `warning`) so behavior is unambiguous:\n\n  -\
  \ approve:\n    {\n      \"decision\": \"approve\",\n      \"summary\": \"No blocking\
  \ issues found in scoped changes.\",\n      \"required_actions\": [],\n      \"\
  confidence\": 0.94,\n      \"scope_notes\": \"Reviewed src and tests changes only.\"\
  \n    }\n\n  - request_changes:\n    {\n      \"decision\": \"request_changes\"\
  ,\n      \"summary\": \"Refactor duplicated parsing helper before completion.\"\
  ,\n      \"required_actions\": [\n        \"Extract shared parser helper in src/engineeringagent/reviewers.py\"\
  ,\n        \"Add regression test for malformed decision payload\"\n      ],\n  \
  \    \"confidence\": 0.88,\n      \"scope_notes\": \"Focused on reviewer-runtime\
  \ module changes.\"\n    }\n\n  - warning:\n    {\n      \"decision\": \"warning\"\
  ,\n      \"summary\": \"Readability can improve, but no hard blocker.\",\n     \
  \ \"required_actions\": [\n        \"Consider simplifying nested conditional in\
  \ reviewer planner\"\n      ],\n      \"confidence\": 0.73,\n      \"scope_notes\"\
  : \"Advisory readability guidance only.\"\n    }\n\n- Include a full copy-pastable\
  \ `harness/reviewers.yaml` example aligned to v1:\n\n  contract_version: \"1.0\"\
  \n  profiles:\n    loop_fast:\n      - code_simplifier\n      - readme_process\n\
  \  reviewers:\n    code_simplifier:\n      prompt_file: \"harness/reviewers/prompts/code_simplifier.md\"\
  \n      trigger:\n        phase: \"iteration_end\"\n        on_change:\n       \
  \   - \"src/**/*.py\"\n          - \"tests/**/*.py\"\n      approval:\n        mode:\
  \ \"advisory\"\n        first_feature_approval: true\n        max_retries: 2\n \
  \       continue_on_exhausted: true\n    readme_process:\n      prompt_file: \"\
  harness/reviewers/prompts/readme_process.md\"\n      trigger:\n        phase: \"\
  feature_done\"\n        on_change: [\"README.md\"]\n      sandbox:\n        mode:\
  \ \"temp_worktree_snapshot\"\n      approval:\n        mode: \"blocking\"\n    \
  \    first_feature_approval: true\n        max_retries: 2\n        continue_on_exhausted:\
  \ true\n\n- Add concise human-facing README section linking to deeper reviewer\n\
  \  reference.\n\n- Update `AGENTS.md` docs map to include new reviewer reference\
  \ path."
acceptance:
- '`harness/reviewers.yaml` contract exists with strict validation for profiles, reviewer
  definitions, trigger phase, optional `on_change`, approval policy, prompt file references,
  and sandbox mode.'
- '`engineeringagent validate` reports deterministic reviewer-config contract issues
  and passes when reviewer contract is valid.'
- Reviewers can be planned deterministically by phase and changed paths, with explicit
  run or skip reasons.
- Reviewer prompts are loaded from `harness/reviewers/prompts/*.md` and executed through
  shared OpenCode runner path without requiring repository `.opencode/agents/*.md`
  definitions.
- Reviewer decision parsing is deterministic and machine-parse-friendly; malformed
  reviewer outputs produce deterministic failure feedback.
- Advisory reviewer advice always causes at least one follow-up implement pass before
  completion commit for the same feature run.
- Advisory reviewers do not block feature completion; blocking reviewers can request
  changes and feed retry feedback back into implement step.
- Blocking reviewer exhaustion respects configured policy, and default exhausted behavior
  continues loop with warning and audit trail.
- First feature approval reuse works and invalidates when relevant scoped files change.
- README-change reviewers can run in `temp_worktree_snapshot` sandbox mode without
  mutating active worktree.
- Loop telemetry and human summary output include reviewer status and decisions in
  a deterministic, parse-friendly format.
- CLI tooling exists to initialize, inspect, and dry-plan reviewer execution for easier
  custom reviewer setup under harness.
- README and agent-facing docs include a clear reviewer section and reference links
  while preserving audience split.
- Reviewer docs describe policy in plain English, including exactly how advisory,
  blocking, retries, exhausted behavior, and first-approval reuse work, with at least
  one concrete end-to-end example per mode.
- Reviewer docs include complete copy-pastable JSON examples for `approve`, `request_changes`,
  and `warning` decision envelopes.
- Reviewer docs include a complete copy-pastable `harness/reviewers.yaml` example
  with both advisory and blocking reviewers.
