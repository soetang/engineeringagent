id: FEAT-138
title: Remove analysis-identified dead symbols while preserving CLI checks and spec
  contracts
type: spec
expected_commit_subject: 'spec: add FEAT-138 dead-code cleanup with contract preservation'
planning_tier: planned
status: done
priority: high
objective: Remove only the specific confirmed/likely-dead symbols identified in the
  FEAT-138 dead-code analysis, without changing behavior for users of the CLI, checks/spec-definition
  contracts, or harness workflow, and keep regression evidence strong with full validation
  and test execution.
context: 'Dead-code analysis found a specific set of definition-only helpers/constants
  and test artifacts that appear unused in this repository. The cleanup should reduce
  maintenance overhead, but the repo must keep the same observable behavior for CLI
  users, checks execution, spec validation, and harness fitness orchestration.

  This feature is not a generic repo-wide dead-code sweep. It is limited to the exact
  symbols listed in subtasks ST-001 through ST-003, plus behavior-regression verification
  in ST-004 and ST-005.

  The cleanup includes removing tests that exist only to cover symbols being deleted,
  while preserving or strengthening tests that verify user-facing/runtime behavior.'
constraints:
- Preserve user-facing CLI behavior and output semantics for existing commands.
- Preserve checks runtime behavior and the stable checks import surface.
- Preserve spec-definition and validation behavior, including existing schema/contract
  expectations.
- Preserve harness fitness workflow behavior and rule execution semantics.
- Remove only symbols verified as dead/likely-dead with no effect on CLI/checks/spec/harness
  behavior.
- Remove tests that only cover deleted dead symbols; keep and update behavior-oriented
  tests.
- Allow per-symbol rollback during implementation when newly discovered runtime/test
  usage appears.
- Do not introduce compatibility shims for removed dead code unless needed to keep
  user-facing behavior unchanged.
- Keep changes narrowly scoped to dead-code removal and related test cleanup.
- 'Out of scope: additional dead-code hunting beyond the explicit FEAT-138 symbol
  list.'
implementation_notes: 'Contract change declaration


  Surface:

  - Internal helper/constants and test-only dead artifacts in checks/validator/specs/facade-signatures
  and selected tests.

  - No intended changes to user-facing CLI contracts, checks public behavior, or spec-definition
  workflows.


  Old behavior:

  - Repo contains dead/likely-dead internal symbols and a few dead test artifacts.

  - Runtime behavior for CLI/checks/spec/harness is stable and covered by tests.


  New behavior:

  - Dead/likely-dead internal symbols are removed.

  - Tests that only covered removed dead symbols are removed or rewritten to assert
  live behavior.

  - Observable behavior for CLI/checks/spec/harness remains unchanged.


  Compatibility policy:

  - Preserve functionality for in-repo user-facing surfaces (CLI/checks/spec-definition/harness).

  - External import compatibility for unused internal symbols is not a requirement
  for this feature.


  Migration plan:

  - Remove confirmed-dead helpers/imports first, then likely-dead constants with behavior
  checks after each step.

  - Run targeted regressions for touched areas, then full validation and full test
  suite.

  - If newly discovered usage appears for a symbol, rollback that symbol removal in
  the same change and defer with explicit follow-up notes.

  - If any user-facing behavior regression appears, revert that symbol removal and
  keep it for follow-up.


  Fitness-function impact assessment:

  - Likely touched rules: `architecture.checks-import-surface`, `architecture.no-facade-varargs-shims`,
  and catalog/spec validation related coverage guards.

  - no fitness-function changes required. The implementation stays within current
  policy and preserves existing behavior contracts.'
acceptance:
- Confirmed-dead symbols are removed from source and dead test artifacts are removed
  from tests.
- Likely-dead facade signature constants are removed only if CLI/checks/spec/harness
  behavior remains unchanged.
- '`engineeringagent checks catalog` behavior and output expectations remain unchanged.'
- Checks API/import-surface expectations remain green under existing fitness rules.
- Spec validation behavior remains unchanged for existing valid/invalid fixture coverage.
- Test cleanup removes only dead-symbol coverage; behavior-oriented tests continue
  to validate user-facing contracts.
- If implementation discovers active usage for any target symbol, that symbol is restored
  and documented as deferred.
- Cleanup scope is limited to the explicit ST-001/ST-002/ST-003 symbol list unless
  the spec is amended.
- '`uv run engineeringagent validate` passes.'
- Full test suite passes with `uv run pytest`.
artifacts:
  plan: plan.md
