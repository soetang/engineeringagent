id: FEAT-175
title: Align checks run CLI policy across check types and phases
type: spec
expected_commit_subject: 'spec: add FEAT-175 checks run CLI policy alignment'
planning_tier: planned
status: done
priority: high
objective: Make explicit `engineeringagent checks run` executions predictable and
  uniform by ignoring `when.on_change`, defaulting to all deterministic non-reviewer
  groups, and adding a CLI option to run all phases in one invocation.
context: 'Today, direct CLI runs can skip checks due to `on_change` matching and manual
  phase handling, which creates confusion (for example manual reviewer checks appear
  selected but do not execute). We want one clear operator model for explicit CLI
  runs: phase-driven execution, deterministic defaults, and no per-type policy differences.'
constraints:
- 'In scope: behavior changes for explicit `engineeringagent checks run` CLI execution.'
- 'In scope: default CLI checks-group selection becomes `validate`, `commands`, `fitness`.'
- 'In scope: explicit CLI runs ignore `when.on_change` for all selected check types.'
- 'In scope: add a CLI phase option to run all phases in one command (`iteration_end`,
  `feature_done`, `manual`).'
- 'In scope: preserve reviewer precondition requiring `--feature-path` when reviewers
  are selected.'
- 'Out of scope: changing loop-triggered checks behavior in `engineeringagent run
  --all`.'
- 'Out of scope: removing or renaming existing phase identifiers.'
implementation_notes: 'Contract change declaration

  Surface: - `engineeringagent checks run` CLI semantics (default groups, phase fan-out
  option, and `on_change` handling). - Checks planning policy application path for
  CLI-triggered runs.

  Old behavior: - Default `checks run` group selection excludes `validate` (defaults
  to command + fitness groups). - `when.on_change` is honored for direct CLI runs,
  so selected checks may skip. - Manual-phase checks can be selected but skipped by
  shared planning policy. - CLI supports only single-phase execution per invocation.

  New behavior: - Default `checks run` executes `validate`, `commands`, and `fitness`
  (reviewers still opt-in only). - For explicit CLI runs, `when.on_change` is ignored
  and phase-matched checks are treated as runnable regardless of changed-path matches.
  - Add CLI support for running all phases in one invocation, executing in deterministic
  phase order: `iteration_end` -> `feature_done` -> `manual`. - Reviewers remain explicit
  and still require `--feature-path`.

  Compatibility policy: - Breaking behavior change for direct `checks run` semantics
  is allowed. - Loop/runtime policy remains unchanged; loop-triggered checks continue
  to own their existing changed-path behavior.

  Migration plan: 1) Add/adjust CLI and checks tests that lock new defaults and `on_change`-ignore
  behavior for CLI runs. 2) Implement CLI-scoped policy signal so shared planning
  engine can differentiate direct CLI execution from loop-triggered execution. 3)
  Add all-phases CLI fan-out behavior with deterministic phase ordering and stable
  failure reporting. 4) Update approach/docs references that describe direct checks
  usage.

  Fitness-function impact assessment: - no fitness-function changes required. - Rationale:
  this feature changes operator-facing CLI policy semantics, not module boundary ownership
  or architectural layering guarded by current rules.'
acceptance:
- '`engineeringagent checks run` without `--checks` executes `validate`, `commands`,
  and `fitness` by default.'
- Direct CLI checks runs ignore `when.on_change` for selected groups and run phase-matched
  checks deterministically.
- Manual-phase checks selected through direct CLI execution can execute (they are
  not forced to skip by planning policy).
- 'CLI supports all-phase execution in one invocation and applies deterministic phase
  order: `iteration_end`, `feature_done`, `manual`.'
- When reviewers are selected, `--feature-path` remains required and missing-path
  errors stay actionable/deterministic.
- '`engineeringagent run --all` behavior remains unchanged for `on_change` handling
  and loop-triggered checks policy.'
- 'Verification command passes: `uv run pytest -q tests/cli/test_cli_checks.py tests/checks/test_run_checks_contract.py`.'
- 'Verification command passes: `uv run pytest -q tests/checks/test_commands_runtime.py
  tests/checks/test_fitness_runtime.py tests/checks/test_checks_reviewers_runtime.py`.'
artifacts:
  plan: plan.md
