id: FEAT-021
title: Enforce per-feature completion commit before loop advances
type: bug
expected_commit_subject: 'fix: add FEAT-021 per-feature completion commit enforcement'
planning_tier: planned
status: done
priority: high
objective: 'Ensure `engineeringagent run` advances to the next feature only when the
  selected feature is completed with a successful completion commit in that same iteration.

  '
context: 'The current loop can treat a selected feature as completed when the active
  feature file disappears and an archived counterpart exists with `status: done`.
  In that path, the loop may proceed without creating a completion commit for the
  selected feature in the current iteration, which violates the expected per-feature
  commit boundary.

  Clarification: the active file and archived file are two locations for the same
  selected feature spec (same feature id and filename), not two distinct feature paths
  to process independently.

  This can produce misleading terminal output about committed completion even when
  archive movement or done-state transitions are still uncommitted in the working
  tree.

  '
constraints:
- Scope is limited to run-loop behavior and loop-focused tests; do not add validator
  or schema changes.
- A selected feature must not be marked completed unless `_commit_feature_completion`
  succeeds in the same iteration.
- Treat `docs/spec/features/<name>.yaml` and `docs/spec/features_done/<name>.yaml`
  as lifecycle locations for the same selected feature path identity.
- 'If selected feature path is missing and only an archived `status: done` spec is
  found without a same-iteration completion commit, fail deterministically with actionable
  guidance.'
- Keep existing successful flow unchanged when archive + completion commit both succeed.
- Preserve existing `--allow-dirty` semantics except it cannot bypass per-feature
  completion commit enforcement.
- Keep run telemetry deterministic (`result`, `failed_gate`, and `next_action` semantics
  remain stable).
implementation_notes: 'Introduce an explicit same-iteration completion signal in loop
  execution and use it as the required condition for `completed=True` and `next_action=select_next_feature`
  transitions. Treat archive-fallback loading as informational unless the completion
  signal was set by a successful completion commit for the selected feature.

  Update failure messaging in this path to direct operators toward corrective action
  (for example, restoring the active feature spec or committing the intended completion
  changes). Ensure loop-level terminal messages do not overstate commit guarantees
  when no completion commit occurred for the latest selected feature.

  '
acceptance:
- Loop iteration for a selected feature cannot complete successfully without a same-iteration
  successful completion commit.
- Archive fallback for `<features>/<name>.yaml` -> `<features_done>/<name>.yaml` is
  interpreted as the same selected feature identity, not an independent second path.
- 'When selected feature path is missing and only archived `status: done` exists before
  completion commit, iteration fails with `failed_gate=feature_missing` and actionable
  detail.'
- In the normal completion path, feature archive + completion commit still succeed
  and transition to `next_action=select_next_feature`.
- Loop terminal messaging does not claim committed completion when the selected feature
  did not produce a completion commit in that run.
- Targeted loop regression tests and schema validation pass.
