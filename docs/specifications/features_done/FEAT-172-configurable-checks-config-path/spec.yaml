id: FEAT-172
title: Make checks config path configurable
type: feature
expected_commit_subject: 'feat: support configurable checks config path'
planning_tier: planned
status: done
priority: high
objective: Allow repositories to configure the checks config file location instead
  of hardcoding `harness/checks.yaml`.
context: 'Checks loading and several loop/CLI flows currently assume checks config
  lives at

  `harness/checks.yaml`.


  This is too rigid for repositories with custom layout preferences. We should support

  a repo-owned path setting in config while keeping the current default behavior.

  '
constraints:
- Add a configurable checks-config path setting via `engineeringagent.toml` with pyproject
  fallback support.
- Keep default behavior unchanged when no setting is provided (`harness/checks.yaml`).
- Use one canonical path resolver shared by checks loader, CLI run-all precondition,
  and loop gate/reviewer phase checks-config presence checks.
- Treat configured paths as repository-local (no parent traversal outside project
  root).
- Error messages should include the resolved checks-config path, not a hardcoded string.
- Do not change checks manifest schema itself in this feature; this is file-location
  resolution only.
implementation_notes: "Contract change declaration\n\nSurface:\n- checks config discovery\
  \ for `checks run`, `run --all`, and loop gate/reviewer flows.\n- config resolution\
  \ from repo-owned TOML settings.\n\nOld behavior:\n- checks config path is always\
  \ `harness/checks.yaml`.\n- missing/invalid errors always reference that fixed path.\n\
  \nNew behavior:\n- checks config path resolves from configuration (for example\n\
  \  `engineeringagent.toml[harness.checks].path`) with existing defaults preserved.\n\
  - all checks-loading and checks-presence flows use the resolved path consistently.\n\
  \nCompatibility policy:\n- additive; repositories without the new setting behave\
  \ exactly as before.\n\nMigration plan:\n- optional opt-in by adding a configured\
  \ checks path in repository config.\n\nVerification evidence:\n- targeted checks\
  \ contract, CLI, and loop phase tests cover default and configured paths.\n\nFitness-function\
  \ impact assessment:\n- no fitness-function changes required.\n- Rationale: this\
  \ is path-resolution/config plumbing and does not change architecture\n  boundaries\
  \ or rule ownership.\n"
acceptance:
- Without configuration, checks still load from `harness/checks.yaml`.
- With configured checks path, `engineeringagent checks run` loads and validates that
  configured file.
- With configured checks path, `engineeringagent run --all` and loop gate/reviewer
  phase preconditions use the configured path (no hardcoded `harness/checks.yaml`).
- Missing/invalid checks config errors reference the resolved configured path.
- Configured path values that escape repository root are rejected with deterministic
  input/config errors.
- '`uv run pytest -q tests/checks/test_run_checks_contract.py tests/cli/test_cli_checks.py
  tests/loop/test_loop_phases_coverage.py` passes.'
artifacts:
  plan: plan.md
