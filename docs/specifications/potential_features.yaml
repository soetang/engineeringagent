version: 1
description: >
  Parking lot for future ideas that are intentionally not part of active loop specs.
  Items here do not get picked by the loop runner.
potential_features:
  - id: POT-008
    title: Add run telemetry reporting command with invariants checks
    status: idea
    context: >
      Build a CLI view over progress/runs.jsonl to summarize failure patterns, retry
      streaks, and telemetry anomalies (for example inconsistent result/next_action).
    value:
      - "Speeds up triage and prioritization"
      - "Makes reliability trends visible over time"
      - "Detects data-quality issues in loop telemetry"
    acceptance_hint:
      - "A CLI command summarizes runs by feature and failed_gate"
      - "Command flags suspicious telemetry invariants"
      - "Output is concise for humans and parse-friendly for automation"
  - id: POT-009
    title: Emit structured per-feature run logs alongside human-readable output
    status: idea
    context: >
      Current per-feature logs mix verbose terminal output and control characters.
      Add ANSI-safe logging and structured sidecar output for reliable downstream parsing.
    value:
      - "Improves machine triage and post-run analytics"
      - "Retains concise human debugging context"
      - "Enables better tooling around retries and failure diagnosis"
    acceptance_hint:
      - "Feature logs are emitted without ANSI control artifacts"
      - "Structured sidecar format is documented and stable"
      - "Loop references both human and structured log paths consistently"
  - id: POT-012
    title: Automate per-run branch creation and GitHub pull request workflow
    status: idea
    context: >
      For each non-dry loop run, create a new git branch first, run the loop on that
      branch, then create a GitHub pull request with all resulting changes using gh.
      This keeps loop output isolated from the base branch and makes review handoff
      automatic.
    value:
      - "Reduces risk of accidental direct commits to long-lived branches"
      - "Creates a consistent review handoff artifact for every completed loop"
      - "Improves auditability by tying each run to a branch and PR"
    acceptance_hint:
      - "Each non-dry run creates and switches to a fresh branch before iteration work"
      - "When loop work produces commits, branch is pushed and PR is created via gh"
      - "No-change runs skip PR creation with a clear terminal reason"
      - "Missing remote or gh auth failures are surfaced with actionable remediation"

  - id: POT-013
    title: Replace OpenCode runtime with local Pydantic-agent loop runner
    status: idea
    context: >
      Switch implementation loops from the OpenCode runtime to a locally-run agent stack
      (for example Pydantic-based agents) to avoid subscription requirements. This
      requires re-implementing the OpenCode-built-in tool surface (file ops, search,
      shell, git/GitHub helpers) plus the safety controls we currently rely on
      (tool allowlists, non-interactive execution constraints, secret redaction, and
      auditable logs).
    value:
      - "Removes dependency on OpenCode subscriptions/availability"
      - "Enables running loops fully offline/on-prem with controlled tool access"
      - "Makes safety and tool contracts explicit and testable in-repo"
      - "Makes structured, typed output (events/tool calls/results) cheap to enforce"
    acceptance_hint:
      - "A new agent runner backend can execute an end-to-end loop without OpenCode"
      - "Tooling parity exists for read/write/patch/search/shell with equivalent safety"
      - "All tool calls are logged with stable, parseable audit records"
      - "Run output is emitted as versioned JSONL with records validated against typed schemas"
      - "Behavioral regression coverage ensures loop outputs match baseline"

  - id: POT-014
    title: Reintroduce reviewer retry budget (max_retries) as an explicit policy knob
    status: idea
    context: >
      The reviewer contract and runtime were simplified to remove blocking-mode retries
      (`approval` config `max_retries` and `continue_on_` `exhausted`). Consider reintroducing
      a bounded retry budget later so reviewer-requested changes do not cause unbounded
      loop churn. This could be modeled as a per-reviewer cap (similar to prior behavior)
      or as a loop-level cap that limits total retry iterations per feature.
    value:
      - "Prevents pathological retry loops on persistent reviewer feedback"
      - "Makes retry policy explicit, configurable, and testable"
      - "Improves operator control over time/cost of runs"
    acceptance_hint:
      - "A documented, versioned config knob controls retry budgets"
      - "Telemetry captures when retry budgets are hit and how the run proceeds"
      - "Regression tests cover budget enforcement and compatibility migration"

  - id: POT-015
    title: Revisit ignore-pattern matching and TOML parsing dependencies
    status: idea
    context: >
      We currently depend on pathspec for gitignore-style matching and tomli for TOML
      parsing (as a fallback to stdlib tomllib on Python < 3.11). Explore whether we
      should replace pathspec (license/supply-chain surface, feature scope vs our needs)
      and whether our TOML strategy should change (conditional dependency, version pin,
      or raising requires-python to drop the fallback).
    value:
      - "Reduce dependency/license risk for gitignore-style matching"
      - "Make TOML parsing strategy explicit and aligned with supported Python versions"
      - "Avoid unnecessary version caps that complicate downstream resolution"
    acceptance_hint:
      - "Decision record compares pathspec vs alternatives (gitmatch/gitignorant/etc) vs in-house matcher"
      - "If replacing pathspec, behavior remains equivalent for our supported pattern set"
      - "tomli is only installed when needed (python_version < 3.11) or requires-python is raised to >=3.11"
      - "Dependency constraints are updated with a clear rationale (remove/adjust tomli <2.1.0 cap)"
      - "Targeted tests cover ignore matching and TOML parsing across supported Python versions"

  - id: POT-016
    title: Move reviewer changed-path snapshot ownership into checks runtime
    status: idea
    context: >
      Reviewer checks currently receive changed-path discovery via loop-injected
      `collect_changed_paths` callables so one iteration can reuse a memoized
      snapshot across phases. Explore moving that ownership into checks contracts
      by passing a resolved snapshot object (or explicit change context) instead
      of a loop-owned collector function.
    value:
      - "Clarifies loop vs checks ownership boundaries"
      - "Reduces callable injection seams in reviewer orchestration"
      - "Makes same-iteration determinism explicit in checks contracts"
    acceptance_hint:
      - "Reviewer checks consume explicit change-context data instead of a collector callable"
      - "Same-iteration gate/reviewer changed-path consistency remains deterministic"
      - "Loop runtime no longer injects collect_changed_paths into reviewer checks wiring"

  - id: POT-017
    title: Introduce explicit reviewer runner port to simplify agent boundary
    status: idea
    context: >
      Reviewer execution currently injects `run_agent_fn` into checks at runtime.
      Explore introducing a dedicated reviewer-runner port/adapter contract so
      checks depend on a typed reviewer execution interface rather than generic
      callable injection. This can reduce cross-module coupling and make backend
      swaps easier to reason about.
    value:
      - "Makes reviewer execution dependency explicit and typed"
      - "Reduces hidden coupling between loop runtime and reviewer internals"
      - "Improves testability by standardizing reviewer runner behavior"
    acceptance_hint:
      - "Checks reviewers depend on a typed reviewer runner interface"
      - "Loop wiring uses adapter construction instead of raw run_agent_fn injection"
      - "Structured reviewer decision handling remains behaviorally equivalent"
