id: FEAT-041
title: Tighten Ruff complexity threshold and block non-ignorable suppressions
type: feature
expected_commit_subject: 'spec: add FEAT-041 ruff threshold and suppression guardrails'
status: backlog
priority: high
objective: 'Align Ruff complexity policy with upstream defaults and prevent agents from bypassing high-value lint rules through inline/file ignore comments, while providing clear remediation guidance for maintainable refactors.

  '
context: 'Current Ruff policy sets `lint.mccabe.max-complexity = 30`, which is much higher than Ruff''s default value (`10`) when `C901` is enabled. The repository also currently contains inline `# noqa: PLR0913` suppressions, and user feedback indicates agents are increasingly using suppressions rather than refactoring.

  Official Ruff docs confirm: `PLR0913` default argument budget is `5` (`lint.pylint.max-args`), and recommended remediations include grouping related arguments into objects (for example, `NamedTuple`). For this repository, user-confirmed scope is to fail immediately on existing `PLR0913` suppressions, enforce no-ignore policy across `src/`, `tests/`, and `harness/`, and seed an initial non-ignorable set containing `D103` and `PLR0913`.

  '
constraints:
- Set `tool.ruff.lint.mccabe.max-complexity` to `10`.
- 'Do not grandfather existing `# noqa: PLR0913` occurrences; enforcement must fail immediately until code is refactored.'
- Add a fitness function rule that detects suppression directives for configured non-ignorable Ruff rules across `src/`, `tests/`, and `harness/`.
- Initial non-ignorable rule IDs must include `D103` and `PLR0913` and be configurable from harness-managed configuration (not hardcoded-only behavior).
- 'Detection must cover common suppression forms, including inline `# noqa: CODE`, multi-code `# noqa: X,Y`, and file-level Ruff suppression directives.'
- Fitness rule output must include actionable remediation feedback, including alternatives such as passing a structured object (`NamedTuple` or `pydantic` model) instead of many scalar arguments.
- 'Keep fitness result envelope contract at `contract_version: "1.0"` and deterministic output ordering.'
- Preserve side-effect-free execution and compatibility with existing fitness runner/gate integration.
implementation_notes: 'Implement a new command-adapter fitness check script under `harness/fitness-functions/` that scans Python files in `src/`, `tests/`, and `harness/` via AST/token-safe parsing and reports deterministic path:line diagnostics when configured non-ignorable suppressions are found.

  Prefer a configuration pattern that remains declaration-driven from harness state without expanding the fitness manifest schema: e.g., pass non-ignorable rule IDs through manifest command arguments (or an adjacent harness config file referenced by command args) so adding future blocked rules does not require code edits.

  Register the new fitness rule in `harness/fitness-functions/rules.yaml` with `severity: error` and command execution through `uv run python ...`.

  Remove existing `PLR0913` suppression comments from `src/engineeringagent/loop.py` by refactoring signatures and/or parameter grouping so Ruff passes without suppression. Preferred techniques: extract cohesive input models (e.g., pydantic or named tuple-like structures), split orchestration phases, and keep control-flow readability.

  Update agent-facing Ruff guidance docs to reflect tightened `C901` threshold and explicit non-ignorable suppression policy for `D103` and `PLR0913`.

  '
acceptance:
- '`pyproject.toml` sets `tool.ruff.lint.mccabe.max-complexity = 10`.'
- No `PLR0913` suppressions remain in `src/engineeringagent/loop.py`; repository passes `uv run ruff check src/engineeringagent --select PLR0913` without suppression comments.
- A fitness rule exists and fails when non-ignorable suppression directives target configured IDs (`D103`, `PLR0913`) anywhere under `src/`, `tests/`, or `harness/`.
- The non-ignorable Ruff ID list is configurable from harness-managed configuration and is seeded with `D103` and `PLR0913`.
- Fitness failure output includes remediation guidance that recommends refactoring options (including grouping parameters into `NamedTuple`/`pydantic` objects).
- '`engineeringagent fitness list`, `engineeringagent fitness run`, and `gates run --profile loop_fast` include and enforce the new rule deterministically.'
- Targeted tests cover detection of inline and file-level suppression forms, configuration loading, and deterministic violation reporting.
- '`uvx --from . engineeringagent gates run --profile precommit` passes after refactors.'
