id: FEAT-019
title: Default concise run output with detailed per-feature progress logs
type: feature
expected_commit_subject: 'feat: add FEAT-019 concise run output and detailed logs'
status: backlog
priority: high
objective: >
  Make `engineeringagent run` output short and easy to follow by default, while
  preserving full implement and gate execution detail in per-feature progress
  log files.
context: >
  Current run-loop terminal output includes long implement transcripts and gate
  command output, which makes it hard to follow control flow during normal
  operation. Operators want concise status lines in the terminal, with detailed
  debugging evidence persisted to files under `progress/`.

  Scope confirmed with the user: suppress both implement and gate raw output in
  default run mode, add an explicit `--verbose-output` opt-in to stream full
  output in terminal, append detailed output to
  `progress/run-feature-<FEATURE_ID>.txt`, include a `log_path` reference in
  `progress/runs.jsonl`, and keep direct `engineeringagent gates run` behavior
  unchanged.
constraints:
  - Default `engineeringagent run` terminal output is concise and does not stream raw implement/gate stdout or stderr.
  - Add `--verbose-output` on `engineeringagent run` to stream raw implement and gate output to terminal.
  - Detailed output is appended to `progress/run-feature-<FEATURE_ID>.txt` for each non-dry iteration.
  - Each runs telemetry record includes `log_path` for the corresponding iteration output.
  - Failure and stop conditions print short actionable messages and include the detailed log file path.
  - Apply output-concise behavior only to `engineeringagent run`; do not change direct `engineeringagent gates run` output semantics.
  - Ignore new `progress/run-feature-*.txt` artifacts in git status/commit flows.
  - Preserve existing permission-rejection detection and failed-gate semantics.
implementation_notes: >
  Add loop-level output mode plumbing from CLI (`--verbose-output`) to
  implement and gate execution paths. Introduce a per-feature log writer in
  loop runtime that appends sectioned output for each attempt (implement,
  gates, summary, failure detail).

  Refactor gate execution to support optional captured output for loop mode
  while preserving inherited-stdio behavior for direct `gates run`. Keep
  concise terminal output as short lifecycle lines (selection, implement
  status, gate status, summary, and log pointer on failure).

  Extend run telemetry payload in `progress/runs.jsonl` with `log_path`, update
  docs for the new default behavior and verbose override, and add focused tests
  for both concise and verbose paths.
acceptance:
  - Running `engineeringagent run ...` prints concise lifecycle messages and does not emit raw implement/gate output by default.
  - Running `engineeringagent run ... --verbose-output` emits raw implement and gate output in terminal.
  - For each non-dry iteration, detailed output is appended to `progress/run-feature-<FEATURE_ID>.txt`.
  - "`progress/runs.jsonl` includes a `log_path` field that points to the per-feature detailed log file."
  - On loop failures, terminal output includes a concise failure reason and an explicit detailed-log pointer.
  - "`engineeringagent gates run --profile ...` keeps current output behavior."
  - New progress log files do not pollute completion commits by default because they are gitignored.
subtasks:
  - id: ST-001
    title: Add run CLI flag and loop plumbing for output verbosity
    status: backlog
    order: 1
    context: >
      Add `--verbose-output` to `engineeringagent run` and thread the setting
      into loop iteration execution.
    verification:
      - uvx --from . engineeringagent run --help
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_cli_run_help_includes_verbose_output_flag
  - id: ST-002
    title: Add per-feature detailed progress log writer and ignore rule
    status: backlog
    order: 2
    context: >
      Add deterministic log-path resolution for
      `progress/run-feature-<FEATURE_ID>.txt`, append per-attempt details, and
      update ignore rules so logs do not appear in commit status.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_writes_per_feature_progress_log
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_progress_logs_are_gitignored
  - id: ST-003
    title: Capture implement and gate output in concise mode with verbose override
    status: backlog
    order: 3
    context: >
      In default mode, suppress raw implement/gate output from terminal and
      write it to detailed logs. In verbose mode, preserve terminal streaming.
      Keep gate command behavior unchanged for direct `gates run`.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_concise_mode_hides_raw_implement_and_gate_output
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_verbose_output_streams_raw_implement_and_gate_output
      - uv run pytest -q tests/test_gates.py::test_cmd_gates_run_output_unchanged_when_loop_concise_mode_exists
  - id: ST-004
    title: Include log path in telemetry and failure messaging
    status: backlog
    order: 4
    context: >
      Add `log_path` to each runs telemetry record and ensure concise failure
      output points operators to the detailed file.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_telemetry_includes_log_path
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_failure_prints_detailed_log_pointer
  - id: ST-005
    title: Document concise default and verbose-output usage
    status: backlog
    order: 5
    context: >
      Update README loop behavior and CLI details to describe concise terminal
      output, detailed per-feature logs, and `--verbose-output` behavior.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8').lower(); assert 'verbose-output' in t and 'progress/run-feature-' in t and 'concise' in t; print('ok')\""
  - id: ST-006
    title: Run focused regression and schema checks
    status: backlog
    order: 6
    context: >
      Validate loop output behavior, telemetry changes, and spec schema
      compatibility after implementing concise output and detailed logs.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py
      - uv run pytest -q tests/test_gates.py
      - uvx --from . engineeringagent validate --schema-only
