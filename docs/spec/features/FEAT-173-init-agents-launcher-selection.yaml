id: FEAT-173
title: Add init launcher selection for scaffolded AGENTS
type: feature
expected_commit_subject: 'feat: let init choose AGENTS launcher wording'
status: backlog
priority: high
objective: Let users choose launcher wording for scaffolded `AGENTS.md` during init
  instead of forcing a single launcher phrase.
context: |
  Init currently scaffolds `AGENTS.md` from a fixed template line that names one
  launcher style. Combined with prior validation behavior, this made launcher wording
  effectively mandatory.

  Product intent is launcher flexibility: repositories may prefer `uvx`, `uv run`,
  or launcher-neutral `engineeringagent` command examples. Init should ask users what
  wording they want when writing AGENTS guidance.
constraints:
- This feature only affects generated AGENTS scaffold wording.
- Do not reintroduce AGENTS validation coupling in validate/checks.
- When init will write AGENTS content (missing file or overwrite mode), interactive
  mode should prompt for launcher preference.
- Provide a non-interactive explicit option for launcher preference so automation is
  deterministic.
- Preserve current preserve/abort semantics for existing user-authored AGENTS.md.
- Keep `engineeringagent approach` bootstrap guidance lines intact; only launcher
  wording in command examples should vary by selected option.
implementation_notes: |
  Contract change declaration

  Surface:
  - `engineeringagent init` AGENTS scaffold generation and interactive UX.

  Old behavior:
  - AGENTS scaffold text uses one fixed launcher phrase from static template.

  New behavior:
  - Init supports launcher selection for AGENTS scaffold text (for example `uvx`,
    `uv run`, or `engineeringagent`).
  - Interactive init prompts when AGENTS content will be written.
  - Non-interactive/init automation can set launcher choice explicitly.

  Compatibility policy:
  - additive; existing init flows continue to work with a deterministic default.

  Migration plan:
  - no forced migration; repositories can re-run init overwrite mode to refresh AGENTS
    with selected launcher wording.

  Verification evidence:
  - init command and scaffold tests cover prompt path, explicit option path,
    and preserve-mode behavior.

  Fitness-function impact assessment:
  - no fitness-function changes required.
  - Rationale: this is init UX/template parameterization and does not alter active
    architecture policy boundaries.
acceptance:
- Interactive init prompts for launcher preference when AGENTS.md will be written.
- Non-interactive init supports an explicit launcher-selection option and writes
  matching AGENTS launcher wording deterministically.
- Preserve mode keeps user-authored AGENTS content unchanged and does not force
  launcher prompt decisions when AGENTS is not rewritten.
- Overwrite mode writes scaffold AGENTS content with the selected launcher wording.
- '`uv run pytest -q tests/cli/test_init_command.py tests/cli/test_init_scaffold.py
  tests/cli/test_cli_typer_parity_helpers.py` passes.'
subtasks:
