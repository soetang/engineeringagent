id: FEAT-085
title: Delete committed opencode.json from repo root
type: chore
expected_commit_subject: "chore: remove repo-root opencode.json"
status: backlog
priority: medium
objective: |
  Remove the committed `opencode.json` from this repository so that the
  OpenCode agent policy source-of-truth is `.opencode/agents/engineeringagent.md`.

  The `engineeringagent` loop must continue to work because it shells out with an
  explicit `opencode run --agent engineeringagent` invocation.
context: |
  The repository currently contains both:
  - `opencode.json` (repo root)
  - `.opencode/agents/engineeringagent.md`

  Both files define overlapping agent configuration (model/variant/permissions).
  This duplication can drift, and `opencode.json` is not required for the
  `engineeringagent` automation path because the agent name is always passed
  explicitly.
constraints:
  - "Delete the repo-root `opencode.json` file; do not replace it with another repo-root OpenCode config file."
  - "Do not change the required OpenCode invocation contract: `engineeringagent` continues to use `opencode run --agent engineeringagent`."
  - "Do not add new runtime dependencies on `opencode.json` anywhere in `src/engineeringagent`."
  - "Do not edit archived specs under `docs/spec/features_done/`; historical references may remain there."
  - "Docs must not claim `opencode.json` is required for `engineeringagent` to run; documentation should emphasize shipping only the files users need (notably `.opencode/agents/engineeringagent.md`)."
implementation_notes: |
  Contract/API delta (explicit):

  - Surface: repository-distributed configuration artifacts.
    - Old behavior: the repository ships a committed `opencode.json` at the repo root.
    - New behavior: the repository no longer ships `opencode.json`; agent policy is
      shipped via `.opencode/agents/engineeringagent.md`.

  Compatibility policy:
  - Breaking change for contributors who relied on `opencode.json` being present
    when running OpenCode manually without passing `--agent`.
  - Non-breaking for `engineeringagent` automation because it specifies
    `--agent engineeringagent`.

  Fitness-function impact assessment:
  - no fitness-function changes required; this is a repository artifact cleanup
    and should not change loop behavior or gate execution.
acceptance:
  - "`opencode.json` is removed from the repository root."
  - "Repository docs do not instruct users to create, commit, or rely on `opencode.json` for `engineeringagent` to function."
  - "`engineeringagent` continues to call OpenCode with `opencode run --agent engineeringagent` (no reliance on OpenCode default-agent selection)."
  - "Test suite and spec validation continue to pass after the deletion."
  - "Repository search for `opencode.json` returns matches only in tests that intentionally generate temporary configs and in archived specs under `docs/spec/features_done/`."
subtasks:
  - id: ST-001
    title: Remove repo-root opencode.json and confirm no runtime dependency
    status: backlog
    context: |
      Delete `opencode.json` from the repository root and confirm nothing in
      `src/engineeringagent/` requires it.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q
  - id: ST-002
    title: Update docs to avoid requiring opencode.json
    status: backlog
    context: |
      Ensure active docs (README and docs/references) emphasize the shipped policy
      file `.opencode/agents/engineeringagent.md` and do not imply `opencode.json`
      is required.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q tests/reviewers/test_repo_reviewers_config.py
  - id: ST-003
    title: Lock in invariants with lightweight search assertions
    status: backlog
    context: |
      Add or update tests/validation checks to ensure we do not regress and
      accidentally re-introduce a dependency on repo-root `opencode.json`.
    verification:
      - uv run pytest -q
      - uv run python -c "from pathlib import Path; roots=[Path('src'),Path('docs'),Path('README.md')]; hits=[]\nfor root in roots:\n    paths=[root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]\n    for p in paths:\n        if 'features_done' in str(p):\n            continue\n        text=p.read_text(encoding='utf-8', errors='ignore')\n        if 'opencode.json' in text:\n            hits.append(str(p))\nprint('\\n'.join(hits)); raise SystemExit(1 if hits else 0)"
  - id: ST-004
    title: Run regression gates
    status: backlog
    context: |
      Run the standard validation and gate profile used for loop iterations.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run python -m engineeringagent.cli gates run --profile loop_fast
      - uv run pytest -q
updated_at: "2026-02-16T00:00:00Z"
