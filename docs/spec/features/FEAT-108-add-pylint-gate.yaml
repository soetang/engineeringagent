id: FEAT-108
title: Add pylint as an iteration_end gate (disable module docstring + line length)
type: chore
expected_commit_subject: "chore: add pylint gate to iteration_end checks"
status: backlog
priority: medium
objective: >
  Add pylint as a first-class repo gate by wiring it into `harness/checks.yaml`
  (iteration_end). Configure pylint via `pyproject.toml` while explicitly not
  enforcing module docstrings or line length.

context: >
  This repo currently enforces lint/type/test via `ruff`, `pyright`, and `pytest`
  checks declared in `harness/checks.yaml`, executed in CI and pre-commit through
  `engineeringagent checks run --phase iteration_end`.

  We want to add pylint as an additional deterministic gate, but avoid double-
  enforcing two policies:
  - module docstrings (do not require them)
  - line length (already enforced elsewhere; pylint should not own it)

constraints:
  - 'Add pylint as a `type: command` check in `harness/checks.yaml` for `phase: iteration_end`.'
  - 'Pylint must run on `src/engineeringagent`, `tests`, and `harness`.'
  - 'Pylint configuration must live in `pyproject.toml` (no `.pylintrc` added).'
  - 'Disable only these pylint messages: `missing-module-docstring` (C0114) and `line-too-long` (C0301).'
  - 'Do not disable any other pylint messages as part of this feature.'
  - 'Prefer fixing violations over adding inline suppressions (`# pylint: disable=...`). Inline suppressions must be narrowly scoped and justified if used.'
  - 'Keep execution uv-native (`uv run ...`) and deterministic.'
  - '"no fitness-function changes required" (command check only; configured in `harness/checks.yaml`).'

implementation_notes: |
  Contract delta (explicit)

  Surface: repo verification checks in `harness/checks.yaml` (iteration_end).
  - Old behavior: iteration_end runs ruff/pyright/pytest (plus fitness).
  - New behavior: iteration_end also runs pylint.

  Add pylint dependency

  Add `pylint` to `[dependency-groups].dev` in `pyproject.toml`.

  Pylint config in pyproject.toml (normative)

  Add these sections to `pyproject.toml`:

  ```toml
  [tool.pylint]
  # Presence of this table signals pylint to read pyproject.toml.

  [tool.pylint."MESSAGES CONTROL"]
  disable = [
    "missing-module-docstring", # C0114
    "line-too-long",            # C0301
  ]
  ```

  Notes:
  - Keep this config minimal: only disable the two messages above.
  - Pylint must pick up this config when run from the repository root without needing
    `--rcfile`.

  Wire pylint into harness/checks.yaml (normative)

  Add a new check entry to `harness/checks.yaml` (ids can differ, but behavior should match):

  ```yaml
  pylint_validate:
    type: command
    command: "uv run pylint --score=n --reports=n src/engineeringagent tests harness"
    when:
      phase: iteration_end
      on_change: ["src/**/*.py", "tests/**/*.py", "harness/**/*.py"]
  ```

  Rationale for flags:
  - `--score=n` / `--reports=n` reduces noisy output and avoids score-based behavior.
  - The gate is still enforced by pylint's exit code (any remaining messages fail).

acceptance:
  - "`uv run pylint --score=n --reports=n src/engineeringagent tests harness` runs from repo root and does not report C0114 or C0301."
  - "`harness/checks.yaml` includes a pylint command check that runs at `iteration_end` and is selected by `when.on_change` for Python changes."
  - "Pylint configuration is read from `pyproject.toml` (no `.pylintrc` in repo and no `--rcfile` required in the gate command)."
  - "After remediation, pylint passes with no additional global disables beyond C0114/C0301."
  - "`uv run engineeringagent checks run --phase iteration_end` passes locally after changes."
  - "Contributor docs mention how to run pylint directly and via `engineeringagent checks run`."
  - "`uv run pytest -q` passes."

subtasks:
  - id: ST-001
    title: Add pylint to dev dependencies
    status: backlog
    verification:
      - uv sync
      - uv run pylint --version

  - id: ST-002
    title: Add minimal pylint config in pyproject.toml (disable C0114 + C0301 only)
    status: backlog
    verification:
      - uv run pylint --score=n --reports=n src/engineeringagent tests harness

  - id: ST-003
    title: Wire pylint into harness/checks.yaml as iteration_end command check
    status: backlog
    verification:
      - uv run engineeringagent checks run --phase iteration_end

  - id: ST-004
    title: Resolve initial pylint findings until gate is green
    status: backlog
    context: >
      Expect a large initial set of pylint findings on first enablement. Fix violations
      in code (preferred) rather than disabling additional messages.

      Keep changes incremental and verification-driven: run pylint, fix a coherent
      slice, re-run pylint + pytest, repeat.

      Do not expand the global disabled message list beyond C0114/C0301 as part of
      this feature.
    verification:
      - uv run pylint --score=n --reports=n src/engineeringagent tests harness
      - uv run pytest -q

  - id: ST-005
    title: Update docs with pylint gate usage
    status: backlog
    verification:
      - uv run engineeringagent checks run --phase iteration_end

