id: FEAT-119
title: Finish agents backend decoupling cleanup (backend resolution stays inside agents)
type: chore
expected_commit_subject: 'chore: finish agents backend decoupling cleanup'
status: backlog
priority: high
objective: |
  Complete the agent-backend decoupling so production callsites cannot select or
  construct agent backends.

  After this change:
  - Backend resolution happens only inside `engineeringagent.agents`.
  - `run_agent` no longer accepts a backend override.
  - The remaining backend-coupling budget is tightened to zero.
  - Backend-owned scaffold assets can be honest Markdown again (no extension hacks),
    while still satisfying repository markdown locality policies.
context: |
  Recent features moved OpenCode under `src/engineeringagent/agents/backends/**` and
  introduced a backend registry + config selection.

  Remaining coupling indicates we partially "hid" backend details rather than fully
  removing them:
  - `engineeringagent.agents.run_agent` still accepts a `backend` input.
  - Reviewers can pass a backend object into `run_agent`.
  - `src/engineeringagent/agents_defaults.py` still exists and trips the backend
    literal-locality budget.
  - The OpenCode agent-policy scaffold template was renamed to a non-markdown file
    extension to satisfy markdown-locality constraints.
constraints:
  - 'Precondition: FEAT-115 is done (core loop is backend-agnostic).'
  - Remove the `backend` parameter from `engineeringagent.agents.run_agent` and update
    all production callsites and tests to use backend resolution inside
    `engineeringagent.agents`.
  - Remove the reviewer-level backend override seam by deleting
    `ReviewerRunRequest.agent_backend` and stopping any propagation of backend objects
    from reviewer wiring into `run_agent`.
  - Preserve the ability to run deterministic tests by injecting backends through the
    agents registry + repo config (tests set `[agents] backend = "..."` in a temp
    `engineeringagent.toml` and monkeypatch/register backend factories as needed).
  - Delete `src/engineeringagent/agents_defaults.py` by moving the OpenCode default
    agent id constant under the OpenCode backend package.
  - |-
    Replace the OpenCode agent-policy scaffold asset extension hack:
    - Allow backend-owned scaffold markdown assets under `src/engineeringagent/agents/backends/**/scaffold_templates/**`.
    - Rename `agent.engineeringagent.template` back to a `.md` asset.
    - Adjust markdown locality/reference-coverage fitness rules so backend-owned scaffold templates do not require non-self path references.
  - Tighten `architecture.backend-literal-locality-budget` to a strict zero baseline.
  - 'Update `docs/spec/features/FEAT-117-add-codex-cli-backend.yaml` so the intended contract is explicit: backend selection/resolution is internal to `engineeringagent.agents`, and `run_agent` does not accept a backend override.'
  - 'Fitness-function impact assessment: expected fitness updates are limited to the
    markdown locality/reference coverage fitness rule (and its tests) to accommodate
    backend-owned scaffold markdown assets; no new rules should be added.'
implementation_notes: |
  Contract change declaration (required)

  Surface: `engineeringagent.agents.run_agent` API (internal callsites) and reviewer
  invocation wiring.

  Old behavior:
  - `run_agent(project_root, prompt, *, output_type=..., backend=..., ...)` accepts an
    optional backend object override.
  - Reviewer execution may pass an `agent_backend` object into `run_agent`.
  - Tests commonly inject a fake backend by passing `backend=` directly.

  New behavior:
  - `run_agent(project_root, prompt, *, output_type=..., ...)` does not accept a
    backend object.
  - Backend selection is always resolved inside `engineeringagent.agents` using repo
    configuration + the agents registry.
  - Reviewers do not accept or pass backend objects; they rely on `run_agent`.
  - Tests inject fake backends by setting `[agents] backend` and registering a backend
    id in the agents registry (or monkeypatching the registry mapping).

  Compatibility policy:
  - Immediate internal break (no deprecation period). Update all internal callsites
    and tests in the same change.

  Markdown locality policy update:
  - The markdown-locality/reference-coverage fitness rule should treat backend-owned
    scaffold template directories as approved markdown locality roots.
  - Backend-owned scaffold templates should be exempt from the non-doc markdown
    reference-coverage requirement because they are referenced via
    `importlib.resources`, not literal path strings.
acceptance:
  - '`engineeringagent.agents.run_agent` has no `backend` parameter and all production callsites compile and pass tests without backend overrides.'
  - Reviewer execution no longer accepts/passes backend objects, and reviewers still
    return deterministic parser-failure envelopes when agent execution fails.
  - '`src/engineeringagent/agents_defaults.py` is removed and no longer appears in the backend literal-locality scan.'
  - The OpenCode agent-policy scaffold asset is a `.md` file under
    `src/engineeringagent/agents/backends/opencode/scaffold_templates/`.
  - Markdown locality/reference-coverage fitness passes without relying on non-markdown
    extension workarounds for backend-owned scaffold templates.
  - '`architecture.backend-literal-locality-budget` passes with baseline set to 0.'
  - FEAT-117 spec text reflects the new `run_agent` contract (no backend parameter).
  - '`uv run pytest -q` passes.'
  - '`uv run engineeringagent validate` passes.'
subtasks:
  - id: ST-001
    title: Remove backend override from run_agent public contract
    status: backlog
    context: |
      Update `engineeringagent.agents.run_agent` to remove the `backend` parameter and
      rely exclusively on internal backend resolution.
    verification:
      - uv run pytest -q tests/agents/test_agents_api.py
  - id: ST-002
    title: Remove reviewer backend override seam
    status: backlog
    context: |
      Remove `ReviewerRunRequest.agent_backend` and stop passing any backend object into
      `run_agent` from reviewer execution.
    verification:
      - uv run pytest -q tests/reviewers
  - id: ST-003
    title: Migrate tests to registry+config backend injection
    status: backlog
    context: |
      Replace direct `backend=` injection with:
      - a temp `engineeringagent.toml` containing `[agents] backend = "<id>"`
      - registry mapping injection via monkeypatching/registering backend factories.
    verification:
      - uv run pytest -q tests/agents
  - id: ST-004
    title: Remove agents_defaults by internalizing OpenCode default agent id
    status: backlog
    context: |
      Move the OpenCode default agent id constant under the OpenCode backend package and
      delete `src/engineeringagent/agents_defaults.py`.
    verification:
      - uv run python harness/fitness-functions/check_backend_literal_locality_budget.py
      - uv run pytest -q
  - id: ST-005
    title: Restore backend-owned scaffold template markdown and adjust fitness rules
    status: backlog
    context: |
      Rename `agent.engineeringagent.template` back to a `.md` asset and update the
      markdown locality/reference-coverage fitness rule to allow backend-owned scaffold
      markdown without requiring non-self references.
    verification:
      - uv run python harness/fitness-functions/check_markdown_locality_reference_coverage.py
      - uv run pytest -q tests/fitness/test_fitness_rules_markdown_locality.py tests/fitness/test_fitness_rules_markdown_references.py
  - id: ST-006
    title: Tighten backend literal-locality budget baseline to zero
    status: backlog
    context: |
      Update the budget baseline constant to 0 and ensure the repository remains clean.
    verification:
      - uv run python harness/fitness-functions/check_backend_literal_locality_budget.py
      - uv run engineeringagent checks run --checks fitness_all --phase iteration_end
  - id: ST-007
    title: Update FEAT-117 spec to match no-backend-override contract
    status: backlog
    context: |
      Update FEAT-117 constraints/acceptance/notes to remove any mention of
      `run_agent(..., backend=...)` and to state that backend selection is internal to
      `engineeringagent.agents`.
    verification:
      - uv run engineeringagent validate
