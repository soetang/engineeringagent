id: FEAT-117
title: Add Codex CLI backend using codex exec with native schema mode
type: feature
expected_commit_subject: 'feat: add codex backend using codex exec'
status: backlog
priority: high
objective: |
  Implement a new `codex` agent backend that runs via `codex exec` and supports
  structured output using Codex CLI schema enforcement.

  The backend must be selectable through the existing agents backend registry and
  configuration path, and it must support backend-owned repository scaffolding via
  `.codex/config.toml` using Codex profiles.
context: |
  We already have an OpenCode backend under `src/engineeringagent/agents/backends/opencode/**`.
  FEAT-113 introduces backend registry + config-driven backend selection,
  FEAT-114 introduces backend-owned scaffolds, and FEAT-115 removes backend-specific
  coupling from loop runtime.

  Codex CLI non-interactive mode (`codex exec`) is suitable for this boundary:
  - prompt as positional argument
  - optional structured output via `--output-schema`
  - final message capture via `--output-last-message`
  - non-interactive execution for automation workflows

  Design decision for this feature:
  - Use Codex profiles (`.codex/config.toml`) for backend setup.
  - Do not implement Codex multi-agent role scaffolding in this feature.
constraints:
- >-
  Preconditions:
  - FEAT-113 must be complete (registry/config backend selection).
  - FEAT-114 must be complete before init/scaffold tasks in this feature.
  - FEAT-115 must be complete before validating full loop-level backend switching.
- |-
  Phase gates for execution safety:
  - Phase A (can execute once FEAT-113 is complete): ST-001, ST-002, ST-003,
    ST-005, ST-006, ST-008, ST-009, ST-010, ST-013, ST-014, ST-016, ST-017,
    ST-018.
  - Phase B (blocked on FEAT-114): ST-007.
  - Phase C (blocked on FEAT-115): ST-011 and ST-015.
- >-
  Authentication assumption: users are already logged into Codex CLI. Do not add
  login bootstrap flows (`codex login`) to init or runtime.
- >-
  Add a new backend package:
  - `src/engineeringagent/agents/backends/codex/__init__.py`
  - `src/engineeringagent/agents/backends/codex/client.py`
  - `src/engineeringagent/agents/backends/codex/backend.py`
- >-
  Codex command contract (normative):
  - text mode uses `codex exec` with workspace-write sandbox and captures final
    output via `--output-last-message <path>`.
  - structured mode uses `codex exec --output-schema <schema.json>` and captures
    final output via `--output-last-message <path>`.
  - command execution uses `cwd=project_root`.
  - final payload extraction is sourced from the output-last-message file path,
    not from stdout event streams.
- >-
  Default Codex sandbox policy for this backend must allow edits required by
  engineeringagent (workspace-write equivalent), not read-only defaults.
- >-
  Introduce backend capability for native structured output enforcement so Codex
  can use `--output-schema` directly instead of prompt-wrapper retries.
- >-
  Structured output behavior for Codex backend:
  - perform one Codex invocation per `run_agent` call in structured mode
  - keep one local JSON parse + Pydantic validation pass for safety
  - on parse/validation failure after Codex schema mode, raise
    `AgentOutputValidationError` without retry loop
  - preserve existing retry behavior for non-native-schema backends
- >-
  Register `codex` in the backend registry and ensure list/resolve behavior is
  deterministic and sorted.
- >-
  Strategy-pattern requirement for FEAT-117:
  - backend selection from TOML and backend construction must be owned by an
    agents-layer runtime/strategy resolver (for example `resolve_agent_strategy`)
  - `run_agent` must be a thin facade/delegator and must not perform direct TOML
    reads or backend-id branching
  - if FEAT-113 leaves selection logic inside `run_agent`, migrate it in FEAT-117
- |-
  Structured-output ownership requirement for FEAT-117:
  - each backend strategy owns how structured output is requested, extracted,
    and retried (if applicable)
  - backend-owned behavior includes schema transport, prompt contract text,
    invocation count/retry policy, and backend-specific failure mapping
  - ownership is consumer-agnostic: reviewers are only one caller; future
    structured-output callers must use the same backend strategy contract
  - `run_agent` must not contain backend-specific structured-output prompt
    wrappers or retry loops
- >-
  Add backend-specific config resolution for Codex runtime options under:
  - engineeringagent.toml `[agents.codex]`
  - pyproject.toml `[tool.engineeringagent.agents.codex]`
  Minimum keys:
  - `profile` (string, optional)
  - `model` (string, optional)
  Precedence:
  - engineeringagent.toml `[agents.codex]`
  - pyproject.toml `[tool.engineeringagent.agents.codex]`
  - unset/default
- >-
  Add backend-owned scaffold assets for Codex profiles under
  `src/engineeringagent/agents/backends/codex/**` and scaffold `.codex/config.toml`
  when backend=codex is selected during init.
- >-
  Multi-agent config (`[agents]` role tables in Codex config) is explicitly out of
  scope for this feature. Track as future enhancement once codex backend is stable.
- >-
  Fitness-function impact assessment:
  - update subprocess boundary allowlist to include Codex backend client module
  - keep backend boundary checks passing (imports from backends remain inside
    `src/engineeringagent/agents/**`)
- >-
  Reviewer `$responseformat` deprecation contract:
  - prompts must no longer require `$responseformat` to pass validation/runtime
  - codex reviewer path must not depend on `$responseformat` injection
  - for non-native-schema backends (opencode), prepend reviewer response-format
    instructions at runtime before reviewer prompt content
  - retain backward compatibility: if `$responseformat` is present in prompt files,
    treat it as optional legacy token and do not fail
implementation_notes: |
  Backend error mapping

  - Convert missing executable errors (`FileNotFoundError`) into
    `AgentBackendError(backend="codex", message="codex executable missing")`.
  - Non-zero `codex exec` exit should raise `AgentBackendError` with process
    details: return code, stdout, stderr, command args.

  Structured output integration

  - Avoid relying only on `--json` event streams for final output extraction.
  - Use `--output-last-message <path>` as canonical final payload capture in both
    text and structured modes.
  - Parse backend payload from the output-last-message file; treat stdout as
    non-canonical progress channel.
  - For structured mode, write schema JSON to a temp file and pass
    `--output-schema <temp_schema_path>`.

  Session semantics

  - Codex backend can ignore `session_id` for v1 and return `session_id=None`.
  - Resume/fork session behaviors are out of scope.

  Profiles vs multi-agent

  - V1 setup uses profiles because this is stable and directly maps to backend
    model/sandbox defaults.
  - Codex multi-agent is experimental and should not be scaffolded by default.

  Strategy ownership and migration from FEAT-113

  - FEAT-117 is the place to finalize strategy ownership in agents.
  - Introduce a runtime/strategy resolver in `engineeringagent.agents` that reads
    backend configuration and returns the selected execution strategy.
  - Keep `run_agent` as a stable facade API, but move selection logic out of it.
  - Existing `backend=...` argument may remain as an explicit override for tests
    and controlled call sites, but default-path selection must be strategy-owned.

  Structured output ownership by backend

  - Codex backend: use native `--output-schema` and backend-owned single-invocation
    policy with local validation guard.
  - OpenCode backend: own structured-output prompt contract and bounded retry
    policy in the backend strategy (not in run_agent).
  - Keep shared contracts minimal: typed errors and backend-normalized output.
  - Do not add reviewer-specific structured-output branching in run_agent or
    backend strategies; reviewers must consume the same generic structured path.

  Reviewer response-format deprecation

  - Remove hard requirement that reviewer prompt files contain `$responseformat`.
  - In reviewer runtime, make response-format contract injection backend-aware:
    - codex (native schema): do not require or inject reviewer `$responseformat`
      contract text
    - opencode (non-native schema): prepend reviewer response-format instructions
      to composed prompt
  - Keep legacy prompts compatible: when `$responseformat` exists, allow/strip it
    without turning it into a validation/runtime failure.
  - Update reviewer authoring docs to state `$responseformat` is deprecated.
acceptance:
- >-
  engineeringagent.agents.list_backends() includes codex and remains sorted.
- >-
  run_agent(..., backend=codex_backend, output_type=str) executes via codex exec
  command wiring and returns final text payload.
- >-
  run_agent(..., backend=codex_backend, output_type=<model>) uses output-schema
  mode and performs a single backend invocation.
- >-
  Codex command args include a workspace-write-equivalent sandbox policy for both
  text and structured modes.
- >-
  Default backend resolution from TOML is performed by an agents-layer
  strategy/runtime resolver, not in run_agent.
- >-
  run_agent default path delegates to resolved strategy without backend-id
  conditionals in run_agent.
- >-
  run_agent does not implement backend-specific structured-output wrappers or
  retry policy; structured-output behavior is implemented by backend strategies.
- >-
  Structured-output handling remains consumer-agnostic: reviewers and any future
  structured-output callers rely on the same backend strategy contract.
- >-
  Codex runtime options resolve with deterministic precedence:
  engineeringagent.toml [agents.codex] over
  pyproject.toml [tool.engineeringagent.agents.codex].
- Structured codex path raises `AgentOutputValidationError` without retry when
  returned payload still fails local parse/validation.
- >-
  OpenCode structured-output path remains functional after migration to
  backend-owned policy, with deterministic retry behavior covered by tests.
- Missing codex executable maps to deterministic `AgentBackendError` with backend
  id `codex`.
- Init scaffolds `.codex/config.toml` using Codex profile defaults when backend is
  codex (after FEAT-114 wiring).
- No login/bootstrap flow is added for Codex authentication.
- subprocess boundary fitness remains green after allowlist updates.
- >-
  Reviewer prompts without `$responseformat` pass validate/runtime checks and run
  correctly under codex backend.
- >-
  Reviewer prompts still run under opencode backend with response-format contract
  prepended at runtime.
- >-
  Legacy reviewer prompts containing `$responseformat` remain supported during
  migration (no validation/runtime failure solely due to token presence/absence).
- >-
  Repository migration complete: this repository default backend is codex via
  engineeringagent.toml [agents] backend, and default-path agent tests no longer
  rely on opencode as repository default.
- >-
  Non-goals remain enforced in v1: no Codex session resume/fork integration and
  no Codex multi-agent role scaffolding.
- uv run pytest -q passes.
