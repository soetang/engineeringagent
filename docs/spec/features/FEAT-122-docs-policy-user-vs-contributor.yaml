id: FEAT-122
title: Migrate docs policy to user vs contributor (rename references + expand scaffold)
type: feature
expected_commit_subject: 'feat: migrate docs policy to user vs contributor'
status: backlog
priority: high
objective: |
  Stop distinguishing "human docs" vs "agent docs" in repo documentation and policy.

  Replace the docs allowlist policy buckets with "user" vs "contributor" (contributors
  = people working on the engineeringagent package itself), and rename the existing
  `docs/references/*-llms.md` files to drop the "-llms" naming.

  Expand `engineeringagent init` to scaffold additional user-facing docs (principles
  + operational guides) and ensure scaffolded `AGENTS.md` links them.
context: |
  Today we enforce docs classification via `harness/scaffold_policy.yaml` with
  `human_docs` vs `agent_docs`. The naming implies a split between people and agents,
  but most docs are useful to both humans and automation when written as strict,
  deterministic runbooks.

  We want the primary audience split to be:

  - package users (operators using engineeringagent in their repositories)
  - package contributors (people developing engineeringagent itself)

  This change also affects init scaffolding: user docs may be scaffolded into adopter
  repos, while contributor docs should remain internal to this repository.
constraints:
  - >-
    Contract change: `harness/scaffold_policy.yaml` replaces `human_docs` and `agent_docs`
    with `user_docs` and `contributor_docs`.
  - >-
    The docs allowlist fitness rule `architecture.docs-allowlist-policy` is updated to
    enforce the new bucket names and to emit violations/remediation referencing
    `user_docs` / `contributor_docs`.
  - >-
    Rename all files under `docs/references/` currently named `*-llms.md` to drop the
    suffix, and update every in-repo reference (README, AGENTS, templates, tests,
    and docs) accordingly.
  - |-
    Rename mapping (normative):
    - docs/references/docs-architecture-llms.md -> docs/references/docs-architecture.md
    - docs/references/workflow-llms.md -> docs/references/workflow.md
    - docs/references/spec-writing-llms.md -> docs/references/spec-writing.md
    - docs/references/uv-llms.md -> docs/references/uv-workflow.md
    - docs/references/python-uv-ruff-llms.md -> docs/references/python-uv-ruff.md
    - docs/references/retry-feedback-llms.md -> docs/references/retry-feedback.md
    - docs/references/reviewer-agents-llms.md -> docs/references/reviewer-agents.md
  - >-
    Remove "LLM"-framed wording from renamed reference docs (titles/headings) so they
    read as strict runbooks for users/contributors.
  - >-
    Keep `docs/principles/` for conceptual docs. Move these operational guides out of
    `docs/principles/` into `docs/references/` and treat them as user docs:
    - docs/principles/quality-check-playbook.md -> docs/references/quality-check-playbook.md
    - docs/principles/reviewer-authoring-guide.md -> docs/references/reviewer-authoring-guide.md
  - >-
    Update `docs/references/reviewer-authoring-guide.md` to match the current reviewer
    contract (reviewers declared in `harness/checks.yaml`, not `harness/reviewers.yaml`)
    and remove/replace references to non-existent CLI commands.
  - >-
    Init scaffolding expands to include additional user-facing docs and links them from
    the scaffold template `src/engineeringagent/scaffold_templates/AGENTS.md`.
  - |-
    Scaffolded user docs set (normative):
    - docs/references/docs-architecture.md
    - docs/references/workflow.md
    - docs/references/spec-writing.md
    - docs/references/quality-check-playbook.md
    - docs/references/reviewer-authoring-guide.md
    - docs/principles/harness-engineering-principles.md
  - >-
    Contributor docs (including language/tooling contribution references) must not be
    added to the init scaffold manifest.
  - >-
    Update this repo's `harness/scaffold_policy.yaml` `scaffold_docs` and `exact_sync`
    so every scaffolded user doc has a corresponding scaffold template file and is
    enforced byte-for-byte via `architecture.scaffold-docs-exact-sync`.
  - >-
    Fitness-function impact assessment: this feature changes existing fitness rule behavior
    and messages. No new rule IDs are required.
implementation_notes: |
  Contract change declaration

  - Surface: `harness/scaffold_policy.yaml` docs classification keys and the fitness rule
    `architecture.docs-allowlist-policy`.
  - Old behavior: docs under `${docs_root}` (excluding `${docs_root}/spec/**`) must be listed
    in exactly one of `human_docs` or `agent_docs`.
  - New behavior: same allowlist semantics, but the buckets are `user_docs` and
    `contributor_docs`.
  - Compatibility policy: breaking change for the scaffold_policy contract; migrate this
    repository and update init scaffolding accordingly.
  - Migration plan:
    - Update `harness/scaffold_policy.yaml` and the docs allowlist rule implementation.
    - Rename/move docs files, then update policy lists to match final paths.
    - Update init scaffolding templates + manifest to write the new paths.
    - Update tests and any embedded examples that mention the old bucket names.
  - Verification evidence:
    - `uv run pytest -q`
    - `uv run engineeringagent validate`
    - `uv run engineeringagent checks run --checks fitness --phase iteration_end`
acceptance:
  - "`harness/scaffold_policy.yaml` uses `user_docs` and `contributor_docs` and contains no `human_docs` / `agent_docs` keys."
  - Fitness rule `architecture.docs-allowlist-policy` enforces the new keys and emits
    deterministic sorted violations referencing `user_docs` / `contributor_docs`.
  - All `docs/references/*-llms.md` files are renamed per the mapping and no `*-llms.md`
    references remain in repo source/docs/tests (excluding `progress/` artifacts).
  - "`docs/principles/quality-check-playbook.md` and `docs/principles/reviewer-authoring-guide.md` are moved into `docs/references/` and the reviewer authoring guidance matches the current `harness/checks.yaml` reviewer contract."
  - "`engineeringagent init` scaffolds the expanded user doc set and scaffolded `src/engineeringagent/scaffold_templates/AGENTS.md` links each scaffolded doc with a short description."
  - "`architecture.scaffold-docs-exact-sync` passes for all configured exact-sync doc/template pairs (including newly scaffolded user docs)."
  - "`uv run pytest -q` passes."
