id: FEAT-064
title: Enforce YAML-only harness root and relocate harness command scripts into fitness-functions
type: feature
expected_commit_subject: 'feat: add FEAT-064 harness root yaml-only policy and script relocation'
status: backlog
priority: high
objective: Keep harness root manifest-only by allowing only YAML files at harness root, relocating existing root Python scripts into harness/fitness-functions, and enforcing the policy with a blocking fitness rule.
context: >-
  The repository currently keeps executable Python scripts directly under harness/
  (`validate_yaml.py`, `permission_probe.py`, and `validate_commit_messages.py`),
  while runtime and CI/pre-commit surfaces reference those root paths. This
  mixes manifest/config files with executable policy code and makes root-level
  script sprawl easy to reintroduce.

  Desired direction is a strict root contract: harness/ root may contain only
  YAML manifests (`*.yaml`/`*.yml`) while executable scripts live in
  subdirectories. For this feature, all existing root Python scripts are moved
  into harness/fitness-functions and all references are updated in one migration.
constraints:
- Harness root file policy allows only regular files with .yaml or .yml extensions; any other regular file at harness/ root is a violation.
- Directories under harness/ remain allowed; policy applies to regular files directly under harness/ only.
- Move existing harness root scripts (`validate_yaml.py`, `permission_probe.py`, and `validate_commit_messages.py`) to harness/fitness-functions.
- No compatibility fallback for old harness/*.py paths; update call sites and enforce immediately.
- Update all runtime-critical and scaffolded command references, including harness/gates.yaml, src/engineeringagent/gates.py default gate config, .pre-commit-config.yaml, .github/workflows/ci.yaml, and src/engineeringagent/scaffold_templates/precommit.python_uv.yaml.
- Keep gate profile behavior unchanged apart from script path migrations.
- Add a new blocking command fitness rule in harness/fitness-functions/rules.yaml enforcing YAML-only harness root file locality.
- Keep fitness result envelope contract unchanged (`contract_version`, `rule_id`, `status`, `severity`, `summary`, `violations`).
- Update tests and docs/spec references that assert or demonstrate old harness/*.py paths.
implementation_notes: >-
  Contract change declaration:
  - Surface: harness directory file-locality contract for root-level files.
  - Old behavior: harness root accepts arbitrary regular files (including .py),
    and active commands reference scripts from harness/*.py.
  - New behavior: harness root regular files must be YAML only; command scripts
    are expected under harness/fitness-functions and referenced from there.
  - Compatibility policy: immediate breaking change with no dual-path fallback.
  - Migration plan: one-time relocation of current root scripts into
    harness/fitness-functions plus deterministic reference updates across runtime,
    tests, CI, pre-commit, scaffold template, and relevant docs/spec text.
  - Verification evidence: focused pytest coverage for rule behavior and path
    updates, plus repository validate/gates runs.

  Relocated scripts that derive project root from __file__ must adjust parent
  traversal depth to keep behavior unchanged after moving from harness/ to
  harness/fitness-functions/.
acceptance:
- "`harness/` contains only YAML/YML regular files at root after migration."
- "`harness/validate_yaml.py`, `harness/permission_probe.py`, and `harness/validate_commit_messages.py` no longer exist at harness root and are relocated under `harness/fitness-functions/`."
- Runtime and generated command surfaces reference only relocated script paths (gates config/defaults, pre-commit hook config, CI workflow, scaffold template).
- A new fitness rule is declared in `harness/fitness-functions/rules.yaml` and fails when any non-YAML regular file exists directly under `harness/`.
- Repository-level rule execution passes in current state and emits actionable violations in negative tests.
- Existing gate planning/execution and init scaffold tests are updated to new script locations and pass.
subtasks:
- id: ST-001
  title: Relocate harness root scripts into harness fitness-functions and preserve behavior
  status: backlog
  context: Move validate_yaml, permission_probe, and validate_commit_messages scripts and update internal project-root resolution as needed.
  verification:
  - uv run python harness/fitness-functions/validate_yaml.py
  - uv run python harness/fitness-functions/permission_probe.py
  - uv run python harness/fitness-functions/validate_commit_messages.py --help
- id: ST-002
  title: Update runtime, CI, pre-commit, and scaffold references to relocated script paths
  status: backlog
  context: Replace all harness/*.py command references with harness/fitness-functions/*.py for active execution surfaces.
  verification:
  - uv run pytest -q tests/test_gates.py tests/test_init_command.py
- id: ST-003
  title: Add blocking fitness rule for YAML-only harness root file locality
  status: backlog
  context: Implement and register a command-backed rule that scans harness root and reports deterministic violations for non-YAML files.
  verification:
  - uv run pytest -q tests/test_fitness_rules_harness_root_yaml_only.py tests/test_loop_contracts.py
- id: ST-004
  title: Update docs/spec references and validate full repository contracts
  status: backlog
  context: Refresh assertions/examples that mention old harness/*.py paths and run repository-level validation/gates.
  verification:
  - uv run python -m engineeringagent.cli validate
  - uv run python -m engineeringagent.cli gates run --profile loop_fast
