id: FEAT-164
title: Simplify README to minimal spec-to-implement onboarding
type: docs
expected_commit_subject: 'docs: simplify readme to minimal spec-to-implement onboarding'
status: backlog
priority: high
objective: Rewrite `README.md` to a minimal user-onboarding surface centered on the
  primary flow (`spec -> implement`), while preserving the repository development
  warning and reducing contributor guidance to essential policy only.
context: |
  The current README is comprehensive but dense. This rewrite makes README intentionally
  minimal for users and keeps agent-oriented guidance in AGENTS.

  Requested direction:
  - make onboarding minimal and direct
  - keep the "repo under active development" warning
  - keep only essential contributor policy guidance
  - describe spec authoring as: start your favorite coding agent at repo root and ask it
    to write a spec
  - include AGENTS bootstrap fallback guidance (copyable snippet) for repos that do not
    want to fully edit AGENTS.md
  - do not route users from README to `engineeringagent approach`; that surface is for agents
constraints:
  - 'Dependency: this README rewrite assumes FEAT-163 AGENTS bootstrap snippet contract
    exists (or is implemented in the same release window).'
  - 'In scope: substantial content reduction and section reorganization in README.'
  - 'In scope: preserve repository warning semantics at top of README.'
  - 'In scope: keep only contributor policy essentials: no PRs accepted, code is written by
    agents, and users can open issues that can be promoted into specs.'
  - 'Out of scope: changing CLI/runtime behavior; this feature updates docs only.'
implementation_notes: |
  Contract change declaration

  Surface:
  - `README.md`

  Old behavior:
  - README contains broad detail across quickstart variants, schema walkthroughs,
    deep operational notes, and many command examples.

  New behavior:
  - README is intentionally minimal and does not route users to
    `engineeringagent approach`.
  - Primary onboarding message is explicit and short: `spec -> implement`.
  - "Write a spec" guidance is agent-first: initialize repo, start coding agent at repo
    root, ask it to write a spec.
  - AGENTS fallback snippet is included for users who do not want to manually curate
    AGENTS.md content.
  - Contributor section is reduced to policy-level guidance only.

  Compatibility policy:
  - Documentation-only change; no API/runtime compatibility impact.

  Design choices

  1) README information architecture
  - Keep only core sections for first-run success:
    - what engineeringagent is (1-2 short paragraphs)
    - primary flow: `spec -> implement`
    - getting started (very short)
    - AGENTS bootstrap fallback snippet
    - contributor policy (kept, concise)
    - safety warning (top of file)
  - Keep procedural depth out of README; do not replace it with a user-facing redirect
    to approach commands.

  2) Agent-vs-user documentation split
  - `engineeringagent approach` is agent-oriented and should be described in AGENTS,
    not as a primary README path for users.
  - README may include AGENTS bootstrap snippet for convenience, but should not present
    approach commands as the user onboarding flow.

  3) AGENTS fallback guidance
  - Include the exact copyable snippet for repos that do not want to fully edit AGENTS.md:
    - `In this repository, run EngineeringAgent CLI commands with `uvx engineeringagent ...`.`
    - `Use `engineeringagent approach` for the overall workflow and guidance map.`
    - `Use `engineeringagent approach list` to discover topics, then open one (for example `engineeringagent approach specifications`).`
  - Clarify in README that this snippet is the minimum bootstrap if AGENTS is not
    otherwise customized.

  4) Contributor policy-only guidance
  - Keep only these contributor statements in README:
    - pull requests are not accepted
    - code changes are implemented through agents
    - users can open issues and specs can be drafted/promoted from issue proposals
  - Remove contributor operational command walkthroughs (for example validate/lint/type/test
    command lists) from README.

  5) Agent permissions recommendation
  - README should include a concise recommendation for repositories using restrictive
    agent command allowlists.
  - Recommend adding the following commands to approved bash/command permissions:
    - `engineeringagent approach`
    - `engineeringagent schema *`
  - Keep this recommendation short and clearly framed as agent-setup guidance, not
    user onboarding steps.

  Fitness-function impact assessment
  - no fitness-function changes required.

acceptance:
  - README top section preserves the repository active-development warning intent.
  - README presents primary workflow as `spec -> implement` in a concise onboarding path.
  - README getting-started section is minimal and does not route users to
    `engineeringagent approach`.
  - 'README includes explicit "write specs with your coding agent" guidance: start agent at initialized repo root and ask it to write a spec.'
  - 'README includes AGENTS fallback snippet with this exact text: "In this repository, run EngineeringAgent CLI commands with `uvx engineeringagent ...`." "Use `engineeringagent approach` for the overall workflow and guidance map." "Use `engineeringagent approach list` to discover topics, then open one (for example `engineeringagent approach specifications`)."'
  - 'README contributor section keeps only policy essentials: pull requests are not accepted; code changes are implemented through agents; users can open issues and specs can be drafted from those issues.'
  - README does not document contributor operational command walkthroughs (for example
    validate/lint/type/test command lists).
  - 'README recommends allowlisting these agent commands in restrictive environments: `engineeringagent approach` and `engineeringagent schema *`.'
  - The feature spec validates with `uv run engineeringagent validate --schema-only`.
