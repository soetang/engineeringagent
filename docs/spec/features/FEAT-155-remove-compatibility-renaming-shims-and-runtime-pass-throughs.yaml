    verification:
      - uv run pytest -q tests/loop/test_loop_feature_iteration.py tests/loop/test_loop_opencode_integration.py tests/harness/test_checks_runtime.py

  - id: ST-005
    title: Run final contract validation
    status: backlog
    context: >
      Run final schema validation and targeted regression checks to confirm
      removed shim surfaces are not referenced.
    verification:
      - uv run engineeringagent validate --schema-only
      - uv run pytest -q tests/checks/test_validate_group.py tests/fitness/test_fitness_rules_checks_import_surface.py tests/loop/test_loop_feature_iteration.py tests/loop/test_loop_opencode_integration.py tests/harness/test_checks_runtime.py
