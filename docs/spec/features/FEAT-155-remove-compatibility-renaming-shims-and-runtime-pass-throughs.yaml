id: FEAT-155
title: Remove compatibility renaming shims and runtime pass-through aliases
type: spec
expected_commit_subject: 'spec: add FEAT-155 remove compatibility renaming shims'
status: backlog
priority: high
objective: >
  Remove compatibility-style renaming indirection from production checks code so
  runtime imports use canonical symbols directly and constants are treated as
  internal-only implementation details.
context: |
  Current checks modules still carry compatibility-era rename indirection:

  - planning-policy constants are imported with alias names and re-exported via
    mirror assignments in command/fitness/reviewer runtime modules.
  - `checks.validate.runtime` is a pass-through wrapper that renames
    `validator.validate` to `run_validate`.

  Tests also still include compatibility aliases/wrappers that preserve removed
  call shapes (legacy scalar `run_loop` wrappers and migration alias
  `load_checks_document = _load_checks_document`).

  These shims expand surface area, blur canonical ownership, and preserve import
  paths that are not intended to be stable contracts.

  Repository policy for this work is immediate break (no active users) and
  constants should be treated as internal implementation details.
constraints:
  - 'In scope: remove mirror-assignment constant re-exports in `checks/commands/runtime.py`, `checks/fitness/runtime.py`, and `checks/reviewers/runtime.py`.'
  - 'In scope: remove `checks/validate/runtime.py` pass-through aliasing and standardize validate execution on one canonical symbol name.'
  - 'In scope: update internal call sites/tests/imports to canonical names and modules after shim removal.'
  - 'In scope: remove compatibility-only test aliases/wrappers that preserve legacy call shapes when canonical test entrypoints are available.'
  - 'In scope: keep code readable; preserve readability aliases when they add clear local clarity, and only remove aliases that are unnecessary indirection.'
  - 'Out of scope: broad removal of readability aliases in tests (for example `cli_module`, `loop_module`, or other namespace-clarifying aliases) when they are not compatibility shims.'
  - 'Out of scope: broad removal of intentional package facades in `__init__.py` modules unless they are required to complete this shim cleanup.'
  - 'Out of scope: behavior changes to check planning decisions, validation semantics, or reviewer/fitness execution logic.'
  - Compatibility policy is immediate break; do not add transitional aliases, shim modules, or deprecation windows.
implementation_notes: |
  Contract change declaration

  Surface:

  - Internal checks runtime import/constant surfaces.
  - Validate runtime entrypoint naming and module path usage.

  Old behavior:

  - Command/fitness/reviewer runtime modules mirror-export planning-policy
    constants through alias-import + assignment patterns.
  - Validate strategy/runtime code can call `checks.validate.runtime.run_validate`,
    which is only a rename pass-through to `validator.validate`.
  - Some tests keep compatibility wrappers/aliases for legacy contracts instead
    of calling canonical runtime APIs directly.

  New behavior:

  - Planning-policy reason constants have one canonical owner and are not
    re-exported via runtime mirror assignments.
  - Validate execution uses a canonical validate symbol directly; the
    `checks.validate.runtime` rename pass-through module/path is removed.
  - Runtime modules expose only active, intentional APIs needed by checks
    orchestration.
  - Tests no longer retain compatibility wrappers/aliases for removed call
    shapes; they target canonical APIs directly while keeping readability-only
    aliases where useful.

  Compatibility policy:

  - Immediate break for removed shim import paths/symbol exports.
  - No backward-compat aliases or dual-support window.

  Migration plan:

  - Delete mirror constant alias imports/assignments in runtime modules.
  - Update call sites to import canonical symbols from owning modules.
  - Remove `checks.validate.runtime` and route imports/calls to the canonical
    validate implementation.
  - Update tests that currently patch/assert legacy shim paths.
  - Replace compatibility test wrappers and pass-through aliases with canonical
    invocation patterns.

  Verification evidence:

  - Targeted checks/validate tests pass with shim paths removed.
  - Import-surface fitness tests pass with updated allowed/disallowed paths.
  - Schema validation passes.

  Fitness-function impact assessment:

  - no fitness-function changes required.
  - Rationale: this work removes import-surface indirection and compatibility
    aliases without changing architecture-rule intent or check semantics.
acceptance:
  - Runtime modules no longer contain alias-import plus mirror-assignment
    constant re-export patterns for planning-policy reason constants.
  - Canonical planning-policy reason constants are referenced directly from their
    owning module where needed.
  - '`src/engineeringagent/checks/validate/runtime.py` is removed and no production
    call sites depend on `run_validate` pass-through naming.'
  - Tests that patch/assert removed shim paths are updated to canonical targets.
  - Compatibility-only test wrappers/aliases (including legacy scalar `run_loop`
    wrappers and migration pass-through aliases) are removed or rewritten to use
    canonical runtime contracts.
  - Intentional readability aliases that still improve clarity are retained.
  - No new compatibility aliases are introduced to preserve removed shim
    surfaces.
  - 'Verification command passes: `uv run pytest -q tests/checks/test_validate_group.py tests/fitness/test_fitness_rules_checks_import_surface.py`.'
  - 'Verification command passes: `uv run engineeringagent validate --schema-only`.'
subtasks:
