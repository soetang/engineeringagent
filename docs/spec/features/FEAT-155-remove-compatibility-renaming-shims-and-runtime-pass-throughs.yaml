      command/fitness/reviewer runtime modules and switch to canonical constant
      usage/imports.
    verification:
      - uv run pytest -q tests/checks

  - id: ST-002
    title: Remove validate runtime pass-through and standardize canonical naming
    status: backlog
    context: >
      Remove `checks.validate.runtime` alias wrapper and route validate execution
      through the canonical validate symbol/module, including package exports if
      still needed.
    verification:
      - uv run pytest -q tests/checks/test_validate_group.py

  - id: ST-003
    title: Update tests and import-surface assertions for removed shim paths
    status: backlog
    context: >
      Update tests that monkeypatch/import removed shim paths so they assert
      canonical imports only, including checks import-surface fitness tests.
    verification:
      - uv run pytest -q tests/fitness/test_fitness_rules_checks_import_surface.py tests/checks/test_validate_group.py

  - id: ST-004
    title: Remove compatibility-only test aliases and legacy wrappers
    status: backlog
    context: >
      Replace or remove compatibility wrappers that keep legacy test call shapes
