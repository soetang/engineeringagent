id: FEAT-127
title: Extract shared harness checks config loader helper for CLI and checks API
type: chore
expected_commit_subject: 'chore: add FEAT-127 shared checks config loader helper'
status: backlog
priority: high
objective: 'Deduplicate `harness/checks.yaml` load+contract-validation plumbing by
  introducing a shared checks config loader/helper used by both `checks.api` and
  `cli run --all` preflight.

  '
context: '`src/engineeringagent/checks/api.py` and `src/engineeringagent/cli.py` currently
  implement overlapping checks-config load/validation flow with separate error construction.

  Keeping both paths in sync is unnecessary maintenance overhead and increases drift
  risk when contract handling evolves.

  This feature consolidates loader behavior only; it does not change command/fitness/reviewer
  execution ownership or planning policy.

  '
constraints:
- Scope boundary is CLI + checks API checks-config loading only.
- Preserve semantic behavior parity for load/validation outcomes; minor wording normalization
  is allowed.
- Keep deterministic failure classes and actionability (`missing`, `load failure`,
  `contract invalid`, `model validation failure`) for both surfaces.
- Keep `run --all` legacy harness-contract-file rejection behavior unchanged and outside
  the shared loader helper.
- Keep `engineeringagent.checks.run_checks(...)` public API/signature unchanged.
- Do not centralize subprocess/agent execution behavior as part of this feature.
- 'no fitness-function changes required; this is internal config-loader deduplication
  with unchanged architecture boundaries.'
implementation_notes: |
  Contract change declaration (internal-only)

  Surface:
  - Internal checks-config loading helpers used by:
    - `src/engineeringagent/checks/api.py`
    - `src/engineeringagent/cli.py` (`run --all` preflight)

  Old behavior:
  - Each surface resolves `harness/checks.yaml`, parses YAML, runs contract checks,
    and renders errors independently.
  - The two paths duplicate policy and error-shaping logic.

  New behavior:
  - One shared checks-config loader/helper owns path resolution + parse + contract/model
    validation result shaping.
  - CLI and checks API call the shared helper and render/propagate returned outcomes.
  - Behavior remains semantically equivalent (same success/failure decisions and remediation
    intent), while exact wording may be normalized.

  Compatibility policy:
  - No intentional user-facing API contract changes.
  - Semantic parity only for human-readable error text; exact byte-level message parity
    is not required.

  Migration plan:
  - Introduce shared helper under `src/engineeringagent/checks/`.
  - Migrate checks API loader path first.
  - Migrate CLI `run --all` checks-config preflight to the shared helper.
  - Add/adjust focused regressions for missing/invalid config outcomes in both surfaces.

  Verification evidence:
  - Targeted checks API + CLI tests covering missing/invalid checks config.
  - Spec validation command.
acceptance:
- A shared checks-config loader/helper exists and is used by both checks API and CLI
  run preflight code paths.
- Duplicate load/contract-validation blocks for `harness/checks.yaml` are removed from
  `src/engineeringagent/checks/api.py` and `src/engineeringagent/cli.py`.
- '`checks run` with missing/invalid `harness/checks.yaml` still fails deterministically
  with actionable config error output.'
- '`run --all --dry-run` with missing/invalid `harness/checks.yaml` still fails
  deterministically with actionable run config error output.'
- '`run --all` legacy harness-file rejection remains intact and unaffected by the
  shared loader helper.'
- '`uv run pytest -q tests/checks/test_run_checks_contract.py tests/cli/test_cli.py tests/cli/test_cli_checks.py`
  passes.'
- '`uv run engineeringagent validate` passes.'
