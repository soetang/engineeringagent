id: FEAT-050
title: Add harness-managed reviewer agents with prompt contracts, approval policy, and loop integration
type: feature
expected_commit_subject: 'feat: add FEAT-050 harness reviewer agents contract and loop integration'
status: backlog
priority: high
objective: Add a first-class reviewer-agent system managed under `harness/` so teams can run advisory or blocking reviewers with deterministic trigger and approval policy, repository-local prompt files, README-process sandbox checks, and clear tooling/docs for custom reviewers.
context: >-
  Reviewer-agent workflow is currently tracked as idea `POT-011`, while runtime
  and docs principles already position reviewers as a planned complement after
  deterministic checks. The requested design now needs concrete contract plus
  implementation flow: reviewers should support multiple scenarios
  (always-run-on-code-change simplification, README process review only when
  README changes in an isolated temp snapshot), communicate approval
  deterministically, and handle non-determinism via bounded retries and
  explicit exhausted-policy behavior.
constraints:
- Keep deterministic command gates as the primary baseline; reviewer agents are complementary and must not replace spec/gate validation.
- Reviewer configuration must be repository-local and harness-managed in `harness/reviewers.yaml`.
- Reviewer prompt sources must be repository-local files under `harness/reviewers/prompts/`; do not require `.opencode/agents/*.md` files for reviewer setup in this feature.
- Reviewer execution must use shared OpenCode invocation (for example `agent=build`) with composed prompt input and strict machine-parse decision output.
- Default reviewer mode must be advisory unless explicitly configured otherwise.
- 'Advisory reviewer feedback must trigger at least one follow-up implement pass before
  completion commit is allowed for that feature iteration.'
- Blocking reviewers must support `max_retries` and `continue_on_exhausted`; default exhausted behavior is continue with warning and telemetry.
- Support first-approval semantics per feature (first approval can be reused until relevant scoped paths change).
- Reviewer triggers must support phase-based execution (`iteration_end`, `feature_done`) and optional `on_change` path selectors.
- README process reviewers must support isolated execution using temp worktree snapshot sandbox mode.
- 'Preserve backward compatibility: repositories without `harness/reviewers.yaml`
  must keep current loop behavior unchanged.'
- Preserve current run-loop facade signatures and existing gate semantics unless explicitly extended by additive fields only.
implementation_notes: >-
  Introduce a dedicated reviewer contract and runtime path similar in structure to
  gates/fitness but isolated in purpose.

  Contract layer:

  - Add strict schema/model for `harness/reviewers.yaml` with `profiles`,
    `reviewers`, runner details, trigger phase, optional `on_change`, approval
    policy, and optional sandbox block.

  - Lock the v1 contract shape in this feature so implementation and docs align:

    - Top-level keys: `contract_version`, `profiles`, `reviewers`.

    - `contract_version`: exact string `1.0`.

    - `profiles`: mapping of profile name -> ordered list of reviewer ids.

    - `reviewers`: mapping of reviewer id -> reviewer definition.

    - Reviewer definition required fields:

      - `prompt_file`: repo-relative path under
        `harness/reviewers/prompts/`.

      - `trigger.phase`: enum `iteration_end` or `feature_done`.

      - `approval.mode`: enum `advisory` or `blocking`; default `advisory`.

    - Reviewer definition optional fields:

      - `trigger.on_change`: list of path globs; when absent, reviewer is
        considered for all changes at its phase.

      - `approval.first_feature_approval`: bool; default `true`.

      - `approval.max_retries`: integer >= 0; default `2`.

      - `approval.continue_on_exhausted`: bool; default `true`.

      - `sandbox.mode`: currently supports `temp_worktree_snapshot`.

  - Lock the v1 reviewer decision envelope contract:

    - Required JSON fields in reviewer output: `decision`, `summary`.

    - `decision` enum: `approve`, `request_changes`, `warning`.

    - Optional JSON fields: `required_actions` (list of strings),
      `confidence` (0..1), `scope_notes` (string).

    - Non-JSON or malformed output is treated as `request_changes` with a
      deterministic parser-failure reason.

  - Validate reviewer contract from both `engineeringagent validate` and runtime
    loading path with deterministic issue formatting.

  Runtime layer:

  - Add reviewer planning that evaluates trigger phase + changed paths +
    prior-approval cache before execution.

  - Add reviewer execution that runs OpenCode with shared agent and renders
    prompt from `harness/reviewers/prompts/<id>.md` plus deterministic context
    envelope (feature id/path, changed files, prior feedback).

  - Parse a strict JSON decision envelope from reviewer output (for example
    approve/request_changes/warning with reason) and treat parse failures as
    deterministic request_changes outcomes.

  - Add an advisory follow-up latch so advisory `warning` or
    `request_changes` outcomes require at least one subsequent implement pass
    before completion commit can proceed.

  - Lock behavioral semantics for policy modes:

    - `advisory`: never hard-blocks completion forever, but any advisory advice
      (`warning` or `request_changes`) forces one implement follow-up pass before
      completion commit is eligible.

    - `blocking`: `request_changes` causes retry flow until approval or retry
      exhaustion.

    - blocking exhaustion + `continue_on_exhausted=true`: continue with warning,
      record non-approval in telemetry and reviewer state.

    - blocking exhaustion + `continue_on_exhausted=false`: fail iteration.

    - `first_feature_approval=true`: reuse first approval while scoped files are
      unchanged; invalidate cached approval when relevant `on_change` paths
      change.

  - Persist reviewer state in `progress/reviewers-state.json` to support
    first-approval reuse and retry accounting.

  - Add reviewer phase to loop iteration after deterministic gate pass and
    before completion commit so blocking reviewers can request targeted fixes
    prior to feature completion commit.

  Tooling layer:

  - Add reviewer CLI surfaces for discoverability and ease of setup (for
    example `engineeringagent reviewers init|list|plan|run`).

  - Extend init scaffold to optionally include baseline reviewer contract and
    example prompt files under harness.

  Documentation layer:

  - Add an agent reference doc (for example
    `docs/references/reviewer-agents-llms.md`) covering contract, trigger
    semantics, approval policy, sandbox behavior, decision contract, and
    troubleshooting.

  - Include full JSON decision-envelope examples in docs for all v1 decisions
    (`approve`, `request_changes`, `warning`) so behavior is unambiguous:

    - approve:
      {
        "decision": "approve",
        "summary": "No blocking issues found in scoped changes.",
        "required_actions": [],
        "confidence": 0.94,
        "scope_notes": "Reviewed src and tests changes only."
      }

    - request_changes:
      {
        "decision": "request_changes",
        "summary": "Refactor duplicated parsing helper before completion.",
        "required_actions": [
          "Extract shared parser helper in src/engineeringagent/reviewers.py",
          "Add regression test for malformed decision payload"
        ],
        "confidence": 0.88,
        "scope_notes": "Focused on reviewer-runtime module changes."
      }

    - warning:
      {
        "decision": "warning",
        "summary": "Readability can improve, but no hard blocker.",
        "required_actions": [
          "Consider simplifying nested conditional in reviewer planner"
        ],
        "confidence": 0.73,
        "scope_notes": "Advisory readability guidance only."
      }

  - Include a full copy-pastable `harness/reviewers.yaml` example aligned to v1:

    contract_version: "1.0"
    profiles:
      loop_fast:
        - code_simplifier
        - readme_process
    reviewers:
      code_simplifier:
        prompt_file: "harness/reviewers/prompts/code_simplifier.md"
        trigger:
          phase: "iteration_end"
          on_change:
            - "src/**/*.py"
            - "tests/**/*.py"
        approval:
          mode: "advisory"
          first_feature_approval: true
          max_retries: 2
          continue_on_exhausted: true
      readme_process:
        prompt_file: "harness/reviewers/prompts/readme_process.md"
        trigger:
          phase: "feature_done"
          on_change: ["README.md"]
        sandbox:
          mode: "temp_worktree_snapshot"
        approval:
          mode: "blocking"
          first_feature_approval: true
          max_retries: 2
          continue_on_exhausted: true

  - Add concise human-facing README section linking to deeper reviewer
    reference.

  - Update `AGENTS.md` docs map to include new reviewer reference path.
acceptance:
- '`harness/reviewers.yaml` contract exists with strict validation for profiles,
  reviewer definitions, trigger phase, optional `on_change`, approval policy,
  prompt file references, and sandbox mode.'
- '`engineeringagent validate` reports deterministic reviewer-config contract
  issues and passes when reviewer contract is valid.'
- Reviewers can be planned deterministically by phase and changed paths, with explicit run or skip reasons.
- Reviewer prompts are loaded from `harness/reviewers/prompts/*.md` and executed through shared OpenCode runner path without requiring repository `.opencode/agents/*.md` definitions.
- Reviewer decision parsing is deterministic and machine-parse-friendly; malformed reviewer outputs produce deterministic failure feedback.
- Advisory reviewer advice always causes at least one follow-up implement pass before completion commit for the same feature run.
- Advisory reviewers do not block feature completion; blocking reviewers can request changes and feed retry feedback back into implement step.
- Blocking reviewer exhaustion respects configured policy, and default exhausted behavior continues loop with warning and audit trail.
- First feature approval reuse works and invalidates when relevant scoped files change.
- README-change reviewers can run in `temp_worktree_snapshot` sandbox mode without mutating active worktree.
- Loop telemetry and human summary output include reviewer status and decisions in a deterministic, parse-friendly format.
- CLI tooling exists to initialize, inspect, and dry-plan reviewer execution for easier custom reviewer setup under harness.
- README and agent-facing docs include a clear reviewer section and reference links while preserving audience split.
- 'Reviewer docs describe policy in plain English, including exactly how advisory,
  blocking, retries, exhausted behavior, and first-approval reuse work, with at
  least one concrete end-to-end example per mode.'
- Reviewer docs include complete copy-pastable JSON examples for `approve`, `request_changes`, and `warning` decision envelopes.
- Reviewer docs include a complete copy-pastable `harness/reviewers.yaml` example with both advisory and blocking reviewers.
