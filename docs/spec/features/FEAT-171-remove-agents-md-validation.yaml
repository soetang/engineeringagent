id: FEAT-171
title: Remove AGENTS.md validation from validate
type: feature
expected_commit_subject: 'chore: remove AGENTS.md checks from validate'
status: backlog
priority: high
objective: Remove all AGENTS.md content validation from `engineeringagent validate`
  so users can freely author AGENTS guidance without validator failures.
context: |
  We currently enforce an AGENTS bootstrap contract during `engineeringagent validate`
  by requiring specific scaffold-template lines in repository `AGENTS.md`.

  This behavior was introduced in prior docs/approach work and now conflicts with
  product intent: AGENTS content should be user-owned and customizable. Init and
  README may suggest default AGENTS content, but validate must not enforce that
  content.

  We also want launcher flexibility (`engineeringagent ...`, `uv run engineeringagent ...`,
  or `uvx engineeringagent ...`) without AGENTS-content coupling in validate.
constraints:
- Remove AGENTS.md checks from validate behavior entirely.
- Do not fail validate because AGENTS.md is missing, present, or custom-authored.
- Keep init AGENTS scaffolding support as guidance-only behavior (not a validation contract).
- Preserve init AGENTS file-creation semantics by creating/writing scaffold content when
  AGENTS.md is missing, and when user explicitly chooses overwrite in conflict flow.
- Preserve user-authored AGENTS.md when init conflict mode/path chooses preserve.
- Remove repository tests that assert AGENTS bootstrap text as a validate contract.
- Do not add/keep tests that treat this repository's AGENTS.md body as a policy input
  for validate outcomes.
- Remove fitness rule `architecture.repo-validators-boundary` because it hard-codes
  specific validator modules/function imports and can re-introduce policy coupling.
- Preserve all other validate functionality and non-AGENTS repo-policy checks.
- Keep change scope focused on validate path and associated tests/docs.
implementation_notes: |
  Contract change declaration

  Surface:
  - `engineeringagent validate` repo-policy validation behavior.
  - Validate check output in CLI and loop checks phases.

  Old behavior:
  - Validate runs AGENTS bootstrap contract checks and emits failures such as
    `AGENTS docs bootstrap contract missing required line: ...`.

  New behavior:
  - Validate performs no AGENTS.md content checks.
  - AGENTS.md may contain any user-authored guidance (or be absent) without validate failure.

  Candidate implementation approach:
  - Remove `append_agents_docs_map_issues(...)` from repo validator composition.
  - Remove or retire `repo_policy_docs_map.py` and its dedicated tests if no longer used.
  - Update tests that currently assert AGENTS bootstrap validation failures.
  - Remove `architecture.repo-validators-boundary` rule entry, checker script, and
    dedicated fitness tests that enforce named imports/functions.
  - Regenerate fitness catalog docs after manifest/rule removal.
  - Update docs text that implies AGENTS content is validate-enforced.

  Historical provenance note:
  - The AGENTS bootstrap validation contract appears in completed feature
    `FEAT-163-cli-approach-doc-surface-and-init-slimming` (for example validator
    boundary notes and acceptance language).

  Fitness-function impact assessment:
  - no new fitness rules required.
  - remove existing `architecture.repo-validators-boundary` rule because its enforcement
    shape is too specific (named modules/functions) and not a stable architectural invariant.
acceptance:
- '`engineeringagent validate --schema-only` does not emit AGENTS.md content/contract
  errors for any AGENTS.md body, including custom text and missing bootstrap lines.'
- '`engineeringagent validate` does not emit AGENTS.md content/contract errors for
  any AGENTS.md body, including custom text and missing bootstrap lines.'
- AGENTS.md absence does not create validate failures.
- Init AGENTS behavior is unchanged; scaffold content is written when AGENTS.md is
  absent or overwrite is selected, and preserve mode keeps existing user-authored content.
- Existing non-AGENTS validate checks continue to run and report deterministically.
- Tests are updated to remove AGENTS bootstrap-contract expectations and to cover
  permissive AGENTS behavior.
- No remaining validate-focused test asserts exact AGENTS bootstrap snippet lines as
  required policy.
- '`architecture.repo-validators-boundary` is removed from
  `harness/fitness-functions/rules.yaml`, and
  `harness/fitness-functions/check_repo_validators_boundary.py` is removed.'
- Tests dedicated to the removed rule are deleted or replaced with broader,
  non-hardcoded coverage.
- '`uv run pytest -q tests/meta/test_validator.py tests/cli/test_cli.py tests/fitness`
  passes.'
