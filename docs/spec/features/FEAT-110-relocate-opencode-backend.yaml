id: FEAT-110
title: Relocate OpenCode backend implementation under agents/backends
type: chore
expected_commit_subject: "chore: relocate opencode backend under agents/backends"
status: backlog
priority: medium
objective: >
  Move the OpenCode backend implementation from `src/engineeringagent/opencode/**` to
  `src/engineeringagent/agents/backends/opencode/**` while keeping the canonical
  `engineeringagent.agents.run_agent` contract unchanged. This aligns filesystem layout
  with architecture: OpenCode becomes an internal backend implementation detail.

context: >
  FEAT-109 establishes `engineeringagent.agents.run_agent` as the only supported agent
  invocation surface for production code. After that boundary is enforced by tests,
  relocating the OpenCode backend becomes a localized refactor that should not affect
  higher layers.

constraints:
  - "Precondition: FEAT-109 is done and the `architecture.agents-opencode-boundary` fitness rule passes."
  - "Keep the public agent contract stable: `engineeringagent.agents.run_agent` signature and behavior must remain unchanged."
  - "Move implementation: relocate `src/engineeringagent/opencode/**` to `src/engineeringagent/agents/backends/opencode/**`."
  - "No new compatibility shims are required for the old Python import paths (update internal imports in the same change)."
  - "Determinism invariants remain: stable failure messages, stable retry templates, stable envelope emission."
  - "Fitness-function impact assessment: no fitness-function changes required; enforcement remains via fitness rule `architecture.agents-opencode-boundary`."

implementation_notes: |
  Contract delta (explicit)

  Surface: internal module layout only.

  Old behavior:
  - OpenCode backend code lives at `engineeringagent.opencode.*`.
  - `engineeringagent.agents` imports the backend from that location.

  New behavior:
  - OpenCode backend code lives at `engineeringagent.agents.backends.opencode.*`.
  - `engineeringagent.agents` continues to expose the same `run_agent` contract.
  - No other production modules depend on OpenCode backend module paths.

acceptance:
  - "No modules remain under `src/engineeringagent/opencode/**` after relocation (directory removed)."
  - "`engineeringagent.agents.run_agent` behavior and signature are unchanged (verified by unit tests)."
  - "`uv run pytest -q` passes."

subtasks:
  - id: ST-001
    title: Move OpenCode backend package and update internal imports
    status: backlog
    verification:
      - uv run pytest -q

  - id: ST-002
    title: Update fitness-rule allowlists/paths to new backend location
    status: backlog
    context: >
      After relocating the OpenCode backend package, update the fitness enforcement
      that protects the agent/opencode dependency boundary (rule_id:
      `architecture.agents-opencode-boundary`) so that it continues to allow imports
      from the new backend location under `engineeringagent/agents/backends/opencode/**`
      and continues to forbid direct OpenCode usage elsewhere.
    verification:
      - uv run pytest -q
      - uv run python harness/fitness-functions/check_agents_opencode_boundary.py

updated_at: "2026-02-18T00:00:00Z"
