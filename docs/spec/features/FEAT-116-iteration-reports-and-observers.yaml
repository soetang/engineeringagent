id: FEAT-116
title: Iteration reports and observers for telemetry and console output
type: chore
expected_commit_subject: 'chore: add iteration reports and observers'
status: backlog
priority: medium
objective: |
  Increase maintainability of the core loop by splitting iteration orchestration
  from side effects.

  The iteration pipeline should produce a single typed report object, and separate
  observers should be responsible for writing telemetry and rendering console
  output.
context: |
  `src/engineeringagent/loop_runtime/iteration.py` currently performs orchestration
  and also directly calls the telemetry sink and console presenter.

  This makes the pipeline harder to test and reason about, and increases coupling
  between phases, output formatting, and persistence.

  Related specs and sequencing:

  - FEAT-115 refactors loop runtime labeling and backend coupling in iteration.
    This feature touches many of the same files, so implement FEAT-116 after FEAT-115
    to reduce merge conflict and rework.
constraints:
- >-
  Precondition: FEAT-115 is done (backend-agnostic loop runtime), because this
  refactor overlaps in `src/engineeringagent/loop_runtime/iteration.py` and should
  not be interleaved with backend-coupling changes.
- >-
  Introduce a typed `IterationReport` (Pydantic model) that captures everything
  needed for writing iteration telemetry and printing the run summary.
- >-
  Refactor `run_feature_iteration_pipeline` to return the report (directly or via
  a new result wrapper type) and remove direct calls to telemetry/printing from
  inside the pipeline.
- |-
  Introduce observers that consume `IterationReport`.
  Minimum set:
  - telemetry observer (writes progress artifacts)
  - console observer (prints summary)
- |-
  Preserve existing `progress/runs.jsonl` schema.
  In this spec, "schema" means:
  - One JSON object is appended per iteration.
  - The object contains (at minimum) the existing field set and names:
    ts, feature_id, subtask_id, result, failed_gate, verification_status,
    verification_failed_command, reviewer_status, reviewer_decision,
    failed_reviewer_id, duration_sec, attempt, commit, next_action, log_path,
    reviewer_feedback_present, reviewer_feedback_summary.
  - Field types and semantics remain unchanged.
  - No field removals/renames are allowed in this spec (additions require a
    separate spec).
- >-
  Fitness-function impact assessment: no new fitness rules required.
- >-
  Recommended sequencing: implement FEAT-116 after FEAT-115.
implementation_notes: |
  Suggested shapes (normative)

  - `IterationReport` should embed the existing `IterationTelemetryInputs` or
    contain equivalent fields.
  - The observer contract can be simple function calls; avoid an over-engineered
    plugin system.

  Testing

  - Keep existing loop tests passing by updating wiring while preserving output
    behavior.
acceptance:
- run_feature_iteration_pipeline no longer writes telemetry or prints output.
- Telemetry and console output still occur via observers in loop orchestration.
- Existing tests for loop output and telemetry continue to pass.
- >-
  Existing progress artifact timing remains: progress artifacts exist before the
  first implement invocation (covered by existing loop tests).
- uv run pytest -q passes.
subtasks:
