id: FEAT-153
title: Remove legacy gates and reviewers contract remnants from codebase
type: spec
expected_commit_subject: 'spec: add FEAT-153 remove legacy gates and reviewers contracts'
status: backlog
priority: high
objective: >
  Fully remove obsolete `harness/gates.yaml` and `harness/reviewers.yaml` contract
  code paths so only `harness/checks.yaml`-based contracts remain in production
  code, tests, and contributor docs.
context: |
  The repository has already migrated to checks-based contracts, but legacy contract
  remnants still exist as dead models/helpers and compatibility text paths.

  Remaining remnants increase confusion, expand maintenance surface, and risk
  accidental reintroduction of unsupported workflows.

  This feature removes legacy gate/reviewer contract artifacts before introducing
  broader schema-discovery surfaces, so the schema inventory reflects only active contracts.
constraints:
  - 'In scope: remove legacy gate/reviewer contract models and helpers that target `harness/gates.yaml` and `harness/reviewers.yaml`.'
  - 'In scope: remove validate/runtime branches that exist only for legacy gate/reviewer contract compatibility.'
  - 'In scope: update tests and docs to stop referencing legacy contract files as supported surfaces.'
  - 'Out of scope: changing active `harness/checks.yaml` planning/execution semantics.'
  - 'Out of scope: changing reviewer decision envelope or fitness contract payload semantics.'
  - Preserve deterministic behavior for active checks/validate command surfaces.
  - Breaking changes are acceptable in this repository when they simplify architecture and remove dead compatibility seams.
implementation_notes: |
  Contract change declaration

  Surface:

  - Legacy contract model/helpers in `engineeringagent.specs`.
  - Legacy compatibility branches in validate/CLI paths.
  - Tests/docs that still encode legacy gate/reviewer contract surfaces.

  Old behavior:

  - `specs.py` still contains legacy gate/reviewer config models and issue helpers.
  - Some runtime/validate code still carries explicit legacy gate/reviewer references,
    even when behavior is effectively no-op.
  - Test coverage still asserts legacy-remnant behavior and paths.

  New behavior:

  - Legacy gate/reviewer contract models/helpers are deleted.
  - Validate/runtime/CLI retain only active checks-based contract behavior.
  - Tests/docs no longer treat legacy files as part of maintained contract code.

  Compatibility policy:

  - Intentional immediate removal of dead legacy contract code.
  - No staged dual-support window for legacy contract types.

  Migration plan:

  - Delete legacy model classes/helpers for gate/reviewer config contracts in specs module.
  - Remove obsolete validator/runtime branches that reference legacy contract files.
  - Update or remove tests tied exclusively to legacy contract APIs/paths.
  - Update docs wording that implies legacy contract support.

  Verification evidence:

  - Checks, reviewer, and validate test suites pass without legacy contract helpers.
  - `engineeringagent validate` passes with deterministic output.
  - No production source references to `harness/gates.yaml` or `harness/reviewers.yaml` remain.

  Fitness-function impact assessment:

  - no fitness-function changes required.
  - Rationale: this feature removes dead compatibility code and clarifies active
    contracts without changing enforced architecture policy intent.
acceptance:
  - Legacy gate/reviewer contract models and related contract-issue helpers are removed from `src/engineeringagent/specs.py`.
  - Validate code no longer contains legacy gate/reviewer compatibility-only branches.
  - Tests that depended on removed legacy contract APIs are updated or deleted.
  - Contributor-facing docs no longer imply legacy gate/reviewer contracts are active surfaces.
  - No migration/deprecation guidance for legacy gate/reviewer contracts is retained in user or contributor docs.
  - Repository docs do not reference `harness/gates.yaml` or `harness/reviewers.yaml` as supported, transitional, or deprecated paths.
  - Active checks-based command behavior remains unchanged for supported workflows.
  - 'Verification command passes: `uv run pytest -q tests/checks tests/reviewers tests/meta/test_validator.py tests/cli/test_cli.py`.'
  - 'Verification command passes: `uv run engineeringagent validate`.'
subtasks:
  - id: ST-001
    title: Remove legacy specs contract models and issue helpers
    status: backlog
    context: >
      Delete gate/reviewer legacy config models and issue-builder helpers that are
      not part of the active checks contract architecture.
    verification:
      - uv run pytest -q tests/checks tests/reviewers

  - id: ST-002
    title: Remove legacy compatibility branches from validate and CLI
    status: backlog
    context: >
      Eliminate validate/CLI branches that exist only for gate/reviewer legacy
      contract handling, preserving deterministic active-surface behavior.
    verification:
      - uv run pytest -q tests/meta/test_validator.py tests/cli/test_cli.py

  - id: ST-003
    title: Align tests with active checks-only contract surfaces
    status: backlog
    context: >
      Update or remove tests that directly import/assert removed legacy contract
      APIs and ensure remaining tests validate active contract ownership.
    verification:
      - uv run pytest -q tests/checks tests/reviewers tests/meta/test_validator.py tests/cli/test_cli.py

  - id: ST-004
    title: Update docs and references to remove legacy contract mention
    status: backlog
    context: >
      Ensure contributor and user docs describe only checks-based harness
      contracts as maintained surfaces.
    verification:
      - uv run engineeringagent validate

  - id: ST-005
    title: Run final regression and validation
    status: backlog
    context: >
      Run targeted suites plus full validation to confirm legacy-remnant removal
      without regressions to active command/check behavior.
    verification:
      - uv run pytest -q tests/checks tests/reviewers tests/meta/test_validator.py tests/cli/test_cli.py
      - uv run engineeringagent validate
updated_at: '2026-02-27T00:00:00Z'
