id: FEAT-112
title: Add backend coupling fitness budgets and generic backend boundary rule
type: test
expected_commit_subject: 'test: add backend coupling fitness budgets'
status: backlog
priority: high
objective: |
  Introduce measurable architecture fitness rules that prevent new agent-backend
  coupling and make backend-decoupling progress visible while we refactor the
  repository to support swapping agent backends.

  This feature intentionally starts with a budgeted approach (baseline allowed
  violations) so we can land the guardrails without blocking follow-up refactors.
context: |
  FEAT-109 established `engineeringagent.agents.run_agent` as the canonical agent
  boundary and FEAT-110 relocated the OpenCode backend implementation under
  `src/engineeringagent/agents/backends/opencode/**`.

  Despite that boundary, several modules outside `agents/**` and `checks/**` still
  contain OpenCode-specific literal strings (e.g. "opencode", ".opencode") and
  OpenCode-named constants. Those references increase coupling and make it harder
  to swap backends. Before refactoring, we want enforcement + measurement.

  Related specs and sequencing:

  - FEAT-113 introduces a backend registry + config-driven default backend selection.
  - FEAT-114 moves backend scaffolds (e.g. .opencode) under backend-owned packages.
  - FEAT-115 removes backend-specific literals from core loop runtime and tightens
    this budget baseline to 0.
  - Implement FEAT-112 first so backend-decoupling progress is measurable from the
    start of the refactor.
constraints:
- >-
  Add a new fitness rule `architecture.agents-backends-boundary` that forbids
  importing `engineeringagent.agents.backends.*` outside `src/engineeringagent/agents/**`.
- >-
  Keep the existing rule `architecture.agents-opencode-boundary` in place; the new
  rule is a backend-generic complement.
- >-
  Add a new fitness rule `architecture.backend-literal-locality-budget` that scans
  `src/engineeringagent/**` excluding `src/engineeringagent/agents/**` and
  `src/engineeringagent/checks/**` for backend-coupling tokens.
- >-
  The literal-locality rule must be budgeted: encode a `BASELINE_VIOLATION_COUNT`
  constant equal to the repo''s current violation count at the time this feature
  is implemented, and fail only when the count exceeds the baseline.
- >-
  Literal-locality tokens must include (minimum): `opencode`, `.opencode`,
  `OpenCode`, `DEFAULT_OPENCODE_AGENT`, `DEFAULT_OPENCODE_AGENT_MODEL`.
- >-
  Both new rules must emit deterministic, sorted violation lists containing
  `path:line:` prefixes.
- >-
  Fitness-function impact assessment: update `harness/fitness-functions/rules.yaml`
  to register the new rules and add focused pytest coverage under `tests/fitness/`.
- >-
  Recommended sequencing: implement FEAT-112 before FEAT-113, FEAT-114, and FEAT-115.
implementation_notes: |
  Budgeting approach

  - The goal is to prevent regressions immediately, without blocking the refactor
    work that will reduce coupling to zero.
  - The initial baseline is expected to be non-zero.
  - Follow-up features will reduce the baseline until it reaches 0, at which
    point the rule becomes a strict locality constraint.

  Scanning and violations

  - The literal-locality rule should scan Python source files only.
  - Violations should be recorded per matching line (not per file) so the list
    is actionable.
  - The rule should avoid false positives from the allowed packages by path
    allowlisting (agents/** and checks/**).

  Baseline refresh workflow (operational)

  - The checker output must make it easy to set and refresh the baseline without
    guesswork.
  - The emitted FitnessRuleResult should include a `details` object containing:
    - `baseline_violation_count` (int)
    - `observed_violation_count` (int)
    - `tokens` (list[str])
  - The summary should include both baseline and observed counts.
  - The rule must never require increasing the baseline. Follow-up tightening
    should only reduce the baseline toward 0.

  Recommended filenames (normative)

  - `harness/fitness-functions/check_agents_backends_boundary.py`
  - `harness/fitness-functions/check_backend_literal_locality_budget.py`
acceptance:
- New fitness rule `architecture.agents-backends-boundary` is registered in
  `harness/fitness-functions/rules.yaml` and passes on this repository.
- New fitness rule `architecture.backend-literal-locality-budget` is registered
  in `harness/fitness-functions/rules.yaml` and passes with a baseline equal to
  the current violation count.
- Both rules produce deterministic violation ordering (sorted, stable prefixes).
- The literal-locality budget rule output includes baseline and observed counts
  in the emitted FitnessRuleResult (summary and/or details).
- uv run pytest -q passes.
