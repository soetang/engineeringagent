id: FEAT-070
title: Make reviewer decisions schema-validated with same-session retries on parse failure
type: bug
expected_commit_subject: "fix: make reviewer output parsing robust with schema and retries"
status: backlog
priority: high
objective: >
  Stop blocking reviewer gates from failing due to non-JSON / malformed reviewer outputs
  by (1) switching reviewer runs to OpenCode's JSON event stream transport and (2) adding
  deterministic, bounded, same-session retries when the returned decision envelope does
  not validate.

context: >
  The readme_process blocking reviewer intermittently fails with reviewer_output_parse_failure
  (e.g. "output is not valid JSON"), which forces full loop retries despite the underlying
  reviewer intent being recoverable.

  Reviewers already require the $responseformat placeholder in their prompt files, but the
  harness currently relies on a prose contract plus best-effort salvage parsing; this is not
  sufficient when the model returns non-JSON.

  We want PydanticAI-like behavior: strict schema validation and automatic reflection retries,
  while remaining compatible with opencode run.

constraints:
  - Reviewer execution must prefer structured transport via `opencode run --format json` and
    must extract the assistant's final decision text output from the JSON event stream rather
    than parsing the formatted default CLI rendering.
  - JSON event extraction must be deterministic.
    - Parse stdout as JSON Lines (one JSON object per line).
    - Treat `sessionID` from any event as the session identifier.
    - Collect candidate decision payloads from events where `type` is `text` and `part.text` is
      a string.
    - Use the LAST collected `part.text` as the decision payload.
    - Do not concatenate multiple `part.text` values.
  - If JSON event parsing yields no sessionID or no text payload, treat this as an output failure
    and fall back to legacy behavior (current stdout/stderr parsing + best-effort JSON extraction).
  - The reviewer decision envelope must be defined as a Pydantic model with extra=forbid (no
    unexpected keys) and must be used for validation.
  - The reviewer prompt $responseformat replacement must include a machine-readable JSON Schema
    (derived from the Pydantic model) in addition to any prose guidance.
  - On decision parse / schema validation failure, the system must retry up to 2 times within
    the same OpenCode session (`opencode run --session <id> --format json`) using a minimal
    corrective follow-up prompt that includes the validation error and repeats the schema
    requirement.
  - Same-session retries must happen inside a single reviewer run and must not consume loop-level
    reviewer retry counters unless all internal retries fail and the final decision is still
    request_changes.
  - As part of verification for this feature, run the readme_process reviewer via the CLI even if
    README.md is unchanged. If it requests README changes, apply them in this feature so the
    readme_process reviewer is exercised end-to-end.
  - >-
    The readme_process reviewer trigger set must reflect onboarding flow changes, not just README.md.
    Expand readme_process trigger.on_change to include docs/references/**/*.md, docs/principles/**/*.md,
    and onboarding-surface code paths (src/engineeringagent/cli.py, src/engineeringagent/init_scaffold.py,
    src/engineeringagent/scaffold_templates/**, src/engineeringagent/validator.py, src/engineeringagent/gates.py,
    src/engineeringagent/loop.py, src/engineeringagent/loop_runtime/**/*.py). Explicitly do NOT trigger
    on AGENTS.md.
  - Do not change semantics for valid reviewer decisions (approve/request_changes/warning); only
    add robustness for malformed outputs.
  - Preserve that reviewers are invoked with `--agent engineeringagent` (never default to build).

implementation_notes: |
  Contract/API delta (explicit):

  - Surface: Reviewer response format contract.
    - Old behavior: prose-only contract injected via $responseformat; manual parsing/validation.
    - New behavior: contract includes explicit JSON Schema for the reviewer decision envelope,
      and parsing validates by the Pydantic model.

  - Surface: Reviewer runner transport + retries.
    - Old behavior: `opencode run --agent engineeringagent` captured as formatted stdout/stderr;
      malformed output yields deterministic request_changes.
    - New behavior: reviewer runner uses `opencode run --format json` to capture JSON events,
      extracts assistant text + sessionID, and performs up to 2 same-session reflection retries
      on parse/schema failure before returning request_changes.

  New $responseformat expansion (exact):

  ---
  Return exactly one strict JSON object and no other text.
  No Markdown. No code fences. No surrounding commentary.

  The JSON object MUST validate against the JSON Schema below.
  The schema is derived from the reviewer decision envelope model and is emitted with sorted
  keys for deterministic prompts.

  JSON Schema:
  {{REVIEWER_DECISION_JSON_SCHEMA}}

  Notes:
  - `decision` must be one of: "approve", "request_changes", "warning".
  - `summary` must be a non-empty string.
  - If present, `required_actions` must be a list of strings.
  - If present, `confidence` must be a number between 0 and 1.

  Example output:
  {"decision":"approve","summary":"Looks good.","required_actions":[]}
  ---

  Compatibility policy:
  - Additive behavior only; existing valid reviewer outputs must continue to parse unchanged.
  - Internal same-session retries apply only to parse/schema failures, not to contentful
    request_changes decisions.

  OpenCode JSON event extraction (exact):
  - Run OpenCode with JSON output enabled.
    - opencode run --format json --agent engineeringagent "<prompt>"
  - Parse stdout as JSON Lines.
  - Capture session id.
    - If any line contains a string `sessionID`, record it.
  - Capture candidate decision payloads.
    - For each line where `type` is `text`, look for `part.text`.
    - If `part.text` is a string, record it as a candidate.
  - Decision payload is the LAST candidate `part.text`.

  Same-session parse/schema retry prompt (exact):
  ---
  Your previous output did not validate as a reviewer decision JSON object.

  Validation error:
  {{VALIDATION_ERROR}}

  Return exactly one strict JSON object and no other text.
  It MUST validate against the JSON Schema provided in the reviewer instructions.
  No Markdown. No code fences. No surrounding commentary.
  ---

  Manual verification command (exact):
  - uv run python -m engineeringagent.cli reviewers run --reviewer readme_process --feature-id FEAT-070 --feature-path docs/spec/features/FEAT-070-reviewer-structured-output-and-retry.yaml

acceptance:
  - Reviewer runs use `opencode run --format json` and extract assistant decision text from the
    JSON event stream (not the default formatted output).
  - Reviewer decision validation is performed by a Pydantic model; invalid/missing keys are
    detected with actionable error messages.
  - If the reviewer emits malformed output, the runner performs up to 2 retries in the same
    session using `--session`, and succeeds when the model corrects the output.
  - If all internal retries fail, the reviewer result remains deterministic request_changes with
    a parser-failure summary prefix and required_actions.
  - If OpenCode JSON event output cannot be parsed for any reason, reviewer execution falls back
    to the legacy stdout/stderr parsing behavior (no hard failure).
  - Reviewers are always invoked with `--agent engineeringagent` regardless of opencode.json
    presence.
  - Specs validate and targeted unit tests cover JSON event extraction, schema validation, and
    same-session retry behavior.
  - >-
    Reviewer planning: readme_process is planned to run at phase feature_done when any of the
    expanded onboarding trigger paths change (and is skipped otherwise).
  - >-
    Manual verification: run the readme_process reviewer via the reviewers CLI and confirm it
    completes without a parse or schema failure when invoked with FEAT-070 as feature context.

subtasks:
  - id: ST-001
    title: Define reviewer decision envelope model and JSON Schema contract injection
    status: backlog
    context: >
      Add a Pydantic model for the reviewer decision envelope and replace the current prose-only
      $responseformat injection with a contract that includes the model's JSON Schema and a
      minimal example object.
    verification:
      - uv run pytest -q tests/test_reviewers_parse.py tests/test_reviewers_runtime.py

  - id: ST-002
    title: Add JSON event-stream extraction for OpenCode reviewer runs
    status: backlog
    context: >
      Teach the reviewer runner to call `opencode run --format json` and extract:
      (a) sessionID and (b) the assistant's final text output from JSON events.
      Ignore non-text events.
    verification:
      - uv run pytest -q tests/test_reviewers_runtime.py

  - id: ST-003
    title: Implement same-session reflection retries for parse/schema failures
    status: backlog
    context: >
      When the extracted assistant text does not validate as a reviewer decision envelope, send
      a corrective follow-up prompt in the same session using
      `opencode run --session <id> --format json`. Retry up to 2 times, then fall back to the
      existing deterministic parser-failure decision.
    verification:
      - uv run pytest -q tests/test_reviewers_runtime.py tests/test_loop_reviewers.py

  - id: ST-004
    title: Update docs to describe schema-validated reviewer outputs and retries
    status: backlog
    context: >
      Update reviewer reference/authoring docs to describe that $responseformat expands to a JSON
      schema-backed contract and that the harness performs bounded retries on schema violations.
    verification:
      - uv run python -m engineeringagent.cli validate

  - id: ST-005
    title: Run readme_process reviewer and apply any required README fixes
    status: backlog
    context: >
      Force-run the readme_process reviewer via the CLI to exercise the new structured-output and
      retry behavior. If the reviewer requests changes to README.md (or linked docs), apply those
      changes as part of this feature so the reviewer gets a realistic end-to-end pass.
    verification:
      - uv run python -m engineeringagent.cli reviewers run --reviewer readme_process --feature-id FEAT-070 --feature-path docs/spec/features/FEAT-070-reviewer-structured-output-and-retry.yaml

  - id: ST-006
    title: Expand readme_process trigger paths to cover onboarding docs and code changes
    status: backlog
    context: >
      Update `harness/reviewers.yaml` so readme_process triggers not only on README.md, but also on
      onboarding-relevant docs (`docs/references/**/*.md`, `docs/principles/**/*.md`) and onboarding
      surface code paths (CLI/init/validator/gates/loop runtime). Do not trigger on AGENTS.md.
    verification:
      - uv run pytest -q tests/test_repo_readme_process_reviewer_activation.py tests/test_loop_reviewers.py

