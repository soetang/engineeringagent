id: FEAT-113
title: Agent backend registry and config-driven default backend selection
type: feature
expected_commit_subject: 'feat: add agent backend registry and config selection'
status: backlog
priority: high
objective: |
  Make agent backend selection a repository configuration decision rather than a
  hard-coded OpenCode default.

  Introduce a small backend registry in `engineeringagent.agents` and extend the
  public agents surface with simple helper functions so higher layers can remain
  backend-agnostic while we add new backends.
context: |
  `engineeringagent.agents.run_agent` exists and OpenCode is currently the only
  backend. The default backend is hard-coded inside `run_agent`, which prevents
  switching backends based on repo configuration.

  This feature adds the minimal registry + config resolution necessary to
  support backend swaps without rewriting callsites.

  Related specs and sequencing:

  - FEAT-112 adds budgeted fitness rules to measure backend coupling during the
    refactor.
  - FEAT-114 (init backend selection + backend-owned scaffolds) depends on the
    backend registry and backend list exported by this feature.
  - FEAT-115 (core loop backend-agnostic) depends on config-driven backend
    selection being available.
constraints:
- >-
  Public API: keep `engineeringagent.agents.run_agent(project_root, prompt, *, output_type=..., backend=..., max_validation_retries=...)`.
- >-
  When `backend` is None, `run_agent` must select a backend based on repo config
  under `engineeringagent.toml[agents] backend` (with `pyproject.toml[tool.engineeringagent.agents] backend`
  fallback), defaulting to a registry-defined backend id when unset.
- |-
  Add public helper functions under `engineeringagent.agents`:
  - `list_backends() -> tuple[str, ...]` (stable, sorted)
  - `resolve_backend_id(project_root: Path) -> str` (deterministic precedence)
- >-
  Config reading must be backend-agnostic outside `agents/**`: add a config
  resolver that reads `[agents] backend = "..."` without embedding any specific
  backend id strings outside `src/engineeringagent/agents/**`.
- >-
  Unknown backend id must fail deterministically with an actionable message that
  includes the configured value and the available backend ids.
- >-
  Fitness-function impact assessment: no new fitness rules required in this
  feature (existing boundary rules remain sufficient).
- >-
  Recommended sequencing: implement FEAT-112 before FEAT-113 so coupling guardrails are active.
implementation_notes: |
  Registry shape

  - Keep registration simple and explicit. A static mapping in `engineeringagent.agents`
    is sufficient.
  - The registry should return the correct backend implementation depending on
    whether structured output is requested (e.g. OpenCode needs format="json").

  Configuration

  - New config key in engineeringagent.toml:
    - `[agents] backend = "<id>"`
  - New config key in pyproject.toml (tool table):
    - `[tool.engineeringagent.agents] backend = "<id>"`
  - Precedence should match existing config conventions:
    engineeringagent.toml -> pyproject.toml[tool.engineeringagent.*] -> default.
acceptance:
- engineeringagent.agents.list_backends() returns a stable, sorted tuple including opencode.
- engineeringagent.agents.resolve_backend_id(project_root) reads [agents] backend from engineeringagent.toml and [tool.engineeringagent.agents] backend from pyproject.toml with deterministic precedence.
- engineeringagent.agents.run_agent(..., backend=None) uses the resolved backend id.
- Unknown configured backend id fails deterministically and lists available backends.
- uv run pytest -q passes.
subtasks:
- id: ST-001
  title: Add backend-id config resolver (backend-agnostic)
  status: backlog
  context: |
    Add a new resolver in `engineeringagent.config` that reads `[agents] backend`.
    The resolver must not embed any concrete backend id string.
  verification:
  - uv run pytest -q tests/config
- id: ST-002
  title: Implement backend registry mapping in engineeringagent.agents
  status: backlog
  context: |
    Introduce a registry that maps backend ids to backend factories, including
    OpenCode.
  verification:
  - uv run python -c "from engineeringagent import agents; print(agents.list_backends())"
  - uv run pytest -q
- id: ST-003
  title: Update run_agent to select default backend via registry + config
  status: backlog
  verification:
  - uv run pytest -q tests/agents
  - uv run pytest -q
- id: ST-004
  title: Add focused tests for config-driven default backend selection
  status: backlog
  context: |
    Add tests that:
    - write an engineeringagent.toml selecting a backend id
    - verify run_agent chooses that backend when backend=None (use a test double
      by monkeypatching the registry mapping)
    - verify unknown backend id produces a deterministic error
  verification:
  - uv run pytest -q tests/agents tests/config
