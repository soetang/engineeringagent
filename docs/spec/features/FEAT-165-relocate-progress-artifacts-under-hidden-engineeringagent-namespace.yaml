id: FEAT-165
title: Relocate runtime progress artifacts under hidden .engineeringagent namespace
type: feature
expected_commit_subject: 'feat: relocate progress artifacts under hidden engineeringagent namespace'
status: backlog
priority: high
objective: Move all runtime progress/state artifacts from `progress/` to
  `.engineeringagent/progress/` with an immediate contract cut, preserve lazy creation
  during non-dry execution, and improve default ignore/documentation guidance so new
  users do not accidentally track runtime artifacts.
context: |
  Current runtime artifacts are written under repo-root `progress/` (runs telemetry,
  feature logs/handoff, reviewer state). This works, but the folder name is generic and
  visually resembles project-owned source artifacts, which can confuse new users about
  whether it should be committed.

  Requested direction from user interview:
  - hard cut to the new hidden path (no legacy compatibility layer)
  - move all progress artifacts (runs, feature logs/handoff, reviewer state)
  - improve onboarding and scaffold behavior so ignore intent is obvious
  - verification bar should include full repo phase checks
constraints:
  - 'Compatibility policy is immediate break: runtime no longer reads or writes repo-root `progress/` artifacts.'
  - 'In scope: relocate all progress surfaces, including reviewer state (`state.json`).'
  - 'In scope: preserve current lazy materialization semantics (create on first non-dry write path, not during dry-run-only loop execution).'
  - 'In scope: scaffold and docs should make ignore behavior explicit; do not add a validator hard-fail policy for tracked artifacts in this feature.'
  - 'Out of scope: automatic migration of existing `progress/` data into the new location.'
implementation_notes: |
  Contract change declaration

  Surface:
  - Progress path helpers and runtime writers in `src/engineeringagent/progress/*`
  - Loop runtime path creation/telemetry in `src/engineeringagent/loop_runtime/*`
  - Progress CLI helpers in `src/engineeringagent/cli.py` / `src/engineeringagent/cli_typer.py`
  - Reviewer state persistence in `src/engineeringagent/checks/reviewers/engine.py`
  - Validation exclusions in `src/engineeringagent/checks/validate/repo_policy_purge_invariant.py`
  - User/scaffold docs that reference progress paths (`README.md`, `docs/references/workflow.md`, and scaffolded workflow template)
  - Tests that currently assert `progress/...` paths

  Old behavior:
  - Runtime artifacts are written under `progress/`:
    - `progress/runs/runs.jsonl`
    - `progress/features/<FEATURE_ID>/run.txt`
    - `progress/features/<FEATURE_ID>/handoff.md`
    - `progress/reviewers/state.json`

  New behavior:
  - Runtime artifacts are written under `.engineeringagent/progress/`:
    - `.engineeringagent/progress/runs/runs.jsonl`
    - `.engineeringagent/progress/features/<FEATURE_ID>/run.txt`
    - `.engineeringagent/progress/features/<FEATURE_ID>/handoff.md`
    - `.engineeringagent/progress/reviewers/state.json`
  - `engineeringagent run` keeps lazy path creation in non-dry flows.
  - Dry-run flow continues to avoid creating runtime progress artifacts.
  - Init/docs include deterministic ignore guidance for `.engineeringagent/progress/`
    (scaffold + documentation only; no new tracked-artifact validator failures).

  Compatibility policy:
  - Immediate break from `progress/` to `.engineeringagent/progress/` is intentional.
  - No dual-read/write and no runtime auto-migration.

  Migration plan:
  - One-time implementation migration in source/tests/docs to new canonical path helpers.
  - Existing repositories may keep legacy `progress/` as historical residue; this feature
    does not move or consume those artifacts.

  Design choices

  1) Canonical path root
  - Keep one canonical constructor in `engineeringagent.progress.paths` and route all
    runtime writers through it.
  - Preserve repo-relative references in terminal output and telemetry payload fields.

  2) Ignore strategy (scaffold + docs only)
  - Add deterministic scaffold behavior that documents or seeds ignore coverage for
    `.engineeringagent/progress/` without adding validation hard failures.
  - Keep behavior idempotent across repeated init runs.

  3) Runtime semantics
  - Preserve lazy creation invariants: first non-dry write path creates directories/files,
    dry-run loop paths do not.
  - Preserve append-only behavior for telemetry/handoff sinks.

  4) Boundary and policy updates
  - Update validation exclusions and any path-literal fitness checks to the new canonical
    path while retaining existing locality/write guardrails.

  Fitness-function impact assessment
  - Rule update required (same rule id, revised path tokens):
    - `architecture.progress-log-path-locality`
    - Script: `harness/fitness-functions/check_progress_log_locality.py`
    - Manifest/docs references: `harness/fitness-functions/rules.yaml`, `docs/fitness-functions/rules.md`
  - Rationale: rule currently encodes legacy `progress/...` path literals; it must enforce
    the new `.engineeringagent/progress/...` contract while preserving locality protections.

acceptance:
  - No runtime write path in the codebase uses repo-root `progress/` as the canonical artifact location.
  - Canonical runtime artifacts resolve under `.engineeringagent/progress/` for runs telemetry,
    feature logs/handoff, and reviewer state.
  - Non-dry loop execution lazily creates required `.engineeringagent/progress/...` artifacts
    before/while writing runtime outputs.
  - Dry-run loop execution does not create `.engineeringagent/progress/runs/runs.jsonl`.
  - Progress CLI commands (`progress handoff-append`, `progress feature-prune`) operate on
    `.engineeringagent/progress/features/<FEATURE_ID>/...`.
  - Init/docs make ignore intent explicit for `.engineeringagent/progress/` without adding
    new validator hard-fail policy for tracked artifacts in this feature.
  - Path references in README/workflow/scaffolded workflow docs are updated to
    `.engineeringagent/progress/...` examples.
  - Progress-path locality fitness rule and related docs remain aligned with canonical
    path construction/write-helper enforcement after migration.
  - The feature spec validates with `uv run engineeringagent validate --schema-only`.
