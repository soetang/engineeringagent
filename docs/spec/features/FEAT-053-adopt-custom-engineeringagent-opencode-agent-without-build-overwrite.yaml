id: FEAT-053
title: Adopt a custom engineeringagent OpenCode default agent without build-config overwrite
type: feature
expected_commit_subject: 'feat: add FEAT-053 engineeringagent opencode default-agent contract without build overwrite'
status: backlog
priority: high
objective: >-
  Use a dedicated `engineeringagent` OpenCode agent for default loop execution and
  permission prechecks with Codex high defaults (`openai/gpt-5.3-codex` plus
  `variant=high`), while preserving existing `build` agent configuration without
  overwrite or fallback.
context: >-
  Current loop behavior hard-codes `build` across OpenCode execution and permission
  remediation messaging. That couples automation policy to one agent identity and creates
  overwrite risk when teams want a repository-local `engineeringagent` agent that keeps
  the same permission posture but does not mutate existing `build` files.

  User-confirmed scope for this feature: make `engineeringagent` the default OpenCode
  agent used by the loop runtime, fail fast when it is not configured (no fallback to
  `build`), require equivalent allow-all permissions from `.opencode/agents/engineeringagent.md`
  as the required policy source, and preserve all existing `build` agent artifacts.
constraints:
- Default OpenCode execution path must invoke `opencode run --agent engineeringagent`
  for selector, implement, and permission-probe surfaces.
- "Default repository agent configuration must set `engineeringagent` to Codex high in `opencode.json` (`model=openai/gpt-5.3-codex`, `variant=high`)."
- Do not fall back to `build` or to implicit `default_agent` behavior when `engineeringagent`
  is missing or not permission-viable.
- Preserve existing bypass behavior for `--skip-implement` and `--implement-command`;
  those modes must continue to skip precheck.
- Keep permission policy semantics equivalent to current allow-all expectations, but
  require remediation guidance to reference `.opencode/agents/engineeringagent.md`
  only for this contract.
- Do not create, edit, rename, or overwrite `.opencode/agents/build.md` or existing
  `build` agent entries during runtime, validation, or tests.
- Preserve run-loop facade signatures, fail-fast ordering, and telemetry contracts except
  for deterministic agent-name text updates.
implementation_notes: >-
  Introduce one canonical default OpenCode agent identifier (`engineeringagent`) that
  is shared by OpenCode client defaults, permission probe execution, and runtime command
  presentation strings. Replace hard-coded `build` literals in runtime command reporting
  and remediation text with deterministic references to the new default agent.

  Keep pre-run precheck behavior introduced in FEAT-026 and execution-contract checks
  from FEAT-044, but rebase them on the new agent identity with fail-fast no-fallback
  behavior. Add explicit regression coverage that proves existing `build` configuration
  can remain present while default-loop execution still requires `engineeringagent`.

  Update operator docs so troubleshooting and setup instructions point to the custom
  agent file and do not imply build-agent overwrite.
acceptance:
- Default OpenCode loop execution and permission probing use `--agent engineeringagent`
  in deterministic command surfaces.
- "The configured `engineeringagent` default uses Codex high in `opencode.json` (`model=openai/gpt-5.3-codex`, `variant=high`)."
- When `engineeringagent` is missing or cannot execute the required probe command, `engineeringagent run`
  exits before feature selection with actionable remediation and no fallback to `build`.
- Precheck bypass behavior remains unchanged for `--skip-implement` and `--implement-command`.
- Remediation messaging for the default-agent permission contract references `.opencode/agents/engineeringagent.md`
  and no longer requires `.opencode/agents/build.md`.
- Regression coverage demonstrates non-overwrite intent where presence of `build` config alone
  does not satisfy default-loop precheck for `engineeringagent`.
- Targeted OpenCode client, loop integration, and permission-probe tests plus spec validation pass.
