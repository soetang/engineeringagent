id: FEAT-130
title: Add per-feature markdown handoff pipeline and progress artifact layout
type: spec
expected_commit_subject: 'spec: add FEAT-130 progress handoff markdown pipeline'
status: backlog
priority: high
objective: >
  Implement a deterministic handoff system where each iteration produces a concise,
  append-only Markdown handoff entry per feature, while preserving machine-readable
  progress telemetry and restructuring progress artifacts under feature-scoped folders.
context: >
  The current loop writes machine telemetry to `progress/runs.jsonl` and per-feature
  logs to `progress/run-feature-<FEATURE_ID>.txt`, but there is no durable,
  human-oriented handoff stream for the next developer iteration.

  We want a structured, inspectable handoff artifact that does not get committed,
  does not live forever by default policy, and is controlled by loop-owned append
  logic instead of ad-hoc agent file edits.

  User direction for this feature:
  - handoff artifact must be Markdown,
  - handoff append should be done by loop logic from a structured final agent block,
  - progress artifacts should be reorganized into dedicated folders,
  - cleanup/retention should be manual (operator-driven), not automatic TTL pruning,
  - path migration can be an immediate break (no dual-support window).
constraints:
  - Handoff artifact format is Markdown at `progress/features/<feature_id>/handoff.md`.
  - Keep machine telemetry format stable and machine-friendly (`runs.jsonl`, `run.txt`), not Markdown.
  - Agent must not write handoff files directly; loop/runtime owns append behavior.
  - Implementation prompt must reference the feature handoff path and instruct the agent to read existing `handoff.md` context before doing new work.
  - Implementation prompt must require a deterministic final handoff block with explicit delimiters and required fields.
  - Missing or malformed handoff block must not fail the iteration; append deterministic fallback content instead.
  - 'Path migration is immediate break: remove reliance on legacy paths (`progress/runs.jsonl`, `progress/run-feature-*.txt`).'
  - Keep progress artifacts out of git via `.gitignore` updates for new directories.
  - Retention is manual only in this feature; do not add automatic TTL cleanup.
  - Centralize all progress path construction in `engineeringagent.progress.paths` and writes in `engineeringagent.progress.logging`/handoff helpers.
  - Keep loop/check behavior deterministic and append-only for handoff entries.
implementation_notes: |
  Contract change declaration (required)

  Surface:
  - Progress artifact path layout in `engineeringagent.progress.paths`.
  - Loop telemetry outputs and log references (`runs.jsonl`, per-feature run logs).
  - Implement prompt output contract for iteration-end handoff block.
  - New handoff append behavior and manual progress CLI helpers.
  - Repo docs and tests that reference progress artifact paths.

  Old behavior:
  - Telemetry JSONL path is `progress/runs.jsonl`.
  - Per-feature machine log path is `progress/run-feature-<FEATURE_ID>.txt`.
  - No canonical Markdown handoff file exists.
  - Agent output has no enforced final handoff block consumed by loop append logic.

  New behavior:
  - Telemetry JSONL path becomes `progress/runs/runs.jsonl`.
  - Per-feature machine log path becomes `progress/features/<feature_id>/run.txt`.
  - Per-feature handoff Markdown path becomes `progress/features/<feature_id>/handoff.md`.
  - Prompt includes the handoff file path so the agent can read prior iteration context before implementation.
  - Implement prompt requires a strict final handoff block (with delimiters + required fields).
  - Loop parses handoff block from implement output and appends one Markdown entry per iteration.
  - If parse fails, loop appends deterministic fallback handoff entry (append-only continuity).
  - Add manual CLI surfaces for operator-driven handoff append/prune workflows.

  Compatibility policy:
  - Immediate break for legacy progress file paths and references.
  - No temporary dual-write or read-shim compatibility layer.

  Migration plan:
  - Refactor path helpers first and migrate all call sites to centralized helpers.
  - Introduce handoff parser/renderer helper and wire into loop telemetry observer flow.
  - Update prompt template contract and prompt regression tests.
  - Add manual progress CLI commands for append/prune operations.
  - Update docs, gitignore, and all affected tests/fixtures for new path layout.
  - Update progress-log locality fitness implementation as needed for new approved literals/helpers.

  Fitness-function impact assessment:
  - Existing rule `architecture.progress-log-path-locality` will need implementation updates
    to recognize the new canonical path literals/helpers and continue enforcing locality.
  - No new fitness policy intent is required; update existing rule/scripts/docs alignment.

  Verification evidence:
  - Loop output/telemetry tests proving new paths and append-only behavior.
  - Prompt tests proving required final handoff block instructions are present.
  - Handoff parser/renderer tests proving valid parse + fallback path determinism.
  - CLI tests for manual `progress` helper commands.
  - Spec validation and iteration-end checks pass.
acceptance:
  - 'Progress artifacts use the new layout: `progress/runs/runs.jsonl`, `progress/features/<feature_id>/run.txt`, `progress/features/<feature_id>/handoff.md`, and `progress/reviewers/state.json`.'
  - Loop/runtime writes one append-only Markdown handoff entry per iteration by parsing a structured final handoff block from implement output.
  - Prompt contract explicitly requires the final handoff block delimiters and required fields.
  - Prompt contract references `progress/features/<feature_id>/handoff.md` and directs the agent to read prior handoff entries when present.
  - Missing/malformed handoff block results in deterministic fallback entry append, without hard-failing the iteration solely for handoff parse issues.
  - Agent direct file writes for handoff are not required by prompt contract; loop remains the handoff writer.
  - '`.gitignore` excludes the new `progress/` directory layout so progress artifacts remain untracked.'
  - Manual CLI helper(s) exist for progress handoff append and feature-scope cleanup (no automatic TTL behavior).
  - Existing progress-path references in docs and test fixtures are migrated to new paths.
  - '`architecture.progress-log-path-locality` implementation remains enforced and aligned with new canonical paths/helpers.'
  - '`uv run pytest -q tests/loop/test_loop_output.py tests/loop/test_loop_ralph_mode.py tests/reviewers/test_reviewers_state.py tests/reviewers/test_reviewers_state_cache.py tests/meta/test_progress_import_paths.py tests/cli/test_cli.py tests/cli/test_cli_checks.py` passes.'
  - '`uv run engineeringagent checks run --checks fitness --phase iteration_end` passes.'
  - '`uv run engineeringagent validate` passes.'
