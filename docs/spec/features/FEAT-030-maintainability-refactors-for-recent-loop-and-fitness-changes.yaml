id: FEAT-030
title: Refactor recent loop and fitness paths for maintainability with quality guardrails
type: feature
expected_commit_subject: 'feat: add FEAT-030 maintainability refactors and quality guardrails'
status: backlog
priority: high
objective: 'Reduce complexity and duplication in code touched by the last four commits
  while preserving behavior, allow minor CLI wording normalization, and add lint/fitness
  guardrails so similar maintainability issues are surfaced earlier.

  '
context: 'User-confirmed scope: maintainability first, analyze the last four commits,
  allow minor CLI output wording tweaks, and explicitly surface where guardrails (fitness
  checks or Ruff linting) could have prevented issue classes.

  The main targets are orchestration and validation paths that became denser across FEAT-026,
  FEAT-027, FEAT-028, and the FEAT-029 planning window: `loop.py`, `cli.py`, `validator.py`,
  and fitness rule/catalog wiring.

  '
constraints:
- Preserve runtime semantics for loop orchestration, feature selection fallback behavior,
  archive handling, and gate execution flow.
- Minor CLI output wording normalization is allowed when it improves consistency or failure
  resilience.
- Keep refactors incremental and test-backed; do not bundle unrelated feature work.
- Do not absorb or pre-complete FEAT-029 scope in this feature; only add guardrails/refactors
  that improve maintainability and reliability for existing behavior.
- Prefer deterministic diagnostics and stable JSON envelope shape for fitness command surfaces.
- Guardrails added in this feature must be actionable and low-noise for this repository.
implementation_notes: 'Refactor in small slices with checkpoint tests after each slice.
  Prioritize extraction of pure helpers and de-duplication before any behavior-sensitive
  cleanup.

  Add Ruff complexity checks aligned with official rule docs and options: C901 (`lint.mccabe.max-complexity`),
  PLR0912 (`lint.pylint.max-branches`), and PLR0915 (`lint.pylint.max-statements`).
  Tune thresholds for repository signal quality, then enforce via existing ruff gate command.

  Add at least one architecture/fitness or validator integrity check where practical to
  prevent regression classes discovered during this refactor cycle.

  '
acceptance:
- _run_feature_iteration in src/engineeringagent/loop.py is decomposed into smaller
  helpers with equivalent behavior under existing loop tests.
- Fitness run JSON output in `src/engineeringagent/cli.py` no longer depends on brittle
  dictionary indexing for remediation metadata and remains deterministic.
- AGENTS docs-map reference parsing in `src/engineeringagent/validator.py` is resilient
  to section number renumbering while preserving deterministic diagnostics.
- Subprocess-boundary allowlist handling in `src/engineeringagent/fitness/builtin_rules.py`
  is simplified to reduce path-string drift risk without weakening policy intent.
- At least one guardrail is added or tightened through fitness/validator checks for issue
  classes identified in this scope.
- Ruff complexity guardrails (C901, PLR0912, PLR0915) are configured with repository-appropriate
  thresholds and enforced in the existing ruff gate path.
- Per-subtask targeted tests pass, and final validation includes `uvx --from . engineeringagent
  gates run --profile loop_fast`.
subtasks:
- id: ST-001
  title: Decompose loop iteration orchestration into maintainable helper phases
  status: backlog
  order: 1
  context: 'Split `_run_feature_iteration` into focused helpers for feature load/recovery,
    implement-stage evaluation, and post-implement reconciliation. Keep behavior stable.

    '
  notes:
  - 'Example target: src/engineeringagent/loop.py::_run_feature_iteration (current anchor from code-simplifier analysis around line ~628).'
  - 'Example extraction: isolate load/recovery decisions (feature missing, loaded from archive, load errors) into one helper that returns structured state instead of repeated branch chains.'
  - 'Example extraction: isolate post-implement reconciliation (re-load feature state, archive mismatch handling) into one helper to reduce duplicate message-building.'
  verification:
  - uv run pytest -q tests/test_loop_ralph_mode.py
  - uv run pytest -q tests/test_loop_opencode_integration.py
- id: ST-002
  title: Harden fitness CLI metadata joins and normalize minor output wording
  status: backlog
  order: 2
  context: 'Remove brittle dictionary lookups in fitness JSON shaping and apply minor wording
