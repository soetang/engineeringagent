id: FEAT-139
title: Unify retry-feedback terminology to feedback across prompt and runtime surfaces
type: spec
expected_commit_subject: 'spec: add FEAT-139 retry-feedback terminology unification'
status: backlog
priority: medium
objective: >-
  Replace legacy "retry feedback" terminology with "feedback" across user-facing,
  backend-facing, and runtime contract surfaces so naming is consistent with checks-owned
  prompt feedback and easier to reason about.
context: >-
  Current naming is mixed: some surfaces use `prompt_feedback` while others use
  "retry feedback", `hook_feedback`, and `retry_feedback` module/symbol naming.
  This increases cognitive load and makes the loop/checks/reviewer boundary less clear.

  Repository policy allows breaking changes when they improve structure and design,
  so this feature can perform a direct rename without compatibility shims.
constraints:
- 'In scope: prompt templates, backend/reviewer prompt prose, runtime/checks field names, helper names, and related docs/tests that encode "retry feedback" terminology.'
- 'Breaking changes are allowed for internal and public contracts in this feature.'
- 'Do not keep dual naming shims (`retry_feedback` + `feedback`) after implementation.'
- 'Use one canonical term: "feedback" for prose and `feedback`-based identifiers in code/contracts.'
- 'Preserve behavioral semantics (what gets forwarded, normalized, and injected), changing naming only unless a test requires minimal structural adjustment.'
- 'Update fitness rules/scripts/docs that encode old naming when necessary to keep the suite coherent.'
implementation_notes: "Contract change declaration\n\nSurface:\n- Prompt template text and prompt renderer feedback injection naming.\n- Loop/checks/reviewer request/result field names currently using `hook_feedback`, `prior_feedback`, and `retry_feedback` terminology.\n- Retry-feedback envelope module/function/type naming where applicable.\n- Tests, docs, and fitness assets that reference the old terminology.\n\nOld behavior:\n- Mixed terminology across runtime and prompts (`prompt_feedback`, `hook_feedback`, `prior_feedback`, `retry_feedback`).\n- User/backend prose includes \"retry feedback\" wording.\n\nNew behavior:\n- Canonical terminology is `feedback` across prompt text, runtime/checks/reviewer contracts, and helper naming.\n- Legacy retry-specific names are removed rather than preserved.\n\nCompatibility policy:\n- Immediate break of old naming contracts is intentional for this feature.\n- No compatibility aliases, deprecation period, or migration shims.\n\nVerification evidence:\n- Loop/checks/reviewer/prompt tests updated to new naming and remain green.\n- Architecture/fitness validation remains green after terminology updates.\n- `uv run engineeringagent validate` passes.\n\nFitness-function impact assessment:\n- Expected impact on fitness rules/docs/scripts that currently encode `retry-feedback` naming.\n- Update affected fitness assets as part of this feature to align to canonical `feedback` terminology while preserving the underlying guard intent."
acceptance:
- User/backend prompt prose uses "feedback" terminology instead of "retry feedback".
- Runtime/checks/reviewer contracts no longer expose legacy `hook_feedback`/`prior_feedback` names.
- Prompt renderer and helpers no longer use `retry_feedback`-named APIs where this feature touches them.
- Retry-envelope semantics remain behaviorally equivalent after rename-focused refactor.
- Docs and fitness assets are updated so naming and architectural guidance are consistent.
- Tests are updated to assert new naming and still enforce previous behavioral guarantees.
- '`uv run pytest -q tests/loop/test_retry_feedback_contracts.py tests/loop/test_loop_contracts.py tests/loop/test_loop_phases_coverage.py tests/loop/test_loop_opencode_integration.py tests/loop/test_loop_ralph_mode.py tests/checks/test_checks_reviewers_runtime.py tests/checks/test_run_checks_contract.py tests/fitness/test_fitness_rules_checks_own_prompt_feedback_rendering.py tests/fitness/test_fitness_rules_retry_feedback_no_truncation.py` passes.'
- '`uv run engineeringagent validate` passes.'
