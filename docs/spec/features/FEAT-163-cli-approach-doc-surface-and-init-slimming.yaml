id: FEAT-163
title: Move guidance docs to CLI approach surface and slim init scaffold
type: feature
expected_commit_subject: 'feat: add cli approach docs surface and slim init scaffold'
status: backlog
priority: high
objective: Replace scaffolded reference/principle markdown handouts with a CLI-native
  progressive-disclosure guidance surface so init becomes lighter, AGENTS integration
  is minimal, and doc-sync fitness complexity is retired.
context: |
  Current init scaffolds user-facing docs from template assets into docs/references/*
  and docs/principles/*. This creates multiple maintenance burdens:
  - docs/template drift risk and byte-sync enforcement complexity
  - AGENTS docs-map rules that hardcode docs/* file references
  - heavier first-run scaffold output and conflict handling

  We already have a successful model for progressive CLI disclosure via schema commands.
  This feature applies the same idea to user guidance by introducing a dedicated
  `engineeringagent approach ...` command surface.

  User intent for this feature:
  - CLI-only immediately for guidance delivery (no staged compatibility period)
  - do not replace AGENTS.md wholesale; append/prepend one deterministic bootstrap line
  - define stable approach topic ids/aliases while preserving migrated doc bodies
  - reduce tests and rules tied to scaffolded-doc synchronization
constraints:
  - 'CLI guidance must be deterministic and non-interactive: plain text/markdown output,
    stable ordering, and no pager/ANSI/interactivity requirements.'
  - 'Guidance must remain available from installed wheels/sdists (not only from git checkout
    docs paths).'
  - 'In scope: breaking changes to init scaffold and AGENTS docs-map behavior are allowed,
    but each contract change must be explicit and covered by tests/docs.'
  - 'In scope: retire fitness rules that only protect scaffolded-doc file sync/linking once
    the file-based scaffold behavior is removed.'
  - 'Out of scope: adding network-dependent doc retrieval; approach content must be local and
    version-pinned to installed package artifacts.'
  - 'Migration-fidelity contract: each new `src/engineeringagent/approach/docs/*.md` file
    must start as an exact copy of its mapped source doc content, with only these allowed
    edits: `approach_id` frontmatter insertion, relocation-driven internal link/path updates,
    and launcher-neutral command normalization to `engineeringagent ...` forms.'
implementation_notes: |
  Contract change declaration

  Surface:
  - CLI command surface in `src/engineeringagent/cli_typer.py` and `src/engineeringagent/cli.py`
  - Init scaffold behavior in `src/engineeringagent/init_scaffold.py` and init orchestration
    in `src/engineeringagent/init_service.py`
  - AGENTS/docs-map validation in `src/engineeringagent/checks/validate/repo_policy_docs_map.py`
  - Fitness rule manifest and docs in `harness/fitness-functions/rules.yaml` and
    `docs/fitness-functions/rules.md`

  Old behavior:
  - init writes user-facing docs from `src/engineeringagent/scaffold_templates/*.md` to
    `docs/references/*` and `docs/principles/*`.
  - AGENTS docs-map validation expects `docs/*` references in the Documentation Layout
    Reference section.
  - Fitness rules enforce scaffold-doc file sync/linking/list classification.

  New behavior:
  - guidance is delivered by CLI via `engineeringagent approach` and topic subdocuments,
    with progressive disclosure and stable topic ids.
  - init no longer scaffolds user guidance markdown docs; it scaffolds operational
    essentials only (harness/spec folders/config/backends plus AGENTS bootstrap patch).
  - AGENTS guidance bootstraps CLI usage with one deterministic line instead of a full
    scaffolded docs list.
  - doc-sync/link/list fitness rules tied to scaffolded user docs are retired.

  Compatibility policy:
  - Immediate break from file-scaffolded user docs to CLI-delivered docs is accepted.
  - CLI should include clear error/help text for unknown approach ids and list available ids.

  Design choices

  1) Command naming and progressive disclosure
  - Decision: use `engineeringagent approach` as the canonical guidance namespace.
  - Required behavior:
    - `engineeringagent approach` prints overview/how-to plus available topic ids.
    - `engineeringagent approach list` prints deterministic topic id + short title list.
    - `engineeringagent approach <topic_id>` prints one subdocument.
    - Optional `--output <path>` writes emitted content to file.
  - Overview-file contract:
    - add a dedicated overview source document in packaged approach docs (for example
      `src/engineeringagent/approach/docs/overview.md`) so the root command has an
      explicit authored narrative rather than only generated command help.
  - Topic-id policy:
    - ids are stable machine-friendly tokens (for example `specifications`, `workflow`,
      `quality-checks`, `principles`,
      `reviewer-authoring`).
    - allow aliases when renaming for clarity, but keep one canonical id in output.
    - exclude contributor-maintainer-only docs from this user-facing surface.

  Topic matrix v1 (canonical ids, aliases, and source mapping)
  - `overview` (aliases: none) -> `src/engineeringagent/approach/docs/overview.md`
  - `principles` (aliases: `harness-engineering-principles`) ->
    `src/engineeringagent/approach/docs/principles.md`
  - `workflow` (aliases: none) -> `src/engineeringagent/approach/docs/workflow.md`
  - `specifications` (aliases: `spec-writing`) ->
    `src/engineeringagent/approach/docs/specifications.md`
  - `quality-checks` (aliases: `quality-check-playbook`) ->
    `src/engineeringagent/approach/docs/quality-checks.md`
  - `reviewer-authoring` (aliases: `reviewer-authoring-guide`) ->
    `src/engineeringagent/approach/docs/reviewer-authoring.md`
  - Excluded from user-facing approach surface:
    - `docs/references/contributor-commands.md`
    - `docs/references/documentation-practices.md`

  2) Subdocument metadata and copy-fidelity contract
  - Decision: add one frontmatter metadata line to each source markdown guidance doc:
    `approach_id: <stable-id>`.
  - Use markdown H1 as display title to avoid duplicated title metadata.
  - Do not perform broad editorial rewrites during migration; only the three allowed edit
    classes from the migration-fidelity constraint are permitted.

  3) Source-of-truth and package delivery
  - Decision: avoid dual-source duplication by storing canonical approach docs directly
    under one package path: `src/engineeringagent/approach/docs/*.md`.
  - Required workflow:
    - no cross-tree copy/sync step between `docs/references` and package docs; approach
      subdocuments live only under `src/engineeringagent/approach/docs/`
    - initial migration into approach docs preserves source prose exactly (except allowed
      migration edits) before any future intentional content revision is proposed in a
      separate spec/feature
    - include approach package docs in build artifacts created by `python -m build`
    - load approach content via `importlib.resources` from the approach package
    - add tests that verify packaged docs are discoverable at runtime and that one
      source-of-truth path is used.

  4) AGENTS integration strategy
  - Decision: do not replace AGENTS.md wholesale during init for this purpose.
  - Init should prepend/append a deterministic AGENTS bootstrap snippet of 1-3 sentences
    pointing to `engineeringagent approach` discovery.
  - Approach subdocuments should use launcher-neutral command forms (for example
    `engineeringagent schema list`) so content stays portable.
  - AGENTS bootstrap snippet should carry launcher preference for the repository (for
    example `uv run engineeringagent ...`, `uvx engineeringagent ...`, or
    `engineeringagent ...`) and clarify that commands in approach docs use base
    `engineeringagent ...` form.
  - Canonical scaffold snippet (exact text):
    - 'In this repository, run EngineeringAgent CLI commands with `uvx engineeringagent ...`.'
    - 'Use `engineeringagent approach` for the overall workflow and guidance map.'
    - 'Use `engineeringagent approach list` to discover topics, then open one (for example `engineeringagent approach specifications`).'
  - Existing AGENTS conflict modes remain for user-authored AGENTS preservation, but
    scaffolded full docs-map section for references/principles is removed.

  5) Init simplification
  - Decision: stop scaffolding user guidance docs and remove related template-discovery
    machinery from init manifest construction.
  - Keep only essential scaffold files for loop operation and specs workflow.
  - Do not scaffold `docs/spec/potential_features.yaml` (or equivalent docs-root path);
    this parking-lot artifact should be opt-in, not baseline init output.

  6) Modularization and clean-architecture boundaries
  - Decision: split approach delivery into small, single-purpose modules so CLI,
    content parsing, and init-scaffold concerns do not leak across boundaries.
  - Target boundaries:
    - CLI boundary (`cli_typer.py`, `cli.py`): argument parsing, command routing,
      exit codes, and terminal output only.
    - Approach domain boundary (`src/engineeringagent/approach/registry.py`,
      `src/engineeringagent/approach/rendering.py`):
      topic discovery, alias resolution, frontmatter validation, and content rendering.
    - Init boundary (`init_service.py`, `init_scaffold.py`): scaffold decisions and file
      writes, including AGENTS bootstrap snippet insertion.
    - Validator boundary (`repo_policy_docs_map.py` or successor): validate AGENTS
      bootstrap contract, not markdown content parsing rules.
  - Guardrails:
    - no markdown/frontmatter parsing logic inside CLI handlers.
    - no runtime dependence on init template discovery for approach topic delivery.
    - no hidden coupling where AGENTS snippet text is duplicated across multiple modules;
      keep one canonical producer.
    - add focused tests per boundary so refactors remain low-risk.

  Files expected to be edited
  - `src/engineeringagent/cli_typer.py` (new `approach` command routing)
  - `src/engineeringagent/cli.py` (handlers for approach list/show/output)
  - `harness/fitness-functions/check_markdown_locality_reference_coverage.py` (allow and
    validate approach markdown locality under `src/engineeringagent/approach/docs`)
  - `src/engineeringagent/init_scaffold.py` (remove scaffolded user-doc generation)
  - `src/engineeringagent/init_service.py` (align AGENTS patch behavior and init output)
  - `src/engineeringagent/checks/validate/repo_policy_docs_map.py` (replace file-path docs-map
    assumptions with CLI-bootstrap invariant or retire this validator)
  - `src/engineeringagent/scaffold_templates/AGENTS.md` (replace docs layout references with
    `engineeringagent approach` bootstrap text)
  - `pyproject.toml` (only if needed to guarantee package data inclusion)
  - selected agent-facing guidance references (for example scaffolded AGENTS content) to
    point to approach commands
  - `harness/fitness-functions/rules.yaml` and `docs/fitness-functions/rules.md`

  Files expected to be added
  - `src/engineeringagent/approach/__init__.py` (stable approach domain exports)
  - `src/engineeringagent/approach/registry.py` (topic discovery + metadata parsing)
  - `src/engineeringagent/approach/rendering.py` (shared formatting/render helpers)
  - `src/engineeringagent/approach/docs/*.md` (canonical packaged guidance subdocuments)
  - `src/engineeringagent/approach/docs/overview.md` (root approach narrative source)
  - CLI tests for approach surface (new test module under `tests/cli/`)
  - unit tests for approach registry/metadata parsing (new test module)

  Files expected to be deleted or retired
  - `harness/fitness-functions/check_scaffold_docs_exact_sync.py`
  - `harness/fitness-functions/check_scaffold_template_agents_doc_links.py`
  - `harness/fitness-functions/check_docs_allowlist_policy.py`
  - `tests/fitness/test_fitness_rules_scaffold_docs_exact_sync.py`
  - `tests/fitness/test_fitness_rules_scaffold_template_agents_doc_links.py`
  - `tests/fitness/test_fitness_rules_docs_allowlist_policy.py`
  - scaffold template markdown assets used only for user-doc scaffolding in
    `src/engineeringagent/scaffold_templates/` (reference/principle files), once package
    approach docs fully replace their purpose
  - migrated user-facing source docs in `docs/references/` and `docs/principles/` that are
    replaced by canonical `src/engineeringagent/approach/docs/*.md` content

  Test updates expected (edit, not delete)
  - `tests/cli/test_init_scaffold.py`
  - `tests/cli/test_init_command.py`
  - `tests/cli/test_cli.py`
  - `tests/cli/test_cli_typer_parity_helpers.py`
  - `tests/meta/test_validator.py`
  - `tests/meta/test_test_layout_fitness_topic.py`
  - `tests/fitness/test_fitness_rules_markdown_locality.py`
  - `tests/fitness/test_fitness_rules_markdown_references.py`
  - `tests/fitness/test_fitness_rules_catalog_docs_sync.py` (catalog updates after rule retirement)

  Migration and rollout sequence
  1. Add approach registry, frontmatter parsing, and packaged docs resources.
  2. Add CLI approach commands and tests.
  3. Update scaffold AGENTS bootstrap line and init output behavior.
  4. Remove user-doc scaffold generation from init and related tests.
  5. Retire doc-sync/link/allowlist fitness rules/scripts/tests.
  6. Update validators and docs references.
  7. Regenerate fitness catalog docs and run full checks.

  Fitness-function impact assessment
  - Rules to retire from `harness/fitness-functions/rules.yaml`:
    - `architecture.scaffold-docs-exact-sync`
    - `architecture.scaffold-template-agents-doc-links`
    - `architecture.docs-allowlist-policy`
  - Rationale:
    - these rules exist primarily to protect file-scaffolded user docs and AGENTS file-link
      discoverability contracts that no longer apply under CLI-delivered guidance.
  - Guardrails replacing retired rules:
    - approach registry tests for deterministic discovery and topic metadata validity
    - CLI tests for list/show/output behavior and error messages
    - packaging tests confirming docs resources are shipped and readable after build/install

acceptance:
  - '`engineeringagent approach` renders an authored overview file and points users/agents
    to subtopics without requiring local scaffolded reference/principle docs files.'
  - '`engineeringagent approach list` and `engineeringagent approach <topic_id>` work in
    both source checkout and installed package environments.'
  - The v1 topic matrix (canonical ids + aliases + source mappings) is implemented and
    validated by deterministic tests.
  - Every approach subdocument includes frontmatter `approach_id` and a single H1 title,
    and duplicate/missing ids fail deterministic validation tests.
  - Migrated approach subdocuments are exact copies of mapped source docs, except for
    allowed migration edits (frontmatter insertion, relocation link/path updates, and
    launcher-neutral command normalization).
  - User-facing approach docs do not require schema-export walkthroughs; schema surfaces
    remain available for contributor/internal workflows without being a required user
    guidance element.
  - Approach docs use launcher-neutral command examples (`engineeringagent ...`), and
    scaffolded AGENTS bootstrap text declares repository launcher preference separately.
  - 'Scaffolded AGENTS bootstrap snippet matches this exact text: "In this repository, run EngineeringAgent CLI commands with `uvx engineeringagent ...`." "Use `engineeringagent approach` for the overall workflow and guidance map." "Use `engineeringagent approach list` to discover topics, then open one (for example `engineeringagent approach specifications`)."'
  - 'Approach architecture keeps module boundaries explicit: CLI handlers delegate topic resolution/rendering to approach modules, and markdown parsing is not duplicated in CLI.'
  - Init no longer writes `docs/references/*` or `docs/principles/*` user guidance files,
    while still scaffolding required harness/spec operational files.
  - Init does not create `docs/spec/potential_features.yaml` (or corresponding configured
    docs-root path).
  - Init AGENTS behavior uses a deterministic 1-3 sentence bootstrap snippet for approach
    discovery instead of full docs-map replacement content.
  - Retired doc-sync/link/allowlist fitness rules are removed from manifest/scripts/tests,
    and catalog docs are regenerated to match the new rule set.
  - Agent-facing guidance references are updated to use the approach command surface.
  - The feature spec validates with `uv run engineeringagent validate --schema-only`.
