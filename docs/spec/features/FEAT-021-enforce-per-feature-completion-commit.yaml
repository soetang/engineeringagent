id: FEAT-021
title: Enforce per-feature completion commit before loop advances
type: bug
expected_commit_subject: 'fix: add FEAT-021 per-feature completion commit enforcement'
status: backlog
priority: high
objective: >
  Ensure `engineeringagent run` advances to the next feature only when the
  selected feature is completed with a successful completion commit in that
  same iteration.
context: >
  The current loop can treat a selected feature as completed when the active
  feature file disappears and an archived counterpart exists with `status: done`.
  In that path, the loop may proceed without creating a completion commit for
  the selected feature in the current iteration, which violates the expected
  per-feature commit boundary.

  This can produce misleading terminal output about committed completion even
  when archive movement or done-state transitions are still uncommitted in the
  working tree.
constraints:
  - Scope is limited to run-loop behavior and loop-focused tests; do not add validator or schema changes.
  - A selected feature must not be marked completed unless `_commit_feature_completion` succeeds in the same iteration.
  - 'If selected feature path is missing and only an archived `status: done` spec is found without a same-iteration completion commit, fail deterministically with actionable guidance.'
  - Keep existing successful flow unchanged when archive + completion commit both succeed.
  - Preserve existing `--allow-dirty` semantics except it cannot bypass per-feature completion commit enforcement.
  - Keep run telemetry deterministic (`result`, `failed_gate`, and `next_action` semantics remain stable).
implementation_notes: >
  Introduce an explicit same-iteration completion signal in loop execution and
  use it as the required condition for `completed=True` and
  `next_action=select_next_feature` transitions. Treat archive-fallback loading
  as informational unless the completion signal was set by a successful
  completion commit for the selected feature.

  Update failure messaging in this path to direct operators toward corrective
  action (for example, restoring the active feature spec or committing the
  intended completion changes). Ensure loop-level terminal messages do not
  overstate commit guarantees when no completion commit occurred for the latest
  selected feature.
acceptance:
  - Loop iteration for a selected feature cannot complete successfully without a same-iteration successful completion commit.
  - 'When selected feature path is missing and only archived `status: done` exists before completion commit, iteration fails with `failed_gate=feature_missing` and actionable detail.'
  - In the normal completion path, feature archive + completion commit still succeed and transition to `next_action=select_next_feature`.
  - Loop terminal messaging does not claim committed completion when the selected feature did not produce a completion commit in that run.
  - Targeted loop regression tests and schema validation pass.
subtasks:
  - id: ST-001
    title: Add same-iteration completion commit signal to loop flow
    status: backlog
    order: 1
    context: >
      Track completion-commit success explicitly and gate completion transitions
      on that signal instead of archive-fallback status alone.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_completion_commit_includes_archive_move
  - id: ST-002
    title: Tighten archive-fallback completion handling
    status: backlog
    order: 2
    context: >
      Fail cleanly when selected feature is archived/done without same-iteration
      completion commit, with stable failed-gate and actionable feedback.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_selected_feature_moved_to_features_done_does_not_crash
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_missing_selected_feature_without_archive_fails_cleanly
  - id: ST-003
    title: Align loop terminal messaging with commit guarantees
    status: backlog
    order: 3
    context: >
      Ensure summary/no-work messaging does not imply completion commits occurred
      when they did not.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_all_selected_feature_moved_to_features_done_continues
  - id: ST-004
    title: Add regression tests for archived-done without completion commit
    status: backlog
    order: 4
    context: >
      Add focused tests that assert deterministic failure behavior and no
      `select_next_feature` transition for the archived-done/no-commit path.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_archived_done_without_completion_commit_fails
  - id: ST-005
    title: Run targeted regression and schema validation
    status: backlog
    order: 5
    context: >
      Verify loop behavior and spec validity after implementing the fix.
    verification:
      - uv run pytest -q tests/test_loop_ralph_mode.py
      - uvx --from . engineeringagent validate --schema-only
updated_at: '2026-02-13T00:00:00Z'
