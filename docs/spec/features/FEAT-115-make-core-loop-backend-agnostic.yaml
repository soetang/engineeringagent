id: FEAT-115
title: Make core loop modules backend-agnostic via engineeringagent.agents helpers
type: chore
expected_commit_subject: 'chore: make core loop backend-agnostic'
status: backlog
priority: high
objective: |
  Remove backend-specific literals and defaults from core orchestration modules so
  the loop can switch agent backends without touching `loop.py` or `loop_runtime/**`.

  The only modules allowed to mention backend-specific details are:
  - `src/engineeringagent/agents/**`
  - `src/engineeringagent/checks/**`
context: |
  After FEAT-113/114, the repository has a backend registry and init writes the
  configured backend id. However, core loop runtime still hard-codes OpenCode
  step labels, gate ids, and permission/protocol detection.

  This feature pushes those details behind small helper functions in
  `engineeringagent.agents`.

  Related specs and sequencing:

  - FEAT-112 introduces the backend-literal coupling budget that this feature
    tightens to 0.
  - FEAT-113 introduces the backend registry and config-driven backend selection.
  - FEAT-114 removes backend-specific literals from init/CLI/scaffold paths.
  - FEAT-116 refactors the iteration pipeline into reports + observers; it overlaps
    with this feature in `src/engineeringagent/loop_runtime/iteration.py`.
constraints:
- >-
  Precondition: FEAT-112, FEAT-113, and FEAT-114 are done.
- |-
  Replace OpenCode-branded step labels in:
  - `src/engineeringagent/loop_runtime/selection.py`
  - `src/engineeringagent/loop_runtime/implement.py`
  - `src/engineeringagent/loop_runtime/iteration.py`
  with backend-agnostic labels derived from `engineeringagent.agents`.
- >-
  Remove the OpenCode-specific permission-precheck seam from `src/engineeringagent/loop.py`:
  wire `LoopRun.services.run_permission_precheck` to a backend-selected helper in
  `engineeringagent.agents`.
- >-
  Remove `DEFAULT_OPENCODE_AGENT` leakage outside agents: eliminate
  `src/engineeringagent/agents_defaults.py` usage from core modules.
- >-
  Gate ids / failure labels may change, but must remain deterministic and tested.
- >-
  Tighten the coupling budget: update `architecture.backend-literal-locality-budget`
  baseline to 0 and ensure it passes.
implementation_notes: |
  Recommended helper API additions under `engineeringagent.agents` (normative)

  - `preflight(project_root: Path) -> bool`
    - backend-selected pre-run checks (OpenCode uses permission probe; others no-op)
  - `describe_action(project_root: Path, *, action: str, structured: bool) -> str`
    - returns a stable, backend-derived label for console/telemetry
  - `classify_backend_exception(exc: Exception) -> tuple[str, str]`
    - maps backend failures into deterministic (failed_gate, message)

  These helpers may be thin wrappers around backend implementations, but core loop
  code must not import backend modules or parse backend-specific output.
acceptance:
- No backend-specific literal strings exist in `src/engineeringagent/**` outside
  `src/engineeringagent/agents/**` and `src/engineeringagent/checks/**`.
- The fitness rule `architecture.backend-literal-locality-budget` passes with
  baseline set to 0.
- Loop selection, implement, and iteration telemetry still produce deterministic
  output and timings (updated expectations acceptable).
- uv run pytest -q passes.
