id: FEAT-099
title: Complete checks migration by relocating fitness + retry_feedback and deleting legacy packages
type: feature
expected_commit_subject: "feat: delete legacy checks packages after migration"
status: backlog
priority: high
objective: >
  Complete the refactor started in FEAT-097/FEAT-098 by relocating remaining
  check-related subsystems (fitness framework and retry-feedback) under
  `src/engineeringagent/checks/**`, enforcing that legacy modules/packages are
  unused by production code, and deleting the legacy paths.

context: >
  Depends on FEAT-097 and FEAT-098.

  Ordering / dependencies (explicit):
  - FEAT-097 must land before FEAT-098.
  - FEAT-098 must land before FEAT-099.

  Spec package (explicit):
  - This larger refactor is intentionally split across multiple specs:
    FEAT-097, FEAT-098, FEAT-099.
  - You are here: FEAT-099.

  FEAT-097 introduces the canonical `engineeringagent.checks` package and stable
  contracts. FEAT-098 migrates the CLI and loop runtime to use
  `engineeringagent.checks.run_checks(...)`. This feature finishes the migration by
  moving remaining fitness and retry-feedback internals behind `checks/**`, updating
  harness allowlist policy to permit the new supported surface, and deleting the
  legacy modules/packages once unused by production code.

constraints:
  - "After this feature, production code MUST NOT import any of: `engineeringagent.harness_checks_runtime`, `engineeringagent.validator`, `engineeringagent.reviewers`, `engineeringagent.fitness`, `engineeringagent.retry_feedback`."
  - "After this feature, the following paths MUST NOT exist in the repository:"
  - "`src/engineeringagent/harness_checks_runtime.py`"
  - "`src/engineeringagent/validator.py`"
  - "`src/engineeringagent/reviewers.py`"
  - "`src/engineeringagent/fitness/`"
  - "`src/engineeringagent/retry_feedback/`"
  - "All relocated functionality must live under `src/engineeringagent/checks/**`."
  - "Keep OpenCode/subagent execution implementation under `src/engineeringagent/opencode/**` (checks orchestrates via injected callable only)."
  - "Determinism invariants must be preserved (ordering, stable output, stable JSON envelopes, stable retry-feedback envelopes)."
  - "Update harness fitness-function import allowlist rules to allow the new supported surface under `engineeringagent.checks` once `engineeringagent.fitness` is removed."
  - "Add a harness fitness function that enforces the supported checks import surface: production code outside `src/engineeringagent/checks/**` must not import `engineeringagent.checks.*` submodules and may only import allowed top-level names from `engineeringagent.checks`."

implementation_notes: |
  Contract/API delta (explicit):

  - Surface: Python module locations for fitness and retry-feedback internals.
    - Old behavior: production code imports fitness framework from `engineeringagent.fitness.*`
      and retry-feedback contracts/builders from `engineeringagent.retry_feedback.*`.
    - New behavior: production code imports these capabilities from `engineeringagent.checks.*`
      only. `engineeringagent.fitness.*` and `engineeringagent.retry_feedback.*` no longer exist.

  - Surface: supported harness import surface for fitness-rule scripts.
    - Old behavior: harness fitness-rule scripts import from `engineeringagent.fitness.*`
      (and an allowlist fitness rule enforces that surface).
    - New behavior: harness fitness-rule scripts import the supported helpers from
      `engineeringagent.checks.*` (at minimum `engineeringagent.checks.emit_fitness_result`),
      and the harness import-allowlist rule is updated accordingly.

  Compatibility policy:
  - Breaking internal refactor: legacy Python import paths are removed.
  - End users should be unaffected as long as they use CLI entrypoints; the supported
    surface is `engineeringagent.checks` and the CLI.

  Fitness-function impact assessment:
  - Requires updates:
    - Update `harness/fitness-functions/check_harness_src_import_allowlist.py` allowlist to
      permit `engineeringagent.checks.*` (or a narrower prefix such as `engineeringagent.checks.fitness.*`).
    - Update harness fitness-rule scripts (if any) that import `engineeringagent.fitness.envelope`
      to import from `engineeringagent.checks` instead.
    - Add a new harness fitness function enforcing that `src/engineeringagent/**` modules outside
      `src/engineeringagent/checks/**` only import the supported top-level checks API.

acceptance:
  - "All functionality previously provided by `src/engineeringagent/fitness/**` is available under `src/engineeringagent/checks/**` and used by production code via `engineeringagent.checks.*` imports."
  - "All functionality previously provided by `src/engineeringagent/retry_feedback/**` is available under `src/engineeringagent/checks/**` and used by production code via `engineeringagent.checks.*` imports."
  - "Production code under `src/engineeringagent/**` contains zero imports from any of:"
  - "`engineeringagent.harness_checks_runtime`"
  - "`engineeringagent.validator`"
  - "`engineeringagent.reviewers`"
  - "`engineeringagent.fitness`"
  - "`engineeringagent.retry_feedback`"
  - "The legacy paths do not exist after the change:"
  - "`src/engineeringagent/harness_checks_runtime.py`"
  - "`src/engineeringagent/validator.py`"
  - "`src/engineeringagent/reviewers.py`"
  - "`src/engineeringagent/fitness/`"
  - "`src/engineeringagent/retry_feedback/`"
  - "Harness import allowlist fitness rule(s) allow the new checks surface and still prevent imports from orchestration internals."
  - "A new harness fitness function enforces the checks import surface: modules outside `src/engineeringagent/checks/**` do not import `engineeringagent.checks.*` submodules and only import the allowed top-level names from `engineeringagent.checks`."
  - "`uv run python -m engineeringagent.cli validate`, `uv run python -m engineeringagent.cli fitness run --format json`, and `uv run pytest -q` pass."

subtasks:
  - id: ST-001
    title: Relocate fitness framework under checks and update callsites
    status: backlog
    context: >
      Move fitness contracts/registry/runner/catalog/adapters/envelope behind
      `src/engineeringagent/checks/fitness/**` (or equivalent) and update all production
      imports to use `engineeringagent.checks.*`. Ensure deterministic behavior and
      preserve the FitnessRuleResult contract.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q

  - id: ST-002
    title: Relocate retry-feedback under checks and update loop_runtime imports
    status: backlog
    context: >
      Move retry-feedback contracts/builders behind `src/engineeringagent/checks/**`
      and update loop runtime to import from `engineeringagent.checks.*`. Preserve
      serialization shape and determinism of retry-feedback payloads.
    verification:
      - uv run pytest -q

  - id: ST-003
    title: Update harness fitness import allowlist and migrate harness imports
    status: backlog
    context: >
      Update the harness allowlist fitness rule to permit the new checks surface and
      keep the allowlist narrow. Migrate harness fitness scripts to import the supported
      helper from `engineeringagent.checks` as needed.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q

  - id: ST-004
    title: Enforce unused-by-production invariant (imports)
    status: backlog
    context: >
      Add an automated check (pytest) that scans `src/engineeringagent/**` imports and
      fails on forbidden legacy imports:
      - engineeringagent.harness_checks_runtime
      - engineeringagent.validator
      - engineeringagent.reviewers
      - engineeringagent.fitness
      - engineeringagent.retry_feedback
    verification:
      - uv run pytest -q
      - uv run python -m engineeringagent.cli validate

  - id: ST-005
    title: Add checks import surface enforcement fitness rule
    status: backlog
    context: >
      Add a harness fitness function that scans Python imports under `src/engineeringagent/**`.
      Enforce that any module outside `src/engineeringagent/checks/**`:
      - does not import `engineeringagent.checks.<submodule>` (no submodule imports)
      - only imports allowed names from `engineeringagent.checks` (e.g. `run_checks`,
        `emit_fitness_result`, `emit_result_envelope`)
      Register the rule in `harness/fitness-functions/rules.yaml`.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q

  - id: ST-006
    title: Delete legacy harness_checks_runtime module
    status: backlog
    context: >
      Remove `src/engineeringagent/harness_checks_runtime.py` after verifying it has
      zero production callsites and all functionality is available under
      `src/engineeringagent/checks/**`.
    verification:
      - uv run pytest -q

  - id: ST-007
    title: Delete legacy validator module
    status: backlog
    context: >
      Remove `src/engineeringagent/validator.py` after verifying it has zero
      production callsites and validation execution is available under
      `src/engineeringagent/checks/**`.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q

  - id: ST-008
    title: Delete legacy reviewers module
    status: backlog
    context: >
      Remove `src/engineeringagent/reviewers.py` after verifying it has zero
      production callsites and reviewer execution is available under
      `src/engineeringagent/checks/**`.
    verification:
      - uv run pytest -q

  - id: ST-009
    title: Delete legacy fitness package
    status: backlog
    context: >
      Remove the `src/engineeringagent/fitness/` package after relocating its
      functionality under checks and updating all production and harness imports.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q

  - id: ST-010
    title: Delete legacy retry_feedback package
    status: backlog
    context: >
      Remove the `src/engineeringagent/retry_feedback/` package after relocating its
      functionality under checks and updating loop runtime imports.
    verification:
      - uv run pytest -q
