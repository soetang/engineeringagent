id: FEAT-183
title: Remove flat-spec compatibility and legacy archived spec files
type: spec
expected_commit_subject: "spec: add FEAT-183 flat spec compatibility removal"
planning_tier: researched
status: in_progress
priority: high
objective: >
  Finish the FEAT-181 migration by removing all remaining compatibility logic,
  prompts, docs, tests, and archived-file remnants that still support the old flat
  feature-spec layout, leaving bundled feature packages with canonical `spec.yaml`
  entrypoints as the only supported spec format.
context: >
  FEAT-181 established bundled feature packages as the target workflow, but the
  repository still carries legacy support for flat active spec files, reviewer and
  documentation fallback language, tests that account for old wrappers, and archived
  flat spec files under `docs/spec/features_done/*.yaml`. That compatibility layer now
  adds complexity without long-term value. We want one clean spec model: active and
  done features live as bundled directories, old flat files are deleted rather than
  preserved as shims, and surrounding repository guidance and verification surfaces stop
  teaching or tolerating the retired layout.
constraints:
  - "In scope: remove remaining support for flat active spec files under `docs/spec/features/*.yaml`, including discovery, validation, prompt/reviewer fallback language, test fixtures, smoke fixtures, and documentation that still references them."
  - "In scope: delete legacy flat archived spec files under `docs/spec/features_done/*.yaml` as part of the cleanup rather than preserving them as compatibility artifacts. Git history is the only required retention path for those old files."
  - "Bundled feature packages with `docs/spec/features/<feature-dir>/spec.yaml` and `docs/spec/features_done/<feature-dir>/spec.yaml` become the only supported feature-spec entrypoints after this change."
  - "Compatibility policy is an immediate breaking cutover; do not keep warning-only wrappers, dual-path loaders, or temporary fallback behavior for old flat spec paths."
  - "The migration must preserve one canonical bundled-spec contract rather than introducing another transitional format."
  - "Delete compatibility code and stale legacy assets instead of moving old behavior behind new helper names."
  - "Update reviewer prompts, contributor guidance, and user-facing docs so they stop mentioning legacy wrappers or flat active-spec paths as valid inputs."
  - "Approach documents surfaced by `engineeringagent approach` must live under `src/engineeringagent/approach/docs/`; do not keep `research-session` or `plan-session` sourced from feature-owned support files under `docs/spec/features_done/**/supporting/`."
  - "Broader verification is required: cover schema validation plus targeted repository checks, prompt/reviewer surfaces, and any smoke or fitness fixtures that still assume flat spec files."
  - "If historical archived specs need replacement to keep repository invariants valid, migrate them into bundled done-feature directories rather than retaining flat files."
  - "Breaking cleanup is preferred over preserving compatibility with repositories or workflows that still depend on the retired flat active-spec format."
implementation_notes: >
  Contract change declaration.

  Surface: feature-spec discovery and validation, archive/done-spec storage layout,
  reviewer fallback behavior, contributor approach guidance, smoke/fitness fixtures,
  and repository docs that currently mention flat feature-spec files.

  Old behavior: the repository still tolerates or documents legacy flat spec paths in
  some places, including references to `docs/spec/features/*.yaml`, reviewer language
  about legacy wrappers, archived done specs stored as flat YAML files under
  `docs/spec/features_done/*.yaml`, and `engineeringagent approach` session topics
  loaded from FEAT-owned supporting files under
  `docs/spec/features_done/FEAT-181-bundled-feature-planning-workflow/supporting/`
  instead of packaged docs under `src/engineeringagent/approach/docs/`.

  New behavior: bundled feature-package directories with canonical `spec.yaml`
  entrypoints are the only supported format for both active and done features. Flat
  active spec support is removed completely, flat archived spec files are deleted or
  migrated into bundled done-feature directories, all repository guidance/tests align
  with the bundled-only contract, and CLI approach topics such as `research-session`
  and `plan-session` are packaged under `src/engineeringagent/approach/docs/` rather
  than loaded from archived feature support files.

  Compatibility policy: immediate break. No compatibility wrappers, fallback loaders,
  or warning-only transitional behavior remain for flat spec files.

  Migration scope: remove flat-spec compatibility branches and references across src,
  harness, docs, reviewer prompts, tests, smoke fixtures, approach-doc registration,
  and the archived spec tree; delete or migrate legacy flat archived specs so the
  repository no longer stores the old format in active use, and move retained approach
  guidance into `src/engineeringagent/approach/docs/`.

  Verification evidence: schema validation, targeted tests for bundled-only discovery
  and reviewer/prompt behavior, and broader quality checks should prove that flat spec
  paths are no longer accepted or referenced in supported workflow surfaces.

  Fitness-function impact assessment: update existing long-lived fitness/smoke policy
  surfaces that still encode legacy flat-spec assumptions so they enforce the bundled
  contract only. No temporary rule exception is desired; the durable boundary should be
  the bundled `spec.yaml` package model introduced by FEAT-181.
acceptance:
  - "Active feature discovery, validation, and loop-facing spec selection no longer support `docs/spec/features/*.yaml` entrypoints or legacy wrapper semantics."
  - "Repository guidance, reviewer prompts, and user-facing documentation no longer describe flat active spec files or legacy wrappers as valid feature-spec inputs."
  - "`engineeringagent approach` session topics are sourced from packaged documents under `src/engineeringagent/approach/docs/` rather than FEAT-owned support files under `docs/spec/features_done/**/supporting/`."
  - "Archived flat spec files under `docs/spec/features_done/*.yaml` are removed from the repository, with any still-needed archived features represented as bundled done-feature directories instead."
  - "Tests, smoke fixtures, and harness/fitness surfaces that previously referenced flat spec paths are updated to the bundled-only `.../spec.yaml` contract."
  - "The resulting implementation keeps one canonical bundled-spec model for both active and done features rather than preserving dual-path compatibility logic."
  - "Regression coverage proves that bundled packages remain valid while flat active spec paths are rejected or absent from supported repository workflows."
  - "`uv run engineeringagent validate --schema-only` passes after the bundled-only cleanup."
  - "Targeted pytest coverage for spec discovery/validation, reviewer prompt guidance, and any smoke or fitness fixtures touched by this migration passes after the compatibility removal."
artifacts:
  plan: plan.md
  research: research.md
