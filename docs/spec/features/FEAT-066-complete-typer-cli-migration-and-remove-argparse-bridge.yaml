id: FEAT-066
title: Complete Typer-native CLI migration and remove argparse bridge from cli.py
type: feature
expected_commit_subject: 'feat: add FEAT-066 complete typer-native cli migration and remove argparse bridge'
status: backlog
priority: medium
objective: Remove legacy argparse parser/forwarding code from the main CLI module and
  complete a Typer-native command implementation while preserving existing
  engineeringagent command, flag, and exit-code behavior.
context: >-
  FEAT-057 introduced Typer at the entrypoint level but intentionally retained an
  argparse bridge (`build_parser` plus legacy forwarding) to de-risk migration.
  Current `src/engineeringagent/cli.py` still mixes Typer command registration,
  argparse namespaces, and parser forwarding helpers, which keeps the file large and
  harder to evolve.

  This feature is a follow-up contract clarification: user-facing CLI behavior remains
  stable, but argparse-based internals in `cli.py` are removed immediately.

  Relevant docs for this migration:
  - https://typer.tiangolo.com/
  - docs/spec/features_done/FEAT-057-migrate-cli-parser-to-typer-with-command-parity.yaml
  - src/engineeringagent/cli.py
constraints:
- Remove argparse parser construction and forwarding helpers from `src/engineeringagent/cli.py`.
- '`src/engineeringagent/cli.py` must not import argparse after migration.'
- Preserve top-level CLI surface and subcommand tree (`validate`, `gates`, `reviewers`, `run`, `fitness`, `init`).
- Preserve existing option names, value semantics, and command exit-code behavior for automation compatibility.
- Preserve global `--project-root` and `--version` behavior.
- Minor help/error text formatting drift from Typer/Click defaults is acceptable when command and option contracts are unchanged.
- Remove `build_parser()` and argparse-namespace command handler contract without temporary dual-support fallback.
- Refactor tests that currently depend on argparse parser objects to validate Typer-native behavior instead.
- Keep script and module invocation paths working (`engineeringagent ...` and `python -m engineeringagent.cli ...`).
- Do not expand scope to unrelated runtime policy changes (gates/reviewers/fitness semantics remain unchanged).
- Verification must include CLI-focused regression coverage, full test suite, and repository validation.
implementation_notes: >-
  Contract/API deltas for this feature are explicit:

  - Surface: CLI implementation internals in `src/engineeringagent/cli.py`.
    - Old behavior: Typer root app delegates some commands through legacy argparse
      parser construction and argparse namespace handlers.
    - New behavior: Commands are implemented and dispatched directly through Typer-native
      command definitions and typed parameters, without argparse parser forwarding.

  - Surface: Internal helper contract (`build_parser` and argparse-dependent helpers).
    - Old behavior: Internal tests and helper flows can parse commands through
      `build_parser()` and legacy forwarding.
    - New behavior: `build_parser()` and legacy forwarding helpers are removed; tests
      and internal call paths use Typer-driven invocation patterns.

  - Surface: User-facing CLI contract.
    - Old behavior: Existing commands/options/exit codes are available.
    - New behavior: Same command/option/exit-code contract remains available, with
      potential minor help formatting differences due to Typer rendering.

  Compatibility policy:
  - User-facing CLI compatibility is preserved for command names, flags, and return
    codes.
  - Internal argparse helper compatibility is intentionally broken immediately (no
    transition window).

  Migration scope:
  - One-time migration of `src/engineeringagent/cli.py` to remove argparse bridge code.
  - One-time refactor of argparse-centric CLI tests to Typer-native assertions.

  Verification evidence should include command-routing parity tests, option/argument
  contract assertions, and end-to-end CLI invocation checks via module entrypoint.
acceptance:
- '`src/engineeringagent/cli.py` contains no argparse import, parser-construction tree, or legacy argparse forwarding helpers.'
- '`build_parser()` no longer exists as an active CLI contract in `engineeringagent.cli`.'
- All top-level commands and nested subcommands remain invocable with the same option spellings and argument intent as before.
- Command success/failure exit-code behavior remains stable for validate/gates/reviewers/run/fitness/init workflows.
- Global `--project-root` and `--version` behavior remains available through Typer root configuration.
- CLI-focused tests are updated to assert Typer-native behavior rather than argparse parser internals.
- '`uv run pytest -q` and `uv run python -m engineeringagent.cli validate` pass after migration.'
