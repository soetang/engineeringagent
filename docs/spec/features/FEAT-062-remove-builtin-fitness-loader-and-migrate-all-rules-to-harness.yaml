id: FEAT-062
title: Remove builtin fitness loader and migrate all active fitness rules to harness command adapters
type: feature
expected_commit_subject: 'feat: add FEAT-062 remove builtin fitness loading and complete harness rule migration'
status: backlog
priority: low
objective: Eliminate builtin fitness-rule execution from application code and run all active fitness policies through harness-managed command adapters declared in harness manifest files.
context: >-
  Current fitness architecture mixes in-app builtin rule functions with harness command
  rules. Repository direction is to fully externalize policy checks to harness assets
  because many rules are repository-development-specific and should not be treated as
  permanently embedded product behavior. This feature is intentionally breaking and
  removes builtin reference support immediately.
constraints:
- Keep this migration lower priority than reviewer activation and sandbox work.
- "Immediate removal policy: do not keep compatibility fallback for builtin manifest references."
- Preserve current rule IDs where practical so policy lineage remains traceable.
- Migrate active builtin rules to harness command scripts under harness/fitness-functions.
- Remove builtin rule registry plumbing and builtin manifest-entry contract support from runtime code.
- Manifest interface contract after migration allows command rule entries only (rule_id/name/summary/rationale/remediation/scope/severity/side_effect_free/adapter=command/command[]/optional timeout_seconds and env).
- Keep fitness result envelope contract unchanged (`contract_version`, `rule_id`, `status`, `severity`, `summary`, `violations`).
- Keep deterministic ordering and duplicate-rule detection behavior for command-backed catalogs.
- Keep gate profile behavior unchanged once migrated rules are declared in harness manifest.
- Relocate rule-specific test ownership toward harness-centric test paths under tests while preserving pytest discovery.
implementation_notes: >-
  Port each currently active builtin rule implementation into dedicated harness command
  scripts, register all of them as command entries in harness/fitness-functions/rules.yaml,
  and delete builtin entry resolution paths from fitness contracts/registry.

  API/interface changes are explicit and intentional:
  - Remove builtin manifest reference shape (`rules: [{builtin: ...}]`) from accepted manifest contract.
  - Remove builtin resolver interfaces from registry composition paths.
  - Keep `engineeringagent.cli fitness list|run|catalog` command-line interfaces and output contracts stable.

  Update tests to stop importing builtin rule modules directly. Prefer command-adapter
  and manifest-driven fitness tests, with harness-oriented test module organization.
acceptance:
- harness/fitness-functions/rules.yaml declares all active architecture and locality rules as command adapters.
- Fitness catalog build no longer supports or parses builtin manifest references.
- Fitness manifest validation fails with actionable error text when a builtin reference entry is present.
- src/engineeringagent/fitness/builtin_rules.py is removed or no longer used by active runtime paths.
- Running fitness and gate profiles preserves current blocking behavior with migrated harness rules.
- Regression tests validate migrated rule behavior parity and deterministic output ordering.
- Harness-oriented fitness tests are reorganized under tests with clear harness ownership structure.
subtasks:
- id: ST-001
  title: Port builtin rule implementations to harness command scripts
  status: backlog
  order: 1
  context: Create one command script per migrated rule with deterministic envelope output.
  verification:
  - uv run pytest -q tests/test_fitness_adapters.py
- id: ST-002
  title: Replace builtin manifest references with command entries
  status: backlog
  order: 2
  context: Update harness fitness manifest so active rule catalog is fully command-backed.
  verification:
  - uv run pytest -q tests/test_fitness_manifest_contract.py tests/test_fitness_registry.py
- id: ST-003
  title: Remove builtin loader and manifest contract support from runtime
  status: backlog
  order: 3
  context: Delete BuiltinRuleManifestReference usage and builtin resolution branches from fitness registry/contracts.
  verification:
  - uv run pytest -q tests/test_fitness_manifest.py tests/test_fitness_rule_id_collisions.py
- id: ST-004
  title: Migrate and reorganize rule-specific tests to harness-oriented structure
  status: backlog
  order: 4
  context: Move builtin-function tests to harness-command behavior tests while maintaining deterministic assertions.
  verification:
  - uv run pytest -q tests/test_fitness_rules_directionality.py tests/test_fitness_rules_loop_subprocess_boundary.py tests/test_fitness_rules_prompt_locality.py tests/test_fitness_rules_scaffold_template_locality.py
- id: ST-005
  title: Run full validation and loop-fast gates after migration
  status: backlog
  order: 5
  context: Confirm migrated harness-only fitness stack blocks or passes exactly through existing gate profiles.
  verification:
  - uv run python -m engineeringagent.cli validate
  - uv run python -m engineeringagent.cli gates run --profile loop_fast
