id: FEAT-180
title: Enforce hermetic fitness-rule tests and isolate repo compliance to harness runs
type: spec
expected_commit_subject: 'spec: add FEAT-180 hermetic fitness rule test guardrail'
status: backlog
priority: high
objective: Prevent fitness-rule tests from scanning the live repository checkout by enforcing synthetic temp-repo fixtures for fitness pytest coverage, while reserving real-repo compliance evaluation for harness and gate execution paths only.
context: "`tests/fitness/**` already had a repository policy in FEAT-111: pytest should verify checker behavior on synthetic fixtures, while real repository compliance should be enforced by the harness and gate profiles. FEAT-176 regressed that boundary by adding many statement-budget tests that invoke the checker with `repo_root` as the scan target. That caused implementation pressure to refactor large parts of the live codebase merely to satisfy rule tests, producing broad repository churn unrelated to the intended feature scope.\n\nWe need an explicit guardrail that blocks this pattern from recurring anywhere in `tests/fitness/**`, not just in one rule module. The rule must allow use of `repo_root` only for locating checker scripts or static resources, while requiring the scanned project root to be a synthetic temp fixture. Real-repo enforcement remains valid, but only through explicit harness/integration tests with a narrow allowlist and clear naming."
constraints:
- 'In scope: add a new fitness guardrail that covers all tests under `tests/fitness/**`, with a narrow explicit allowlist for harness integration tests that intentionally exercise real-repo execution paths.'
- 'In scope: treat direct checker subprocess tests and adapter-driven fitness tests as hermetic by default; the scanned `project_root`/`cwd` must be a synthetic temp fixture rather than `repo_root`.'
- 'In scope: allow `repo_root` to resolve checker scripts, static test resources, or manifest fixtures only; it must not be used as the project root passed to checker execution.'
- 'In scope: make the rule target the coupling pattern rather than banning path names; synthetic fixtures may still create artificial `src/engineeringagent/**`, `tests/**`, or `harness/**` paths inside temp repos.'
- 'In scope: require explicit integration-test affordances for any permitted real-repo fitness execution path, such as a dedicated allowlisted module or clearly named integration marker.'
- 'In scope: update or replace tests that currently assert live-repo compliance from pytest so they instead validate deterministic behavior on synthetic fixtures.'
- 'Out of scope: changing the production behavior of existing fitness checker scripts beyond what is needed to support hermetic testing and explicit harness integration coverage.'
- 'Out of scope: salvaging or preserving the current FEAT-176 implementation diff; restart should assume those uncommitted implementation changes are discarded wholesale.'
implementation_notes: 'Contract change declaration


  Surface:

  - Fitness pytest authoring policy under `tests/fitness/**`.

  - Harness-level ownership of real-repo compliance enforcement.

  - New repository fitness rule guarding against non-hermetic fitness tests.


  Old behavior:

  - Some fitness tests execute checker scripts with `repo_root` as the scan target.

  - Pytest can accidentally become a repository-compliance ratchet instead of a behavior-contract test suite.

  - Features can expand into broad live-repo refactors merely to satisfy rule tests.


  New behavior:

  - Fitness tests are hermetic by default: checker executions scan only synthetic temp repos.

  - `repo_root` is allowed only for locating scripts/resources, not as the scanned project root.

  - Real-repo compliance checks occur only through harness/gate execution or a small explicit integration-test allowlist.

  - A dedicated guardrail fitness rule fails if `tests/fitness/**` reintroduces the forbidden live-repo scan pattern.


  Compatibility policy:

  - No end-user runtime behavior change.

  - Repository test-authoring policy becomes stricter by design.


  Migration plan:

  1) Add the new guardrail rule and document the allowed hermetic-testing pattern.

  2) Refactor violating fitness tests to use synthetic temp repos only.

  3) Keep any legitimate real-repo cases in explicit allowlisted integration coverage.

  4) After the guardrail lands, discard the current FEAT-176 implementation diff and restart FEAT-176 under the new rule.


  Verification evidence:

  - The new guardrail rule fails on a representative forbidden pattern and passes on the approved hermetic pattern.

  - `tests/fitness/**` no longer runs checkers with `repo_root` as the scan target except in explicit allowlisted integration cases.


  Fitness-function impact assessment:


  - fitness-function changes required.

  - Add a new guardrail rule covering hermetic fitness test execution.

  - Update any affected catalog/docs entry for the new rule.

  - Update violating test modules under `tests/fitness/**` to match the approved pattern.

  Recommended enforcement shape:

  - detect helper patterns where a checker is executed with `cwd=repo_root`, `project_root=repo_root`, or equivalent live-repo scan targets;

  - permit `repo_root` when used only to build checker script paths under `harness/fitness-functions/`;

  - support a small explicit allowlist for named integration modules so real-repo harness coverage stays intentional and visible.

  '
acceptance:
- A new fitness guardrail fails when tests under `tests/fitness/**` execute a checker against `repo_root` or otherwise use the live repository as the scan target, unless the test module is explicitly allowlisted as an integration case.
- The guardrail does not ban synthetic fixture paths such as artificial `src/engineeringagent/**`; it specifically bans scanning the real checkout.
- '`repo_root` usage limited to locating checker scripts/resources remains allowed.'
- Existing violating fitness tests are rewritten or removed so pytest covers checker behavior on temp fixtures rather than repository-wide compliance.
- Real-repo compliance responsibility is clearly reserved for harness/gate execution paths and any small explicit integration-test allowlist.
- Fitness rule docs/catalog text is updated consistently for the new guardrail.
- 'Verification command passes: `uv run pytest -q tests/fitness`.'
- 'Verification command passes: `uv run engineeringagent checks catalog --format markdown --output docs/fitness-functions/rules.md`.'
- 'Verification command passes: `uv run engineeringagent validate --schema-only`.'
