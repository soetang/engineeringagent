  title: Define repository policy and explicit allowlist shape for hermetic fitness tests
  status: backlog
  context: Translate the FEAT-111 intent into a precise enforceable repository rule covering all of `tests/fitness/**`, with a small explicit integration allowlist for intentional real-repo harness coverage. Define the allowlist as policy data under `harness/fitness-functions/policies/` rather than embedded conditionals.
  verification:
  - uv run pytest -q tests/fitness
- id: ST-002
  title: Add the guardrail fitness checker and rule registration
  status: backlog
  context: Implement a new AST-based guardrail rule that scans `tests/fitness/**/*.py`, detects forbidden `repo_root` scan-target patterns (`_run_checker(repo_root, ...)`, `execute_rule_definition(..., project_root=repo_root)`, `subprocess.run(..., cwd=repo_root, ...)`, and equivalent wrappers), consults the explicit allowlist policy file, and registers the rule in the fitness manifest. Keep any policy parsing/model code harness-local instead of adding FEAT-180-specific modules under `src/engineeringagent/checks/**`.
  verification:
  - uv run pytest -q tests/fitness
  - uv run engineeringagent checks catalog --format markdown --output docs/fitness-functions/rules.md
- id: ST-003
  title: Refactor violating fitness tests to synthetic temp-repo fixtures
  status: backlog
  context: Remove or rewrite tests that currently use `repo_root` as the scan target so they instead verify deterministic checker behavior on minimal artificial fixtures. Add focused FEAT-180 rule tests that cover one forbidden helper pattern, one forbidden subprocess/adapters pattern, one allowed script-path lookup case, and one allowlisted integration case.
  verification:
  - uv run pytest -q tests/fitness
- id: ST-004
  title: Restart FEAT-176 after guardrail adoption
  status: backlog
  context: Once the guardrail is active, discard the current uncommitted FEAT-176 implementation diff and recreate FEAT-176 work from a clean state under the new hermetic-testing policy.
  verification:
  - uv run engineeringagent validate --schema-only
