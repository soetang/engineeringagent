id: FEAT-017
title: Establish human-first README and agent-only documentation architecture
status: backlog
priority: high
objective: >
  Rework repository documentation so humans get a fast, approachable onboarding
  path in README, while agents follow a strict text-only docs architecture with
  explicit audience boundaries and linkage from AGENTS.md, centered on the
  primary user outcome: define an application spec and run the loop.
context: >
  Current documentation mixes operator-facing and agent-facing concerns in ways
  that increase onboarding friction and make authoring expectations implicit.
  We need a clear split: README as a human-readable quick start with curated
  context links, and agent-only guidance that defines documentation principles,
  ownership, and style boundaries for machine-authored docs.

  The human entrypoint should be purpose-driven: communicate the end-to-end
  flow (`application spec -> run loop`) first, then point to harness and
  validation details as supporting mechanics.
constraints:
  - "README.md is rewritten end-to-end as a human-readable quick start with core ideas and clear next links."
  - "README.md foregrounds the primary workflow (`application spec -> run loop`) before low-level harness details."
  - "README.md explicitly states that users should use agents/specs to implement their harnesses."
  - "README.md must include the external reference https://openai.com/index/harness-engineering/ plus a small curated external link set."
  - "README.md may use expressive human-friendly presentation (for example emoji or ASCII art) when it improves readability."
  - "AGENTS.md must link docs/references/docs-architecture-llms.md and state when to use human-readable docs versus agent-only docs."
  - "docs/references/docs-architecture-llms.md is agent-focused and text-first (no decorative formatting requirements)."
  - "README.md must link to deeper CLI details rather than carrying every operational detail inline."
  - "Add markdown formatting enforcement with mdformat via repository gate wiring."
implementation_notes: >
  Introduce a documentation architecture that distinguishes audience, purpose,
  and allowed style for key docs. Keep README concise and navigational: quick
  start, core mental model, and a clear first-run path focused on shipping via
  `spec -> run loop`. Link harness/validation mechanics as follow-on depth
  rather than first-read blocking detail. Add/adjust gate configuration and
  development dependencies so
  `mdformat --check` runs as part of quality validation.
acceptance:
  - "README.md is fully rewritten as a human-first quick-start document and includes the OpenAI harness engineering reference link."
  - "README.md explicitly presents the purpose-driven path (`application spec -> run loop`) as the main onboarding flow."
  - "README.md explicitly instructs users to use agents/specs to implement harnesses."
  - "README.md links to a deeper CLI details document for operational command coverage."
  - "AGENTS.md links docs/references/docs-architecture-llms.md and explicitly documents human-vs-agent documentation intent."
  - "docs/references/docs-architecture-llms.md defines documentation principles, audience split, and authoring expectations for agent-focused docs."
  - "Repository quality checks include `mdformat --check` through gate/profile wiring."
  - "Documentation updates preserve existing spec validation behavior (`engineeringagent validate` still succeeds)."
subtasks:
  - id: ST-001
    title: Define agent-focused docs architecture reference
    status: backlog
    order: 1
    context: >
      Create docs/references/docs-architecture-llms.md describing doc audience
      boundaries, principles for human-readable docs, principles for agent-only
      docs, and maintenance expectations.
    verification:
      - "python3 -c \"from pathlib import Path; p=Path('docs/references/docs-architecture-llms.md'); t=p.read_text(encoding='utf-8'); lower=t.lower(); assert 'human' in lower and 'agent' in lower and 'principle' in lower; print('ok')\""
  - id: ST-002
    title: Link AGENTS to docs architecture and audience policy
    status: backlog
    order: 2
    context: >
      Update AGENTS.md so agents discover docs/references/docs-architecture-llms.md
      and follow explicit guidance on choosing human-facing versus agent-facing
      documentation artifacts.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('AGENTS.md').read_text(encoding='utf-8'); lower=t.lower(); assert 'docs/references/docs-architecture-llms.md' in t; assert 'human' in lower and 'agent' in lower; print('ok')\""
  - id: ST-003
    title: Rewrite README as purpose-driven human-first quick start
    status: backlog
    order: 3
    context: >
      Replace README structure with concise onboarding: what this project is,
      the primary `application spec -> run loop` workflow, quick start
      commands, core ideas, and where to go next, including explicit guidance
      to use agents/specs to implement harnesses.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8').lower(); assert 'quickstart' in t or 'quick start' in t; assert 'spec' in t and 'run' in t and 'loop' in t; assert 'agent' in t and 'harness' in t; print('ok')\""
  - id: ST-004
    title: Add curated links for context and deeper CLI usage
    status: backlog
    order: 4
    context: >
      Ensure README includes the required OpenAI reference plus a small curated
      list of external links, and links to in-repo CLI detail documentation.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8'); assert 'https://openai.com/index/harness-engineering/' in t; assert 'docs/references/uv-llms.md' in t or 'cli' in t.lower(); print('ok')\""
  - id: ST-005
    title: Add mdformat check to project quality gates
    status: backlog
    order: 5
    context: >
      Add mdformat to development dependencies and wire an mdformat check gate
      into harness gate configuration so markdown formatting is validated.
    verification:
      - "uv run mdformat --check README.md AGENTS.md docs/references/docs-architecture-llms.md"
      - "python3 -c \"from pathlib import Path; import yaml; data=yaml.safe_load(Path('harness/gates.yaml').read_text(encoding='utf-8')); assert 'mdformat_validate' in data.get('gates', {}); assert 'mdformat_validate' in data.get('profiles', {}).get('precommit', []); print('ok')\""
  - id: ST-006
    title: Run full validation for docs and spec integrity
    status: backlog
    order: 6
    context: >
      Confirm spec validation and configured gate checks pass after documentation
      architecture and markdown quality changes are introduced.
    verification:
      - "uvx --from . engineeringagent validate"
      - "uvx --from . engineeringagent gates run --profile precommit"
