id: FEAT-096
title: Move configuration from env vars to engineeringagent.toml and forbid env-key reads
type: feature
expected_commit_subject: "feat: move config from env vars into engineeringagent.toml"
status: backlog
priority: high
objective: >
  Stop using environment variables as configuration inputs for engineeringagent.
  All repo/operator configuration must be loaded from TOML (engineeringagent.toml,
  with pyproject fallback), and the codebase must enforce a policy that forbids
  reading env keys for behavior decisions.

context: >
  We started relying on environment variables (ENGINEERINGAGENT_*) to toggle behavior
  (harness fitness rule enablement and integration-test gating). This is hard to
  discover, hard to document, and encourages ad-hoc configuration surfaces.
  We already have a TOML config mechanism (engineeringagent.toml with pyproject fallback)
  for docs-root. We should expand that contract, migrate existing env-var toggles,
  and add a fitness function that prevents env-key reads from reappearing.

constraints:
  - "Policy: code under src/, harness/, and tests/ must not read env keys (no os.getenv, no os.environ.get, no os.environ['X'], no 'X' in os.environ)."
  - "Exception: os.environ.copy() is allowed only for subprocess environment pass-through (inherit + mutate the copied dict is ok)."
  - "Runtime ANSI decision: must be TTY-only (do not consult NO_COLOR, TERM, or any env key)."
  - "Configuration precedence is deterministic: engineeringagent.toml -> pyproject.toml[tool.engineeringagent] -> defaults."
  - "TOML naming: use tables by area; kebab-case keys."
  - "Do not require or introduce a gitignored local overlay config file (no engineeringagent.local.toml)."
  - "Avoid rewriting historical archived specs under docs/spec/features_done/; enforcement should not force editing past done-specs."

implementation_notes: |
  Configuration contract (new keys):

  - engineeringagent.toml (repo root) uses tables:
    - [harness.fitness]
      - opencode-real-smoke = true|false
    - [harness.pytest]
      - opencode-integration = true|false

  - pyproject.toml fallback uses nested tool tables:
    - [tool.engineeringagent.harness.fitness]
      - opencode-real-smoke = true|false
    - [tool.engineeringagent.harness.pytest]
      - opencode-integration = true|false

  Defaults (when unset in both files):
  - opencode-real-smoke: false (smoke rule returns PASS "skipped (disabled in engineeringagent.toml)")
  - opencode-integration: false (integration tests skip deterministically)

  Behavior deltas (explicit):
  - Real OpenCode smoke fitness rule:
    - Old: enabled only via env var ENGINEERINGAGENT_REAL_OPENCODE_SMOKE=1; otherwise PASS skipped.
    - New: enabled only via TOML key; env var no longer supported.
    - When enabled and opencode is missing, treat as FAIL with remediation to install/configure opencode or disable the TOML key.
  - OpenCode integration tests:
    - Old: enabled only via env var ENGINEERINGAGENT_OPENCODE_INTEGRATION=1; otherwise pytest.skip.
    - New: enabled only via TOML key; env var no longer supported.
  - Run-loop ANSI styling:
    - Old: TTY gating + env-key reads (NO_COLOR, TERM).
    - New: TTY gating only.

  Fitness-function impact assessment:
  - fitness-function changes required:
    - add a new harness fitness rule that fails on forbidden env-key reads across src/, harness/, tests/
    - update existing smoke rule docs/metadata to remove env var remediation text and document TOML instead

acceptance:
  - "No Python code under src/, harness/, or tests/ reads environment keys (no os.getenv, no os.environ.get, no os.environ['X'], no `'X' in os.environ`)."
  - "os.environ.copy() remains allowed for subprocess env pass-through, and fitness/adapters continue to inherit environment for command adapter subprocesses."
  - "Real OpenCode smoke rule enablement uses TOML only; ENGINEERINGAGENT_REAL_OPENCODE_SMOKE is not referenced in code/docs (except historical done-spec archives)."
  - "OpenCode integration test gating uses TOML only; ENGINEERINGAGENT_OPENCODE_INTEGRATION is not referenced in code/docs (except historical done-spec archives)."
  - "Run-loop ANSI behavior is TTY-only; NO_COLOR and TERM env keys are not read."
  - "A new fitness function exists and is registered in harness/fitness-functions/rules.yaml to enforce the env-key read policy."
  - "This repository adds engineeringagent.toml enabling the opt-in smoke rule and integration tests."

subtasks:
  - id: ST-001
    title: Define TOML config keys, precedence, and typed accessors
    status: backlog
    context: >
      Extend configuration loading beyond docs-root to include harness/runtime toggles.
      Keep deterministic precedence: engineeringagent.toml then pyproject.toml[tool.engineeringagent],
      then defaults. Provide a small accessor surface that both harness fitness scripts
      and tests can use without duplicating TOML parsing logic.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q

  - id: ST-002
    title: Migrate real OpenCode smoke rule enablement from env var to TOML
    status: backlog
    context: >
      Update harness/fitness-functions/check_real_opencode_hello_world_smoke.py to read the
      TOML key [harness.fitness].opencode-real-smoke (with pyproject fallback)
      instead of ENGINEERINGAGENT_REAL_OPENCODE_SMOKE.

      Contract:
      - Disabled: PASS with deterministic "skipped (disabled in engineeringagent.toml)" summary.
      - Enabled + opencode missing: FAIL with remediation to install/configure opencode or disable the key.
      - Enabled + opencode present: run end-to-end as before.

      Update associated docs/metadata to remove env-var instructions:
      - harness/fitness-functions/rules.yaml remediation text
      - docs/fitness-functions/README.md
      - docs/fitness-functions/rules.md (regen catalog)
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run python -m engineeringagent.cli fitness catalog --format markdown --output docs/fitness-functions/rules.md
      - uv run pytest -q

  - id: ST-003
    title: Migrate opencode integration-test gating from env var to TOML
    status: backlog
    context: >
      Update tests/loop/test_loop_opencode_integration.py to consult the TOML key
      [harness.pytest].opencode-integration (with pyproject fallback) instead of
      ENGINEERINGAGENT_OPENCODE_INTEGRATION. Keep deterministic skip messaging that points
      to engineeringagent.toml (not env vars).
    verification:
      - uv run pytest -q

  - id: ST-004
    title: Remove env-key reads from run-loop ANSI/TTY presentation
    status: backlog
    context: >
      Update src/engineeringagent/loop_runtime/presentation.py so tty_supports_ansi() uses
      only stdout TTY detection. Remove env parameter usage and remove reads of NO_COLOR
      and TERM=dumb (and any other env-key reads).
    verification:
      - uv run pytest -q

  - id: ST-005
    title: Add a fitness function enforcing "no env-key reads" policy
    status: backlog
    context: >
      Add a new harness fitness rule that fails if any Python code under src/, harness/,
      or tests/ performs env-key reads/branching.

      Enforcement should:
      - FAIL on direct env reads: os.getenv(...), os.environ.get(...), os.environ['X'],
        'X' in os.environ, and common aliases (from os import environ; environ.get(...), etc.).
      - Allow os.environ.copy() usage (and downstream subprocess env pass-through).
      - Be explicit about scope roots (src/, harness/, tests/) and exclude docs/spec/features_done/
        from any doc-text enforcement to avoid rewriting historical done-specs.

      Register the rule in harness/fitness-functions/rules.yaml and regenerate the catalog.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run python -m engineeringagent.cli fitness catalog --format markdown --output docs/fitness-functions/rules.md
      - uv run pytest -q

  - id: ST-006
    title: Add engineeringagent.toml enabling opt-in smoke + integration in this repo
    status: backlog
    context: >
      Add engineeringagent.toml at repo root with:
      - [harness.fitness] opencode-real-smoke = true
      - [harness.pytest] opencode-integration = true

      This makes the opt-in behaviors active for this repository by default, while other
      repos remain opt-in via TOML.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q

updated_at: null
