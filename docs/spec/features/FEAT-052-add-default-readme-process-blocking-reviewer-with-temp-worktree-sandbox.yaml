id: FEAT-052
title: Add default readme_process blocking reviewer with temp worktree sandbox execution
type: feature
expected_commit_subject: 'feat: add FEAT-052 default readme_process reviewer configuration and execution behavior'
status: backlog
priority: high
objective: Add a default `readme_process` reviewer that runs only when `README.md` changes, executes in an isolated temp worktree snapshot, and blocks completion until approved or policy exhaustion.
context: >-
  FEAT-050 defines the reviewer contract and FEAT-051 integrates reviewer runtime.
  This feature provides a concrete built-in reviewer scenario focused on README
  getting-started quality. The reviewer should validate that the documented setup
  flow is still coherent and runnable, with clear machine-parseable decisions and
  deterministic policy handling.
constraints:
- The reviewer id is `readme_process` and its prompt source is `harness/reviewers/prompts/readme_process.md`.
- Trigger only at `feature_done` phase.
- Trigger only when `README.md` is in changed paths.
- Execution must use `sandbox.mode=temp_worktree_snapshot`.
- Approval policy defaults for this reviewer are blocking, first feature approval reuse enabled, max retries 2, continue on exhausted true.
- Reviewer output must follow the v1 decision JSON envelope contract.
- Parse failures must be treated as deterministic `request_changes` outcomes.
- Repositories without reviewer configuration still keep unchanged baseline behavior.
implementation_notes: >-
  Deliver one concrete reviewer profile entry, prompt guidance, and focused
  runtime validation for the README scenario.

  - Add default `readme_process` example in scaffold and docs exactly matching
    agreed contract shape.

  - Author `harness/reviewers/prompts/readme_process.md` with plain-English
    instructions to verify README getting-started flow and emit strict JSON
    decision envelope.

  - Ensure runtime planner only schedules this reviewer when README changed and
    phase is `feature_done`.

  - Ensure sandbox setup uses temp worktree snapshot and does not mutate active
    worktree.

  - Ensure blocking retry behavior and exhausted continuation policy are applied
    to this reviewer scenario.

  The expected reviewer config sample for docs and scaffold must include:

  readme_process:
    prompt_file: "harness/reviewers/prompts/readme_process.md"
    trigger:
      phase: "feature_done"
      on_change: ["README.md"]
    sandbox:
      mode: "temp_worktree_snapshot"
    approval:
      mode: "blocking"
      first_feature_approval: true
      max_retries: 2
      continue_on_exhausted: true
acceptance:
- Default reviewer docs and scaffold include the exact `readme_process` YAML sample agreed in planning.
- '`readme_process` reviewer runs only when `README.md` changed and phase is `feature_done`.'
- '`readme_process` execution runs in temp worktree snapshot isolation.'
- 'Blocking decisions from `readme_process` feed retry flow and hook feedback deterministically.'
- 'Parse failures for `readme_process` are surfaced as deterministic `request_changes` outcomes.'
- 'Exhausted blocking behavior for `readme_process` follows configured continue policy with warning telemetry by default.'
- 'Reviewer prompt content for `readme_process` is plain English and includes explicit JSON response instructions.'
