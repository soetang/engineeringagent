id: FEAT-092
title: Control retry feedback injection with explicit contracts (no prompt truncation)
type: feature
expected_commit_subject: 'feat: add retry feedback contracts'
status: backlog
priority: high
objective: |
  Make retry feedback injected into the next implement prompt deterministic, minimal,
  and contract-driven.

  Replace the current behavior (injecting raw gate/verification output and truncating
  to 8k chars) with explicit retry-feedback contracts that:
  - always include the exact failing command and clear rerun instructions
  - include pre-commit context when applicable
  - include full structured reviewer decision output (contract JSON)
  - include failures-only fitness feedback (contract JSON)
  - do not rely on generic prompt truncation
context: |
  Today, the loop forwards raw hook_feedback from gates/verification/reviewers into
  the next implement prompt via inject_retry_feedback(...).

  This creates two problems:
  - Prompt-size safety is handled by prefix truncation (8k chars), which can drop the
    most relevant failure lines and can include lots of non-failure noise.
  - The model can receive entire gate outputs (including full fitness JSON results)
    rather than the minimal failing signal.

  We want strict control over what enters the next prompt.
constraints:
  - Do not inject links/pointers that allow the agent to fetch the full log output
    from progress artifacts.
  - For command-based failures (gates/verification), injected feedback MUST include
    the exact failing command and a deterministic instruction to rerun it from the
    repo root.
  - If a command failure occurs under pre-commit, injected feedback MUST include that
    context (profile=precommit or commit hook rejection).
  - Fitness failures must inject failures-only feedback (no full results list).
  - Reviewer failures/forwarded feedback must inject the full structured reviewer
    decision payload (parsed/validated JSON), not raw OpenCode logs.
  - Remove prompt-time truncation for retry feedback injection; ensure injected
    feedback is bounded by construction (contract caps), not by slicing.
  - Keep existing progress logging behavior (full raw outputs in progress logs)
    available for humans; do not make prompt injection depend on those logs.
implementation_notes: |
  Contract strategy
  - Introduce a v1 retry-feedback envelope as strict JSON injected into the retry
    feedback section of the implement prompt.
  - For gate/verification command failures, inject a minimal envelope:
    - phase (gates|verification|completion_commit)
    - gate/check name where available
    - gate profile (when present) and/or pre-commit context
    - exact failing command
    - rerun instruction (repo root)
    - optional bounded tail snippet (small, deterministic cap)
  - For fitness failures, parse the fitness JSON output and inject only:
    - failed_rules (rule_id/status/remediation)
    - matching failing rule violations/details for those failed rule_ids
  - For reviewers, inject the full reviewer decision JSON (as produced by the
    reviewer contract) with reviewer_id and phase metadata.

  Retry-feedback envelope contract (v1, normative)

  - Inject exactly one JSON object per iteration retry into the next implement prompt.
  - The JSON object is the system-of-record for what the implement agent is allowed
    to rely on for retry context.
  - Do not include pointers/links to progress logs.
  - Keep envelopes small by construction. Prefer caps on list lengths/snippet lines.

  Common fields (all envelope kinds):

  ```json
  {
    "retry_feedback_contract": "1.0",
    "kind": "command_failure|fitness_failure|reviewer_feedback",
    "phase": "gates|verification|completion_commit|reviewers",
    "message": "Short human-readable header (non-empty)."
  }
  ```

  Kind: command_failure

  - Used for gate and verification command failures (including pre-commit context).
  - Must include the exact failing command string and rerun instruction.
  - gate_profile must be included when the failure occurs during a configured profile
    that has semantic meaning (e.g. precommit).

  ```json
  {
    "retry_feedback_contract": "1.0",
    "kind": "command_failure",
    "phase": "gates",
    "gate": "ruff_validate",
    "gate_profile": "precommit",
    "precommit_context": {
      "profile_precommit": true,
      "git_hook_suspected": false
    },
    "command": "uv run ruff check src/engineeringagent harness",
    "rerun": {
      "cwd": "repo_root",
      "instructions": "Run the command exactly as shown from the repository root."
    },
    "exit_code": 1,
    "snippet_tail": [
      "<optional bounded tail lines>",
      "<max N lines>"
    ],
    "message": "Command check failed. Rerun the command to see full diagnostics."
  }
  ```

  Kind: fitness_failure

  - Used when the fitness runner fails.
  - Must include failures-only content.
  - Do not inject the full fitness results list (pass noise).

  ```json
  {
    "retry_feedback_contract": "1.0",
    "kind": "fitness_failure",
    "phase": "gates",
    "gate": "fitness_validate",
    "command": "uv run python -m engineeringagent.cli fitness run --format json",
    "failed_rules": [
      {
        "rule_id": "architecture.markdown-locality-reference-coverage",
        "status": "fail",
        "remediation": "Move markdown under approved roots ...",
        "violations": [
          "path/to/file.md:1 ..."
        ],
        "details": null
      }
    ],
    "message": "Fitness rule(s) failed. Apply remediation and rerun the command."
  }
  ```

  Kind: reviewer_feedback

  - Used when reviewers must request changes (or when forwarding reviewer feedback
    into the next implement pass).
  - Must include the full parsed reviewer decision payload (contract JSON), not raw
    OpenCode logs.
  - Reviewer decision payload must not include a confidence field. Keep the decision
    contract minimal: decision, summary, optional required_actions, optional scope_notes.

  ```json
  {
    "retry_feedback_contract": "1.0",
    "kind": "reviewer_feedback",
    "phase": "reviewers",
    "reviewer_id": "code_simplifier",
    "reviewer_phase": "feature_done",
    "decision": {
      "decision": "request_changes",
      "summary": "Refactor duplicated helper.",
      "required_actions": [
        "Extract helper ..."
      ],
      "scope_notes": "Reviewed src and tests changes only."
    },
    "message": "Reviewer requested changes. Apply required actions before completing."
  }
  ```

  No-truncation policy
  - Remove the _truncate_feedback(...) call from prompt injection.
  - Keep truncation helpers only for telemetry summaries/log formatting if needed,
    but not for prompt injection.

  Future-proofing note
  - FEAT-087 may remove legacy gate profiles. The retry-feedback envelope should
    treat gate_profile as optional and support a more general execution context
    (phase/check id) without requiring profiles.
acceptance:
  - The next-iteration prompt receives retry feedback as strict JSON envelopes, not
    raw concatenated tool output.
  - For gate and verification command failures, the injected feedback includes the
    exact failing command and rerun instruction.
  - When failures occur under pre-commit (profile or hook), injected feedback includes
    explicit pre-commit context.
  - Fitness failure feedback injected into prompts includes only failing rules and
    their violations/remediation (no pass noise).
  - Reviewer forwarded feedback injected into prompts includes the full parsed
    reviewer decision payload (JSON) when applicable.
  - Prompt retry feedback injection no longer truncates content generically.
  - A new fitness rule fails if prompt retry feedback injection reintroduces
    truncation-by-slicing behavior.
  - Spec validation and targeted unit tests pass.
subtasks:
  - id: ST-001
    title: Define retry-feedback envelope contract (v1) and serialization rules
    status: backlog
    context: |
      Add strict models (Pydantic) for injected retry feedback envelopes.

      Define envelope kinds:
      - command_failure (gates/verification/commit)
      - fitness_failure
      - reviewer_feedback

      Ensure the contract is deterministic and bounded by construction.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q
  - id: ST-002
    title: Generate command failure retry feedback (exact failing command + pre-commit context)
    status: backlog
    context: |
      Update gate and verification failure handling to set hook_feedback to a
      serialized command_failure envelope instead of raw stdout/stderr.

      Required fields include:
      - exact failing command
      - phase and gate/check name when available
      - pre-commit context when applicable
    verification:
      - uv run pytest -q
  - id: ST-003
    title: Generate fitness failure retry feedback (failures-only contract)
    status: backlog
    context: |
      For fitness_validate failures, parse fitness JSON and inject only failing
      rule ids + remediation + violations/details. Do not inject the full results
      array.
    verification:
      - uv run pytest -q
      - uv run python -m engineeringagent.cli fitness run --format json
  - id: ST-004
    title: Inject full reviewer decision JSON as retry feedback
    status: backlog
    context: |
      Ensure reviewer-forwarded feedback injected into the next implement prompt is
      the full parsed decision JSON envelope plus reviewer metadata, not raw logs.
    verification:
      - uv run pytest -q
  - id: ST-005
    title: Remove prompt retry-feedback truncation and enforce bounded envelopes
    status: backlog
    context: |
      Remove _truncate_feedback usage from inject_retry_feedback so prompt injection
      does not slice feedback.

      Keep retry feedback bounded by envelope caps (counts/lines/bytes) rather than
      generic truncation.
    verification:
      - uv run pytest -q
  - id: ST-006
    title: Add fitness rule that blocks retry-feedback truncation regressions
    status: backlog
    context: |
      Add a new fitness function (architecture rule) that fails if the loop prompt
      retry feedback injection uses truncation-by-slicing (e.g. _truncate_feedback
      in src/engineeringagent/prompts/renderer.py).
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
  - id: ST-007
    title: Document retry feedback injection policy for LLM operators
    status: backlog
    context: |
      Add an agent-facing reference doc describing:
      - what is injected into retry prompts
      - the envelope schemas and examples
      - pre-commit context rules
      - how fitness/reviewer failures differ from command failures

      Ensure the new doc is allowlisted in harness/scaffold_policy.yaml.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
  - id: ST-008
    title: Remove confidence from reviewer decision contract (model + docs)
    status: backlog
    context: |
      Remove the confidence field from the reviewer decision envelope contract.

      Scope:
      - Update the ReviewerDecisionEnvelope model so confidence is not accepted.
      - Update the injected reviewer response-format contract text so confidence is
        not mentioned.
      - Update agent-facing docs that describe the reviewer decision envelope so
        confidence is not documented or used in examples.

      Rationale:
      - Keep reviewer outputs minimal and deterministic.
      - Avoid encouraging self-reported confidence scores that are not enforced by
        deterministic checks.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q
      - 'uv run python -c "import pathlib,re,sys; roots=[pathlib.Path(\"src\"),pathlib.Path(\"docs\"),pathlib.Path(\"harness\")]; pat=re.compile(r\"\\bconfidence\\b\"); ignore_dirs={\".git\",\".opencode\",\".pytest_cache\",\".ruff_cache\",\".venv\",\"__pycache__\",\"dist\",\"node_modules\",\"output\",\"tmp\"}; hits=[];\nfor root in roots:\n  if not root.exists():\n    continue\n  for p in root.rglob(\"*\"):\n    if p.is_dir():\n      continue\n    if any(part in ignore_dirs for part in p.parts):\n      continue\n    if p.parts[:2] == (\"docs\", \"spec\"):\n      continue\n    try:\n      text=p.read_text(encoding=\"utf-8\")\n    except Exception:\n      continue\n    if pat.search(text):\n      hits.append(str(p))\nif hits:\n  print(\"confidence token found outside docs/spec:\", *[\"- \"+h for h in hits], sep=\"\\n\"); sys.exit(1)\nprint(\"confidence token absent outside docs/spec\")"'
