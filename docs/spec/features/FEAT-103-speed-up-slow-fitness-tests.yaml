id: FEAT-103
title: Speed up slow fitness tests by avoiding repo-root scans and reducing semgrep invocations
type: test
expected_commit_subject: "test: speed up slow fitness tests"
status: backlog
priority: medium
objective: >
  Reduce `uv run pytest -q` wall time by refactoring two slow test areas:
  (1) stop running the markdown locality checker against the full repository when
  asserting only the stable rule_id, and (2) reduce repeated semgrep subprocess
  startups in the loop subprocess boundary tests, and (3) avoid running the full
  repository validation path when checking that the validate check group executes.

context: >
  The harness fitness rule scripts are intentionally repo-scanning, but some tests
  are using repo_root as the cwd even when they assert only trivial invariants.
  This causes unnecessary full-repo scanning and dominates the test durations list.
  Separately, semgrep startup is expensive; current tests invoke the semgrep-based
  subprocess-boundary checker once per scenario, paying the startup cost repeatedly.
  We can keep coverage and confidence while making the tests much faster.

constraints:
  - "Do not change production behavior of any harness fitness checker scripts (only tests refactoring)."
  - "Keep assertions deterministic and maintain existing intent/coverage."
  - "Do not relax the semantics of the rules being tested (only reduce test runtime)."

implementation_notes: |
  Target 1: markdown locality rule_id test

  - File: tests/fitness/test_fitness_rules_markdown_locality.py
  - Current behavior: test_markdown_locality_rule_uses_expected_rule_id runs
    the checker with cwd=repo_root, which triggers full repository scans.
  - Change: run the checker with cwd=tmp_path instead.
    - Keep checker_path pointing at the real script in repo_root.
    - Create a minimal directory structure in tmp_path if needed (e.g. an empty tree
      is fine; the rule id is constant).
    - Assert only that:
      - subprocess returncode is 0
      - payload["rule_id"] matches the stable id
    - Do not assert pass/fail status in this test; other tests already cover behavior.

  Target 2: reduce semgrep invocations in subprocess-boundary tests

  - File: tests/fitness/test_fitness_rules_loop_subprocess_boundary.py
  - Current behavior: multiple tests each call the checker, which spawns semgrep.
  - Change: consolidate scenarios to reduce checker runs:
    - Keep the existing rule_id assertion test (it runs semgrep once).
    - Add/keep one FAIL test that writes multiple violating modules into the same tmp_path
      (e.g. direct subprocess use, alias module call, from-import alias call) then runs
      the checker once and asserts all expected violation strings are present.
    - Add/keep one PASS test that writes an allowlisted module invoking subprocess and
      asserts status pass and violations empty.
  - Delete or merge redundant tests so the file performs at most ~3 checker runs total
    (rule_id + consolidated fail + pass).
  - Preserve deterministic violation matching by checking for stable substrings.

  Target 3: avoid repo-root validate execution in checks contract test

  - File: tests/checks/test_run_checks_contract.py
  - Current behavior: test_run_checks_validate_group_executes(repo_root) calls
    run_checks(repo_root, checks=["validate"]). This exercises full repository
    validation, which is integration-like and slower than necessary for the
    contract being asserted.
  - Change: run the validate group against a minimal temp repository instead.
    - Use tmp_path, scaffold only the minimal files needed for validate to succeed.
      Follow existing init scaffold conventions in tests (e.g., create
      docs/spec/features/.gitkeep, docs/spec/features_done/.gitkeep, and
      docs/spec/schemas/feature.schema.json if required by validate).
    - Write a minimal harness/checks.yaml suitable for run_checks selection.
    - Assert result.ok is True.
    - Do not assert repo-specific validate details in this test; other tests cover
      validate semantics.

acceptance:
  - "tests/fitness/test_fitness_rules_markdown_locality.py::test_markdown_locality_rule_uses_expected_rule_id no longer runs with cwd=repo_root."
  - "tests/fitness/test_fitness_rules_loop_subprocess_boundary.py invokes the semgrep-based checker fewer times by consolidating scenarios (no per-scenario semgrep subprocess)."
  - "tests/checks/test_run_checks_contract.py::test_run_checks_validate_group_executes no longer runs validate against repo_root (it uses a minimal temp repo)."
  - "uv run pytest -q passes."
  - "uv run pytest -q --durations=20 shows a material reduction in the top slowest durations (markdown locality rule_id test no longer appears as a multi-second outlier)."

subtasks:
  - id: ST-001
    title: Refactor markdown locality rule_id test to use tmp cwd
    status: backlog
    context: >
      Update tests/fitness/test_fitness_rules_markdown_locality.py so the rule_id test
      runs the checker against tmp_path instead of repo_root to avoid full-repo scanning.
    verification:
      - uv run pytest -q tests/fitness/test_fitness_rules_markdown_locality.py

  - id: ST-002
    title: Consolidate loop subprocess boundary scenarios to reduce semgrep runs
    status: backlog
    context: >
      Update tests/fitness/test_fitness_rules_loop_subprocess_boundary.py to collapse
      multiple failing scenario tests into a single test that writes multiple violating
      modules and asserts all expected violations from a single checker run.
    verification:
      - uv run pytest -q tests/fitness/test_fitness_rules_loop_subprocess_boundary.py

  - id: ST-003
    title: Refactor validate group execution test to use a minimal temp repo
    status: backlog
    context: >
      Update tests/checks/test_run_checks_contract.py so test_run_checks_validate_group_executes
      validates the execution path using tmp_path (minimal scaffold), not repo_root.
    verification:
      - uv run pytest -q tests/checks/test_run_checks_contract.py

  - id: ST-004
    title: Verify suite speedup with durations
    status: backlog
    context: >
      Run the suite with durations reporting and confirm the previously slow tests are
      no longer large outliers.
    verification:
      - uv run pytest -q --durations=20
