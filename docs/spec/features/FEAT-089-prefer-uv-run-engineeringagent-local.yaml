id: FEAT-089
title: Prefer `uv run engineeringagent` for local (from-source) execution
type: chore
expected_commit_subject: "chore: prefer uv run engineeringagent locally"
status: backlog
priority: medium
objective: |
  Replace local/from-source command guidance and in-repo gate commands that currently
  use `uv run python -m engineeringagent.cli ...` with `uv run engineeringagent ...`.

  This repo already defines the `engineeringagent` console script entrypoint
  (pyproject `[project.scripts]`). When the project is installed into the uv
  environment (for example via `uv sync` or `uv pip install -e .`), we can run the
  CLI directly without an explicit `python -m`.
context: |
  Today the repository frequently documents and embeds commands like:

  - `uv run python -m engineeringagent.cli validate`
  - `uv run python -m engineeringagent.cli gates run --profile precommit`

  This works, but it is noisier than needed when developing locally.

  We want to keep the existing “source-first” policy (avoid `uvx --from . ...` for
  loop-scoped command surfaces), while simplifying the preferred local command form
  to `uv run engineeringagent ...`.
constraints:
  - "Do not change the PyPI/consumer guidance: keep `uvx engineeringagent ...` usage for no-clone/package workflows."
  - "Do not remove support for `python -m engineeringagent.cli`; this is a preference + docs/config update, not a breaking runtime removal."
  - "Keep the in-repo source-first policy intact: continue to forbid `uvx --from . engineeringagent ...` in loop-scoped command surfaces."
implementation_notes: |
  Contract/API delta (explicit):

  - Surface: local contributor command style.
    - Old guidance/defaults: `uv run python -m engineeringagent.cli <command>`
    - New guidance/defaults: `uv run engineeringagent <command>`

  Compatibility policy:
  - Backwards compatible: existing `uv run python -m engineeringagent.cli ...`
    invocations still work.
  - We will update documentation, default gate config, and harness examples to
    prefer the shorter form.

  Notes:
  - The `engineeringagent` console script is defined in `pyproject.toml`.
  - Verify that `uv run engineeringagent --help` works from a repo checkout.
acceptance:
  - "`harness/gates.yaml` uses `uv run engineeringagent ...` for engineeringagent CLI invocations (validate/fitness/gates/etc.)."
  - "Default gate config in `src/engineeringagent/gates.py` uses `uv run engineeringagent ...` (keeps defaults aligned with harness examples)."
  - "Agent-facing docs and playbooks that currently recommend `uv run python -m engineeringagent.cli ...` are updated to `uv run engineeringagent ...`."
  - "Fitness rule remediation strings that mention `uv run python -m engineeringagent.cli ...` are updated to `uv run engineeringagent ...` to match the new guidance."
  - "Tests that assert the old command strings are updated and pass."
  - "`uv run engineeringagent validate` passes."
  - "`uv run pytest -q` passes."
subtasks:
  - id: ST-001
    title: Update harness gate commands and default gate config to call `uv run engineeringagent`
    status: backlog
    context: |
      Update `harness/gates.yaml` (and `DEFAULT_GATE_CONFIG` in
      `src/engineeringagent/gates.py`) to replace:

      - `uv run python -m engineeringagent.cli validate`
      - `uv run python -m engineeringagent.cli fitness run --format json`

      with:

      - `uv run engineeringagent validate`
      - `uv run engineeringagent fitness run --format json`
    verification:
      - uv run engineeringagent gates run --profile loop_fast
  - id: ST-002
    title: Update local/from-source documentation to prefer `uv run engineeringagent`
    status: backlog
    context: |
      Update repo docs that describe contributor/local verification commands.

      Expected touch points include:
      - `AGENTS.md` verification quick reference
      - `docs/references/uv-llms.md`
      - `docs/principles/quality-check-playbook.md`
      - `docs/references/docs-architecture-llms.md` and its scaffold template
        `src/engineeringagent/scaffold_templates/reference.docs-architecture-llms.md`
      - Any other agent-only references that embed the old form.
    verification:
      - uv run pytest -q tests/meta/test_quality_check_playbook_source_first_cli.py
      - uv run pytest -q tests/reviewers/test_reviewer_reference_docs.py
  - id: ST-003
    title: Update fitness rule remediation strings and any policy text that references the old form
    status: backlog
    context: |
      Update remediation strings so failures recommend the new local command style.

      Expected touch points include:
      - `harness/fitness-functions/check_source_first_loop_commands.py` REMEDIATION
      - `harness/fitness-functions/rules.yaml` rule remediation for
        `architecture.source-first-loop-command-policy`
      - `docs/fitness-functions/rules.md` (either update directly or regenerate via
        the catalog generator if that is the established workflow)
    verification:
      - uv run engineeringagent fitness run --format json
      - uv run pytest -q tests/fitness/test_fitness_rules_source_first_loop_commands.py
  - id: ST-004
    title: Align README and meta tests with the new local command style
    status: backlog
    context: |
      Update README contributor/from-source guidance to use `uv run engineeringagent ...`
      (while keeping `uvx engineeringagent ...` for package usage).

      Update meta tests that assert the exact README command strings.
    verification:
      - uv run pytest -q tests/meta/test_validator.py
      - uv run engineeringagent --help
