id: FEAT-098
title: Migrate CLI + loop to engineeringagent.checks (grouped checks selection + reviewer CLI)
type: feature
expected_commit_subject: "feat: migrate checks execution to engineeringagent.checks"
status: backlog
priority: high
objective: >
  Reduce cross-module coupling and enable smaller diffs by migrating the CLI and loop
  runtime to the canonical `engineeringagent.checks.run_checks(...)` contract, adding an
  explicit grouped selection interface for `engineeringagent checks run` (including
  reviewer execution), and removing legacy harness policing from `engineeringagent validate`.

context: >
  Depends on FEAT-097.

  Ordering / dependencies (explicit):
  - FEAT-097 must land before FEAT-098.
  - FEAT-098 must land before FEAT-099.

  Spec package (explicit):
  - This larger refactor is intentionally split across multiple specs:
    FEAT-097, FEAT-098, FEAT-099.
  - You are here: FEAT-098.

  FEAT-097 introduces `src/engineeringagent/checks/**` as the canonical home for check
  execution with a narrow supported surface. This feature adopts that surface in the
  primary callsites (CLI checks runner and loop runtime), extends the checks CLI to run
  reviewers via explicit group selection, and begins deprecating legacy check execution
  modules by making them unused. Physical deletions and broader package relocation are
  deferred to FEAT-099 to confirm parity before removal.

constraints:
  - "Default behavior must remain stable: when group selection is omitted, `engineeringagent checks run` executes commands+fitness only."
  - "No boolean flags for reviewers; use explicit group selection via `--checks`."
  - "Reviewer checks in `engineeringagent checks run` require explicit `--feature-path` (no auto-detect)."
  - "Checks code must not implement OpenCode/subagent logic; CLI and loop wire `start_agent_fn` from `engineeringagent.opencode.client.start_agent`."
  - "Remove legacy harness contract file policing from `engineeringagent validate` (do not fail validation solely because harness/gates.yaml or harness/reviewers.yaml exist)."
  - "Do not delete legacy modules in this spec; they must become unused by production code, then deleted in FEAT-099."

implementation_notes: |
  Contract/API delta (explicit):

  - Surface: `engineeringagent checks run` CLI.
    - Old behavior: executes command+fitness checks declared in `harness/checks.yaml`.
      Reviewers are not runnable from this command.
    - New behavior:
      - `engineeringagent checks run` accepts repeatable `--checks` group selection:
        validate|commands|fitness|reviewers
      - Default when `--checks` is omitted remains ["commands", "fitness"].
      - Reviewers can be run from CLI by including reviewers in `--checks`, and require
        `--feature-path <path-to-feature-yaml>`.

  - Surface: internal callsites for check execution (CLI + loop runtime).
    - Old behavior: CLI and loop runtime call legacy modules directly
      (`engineeringagent.harness_checks_runtime.*`, `engineeringagent.reviewers.*`,
      `engineeringagent.validator.validate`).
    - New behavior: CLI and loop runtime call `engineeringagent.checks.run_checks(...)`
      with group selection and injected dependencies.

  - Surface: spec/setup validation policy.
    - Old behavior: `engineeringagent validate` fails when legacy harness contract files
      (`harness/gates.yaml`, `harness/reviewers.yaml`) exist.
    - New behavior: `engineeringagent validate` no longer fails solely due to presence of
      legacy harness contract files.

  Compatibility policy:
  - Default user workflows remain stable:
    - `engineeringagent checks run` still runs commands+fitness by default.
    - `engineeringagent run --all` still runs gates + reviewers with the same phase semantics.
  - Reviewer CLI support is additive and opt-in via explicit `--checks reviewers`.

  CLI contract details (v1 additions):
  - `engineeringagent checks run` options:
    - `--checks <group>` repeatable (e.g. `--checks commands --checks fitness`).
      Allowed values: validate|commands|fitness|reviewers.
    - `--check-id <id>` optional: run only one check id within selected groups.
    - `--feature-path <path>` required when reviewers group is selected.
    - Existing options preserved: `--phase`, `--base`, `--head`, `--verbose-output`.

  Post-migration unused-by-production goal (deletions in FEAT-099):
  - After FEAT-098, production code should not import legacy check entrypoints:
    - `engineeringagent.harness_checks_runtime`
    - `engineeringagent.validator`
    - `engineeringagent.reviewers`

  Fitness-function impact assessment:
  - no fitness-function changes required.

acceptance:
  - "CLI: `engineeringagent checks run` calls `engineeringagent.checks.run_checks(...)`."
  - "CLI: `engineeringagent checks run` supports repeatable `--checks` group selection; default groups are ['commands','fitness'] when omitted."
  - "CLI: reviewers are runnable via `engineeringagent checks run --checks reviewers --feature-path <feature.yaml>` and fail fast with deterministic remediation when `--feature-path` is missing."
  - "CLI: optional `--check-id` runs only the selected check id (deterministic unknown-id failure)."
  - "Loop runtime uses `engineeringagent.checks.run_checks(...)` for gate execution (commands+fitness) and reviewer execution (reviewers) instead of direct imports from legacy executors."
  - "`engineeringagent validate` no longer fails due to presence of legacy harness contract files (`harness/gates.yaml`, `harness/reviewers.yaml`)."
  - "After FEAT-098, production code does not import any legacy checks entrypoints: `engineeringagent.harness_checks_runtime`, `engineeringagent.validator`, or `engineeringagent.reviewers` (deletions follow in FEAT-099)."
  - "`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass."

subtasks:
  - id: ST-001
    title: Extend checks CLI with group selection and single-check mode
    status: backlog
    context: >
      Update Typer wiring for `engineeringagent checks run` to accept repeatable `--checks`,
      plus optional `--check-id` and `--feature-path` (required when reviewers group selected).
      Keep default behavior unchanged when `--checks` is omitted.
    verification:
      - uv run python -m engineeringagent.cli checks run --phase iteration_end
      - uv run pytest -q

  - id: ST-002
    title: Migrate cmd_checks_run to call engineeringagent.checks.run_checks
    status: backlog
    context: >
      Replace `cmd_checks_run` internals with a call to `engineeringagent.checks.run_checks(...)`,
      wiring `run_shell_command` and `start_agent` from `engineeringagent.opencode.client`.
      Preserve output + exit-code semantics.
    verification:
      - uv run pytest -q

  - id: ST-003
    title: Migrate loop runtime gates + reviewers orchestration to checks.run_checks
    status: backlog
    context: >
      Update `engineeringagent.loop_runtime.phases` to call `engineeringagent.checks.run_checks(...)`
      for:
      - gate phase: groups ['commands','fitness'] at iteration_end (and feature_done when archived)
      - reviewer phase: group ['reviewers'] at feature_done
      Preserve retry-feedback behavior and deterministic status fields.
    verification:
      - uv run pytest -q

  - id: ST-004
    title: Remove legacy harness policing from engineeringagent validate
    status: backlog
    context: >
      Remove the validator failure that triggers when `harness/gates.yaml` or `harness/reviewers.yaml`
      exist. Validation should remain strict for specs and active contracts, but legacy harness files
      are not a setup/validate concern after this change.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q

  - id: ST-005
    title: Remove production imports of legacy checks entrypoints
    status: backlog
    context: >
      Ensure production code under `src/engineeringagent/**` no longer imports any of:
      `engineeringagent.harness_checks_runtime`, `engineeringagent.validator`, or
      `engineeringagent.reviewers`. Add a pytest guard to prevent regressions.
    verification:
      - uv run pytest -q
