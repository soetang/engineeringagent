id: FEAT-152
title: Add CLI schema contract surface and remove shipped feature schema artifact
type: spec
expected_commit_subject: 'spec: add FEAT-152 CLI schema contract surface and artifact removal'
status: backlog
priority: medium
objective: >
  Make CLI-emitted schemas the source of truth for user-editable contracts by
  adding a dedicated schema command surface and removing the scaffolded
  `docs/spec/schemas/feature.schema.json` artifact and its drift checks.
context: |
  We currently expose only one shipped schema artifact (`docs/spec/schemas/feature.schema.json`),
  while multiple active contracts are defined in code (feature specs, checks, fitness, reviewer envelopes).

  This creates asymmetric discoverability and artifact drift risk.

  Agents and contributors are good at invoking CLI commands. A first-class schema
  command surface provides one deterministic source for contract discovery and exact schema emission.
constraints:
  - 'Sequence: implement after FEAT-153 removes legacy gate/reviewer contract remnants so schema ids and docs only expose active contracts.'
  - 'In scope: add a dedicated CLI schema surface with direct schema-id access and deterministic outputs.'
  - 'In scope: support `json` and `yaml` output formats plus optional file output.'
  - 'In scope: include an ergonomic schema inventory command (`engineeringagent schema list`).'
  - 'In scope: remove scaffolded `docs/spec/schemas/feature.schema.json` and validator sync checks tied to that artifact.'
  - 'In scope: update user/contributor/scaffold docs to point to CLI schema discovery and retrieval.'
  - 'Out of scope: changing semantic validation invariants that are enforced by Pydantic validators beyond structural schema shape.'
  - 'Out of scope: introducing remote/schema-registry network dependencies.'
  - Keep schema generation owned by canonical contract models in source code.
  - Keep deterministic error and exit behavior for unknown schema ids and invalid format/output usage.
implementation_notes: |
  Contract change declaration

  Surface:

  - CLI contract schema discovery/retrieval commands.
  - Source-of-truth policy for user-visible contract schemas.
  - Init/validate/documentation behavior that currently references a shipped feature schema file.

  Old behavior:

  - Feature schema is shipped as `docs/spec/schemas/feature.schema.json`.
  - `engineeringagent validate` enforces byte-sync between that file and generated model schema.
  - No general CLI command exists to emit all relevant contract schemas.

  New behavior:

  - `engineeringagent schema <schema_id>` emits the exact schema from source models.
  - `engineeringagent schema list` prints deterministic available schema ids.
  - `--format json|yaml` and `--output <path>` are supported for schema emission.
  - Shipped feature schema artifact is removed; schema retrieval is CLI-first.
  - Validator sync checks for removed schema artifact are removed.

  Compatibility policy:

  - Intentional contract shift from file artifact distribution to CLI distribution.
  - Breaking change is acceptable for this repository (no active users).
  - CLI error messages must remain deterministic and remediation-oriented.

  Migration plan:

  - Add a schema registry that maps stable schema ids to model-derived JSON Schemas.
  - Add CLI command handling and Typer wiring for `engineeringagent schema` and `engineeringagent schema list`.
  - Implement serializer support for `json` and `yaml` and optional `--output` file writes.
  - Remove schema artifact creation from init scaffold.
  - Remove feature-schema artifact sync validation logic.
  - Update README/reference/scaffold docs with CLI retrieval one-liners.

  Verification evidence:

  - CLI tests cover schema listing, direct retrieval, output formats, output file writing, and unknown-id failures.
  - Init/validate tests are updated for artifact removal and pass.
  - `engineeringagent validate` still enforces all non-artifact contract checks.

  Fitness-function impact assessment:

  - no fitness-function changes required.
  - Rationale: this feature changes schema distribution/discoverability and scaffold behavior,
    not architecture rule semantics.
acceptance:
  - '`engineeringagent schema list` returns deterministic schema ids for all supported user-editable contract surfaces.'
  - '`engineeringagent schema <schema_id>` emits the exact schema from source models without relying on shipped schema files.'
  - '`engineeringagent schema <schema_id> --format json|yaml` works and output is deterministic.'
  - '`engineeringagent schema <schema_id> --output <path>` writes schema content and prints deterministic success text.'
  - Unknown schema ids fail non-zero with actionable deterministic remediation.
  - '`docs/spec/schemas/feature.schema.json` is no longer scaffolded or required for validation.'
  - Feature-schema artifact drift checks are removed from validate runtime.
  - README, contributor commands, spec-writing reference, and scaffold AGENTS docs point users to CLI schema retrieval.
  - 'Verification command passes: `uv run pytest -q tests/cli tests/meta/test_validator.py tests/cli/test_init_scaffold.py`.'
  - 'Verification command passes: `uv run engineeringagent validate`.'
