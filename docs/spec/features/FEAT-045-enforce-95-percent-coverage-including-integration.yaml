id: FEAT-045
title: Enforce 95 percent minimum coverage with integration tests included
type: test
expected_commit_subject: 'test: add FEAT-045 enforce 95 percent coverage including integration'
status: backlog
priority: high
objective: Enforce a minimum total coverage threshold of 95 percent on the default pytest workflow while always including integration tests in collection/execution.
context: Coverage is currently run ad hoc and default pytest configuration excludes integration tests via marker filtering. Recent full-suite coverage run (with integration included) reports 94 percent total coverage, which is below the desired baseline. The user-requested policy is direct pytest/coverage-config enforcement (without adding new gate wiring) so local and CI test execution fail immediately when total coverage drops below 95 percent.
constraints:
- Enforce the threshold through pytest and/or coverage configuration in `pyproject.toml` (no new gate profile required).
- Default pytest behavior must include integration tests; do not keep marker-based default exclusion.
- Coverage failure output must clearly report the configured minimum and measured total.
- Keep enforcement deterministic across local runs and CI.
- Coordinate with FEAT-044 permission-contract fixes so integration participation is reliable when OpenCode is available.
implementation_notes: Add coverage tooling/config that makes `uv run pytest` enforce total minimum coverage directly (for example through pytest-cov and/or coverage fail-under settings). Remove default marker exclusion for integration tests, then raise overall coverage to at least 95 percent by adding targeted tests in current low-coverage modules.
acceptance:
- Default pytest invocation enforces total minimum coverage of 95 percent.
- Integration tests are included by default in pytest collection/execution.
- Coverage policy is declared in repository config, not only in ad hoc shell commands.
- Repository test suite meets or exceeds 95 percent total coverage under the configured default command.
- A focused regression test guards the coverage threshold/config contract from accidental drift.
- 'uv run pytest -q passes with coverage enforcement active.'
subtasks:
- id: ST-001
  title: Configure direct pytest coverage enforcement at 95 percent
  status: backlog
  order: 1
  context: Add or update pytest/coverage config so default test execution fails below 95 percent without gate mediation.
  verification:
  - uv run pytest -q
- id: ST-002
  title: Include integration tests in default pytest execution path
  status: backlog
  order: 2
  context: Remove marker-based default exclusion and ensure integration tests are part of normal run behavior.
  verification:
  - uv run pytest -q tests/test_loop_opencode_integration.py
- id: ST-003
  title: Add regression coverage test for configuration contract
  status: backlog
  order: 3
  context: Add a focused test that asserts the configured minimum-coverage policy and default inclusion behavior remain intact.
  verification:
  - uv run pytest -q tests/test_validator.py
- id: ST-004
  title: Raise suite coverage to meet 95 percent threshold
  status: backlog
  order: 4
  context: Add focused tests for currently under-covered modules so the enforced threshold passes consistently.
  verification:
  - uv run pytest -q
