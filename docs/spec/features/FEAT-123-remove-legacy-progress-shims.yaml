  title: Remove legacy progress shim modules
  status: backlog
  context: Delete the two top-level shim files and any remaining production references under `src/engineeringagent/**`.
  verification:
  - uv run pytest -q tests/meta/test_progress_import_paths.py
- id: ST-002
  title: Add progress package convenience re-exports
  status: backlog
  context: Update `engineeringagent.progress.__init__` to expose commonly used paths/logging helpers while keeping canonical submodules intact.
  verification:
  - uv run pytest -q tests/meta
- id: ST-003
  title: Update contract tests for hard-fail legacy imports
  status: backlog
  context: Replace shim-importability assertions with explicit checks that legacy modules are absent and canonical imports work.
  verification:
  - uv run pytest -q tests/meta/test_legacy_shim_imports.py tests/meta/test_progress_import_paths.py
- id: ST-004
  title: Run full validation for breaking import-surface change
  status: backlog
  context: Validate no regressions in loop/reviewer progress behavior and spec/runtime contracts.
  verification:
  - uv run pytest -q
  - uv run engineeringagent validate
