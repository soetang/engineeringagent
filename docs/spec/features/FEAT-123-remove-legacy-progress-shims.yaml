id: FEAT-123
title: Remove legacy progress shim modules and promote progress package imports
type: chore
expected_commit_subject: 'chore: remove legacy progress shim modules'
status: backlog
priority: low
objective: |
  Complete the progress-helper transition by removing legacy top-level shim modules
  and making `engineeringagent.progress` the only supported import surface.
  This is an intentional breaking change.
context: |
  FEAT-082 introduced `engineeringagent.progress.paths` and
  `engineeringagent.progress.logging` and kept:
  - `src/engineeringagent/progress_paths.py`
  - `src/engineeringagent/progress_logging.py`
  as compatibility shims.

  Core runtime modules already import from the subpackage, but legacy shims still
  exist and tests still assert they are importable. We now want to remove those
  shims and enforce the new boundary.
constraints:
- 'Remove both shim modules: `src/engineeringagent/progress_paths.py` and `src/engineeringagent/progress_logging.py`.'
- 'Breaking-change policy: old import paths (`engineeringagent.progress_paths`, `engineeringagent.progress_logging`, and `from engineeringagent import progress_paths/progress_logging`) must fail immediately; do not add compatibility aliases.'
- Add convenience re-exports in `src/engineeringagent/progress/__init__.py` so canonical helpers can be imported from `engineeringagent.progress`.
- 'Scope boundary from interview: dependency/import migration in production code is limited to `src/engineeringagent/**` (tests/docs updated only as needed to codify the new contract).'
- Preserve existing progress path and write behavior (`progress/runs.jsonl`, `progress/run-feature-<FEATURE_ID>.txt`, reviewers state path semantics) with no runtime behavior changes beyond import-surface break.
- 'Fitness-function impact assessment: no fitness-function changes required.'
implementation_notes: |
  Contract change declaration (required)

  Surface: Python import contract for progress helper modules.

  Old behavior:
  - `engineeringagent.progress_paths` and `engineeringagent.progress_logging` are
    importable shim modules.
  - `from engineeringagent import progress_paths, progress_logging` works.

  New behavior:
  - Shim modules are removed from `src/engineeringagent`.
  - Legacy imports fail with `ModuleNotFoundError`/`ImportError`.
  - Canonical imports are:
    - `engineeringagent.progress.paths`
    - `engineeringagent.progress.logging`
    - convenience imports via `engineeringagent.progress` re-exports

  Compatibility policy:
  - Immediate internal/external break (no deprecation window).

  Migration plan:
  - Update all imports under `src/engineeringagent/**` to canonical progress
    package paths (or package re-exports).
  - Update tests to assert legacy module removal and canonical import stability.
  - Keep progress locality and write-path behavior unchanged.

  Verification evidence:
  - Targeted meta/progress import tests.
  - Full test suite and `engineeringagent validate`.
acceptance:
- '`src/engineeringagent/progress_paths.py` and `src/engineeringagent/progress_logging.py` are deleted.'
- '`src/engineeringagent/progress/__init__.py` exports the agreed canonical helper symbols for package-level convenience imports.'
- No production module under `src/engineeringagent/**` imports `engineeringagent.progress_paths` or `engineeringagent.progress_logging`.
- Meta tests assert legacy shim modules are absent and canonical `engineeringagent.progress.*` imports remain valid.
- Existing progress artifact behavior remains unchanged in loop/reviewer flows.
- uv run pytest -q tests/meta tests/loop/test_loop_contracts.py tests/reviewers/test_reviewers_state.py passes.
- uv run pytest -q passes.
- uv run engineeringagent validate passes.
subtasks:
