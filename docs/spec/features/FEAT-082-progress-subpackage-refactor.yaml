id: FEAT-082
title: Refactor progress helpers into a shared engineeringagent.progress subpackage
type: chore
expected_commit_subject: "chore: refactor progress helpers into subpackage"
status: backlog
priority: medium
objective: |
  Improve discoverability and dependency layering by moving progress path and logging
  helpers into a dedicated `engineeringagent.progress` subpackage used by both loop
  telemetry and reviewers state persistence.
context: |
  Progress artifact path construction and writes are currently implemented as two
  top-level modules:

  - `src/engineeringagent/progress_paths.py`
  - `src/engineeringagent/progress_logging.py`

  These are used by both `engineeringagent.loop_runtime.telemetry` and
  `engineeringagent.reviewers`. Reviewers is a stable integration surface tied to
  `harness/reviewers.yaml`, and should not be forced to depend on
  `engineeringagent.loop_runtime.*` internals.
constraints:
  - "Do not change the `harness/reviewers.yaml` contract shape or prompt locations."
  - "Keep `engineeringagent.loop_runtime.*` internal; reviewers must not import loop_runtime internals as a result of this refactor."
  - "Update the progress locality fitness rule to reflect the new canonical module path for progress helpers."
  - "Breaking internal import paths is allowed (big-bang), but tests and fitness rules must be updated in the same change."
implementation_notes: |
  Contract/API delta (explicit):

  - Surface: internal module import paths for progress helpers.
    - Old behavior: imports use `engineeringagent.progress_paths` and `engineeringagent.progress_logging`.
    - New behavior: imports use `engineeringagent.progress.paths` and `engineeringagent.progress.logging`.

  - Surface: progress locality enforcement allowlist.
    - Old behavior: harness rule allowlists only `src/engineeringagent/progress_paths.py` for progress path literals.
    - New behavior: harness rule allowlists only `src/engineeringagent/progress/paths.py` for progress path literals.

  Compatibility policy:
  - This refactor is internal; CLI behavior must remain unchanged.
  - Reviewers runtime behavior and its relationship to `harness/reviewers.yaml` must remain unchanged.
acceptance:
  - "Progress helpers live under `src/engineeringagent/progress/` and are imported via `engineeringagent.progress.paths` and `engineeringagent.progress.logging`."
  - "`engineeringagent.reviewers` uses `engineeringagent.progress.*` and does not import `engineeringagent.loop_runtime.*`."
  - "The progress locality fitness rule (`architecture.progress-log-path-locality`) is updated to match the new canonical module path and remediation guidance."
  - "`uv run python -m engineeringagent.cli fitness run --format json` and `uv run pytest -q` pass."
subtasks:
  - id: ST-001
    title: Create engineeringagent.progress package and move helper modules
    status: backlog
    context: |
      Introduce `src/engineeringagent/progress/__init__.py`, move path helpers to
      `paths.py` and write helpers to `logging.py`.
    verification:
      - uv run ruff check src/engineeringagent
      - uv run pyright src/engineeringagent tests harness
  - id: ST-002
    title: Update imports in loop runtime and reviewers
    status: backlog
    context: |
      Update `engineeringagent.loop_runtime.telemetry` and `engineeringagent.reviewers`
      to import progress helpers from the new subpackage.
    verification:
      - uv run pytest -q tests/test_loop_output.py tests/test_reviewers_state.py
  - id: ST-003
    title: Update harness progress locality rule for new canonical module path
    status: backlog
    context: |
      Update `harness/fitness-functions/check_progress_log_locality.py` to allowlist
      `src/engineeringagent/progress/paths.py` and update remediation text to refer to
      `engineeringagent.progress.paths` and `engineeringagent.progress.logging`.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
      - uv run pytest -q tests/test_fitness_rules_logging_path_locality.py
  - id: ST-004
    title: Update any remaining references and regressions
    status: backlog
    context: |
      Update any tests or docs that reference the old progress helper module names,
      and confirm no regressions in progress path literal enforcement.
    verification:
      - uv run pytest -q
updated_at: "2026-02-15T00:00:00Z"
