id: FEAT-109
title: Canonical agent runner with typed output + internal retries
type: feature
expected_commit_subject: "feat: add canonical run_agent with typed output and retries"
status: backlog
priority: high
objective: >
  Introduce a single canonical agent boundary API (`engineeringagent.agents.run_agent`)
  that returns either plain text or Pydantic-validated structured outputs, with bounded
  internal same-session retries on JSON parse/validation failures. Ensure all production
  callsites stop calling OpenCode directly and do not implement schema prompting, JSON
  parsing, retry loops, or session plumbing, enabling future backend swaps away from
  OpenCode.

context: >
  Today, OpenCode invocation is wrapped by `engineeringagent.opencode.client.start_agent`,
  which exposes OpenCode-specific details such as `format="json"`, JSONL event stream
  parsing, and session reuse. Several higher layers still have to know how to request JSON
  output and implement retries when parsing/validation fails.

  We want a Pydantic-AI-like usage pattern:
  - Caller provides a prompt and an output type (`str` or a Pydantic schema).
  - The boundary validates and retries as needed.
  - Backend-specific structured-output mechanisms (native tools/json-schema vs prompted)
    are hidden inside `run_agent`.
  - Higher layers can be decoupled from OpenCode and later routed to alternative backends.

  Out of scope (explicit): long-lived multi-turn sessions across separate `run_agent`
  calls. `run_agent` may reuse backend sessions internally for parse/validation retries,
  but session ids must not become part of the caller-facing contract in this feature.

  Non-goal (explicit): moving/renaming `src/engineeringagent/opencode/**`. The OpenCode
  module remains in place; a follow-up feature may relocate it once the boundary is stable.

constraints:
  - "Add a canonical API: `engineeringagent.agents.run_agent(project_root, prompt, *, output_type=..., backend=..., max_validation_retries=...)`."
  - "The public contract of `run_agent` returns only the final output value: `str` or validated `T` (no result wrapper required for callers)."
  - "No caller-facing session support: session ids must not be accepted/returned by `run_agent` in this feature (internal retry-only use is allowed)."
  - "Boundary cleanup required: production code must not import or call `engineeringagent.opencode.client.start_agent` outside `engineeringagent/opencode/**` and `engineeringagent/agents/**`."
  - "Callers of `run_agent` must not be required to: pass backend formatting flags (e.g. `format=\"json\"`), inject JSON schema into prompts, parse JSON, or implement retry loops."
  - "Structured output contract: when `output_type` is provided and is not `str`, `run_agent` must validate output using Pydantic (e.g. `TypeAdapter`) and retry on JSON parse or validation failure with deterministic follow-up prompts."
  - "Retry policy: bounded same-session retries for backends that support sessions; OpenCode must reuse its session internally for validation retries."
  - "Backend strategy selection must happen inside `run_agent`, not in callsites. Schema injection mode (prompted/native/tools) must not be a caller responsibility."
  - "Determinism: retry prompts must be template-driven, bounded, and must not include absolute paths. Validation error text included in retry prompts must be truncated to a stable limit."
  - "Compatibility policy: this feature may refactor internal reviewer/loop/checks wiring, but external CLI behavior must remain stable (no new CLI required)."
  - "Fitness-function impact assessment: no fitness-function changes required, because enforcement will be covered by pytest guards and callsite refactors."

implementation_notes: |
  Contract change declaration (required)

  Surface: internal agent invocation interface used by checks reviewers and loop runtime.

  Old behavior:
  - Callers invoke OpenCode via `engineeringagent.opencode.client.start_agent(...)` and
    may pass `format="json"` to get structured fields.
  - Callers parse and validate structured outputs themselves and may implement ad-hoc
    retry loops using an OpenCode session id.

  New behavior:
  - Callers invoke `engineeringagent.agents.run_agent(...)` and specify only:
    - prompt (string)
    - output_type (`str` or schema type)
  - `run_agent` returns only the final output value (text or structured `T`).
  - `run_agent` owns:
    - choosing a backend and backend-specific structured-output request strategy
    - schema injection (when needed) and prompt shaping
    - JSON parsing and Pydantic validation
    - bounded internal retries with deterministic follow-up prompts
    - internal session reuse when supported (OpenCode: reuse session for validation retries)
  - Callers never pass OpenCode-specific flags like `format="json"` and never receive
    session ids as part of the primary API.

  Proposed module layout (normative intent; exact filenames may vary)
  - `src/engineeringagent/agents/api.py`
    - defines:
      - AgentBackend protocol/interface
      - `run_agent(...)` public API
      - typed exceptions for output validation failure
  - `src/engineeringagent/agents/backends/opencode.py`
    - implements AgentBackend using `engineeringagent.opencode.client.start_agent` as the
      subprocess runner; session reuse is internal to the backend/runner
  - `src/engineeringagent/opencode/client.py`
    - remains low-level OpenCode subprocess wrapper; it should not grow schema prompting
      or Pydantic validation responsibilities beyond extracting session_id/text payload

  Output type support
  - `output_type` supports:
    - `str` (plain text)
    - Pydantic model classes and other TypeAdapter-supported types (TypedDict/list/dict/etc)
  - Implementation uses `pydantic.TypeAdapter(output_type)` for schema generation + validation.

  Structured output strategy
  - `run_agent` selects the backend's preferred structured-output mechanism:
    - For OpenCode (current reality): use prompted JSON schema injection:
      - inject JSON schema into a wrapper prompt
      - require "output ONLY valid JSON" (no markdown/code fences)
      - parse model output with `json.loads`
      - validate with TypeAdapter
      - on failure, retry in the same OpenCode session with a follow-up prompt including
        a bounded validation error summary
    - For future backends: use native JSON schema response formats or tool calling as
      preferred by that backend without changing callsites (strategy remains internal)

  Failure surface
  - If structured output still fails after retries, `run_agent` raises a typed exception
    (e.g. `AgentOutputValidationError`) that includes:
    - backend name
    - attempts made
    - last raw text payload (bounded/truncated)
    - JSON parse error or Pydantic validation errors (bounded)
    - optional backend metadata (may include session id for debugging/logging, but not
      required by callers)

acceptance:
  - "A canonical agent API exists: `engineeringagent.agents.run_agent(...)` and is the supported way for production code to request structured agent outputs."
  - "The public contract of `run_agent` returns only `str` or validated `T` (no result wrapper required)."
  - "When structured output is requested, schema prompting + JSON parsing + Pydantic validation + bounded internal retries occur inside `run_agent` (not at callsites)."
  - "OpenCode validation retries reuse the same OpenCode session internally when available; session ids are not accepted/returned by callsites."
  - "No production module outside `engineeringagent/opencode/**` and `engineeringagent/agents/**` imports or references `engineeringagent.opencode.client.start_agent`."
  - "No production module outside `engineeringagent/agents/**` references OpenCode-specific structured-output flags (e.g. `format=\"json\"`)."
  - "`uv run pytest -q` passes."

subtasks:
  - id: ST-001
    title: Define canonical agent interface and typed exceptions
    status: backlog
    context: >
      Create `engineeringagent.agents` module with:
      - public `run_agent` API returning only the output value
      - AgentBackend interface
      - exceptions for structured output failures
      Ensure typing supports `str` and TypeAdapter-supported schemas.
    verification:
      - uv run python -c "import engineeringagent.agents as a; assert hasattr(a, 'run_agent'); print('ok')"
      - uv run pytest -q

  - id: ST-002
    title: Implement OpenCode backend and prompted-JSON strategy with internal retries
    status: backlog
    context: >
      Implement AgentBackend for OpenCode using `engineeringagent.opencode.client.start_agent`
      as the subprocess runner and session provider. Add prompted JSON schema injection,
      parsing, validation, and internal bounded same-session retries into `run_agent`.
    verification:
      - uv run pytest -q

  - id: ST-003
    title: Add unit tests for structured output validation and retry behavior
    status: backlog
    context: >
      Add tests that stub/mock the backend to simulate:
      - invalid JSON then valid JSON (internal same-session retry)
      - valid JSON but schema mismatch then corrected output
      - retry exhaustion => typed exception with bounded details
      Ensure determinism of retry prompt templates and truncation behavior.
    verification:
      - uv run pytest -q

  - id: ST-004
    title: Migrate all production callsites to use run_agent (remove start_agent usage)
    status: backlog
    context: >
      Refactor production code to depend on the canonical agent runner contract.
      This includes checks/loop/cli wiring and reviewers.

      Goals:
      - No imports of `engineeringagent.opencode.client.start_agent` outside
        `engineeringagent/opencode/**` and `engineeringagent/agents/**`.
      - No direct references to `format=\"json\"` outside `engineeringagent/agents/**`.
    verification:
      - uv run pytest -q

  - id: ST-005
    title: Add pytest guard preventing bypass of the agent boundary
    status: backlog
    context: >
      Add deterministic regression tests preventing:
      - importing `engineeringagent.opencode.client.start_agent` outside allowed modules
      - passing OpenCode-specific structured-output flags (e.g. `format=\"json\"`) outside
        `engineeringagent/agents/**`
    verification:
      - uv run pytest -q

