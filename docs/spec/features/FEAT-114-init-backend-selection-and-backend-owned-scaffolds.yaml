id: FEAT-114
title: Select agent backend during init and move backend scaffolds under agents
type: feature
expected_commit_subject: 'feat: select agent backend during init and scaffold config'
status: backlog
priority: high
objective: |
  Make backend choice an explicit init-time decision and ensure backend-specific
  scaffold files (e.g. .opencode/...) are owned by the backend implementation
  under `src/engineeringagent/agents/backends/**`.

  After this change, init/CLI code outside `agents/**` and `checks/**` must not
  contain backend-specific literal strings.
context: |
  Users want to swap backends, and the backend choice depends on backend-specific
  config files (e.g. `.opencode/agents/engineeringagent.md`).

  Today, init scaffolding and CLI help text hard-code OpenCode details under
  `src/engineeringagent/init_scaffold.py`, `src/engineeringagent/cli.py`, and
  `src/engineeringagent/scaffold_templates/**`, which increases coupling.

  Related specs and sequencing:

  - FEAT-113 introduces the backend registry and `engineeringagent.agents.list_backends()`
    / `engineeringagent.agents.resolve_backend_id()`. This init work builds on that.
  - FEAT-112 adds a backend-literal coupling budget that this feature should reduce.
  - FEAT-115 cannot reach a strict "no backend literals outside agents/checks" state
    until init/CLI scaffolding is also backend-agnostic.
constraints:
- >-
  Precondition: FEAT-113 is done (backend registry + list_backends + resolve_backend_id).
- |-
  Init must support backend selection.
  Requirements:
  - Add `engineeringagent init --backend <id>`.
  - When omitted and running on a TTY, prompt for backend selection.
  - When omitted and not a TTY, default deterministically to the agents registry
    default backend id.
- |-
  Backend prompt UX contract (for deterministic tests):
  - If the backend is already configured (engineeringagent.toml contains
    `[agents] backend`), do not prompt unless `--force` is used.
  - Prompt only when `--backend` is omitted AND stdout is a TTY AND more than one
    backend exists.
  - Backend ids shown in the prompt must be sorted and rendered as `[id1/id2/...]`.
  - The default backend id shown in the prompt must be the agents registry default
    backend id (the same value used when backend config is absent).
  - Prompt text must be exactly:
    `init backend: choose [<ids>] (default <default_id>): `
  - Empty input selects the default backend id.
  - EOF (stdin closed) selects the default backend id.
  - Invalid input returns an error and exit code 1 without reprompting.
    Error text must be exactly:
    `init input error: backend must be one of: <id1>, <id2>, ...`
  - When only one backend exists, init selects it without prompting.
- >-
  Init must persist backend selection to `engineeringagent.toml` under `[agents]`.
- >-
  Backend-specific scaffold files must be contributed by backend-owned code under
  `src/engineeringagent/agents/backends/<id>/**`.
- >-
  Remove backend-specific literal strings from modules outside `agents/**` and
  `checks/**` that participate in init/scaffolding (including moving or deleting
  OpenCode-specific templates under `src/engineeringagent/scaffold_templates/**`).
- >-
  Keep current init behavior stable for other scaffold outputs (docs root, packs,
  AGENTS conflict handling).
- >-
  Fitness-function impact assessment: this feature is expected to reduce the
  violation count enforced by `architecture.backend-literal-locality-budget`.
- >-
  Recommended sequencing: implement FEAT-112 before FEAT-114 so coupling budgets are tracked.
implementation_notes: |
  CLI contract

  - `engineeringagent init --help` must not mention any specific backend name or
    backend-specific paths.
  - The existing `--model` option should be treated as a generic agent-model
    setting used by backends that support it. Help text must be backend-agnostic.

  Scaffolding contract

  - Refactor scaffold generation to combine:
    - baseline scaffold manifest (generic files)
    - backend-contributed manifest entries (backend config files)
  - Backend assets should be loaded using `importlib.resources` within the backend
    package.

  Config persistence

  - When init writes `engineeringagent.toml`, it must include both:
    - top-level docs-root when using separate docs
    - `[agents] backend = "..."` always
  - The content should be deterministic and end with a newline.

  Determinism note

  - Keep backend prompting behavior aligned with existing init prompt helpers:
    a single prompt attempt, no loops, stable prompt strings, and stable error
    messages.
acceptance:
- engineeringagent init supports --backend and an interactive backend prompt on TTY when omitted.
- >-
  After a successful init run, engineeringagent.toml contains [agents] backend = "<id>".
  If the file already exists and backend is already configured, init preserves the
  configured value unless --force is used.
- OpenCode-specific scaffold templates and path literals no longer live under src/engineeringagent/scaffold_templates/** or src/engineeringagent/init_scaffold.py.
- src/engineeringagent/cli.py and src/engineeringagent/init_scaffold.py do not contain backend-specific literal strings.
- uv run pytest -q passes.
subtasks:
- id: ST-001
  title: Add backend selection resolution logic to init command
  status: backlog
  context: |
    Add `--backend` to init. When missing and TTY, prompt using
    `engineeringagent.agents.list_backends()`.

    Ensure behavior matches the prompt UX contract in constraints (default/EOF/
    invalid input/only-one-backend).
  verification:
  - uv run pytest -q tests/cli/test_init_command.py
- id: ST-002
  title: Persist backend choice to engineeringagent.toml during init
  status: backlog
  context: |
    Update init to ensure engineeringagent.toml contains `[agents] backend = "..."`.

    Determinism requirements:
    - If the file does not exist, create it.
    - If the file exists and does not contain an agents.backend value, append a
      new `[agents]` table with the selected backend.
    - If the file exists and contains an agents.backend value, do not change it
      unless --force is used.
  verification:
  - uv run pytest -q tests/cli/test_init_command.py
- id: ST-003
  title: Move OpenCode scaffold templates under agents/backends/opencode
  status: backlog
  context: |
    Relocate the OpenCode agent policy template and gitignore template out of
    `src/engineeringagent/scaffold_templates/**` into backend-owned resources.
  verification:
  - uv run pytest -q
- id: ST-004
  title: Refactor init_scaffold to compose baseline + backend manifest
  status: backlog
  verification:
  - uv run pytest -q tests/cli/test_init_command.py
  - uv run pytest -q
- id: ST-005
  title: Make init --help and model help text backend-agnostic
  status: backlog
  verification:
  - uv run pytest -q tests/cli/test_init_command.py
- id: ST-006
  title: Remove OpenCode harness toggle resolution from engineeringagent.config
  status: backlog
  context: |
    To satisfy backend-literal locality outside agents/checks, move OpenCode-named
    harness toggle resolvers out of `src/engineeringagent/config.py` into
    `src/engineeringagent/checks/**` (which is allowed to contain backend-specific
    logic).
  verification:
  - uv run pytest -q tests/config
  - uv run pytest -q
