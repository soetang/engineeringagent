id: FEAT-009
title: Remove scripts folder and canonicalize command entrypoints
status: done
priority: high
objective: Eliminate generic script-wrapper workflows by moving any necessary automation
  to domain-owned locations and documenting canonical `uvx --from . engineeringagent
  ...` commands for contributors.
context: 'The current `scripts/` directory mixes thin wrappers and validation helpers,
  which makes ownership unclear and command discovery inconsistent. Contributors should
  run stable CLI entrypoints directly, while any remaining automation should live
  in purpose-specific locations (not a generic scripts bucket).

  '
constraints:
- Do not keep a generic `scripts/` folder for primary developer workflows.
- Use `uvx --from . engineeringagent ...` as the canonical documented command style.
- Keep validation explicit as separate lint/test/spec commands (no single mega-wrapper).
- Remove legacy script paths immediately (no deprecation shims).
- Ensure docs and CI run the same documented commands.
implementation_notes: 'Replace wrapper scripts with direct CLI usage and add missing
  CLI surface where needed so no required workflow depends on path-based wrappers.
  If shell automation remains necessary, place it under a domain-owned path (for example
  `harness/` or `ci/`) with clear naming and intent.

  '
acceptance:
- No required contributor workflow depends on files under `scripts/`.
- README and reference docs describe canonical commands without `scripts/...` paths.
- 'Validation is documented as three explicit checks: lint, test, and spec validation.'
- Gate/pre-commit/CI invocations use the same documented entrypoints.
- A command mapping is documented for removed script paths to new entrypoints.
subtasks:
- id: ST-001
  title: Inventory current scripts and define old-to-new command mapping
  status: done
  context: 'Capture each existing script behavior and map it to either a canonical
    CLI command or a purpose-owned automation location. This mapping is the migration
    contract used by docs and CI updates.

    '
  verification:
  - python3 -c "from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8');
    assert 'Command mapping' in t; print('ok')"
  attempts: 1
  notes:
  - Added a README command-mapping table that inventories every current scripts/ entrypoint
    and maps each one to canonical `uvx --from . engineeringagent ...` usage or a
    gate-owned profile entrypoint.
- id: ST-002
  title: Remove generic scripts folder and relocate only purpose-specific automation
  status: done
  context: 'Delete wrapper-style scripts and move any genuinely needed automation
    to domain-owned paths with explicit names and ownership.

    '
  verification:
  - python3 -c "from pathlib import Path; assert not Path('scripts').exists(); print('ok')"
  - uvx --from . engineeringagent --help
  attempts: 1
  notes:
  - Removed the generic `scripts/` directory, including thin wrapper entrypoints and
    cached bytecode artifacts.
  - Relocated remaining purpose-owned automation to `harness/` (`harness/fitness-functions/validate_yaml.py`
    and `harness/fitness-functions/permission_probe.py`) and updated gate/pre-commit
    invocation paths.
- id: ST-003
  title: Ensure canonical CLI coverage for workflows previously reached via scripts
  status: done
  context: 'Any workflow that required a script path must be reachable via stable
    `engineeringagent` CLI commands so contributors can run functions directly.

    '
  verification:
  - uvx --from . engineeringagent validate --schema-only
  - uvx --from . engineeringagent gates list
  - uvx --from . engineeringagent gates run --profile precommit
  attempts: 1
  notes:
  - Verified canonical CLI coverage by running schema validation and gate profile
    commands through `uvx --from . engineeringagent ...` with successful results.
- id: ST-004
  title: Rewrite docs to scriptless command usage with explicit lint/test/spec sections
  status: done
  context: 'Update README and reference docs to show scriptless usage, including distinct
    lint, test, and spec validation commands and a migration mapping table.

    '
  verification:
  - python3 -c "from pathlib import Path; files=['README.md','docs/references/uv-workflow.md','AGENTS.md'];
    bad=[f for f in files if 'scripts/' in Path(f).read_text(encoding='utf-8')]; assert
    not bad, bad; print('ok')"
  - python3 -c "from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8').lower();
    assert 'lint' in t and 'test' in t and 'spec' in t; print('ok')"
  attempts: 1
  notes:
  - Updated `README.md`, `docs/references/uv-workflow.md`, and `AGENTS.md` to use canonical
    `uvx --from . engineeringagent ...` command entrypoints with no `scripts/` paths.
  - Added an explicit README validation section that separates lint, test, and spec
    validation commands.
- id: ST-005
  title: Align CI with documented scriptless commands
  status: done
  context: 'Update or add CI workflow definitions so automated checks execute the
    same command set documented for contributors.

    '
  verification:
  - python3 -c "from pathlib import Path; wdir=Path('.github/workflows'); files=list(wdir.glob('*.yml'))+list(wdir.glob('*.yaml'));
    assert files, 'missing CI workflow'; txt='\n'.join(p.read_text(encoding='utf-8')
    for p in files); assert 'uvx --from . engineeringagent validate' in txt; assert
    'pytest -q' in txt; print('ok')"
  attempts: 1
  notes:
  - 'Added `.github/workflows/ci.yaml` using scriptless canonical commands: `uvx --from
    . engineeringagent gates run --profile precommit`, `pytest -q`, and `uvx --from
    . engineeringagent validate`.'
