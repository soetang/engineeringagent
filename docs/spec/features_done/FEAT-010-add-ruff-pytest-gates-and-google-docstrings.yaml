id: FEAT-010
title: Add Ruff and pytest gates with Google-docstring enforcement
status: done
priority: high
objective: Add Ruff-based linting and pytest execution to the harness precommit profile,
  enforce Google-style docstrings for exported (public) functions in src/engineeringagent,
  add a Python uv+Ruff contributor guide referenced from AGENTS.md, and scaffold harness/gates.yaml
  for users when it is missing.
context: 'Current precommit checks only cover YAML/spec validation. We need lint and
  test enforcement in the gate pipeline, plus docstring quality enforcement via Ruff
  for public function APIs in the main package.

  '
constraints:
- Keep .pre-commit-config.yaml on the single stable entrypoint (uvx --from . engineeringagent
  gates run --profile precommit).
- Enforce docstring rules only for Ruff-public functions in src/engineeringagent (non-underscore
  defs), not tests or harness scripts.
- Use Ruff for docstring enforcement with Google convention.
- Keep validation commands deterministic and uv-based.
- When harness/gates.yaml is missing, create it with project default gate profiles
  and commands.
implementation_notes: 'Add Ruff and pytest as project tooling dependencies, define
  Ruff config in pyproject.toml for Google-style docstring checks on public functions,
  then wire new ruff_validate and pytest_validate gates into harness/gates.yaml under
  precommit. Add bootstrap behavior so users get a default harness/gates.yaml when
  absent. Update docs so contributors know precommit now includes Ruff and pytest,
  add a Python guide focused on uv and Ruff, reference that guide from AGENTS.md,
  and ensure public functions in src/engineeringagent have compliant Google docstrings.

  '
acceptance:
- harness/gates.yaml precommit profile includes Ruff and pytest gates in addition
  to existing validators.
- Ruff config enforces Google-style public-function docstrings (D103, D417) for src/engineeringagent.
- Public functions in src/engineeringagent satisfy Ruff docstring checks.
- Contributor docs are updated to reflect Ruff + pytest in the precommit workflow
  and command references.
- A Python guide for uv + Ruff exists under docs/references and is linked from AGENTS.md.
- If harness/gates.yaml is missing, workflow provides a default generated file with
  expected profiles.
- uvx --from . engineeringagent gates run --profile precommit passes end-to-end.
subtasks:
- id: ST-001
  title: Add Ruff and pytest tooling configuration
  status: done
  context: Ensure project tooling includes Ruff and pytest and that lock/sync workflows
    remain uv-native.
  verification:
  - uv sync
  - uv run ruff --version
  - uv run pytest --version
- id: ST-002
  title: Add Ruff and pytest gates to precommit profile
  status: done
  context: Extend `harness/gates.yaml` with `ruff_validate` and `pytest_validate`,
    then include both in `profiles.precommit`.
  verification:
  - python3 -c "from pathlib import Path; import yaml; cfg=yaml.safe_load(Path('harness/gates.yaml').read_text(encoding='utf-8'));
    pre=cfg['profiles']['precommit']; assert 'ruff_validate' in pre and 'pytest_validate'
    in pre; assert cfg['gates']['ruff_validate']['run'] == 'uv run ruff check src/engineeringagent';
    assert cfg['gates']['pytest_validate']['run'] == 'uv run pytest -q'; print('ok')"
  - uvx --from . engineeringagent gates list
- id: ST-003
  title: Enforce Google docstrings for exported src functions via Ruff
  status: done
  context: Configure Ruff pydocstyle with Google convention and required rules for
    public functions, then add missing docstrings in `src/engineeringagent` until
    clean.
  verification:
  - uv run ruff check src/engineeringagent --select D103,D417
  - uv run ruff check src/engineeringagent
- id: ST-004
  title: Add Python uv+Ruff guide and AGENTS reference
  status: done
  context: Add a concise Python contributor guide covering uv workflow, Ruff usage,
    and docstring expectations, then link it from AGENTS.md so it is discoverable
    in the default read order.
  verification:
  - python3 -c "from pathlib import Path; guide=Path('docs/references/python-uv-ruff-llms.md');
    agents=Path('AGENTS.md'); assert guide.exists(); gt=guide.read_text(encoding='utf-8').lower();
    at=agents.read_text(encoding='utf-8').lower(); assert 'uv' in gt and 'ruff' in
    gt and 'pytest' in gt; assert 'python-uv-ruff-llms.md' in at; print('ok')"
- id: ST-005
  title: Update README and uv workflow docs for new checks
  status: done
  context: Update README.md and docs/references/uv-llms.md to reflect Ruff + pytest
    checks and command usage within precommit and daily workflow docs.
  verification:
  - python3 -c "from pathlib import Path; files=['README.md','docs/references/uv-llms.md'];
    text='\n'.join(Path(f).read_text(encoding='utf-8').lower() for f in files); assert
    'ruff' in text and 'pytest' in text and 'precommit' in text; print('ok')"
- id: ST-006
  title: Run full precommit profile verification
  status: done
  context: Confirm all configured precommit gates run successfully with the new checks
    enabled.
  verification:
  - uvx --from . engineeringagent gates run --profile precommit
  - uv run ruff check src/engineeringagent
  - uv run pytest -q
- id: ST-007
  title: Scaffold default harness gates file for users
  status: done
  context: Define and implement a bootstrap path that creates harness/gates.yaml with
    default profiles and gate commands when the file is absent, so new users can run
    documented gate workflows immediately.
  verification:
  - python3 -c "import tempfile, shutil; from pathlib import Path; root=Path(tempfile.mkdtemp());
    src=Path('.'); shutil.copytree(src/'src', root/'src', dirs_exist_ok=True); shutil.copy2(src/'pyproject.toml',
    root/'pyproject.toml'); result=__import__('subprocess').run(['uvx','--refresh','--from','.','engineeringagent','--project-root',str(root),'gates','list'],
    cwd='.', capture_output=True, text=True); assert result.returncode == 0; cfg=root/'harness'/'gates.yaml';
    assert cfg.exists(); txt=cfg.read_text(encoding='utf-8').lower(); assert 'precommit'
    in txt and 'loop_fast' in txt; print('ok')"
