objective: 'Publish a clear human-facing documentation update that explains the guiding
  harness engineering principles behind EngineeringAgent, with a concise README entry
  and a deeper principles document, while applying only minimal agent-doc alignment
  to keep execution guidance coherent.

  '
context: 'The user wants a docs-principles feature inspired by practitioner experience
  and external harness-engineering references, with no code behavior changes. The
  update should be primarily for humans, written in English, and explicitly cover
  six concepts: Ralph Loop, progressive disclosure, structured YAML specs, automatic
  validation, fitness functions, and planned agent reviewers.

  Placement and scope confirmed by interview: - Human-facing content should live in
  README plus a new deeper doc. - Agent docs should receive light alignment only when
  it improves clarity. - Verification should use docs checks plus `engineeringagent
  validate`.

  '
constraints:
- No code or runtime behavior changes; this feature is documentation-only.
- Keep README concise and outcome-first; move deeper explanation to a dedicated human
  doc.
- Keep repository docs language in English.
- Explicitly document all six principles in scope, including that agent reviewers
  are planned/future.
- 'Preserve audience split from FEAT-017: human onboarding in README, deterministic
  agent rules in AGENTS/references.'
- Any agent-doc updates must be minimal and strictly for clarity/alignment with human
  docs.
implementation_notes: 'Add a concise principles section in `README.md` that links
  to a new human-focused deep-dive,

  proposed at `docs/principles/harness-engineering-principles.md`.


  The deep-dive should frame each concept as practical workflow guidance:

  1) Ralph Loop (short context windows / frequent resets)

  2) Progressive disclosure through references

  3) Structured YAML specs for deterministic execution

  4) Automatic validation each iteration

  5) Fitness functions for architecture/design integrity

  6) Agent reviewers as a planned complement when automated checks are insufficient


  Keep tone pragmatic and operator-focused. For agent alignment, only add short references
  in

  `AGENTS.md` and/or `docs/references/docs-architecture.md` if needed so agents can
  route

  users to the new human principles doc without mixing audiences.

  '
acceptance:
- README includes a concise, human-readable principles update and links to a deeper
  principles document.
- A new human-facing principles doc exists under `docs/` and clearly explains all
  six concepts in scope.
- The principles doc references external context where useful, including OpenAI harness
  engineering and Ralph Loop.
- Agent reviewers are explicitly labeled as planned/future capability, not current
  behavior.
- Any AGENTS/reference updates are minimal, preserve audience boundaries, and improve
  discoverability only.
- Documentation changes introduce no code-path or CLI behavior changes.
- Markdown/docs checks and `engineeringagent validate` pass for the changed files.
