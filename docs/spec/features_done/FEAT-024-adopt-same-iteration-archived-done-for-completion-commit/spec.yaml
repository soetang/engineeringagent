id: FEAT-024
title: Adopt same-iteration archived done feature for completion commit
type: bug
expected_commit_subject: 'fix: add FEAT-024 adopt same-iteration archived-done completion
  path'
planning_tier: planned
status: done
priority: high
objective: 'Ensure `engineeringagent run` can complete a selected feature when implement
  moves that same feature spec to `docs/spec/features_done/` with `status: done` within
  the same iteration, by continuing gates and attempting completion commit instead
  of failing as feature-missing.

  '
context: 'Current loop behavior enforces a strict per-feature completion-commit boundary
  and fails when the active selected path disappears and only an archived done counterpart
  exists before loop-owned completion signaling. This is safe but blocks a common
  flow where implement already moved the selected spec to `features_done` in the same
  iteration.

  User-confirmed intent: allow this same-iteration moved-and-done case to be adopted
  as the same feature identity and proceed to gate + completion commit, while preserving
  deterministic retry behavior by restoring active path on gate/commit failure.

  '
constraints:
- Limit changes to run-loop behavior and loop-focused tests; do not change validator
  or gate profile definitions.
- Adoption is allowed only when the selected feature started from active path in the
  current iteration and was moved to archived path during that iteration.
- 'Archived fallback payload must be `status: done` to qualify for adoption.'
- If any gate fails after adoption, restore the feature spec to `docs/spec/features/<name>.yaml`
  for deterministic retry.
- If completion commit fails after adoption, restore the feature spec to `docs/spec/features/<name>.yaml`
  for deterministic retry.
- Preserve deterministic telemetry semantics (`result`, `failed_gate`, `next_action`)
  and latest-only retry feedback behavior.
- Preserve strict failure behavior for archived-at-start scenarios that do not satisfy
  same-iteration adoption conditions.
implementation_notes: 'Update `_run_feature_iteration` to distinguish between archived
  fallback found at iteration start versus archived fallback produced by implement
  in the same iteration. For the latter, treat active and archived paths as the same
  selected feature identity and continue with gate execution and completion commit
  flow.

  Reuse existing rollback helpers so adopted archive state is restored to active path
  whenever gates or completion commit fail.

  Update loop regression tests that currently assert failure for same-iteration moved-to-archive
  cases, and add focused coverage for gate/commit failure rollback under the adoption
  path.

  '
acceptance:
- 'When selected feature starts active and implement moves it to `docs/spec/features_done/<name>.yaml`
  with `status: done` in the same iteration, loop does not fail with `feature_missing`
  solely due to that move.'
- Loop continues through gate execution and completion-commit attempt for the adopted
  same-iteration archived done feature.
- If gates fail after adoption, spec is restored to active path and loop remains retryable
  on the same selected feature path.
- If completion commit fails after adoption, spec is restored to active path and loop
  remains retryable on the same selected feature path.
- Archived-at-start scenarios that did not originate from same-iteration active selection
  still fail deterministically with actionable guidance.
- Targeted loop regressions and schema validation pass.
artifacts:
