id: FEAT-081
title: Standardize fitness result envelope helpers and constrain harness-to-src imports
type: chore
expected_commit_subject: 'chore: standardize fitness envelope helpers'
planning_tier: planned
status: done
priority: medium
objective: 'Make fitness-function authoring easier and more consistent by providing
  a single

  supported result-envelope helper surface under `engineeringagent.fitness.*`, and

  prevent harness scripts from importing arbitrary `src/` internals by enforcing a

  narrow harness-to-src import allowlist.

  '
context: 'Today, harness fitness functions emit results via a local helper

  `harness/fitness_functions/result_envelope.py`, while the canonical schema and

  contract version live under `src/engineeringagent/fitness/contracts.py`.


  This duplication risks drift in contract versioning and makes it unclear which

  modules are safe for harness scripts to depend on.

  '
constraints:
- Fitness rule results must continue to validate against `engineeringagent.fitness.contracts.FitnessRuleResult`
  (contract_version=1.0).
- Harness fitness-function scripts may import a small, explicit allowlist from `engineeringagent.*`;
  by default this allowlist should only include `engineeringagent.fitness.*`.
- Harness fitness-function scripts must not import orchestration/runtime internals
  (e.g. `engineeringagent.loop`, `engineeringagent.loop_runtime.*`, `engineeringagent.cli`).
- Result envelope emission must be deterministic (stable keys; stable encoding; no
  surrounding text).
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: harness fitness-function\
  \ scripts' import source for emitting result envelopes.\n  - Old behavior: scripts\
  \ import `emit_result_envelope` from `harness/fitness_functions/result_envelope.py`.\n\
  \  - New behavior: scripts import `emit_result_envelope` from `src/engineeringagent/fitness/envelope.py`.\n\
  \n- Surface: allowed harness-to-src dependency surface.\n  - Old behavior: no explicit\
  \ enforcement; harness scripts may import arbitrary `engineeringagent.*` modules.\n\
  \  - New behavior: a fitness function enforces that harness scripts import only\
  \ from an explicit allowlist\n    (initially `engineeringagent.fitness.*`), with\
  \ deterministic diagnostics.\n\nCompatibility policy:\n- CLI behavior is unchanged.\n\
  - Harness scripts remain runnable via the existing command adapter (e.g. `uv run\
  \ python harness/fitness_functions/...`).\n- This is an intentional internal refactor;\
  \ downstream Python imports of harness helpers are not supported.\n"
acceptance:
- A new module `src/engineeringagent/fitness/envelope.py` provides a canonical `emit_result_envelope(...)`
  helper that uses `engineeringagent.fitness.contracts.CONTRACT_VERSION`.
- All harness fitness-function scripts import `emit_result_envelope` from `engineeringagent.fitness.envelope`
  and continue to emit JSON objects that validate as `FitnessRuleResult`.
- '`harness/fitness_functions/result_envelope.py` is removed or no longer used by
  any harness fitness function.'
- A new harness fitness function enforces a harness-to-src import allowlist for harness
  fitness-rule scripts under `harness/fitness_functions/` (e.g. `check_*.py`) and
  is registered in `harness/fitness_functions/rules.yaml`.
- '`uv run python -m engineeringagent.cli fitness run --format json` and `uv run pytest
  -q` pass.'
artifacts:
  plan: plan.md
