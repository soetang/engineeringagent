id: FEAT-074
title: Make python_uv scaffold run minimal ruff checks without pyright or repo config
type: feature
expected_commit_subject: 'feat: update python_uv scaffold to run ruff via uvx'
status: done
priority: high
objective: 'Update the `python_uv` scaffold profile to ship Python validation without
  requiring

  any changes to repo TOML/config files and without scaffolding pyright.


  Specifically:

  - add a ruff gate that runs base checks in isolated mode

  - do not add pyright gates or pyright config

  - fix python_uv pre-commit entry to not assume the target repo contains engineeringagent
  source

  '
context: '`python_uv` currently changes only pre-commit wiring and includes a commit-msg
  hook,

  but it does not provide a useful validation baseline (because init currently scaffolds

  empty gate profiles). It also uses `uvx --from . engineeringagent ...`, which assumes

  the target repo contains engineeringagent as a local package.

  '
constraints:
- Do not scaffold pyright config files.
- Do not add a pyright gate to scaffolded `harness/gates.yaml`.
- Ruff validation must not require repo-local ruff config; use `ruff --isolated`.
- Ruff gate must run via `uvx` (tooling is self-contained for python_uv).
- 'Ruff gate command is exactly: `uvx ruff check --isolated .`'
- Update `src/engineeringagent/scaffold_templates/precommit.python_uv.yaml` to use
  `uvx engineeringagent ...` (not `uvx --from . engineeringagent ...`).
- Keep core profile tool-agnostic; these changes apply only to `python_uv`.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `python_uv` scaffolded\
  \ `.pre-commit-config.yaml`.\n  - Old behavior: `entry: uvx --from . engineeringagent\
  \ gates run --profile precommit`\n  - New behavior: `entry: uvx engineeringagent\
  \ gates run --profile precommit`\n\n- Surface: `python_uv` scaffolded gate inventory.\n\
  \  - Old behavior: empty precommit gates by default.\n  - New behavior: includes\
  \ at least `spec_validate`, `fitness_validate`, and a\n    `ruff_validate` gate\
  \ using `uvx ruff check --isolated ...`.\n\nCompatibility policy:\n- The `core`\
  \ scaffold profile remains unchanged by this spec.\n"
acceptance:
- python_uv scaffolded `.pre-commit-config.yaml` uses `uvx engineeringagent ...` (no
  `--from .`).
- 'python_uv scaffolded `harness/gates.yaml` includes a ruff gate that runs: `uvx
  ruff check --isolated .`'
- python_uv scaffold contains no pyright gate and does not scaffold pyright config
  files.
- All init-related tests pass.
