id: FEAT-119
title: Finish agents backend decoupling cleanup (backend resolution stays inside agents)
type: chore
expected_commit_subject: 'chore: finish agents backend decoupling cleanup'
planning_tier: planned
status: done
priority: high
objective: "Complete the agent-backend decoupling so production callsites cannot select\
  \ or\nconstruct agent backends.\n\nAfter this change:\n- Backend resolution happens\
  \ only inside `engineeringagent.agents`.\n- `run_agent` no longer accepts a backend\
  \ override.\n- The remaining backend-coupling budget is tightened to zero.\n- Backend-owned\
  \ scaffold assets can be honest Markdown again (no extension hacks),\n  while still\
  \ satisfying repository markdown locality policies.\n"
context: "Recent features moved OpenCode under `src/engineeringagent/agents/backends/**`\
  \ and\nintroduced a backend registry + config selection.\n\nRemaining coupling indicates\
  \ we partially \"hid\" backend details rather than fully\nremoving them:\n- `engineeringagent.agents.run_agent`\
  \ still accepts a `backend` input.\n- Reviewers can pass a backend object into `run_agent`.\n\
  - `src/engineeringagent/agents_defaults.py` still exists and trips the backend\n\
  \  literal-locality budget.\n- The OpenCode agent-policy scaffold template was renamed\
  \ to a non-markdown file\n  extension to satisfy markdown-locality constraints.\n"
constraints:
- 'Precondition: FEAT-115 is done (core loop is backend-agnostic).'
- Remove the `backend` parameter from `engineeringagent.agents.run_agent` and update
  all production callsites and tests to use backend resolution inside `engineeringagent.agents`.
- Remove the reviewer-level backend override seam by deleting `ReviewerRunRequest.agent_backend`
  and stopping any propagation of backend objects from reviewer wiring into `run_agent`.
- Preserve the ability to run deterministic tests by injecting backends through the
  agents registry + repo config (tests set `[agents] backend = "..."` in a temp `engineeringagent.toml`
  and monkeypatch/register backend factories as needed).
- Delete `src/engineeringagent/agents_defaults.py` by moving the OpenCode default
  agent id constant under the OpenCode backend package.
- 'Replace the OpenCode agent-policy scaffold asset extension hack:

  - Allow backend-owned scaffold markdown assets under `src/engineeringagent/agents/backends/**/scaffold_templates/**`.

  - Rename `agent.engineeringagent.template` back to a `.md` asset.

  - Adjust markdown locality/reference-coverage fitness rules so backend-owned scaffold
  templates do not require non-self path references.'
- Tighten `architecture.backend-literal-locality-budget` to a strict zero baseline.
- 'Update `docs/spec/features/FEAT-117-add-codex-cli-backend.yaml` so the intended
  contract is explicit: backend selection/resolution is internal to `engineeringagent.agents`,
  and `run_agent` does not accept a backend override.'
- 'Fitness-function impact assessment: expected fitness updates are limited to the
  markdown locality/reference coverage fitness rule (and its tests) to accommodate
  backend-owned scaffold markdown assets; no new rules should be added.'
implementation_notes: "Contract change declaration (required)\n\nSurface: `engineeringagent.agents.run_agent`\
  \ API (internal callsites) and reviewer\ninvocation wiring.\n\nOld behavior:\n-\
  \ `run_agent(project_root, prompt, *, output_type=..., backend=..., ...)` accepts\
  \ an\n  optional backend object override.\n- Reviewer execution may pass an `agent_backend`\
  \ object into `run_agent`.\n- Tests commonly inject a fake backend by passing `backend=`\
  \ directly.\n\nNew behavior:\n- `run_agent(project_root, prompt, *, output_type=...,\
  \ ...)` does not accept a\n  backend object.\n- Backend selection is always resolved\
  \ inside `engineeringagent.agents` using repo\n  configuration + the agents registry.\n\
  - Reviewers do not accept or pass backend objects; they rely on `run_agent`.\n-\
  \ Tests inject fake backends by setting `[agents] backend` and registering a backend\n\
  \  id in the agents registry (or monkeypatching the registry mapping).\n\nCompatibility\
  \ policy:\n- Immediate internal break (no deprecation period). Update all internal\
  \ callsites\n  and tests in the same change.\n\nMarkdown locality policy update:\n\
  - The markdown-locality/reference-coverage fitness rule should treat backend-owned\n\
  \  scaffold template directories as approved markdown locality roots.\n- Backend-owned\
  \ scaffold templates should be exempt from the non-doc markdown\n  reference-coverage\
  \ requirement because they are referenced via\n  `importlib.resources`, not literal\
  \ path strings.\n"
acceptance:
- '`engineeringagent.agents.run_agent` has no `backend` parameter and all production
  callsites compile and pass tests without backend overrides.'
- Reviewer execution no longer accepts/passes backend objects, and reviewers still
  return deterministic parser-failure envelopes when agent execution fails.
- '`src/engineeringagent/agents_defaults.py` is removed and no longer appears in the
  backend literal-locality scan.'
- The OpenCode agent-policy scaffold asset is a `.md` file under `src/engineeringagent/agents/backends/opencode/scaffold_templates/`.
- Markdown locality/reference-coverage fitness passes without relying on non-markdown
  extension workarounds for backend-owned scaffold templates.
- '`architecture.backend-literal-locality-budget` passes with baseline set to 0.'
- FEAT-117 spec text reflects the new `run_agent` contract (no backend parameter).
- '`uv run pytest -q` passes.'
- '`uv run engineeringagent validate` passes.'
artifacts:
  plan: plan.md
