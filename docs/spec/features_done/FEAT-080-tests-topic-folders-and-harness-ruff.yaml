- id: ST-006
  title: Update README troubleshooting for init hooks and OpenCode retries
  status: done
  context: 'Reviewer feedback: document that `engineeringagent init` skips pre-commit

    hook installation when `.git/` does not exist (and that `git init` should be run

    before `engineeringagent init` when hooks are expected).

    Also document that `engineeringagent run` retries up to `--max-iterations`

    (default 50), and that `--max-iterations 1` helps fail fast when debugging

    OpenCode timeouts.

    Progress (2026-02-16): updated README so the first non-dry `engineeringagent run`
    example uses a longer OpenCode timeout by default (to avoid clean-room `opencode_timeout`
    failures), documented that `init` can also skip hook installation when `pre-commit`
    is not available on PATH, and aligned the readme_process reviewer prompt outline
    with the README''s validate/gates steps.

    Progress (2026-02-16): tightened the README Quickstart indentation rules (Quickstart
    content indented <= 3 spaces; no 4-space indentation outside code fences) so notes
    render as list paragraphs (not indented code blocks) in common Markdown renderers.
    Updated `README.md` to match and strengthened the meta test to prevent regressions.

     Progress (2026-02-16): enabled the `readme_process` reviewer in `harness/reviewers.yaml`
     and updated `README.md` to document init hook-installation skip cases and OpenCode
     retry/max-iterations guidance.

     Progress (2026-02-16): updated `README.md` to include a source-run callout using
     `.engineeringagent/bin/engineeringagent`, clarified first non-dry-run cleanliness
     expectations (untracked `init` output can be swept into the first loop commit),
     clarified that the loop may auto-archive `status: done` specs into
     `docs/spec/features_done/`, and clarified that `harness/reviewers.yaml` is created
     by `engineeringagent reviewers init`. Added a committed `.engineeringagent/bin/engineeringagent`
     helper script for contributors.

     '
  verification:
  - uv run pytest -q tests/reviewers/test_repo_readme_process_reviewer_activation.py
