- id: ST-002
  title: Fix tests that compute repo root via Path(__file__).parents
  status: done
  context: 'Update tests that use `Path(__file__).resolve().parents[1]` so they still

    resolve the repository root after being moved one directory deeper.

    Prefer a robust approach that remains correct if additional nesting is

    introduced later (e.g. pytest rootpath fixture or a centralized helper).

    Progress (2026-02-16): updated `tests/loop/test_loop_contracts.py` to resolve
    `harness/fitness-functions/*` scripts via `pytestconfig.rootpath` instead of `Path(__file__).resolve().parents[1]`.

    Progress (2026-02-16): updated `tests/vcs/test_commit_message_validation.py` to
    resolve the repo root via `pytestconfig.rootpath` instead of `Path(__file__).resolve().parents[1]`.

    Progress (2026-02-16): added a shared `repo_root` fixture in `tests/conftest.py`,
    updated remaining tests to use `repo_root`/`pytestconfig.rootpath` (including
    harness fitness-function script path resolution), and added a meta test to prevent
    reintroducing brittle `parents[1]` repo-root computation.

    '
  verification:
  - uv run pytest -q
- id: ST-003
