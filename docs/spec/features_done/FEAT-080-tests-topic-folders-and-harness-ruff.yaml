acceptance:
- All existing tests are relocated under topic folders as defined in the move map,
  without renaming test modules.
- '`tests/conftest.py` and `tests/fixtures/` remain at `tests/` root and continue
  to work.'
- Any repo-root path resolution in tests remains correct after relocation (no tests
  rely on `parents[1]` meaning repo root).
- '`uv run pytest -q` passes.'
- '`ruff_validate` gate command lints `harness/` as well as `src/engineeringagent`.'
- '`uv run ruff check src/engineeringagent harness` passes in this repo.'
- Docs that describe the canonical Ruff command are updated to mention the harness
  path.
