id: FEAT-170
title: Persist codex profile selection during init
type: feature
expected_commit_subject: 'feat: persist codex init profile in engineeringagent config'
status: done
priority: high
objective: Ensure `engineeringagent init` writes the Codex profile selection into
  `engineeringagent.toml` so `engineeringagent run` consistently invokes Codex with
  the intended profile.
context: 'Today, init can scaffold `.codex/config.toml` with a profile named `engineeringagent`,

  but init does not persist `[agents.codex].profile` in repository config.


  As a result, runtime backend resolution often omits `--profile`, leaving execution

  dependent on ambient Codex CLI defaults instead of deterministic repo-owned config.

  '
constraints:
- In scope is init-time config persistence only.
- Do not add runtime fallback logic in agent execution paths.
- Persist profile under `engineeringagent.toml` only (not `pyproject.toml`).
- Write default value `[agents.codex].profile = "engineeringagent"` when selected
  backend is codex.
- Do not persist `[agents.codex].model` as part of this feature.
- Preserve existing init force semantics and interactive UX expectations.
implementation_notes: "Contract change declaration\n\nSurface:\n- `engineeringagent\
  \ init` config-write behavior for `engineeringagent.toml`.\n- Codex backend runtime\
  \ option resolution from repo-owned config.\n\nOld behavior:\n- Init writes `[agents]\
  \ backend = \"codex\"` but does not write `[agents.codex].profile`.\n- Codex runtime\
  \ often executes without `--profile` unless users manually add config.\n\nNew behavior:\n\
  - When init resolves selected backend to codex, it persists `[agents.codex].profile\
  \ = \"engineeringagent\"`\n  in `engineeringagent.toml`.\n- Model persistence remains\
  \ unchanged (no `[agents.codex].model` writes introduced).\n\nCompatibility policy:\n\
  - Breaking compatibility is acceptable in this repository, but this feature is intended\n\
  \  to be additive and low-risk for existing users.\n\nMigration plan:\n- New or\
  \ re-run init executions populate codex profile config automatically.\n- Existing\
  \ repositories that do not rerun init remain unchanged until they opt in.\n\nInteractive\
  \ overwrite policy:\n- If `[agents.codex].profile` already exists and differs, init\
  \ should ask in interactive\n  mode whether to keep current value or overwrite with\
  \ `engineeringagent`.\n- In non-interactive mode, init must not block on prompts;\
  \ preserve existing value unless\n  explicit force behavior applies.\n\nVerification\
  \ evidence:\n- Targeted init/config tests cover default write, overwrite decision\
  \ path, and non-codex behavior.\n\nFitness-function impact assessment:\n- no fitness-function\
  \ changes required.\n- Rationale: the change is limited to TOML config write behavior\
  \ and does not alter active\n  architecture boundaries, subprocess policies, or\
  \ checks ownership contracts.\n"
acceptance:
- Running `engineeringagent init --backend codex` on a repo without `[agents.codex]`
  persists `[agents.codex].profile = "engineeringagent"` in `engineeringagent.toml`.
- The same init path does not persist `[agents.codex].model`.
- Running init with non-codex backend does not add or modify `[agents.codex]` profile
  config.
- When `[agents.codex].profile` already exists and differs, interactive init presents
  a keep-vs-overwrite decision and applies the user choice.
- Non-interactive init does not block for profile-overwrite prompts and preserves
  deterministic behavior.
- '`uv run pytest -q tests/cli/test_init_command.py tests/config/test_config_agents_backend.py`
  passes.'
subtasks:
