id: FEAT-155
title: Remove compatibility renaming shims and runtime pass-through aliases
type: spec
expected_commit_subject: 'spec: add FEAT-155 remove compatibility renaming shims'
status: done
priority: high
objective: 'Remove compatibility-style renaming indirection from production checks
  code so runtime imports use canonical symbols directly and constants are treated
  as internal-only implementation details.

  '
context: "Current checks modules still carry compatibility-era rename indirection:\n\
  \n- planning-policy constants are imported with alias names and re-exported via\n\
  \  mirror assignments in command/fitness/reviewer runtime modules.\n- `checks.validate.runtime`\
  \ is a pass-through wrapper that renames\n  `validator.validate` to `run_validate`.\n\
  \nTests also still include compatibility aliases/wrappers that preserve removed\n\
  call shapes (legacy scalar `run_loop` wrappers and migration alias\n`load_checks_document\
  \ = _load_checks_document`).\n\nThese shims expand surface area, blur canonical\
  \ ownership, and preserve import\npaths that are not intended to be stable contracts.\n\
  \nRepository policy for this work is immediate break (no active users) and\nconstants\
  \ should be treated as internal implementation details.\n"
constraints:
- 'In scope: remove mirror-assignment constant re-exports in `checks/commands/runtime.py`,
  `checks/fitness/runtime.py`, and `checks/reviewers/runtime.py`.'
- 'In scope: remove `checks/validate/runtime.py` pass-through aliasing and standardize
  validate execution on one canonical symbol name.'
- 'In scope: update internal call sites/tests/imports to canonical names and modules
  after shim removal.'
- 'In scope: remove compatibility-only test aliases/wrappers that preserve legacy
  call shapes when canonical test entrypoints are available.'
- 'In scope: keep code readable; preserve readability aliases when they add clear
  local clarity, and only remove aliases that are unnecessary indirection.'
- 'Out of scope: broad removal of readability aliases in tests (for example `cli_module`,
  `loop_module`, or other namespace-clarifying aliases) when they are not compatibility
  shims.'
- 'Out of scope: broad removal of intentional package facades in `__init__.py` modules
  unless they are required to complete this shim cleanup.'
- 'Out of scope: behavior changes to check planning decisions, validation semantics,
  or reviewer/fitness execution logic.'
- Compatibility policy is immediate break; do not add transitional aliases, shim modules,
  or deprecation windows.
implementation_notes: "Contract change declaration\n\nSurface:\n\n- Internal checks\
  \ runtime import/constant surfaces.\n- Validate runtime entrypoint naming and module\
  \ path usage.\n\nOld behavior:\n\n- Command/fitness/reviewer runtime modules mirror-export\
  \ planning-policy\n  constants through alias-import + assignment patterns.\n- Validate\
  \ strategy/runtime code can call `checks.validate.runtime.run_validate`,\n  which\
  \ is only a rename pass-through to `validator.validate`.\n- Some tests keep compatibility\
  \ wrappers/aliases for legacy contracts instead\n  of calling canonical runtime\
  \ APIs directly.\n\nNew behavior:\n\n- Planning-policy reason constants have one\
  \ canonical owner and are not\n  re-exported via runtime mirror assignments.\n-\
  \ Validate execution uses a canonical validate symbol directly; the\n  `checks.validate.runtime`\
  \ rename pass-through module/path is removed.\n- Runtime modules expose only active,\
  \ intentional APIs needed by checks\n  orchestration.\n- Tests no longer retain\
  \ compatibility wrappers/aliases for removed call\n  shapes; they target canonical\
  \ APIs directly while keeping readability-only\n  aliases where useful.\n\nCompatibility\
  \ policy:\n\n- Immediate break for removed shim import paths/symbol exports.\n-\
  \ No backward-compat aliases or dual-support window.\n\nMigration plan:\n\n- Delete\
  \ mirror constant alias imports/assignments in runtime modules.\n- Update call sites\
  \ to import canonical symbols from owning modules.\n- Remove `checks.validate.runtime`\
  \ and route imports/calls to the canonical\n  validate implementation.\n- Update\
  \ tests that currently patch/assert legacy shim paths.\n- Replace compatibility\
  \ test wrappers and pass-through aliases with canonical\n  invocation patterns.\n\
  \nVerification evidence:\n\n- Targeted checks/validate tests pass with shim paths\
  \ removed.\n- Import-surface fitness tests pass with updated allowed/disallowed\
  \ paths.\n- Schema validation passes.\n\nFitness-function impact assessment:\n\n\
  - no fitness-function changes required.\n- Rationale: this work removes import-surface\
  \ indirection and compatibility\n  aliases without changing architecture-rule intent\
  \ or check semantics.\n"
acceptance:
- Runtime modules no longer contain alias-import plus mirror-assignment constant re-export
  patterns for planning-policy reason constants.
- Canonical planning-policy reason constants are referenced directly from their owning
  module where needed.
- '`src/engineeringagent/checks/validate/runtime.py` is removed and no production
  call sites depend on `run_validate` pass-through naming.'
- Tests that patch/assert removed shim paths are updated to canonical targets.
- Compatibility-only test wrappers/aliases (including legacy scalar `run_loop` wrappers
  and migration pass-through aliases) are removed or rewritten to use canonical runtime
  contracts.
- Intentional readability aliases that still improve clarity are retained.
- No new compatibility aliases are introduced to preserve removed shim surfaces.
- 'Verification command passes: `uv run pytest -q tests/checks/test_validate_group.py
  tests/fitness/test_fitness_rules_checks_import_surface.py`.'
- 'Verification command passes: `uv run engineeringagent validate --schema-only`.'
