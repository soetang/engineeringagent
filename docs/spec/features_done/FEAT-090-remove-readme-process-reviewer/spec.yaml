id: FEAT-090
title: Remove README process reviewer and rename clean-room sandbox mode to empty_folder
type: chore
expected_commit_subject: 'chore: add FEAT-090 remove README process reviewer'
planning_tier: planned
status: done
priority: medium
objective: 'Remove the repository''s dedicated README onboarding/process reviewer
  entirely (config, prompt, scaffolding, docs, and tests), and preserve a generic
  clean-room reviewer sandbox by renaming the existing clean-room sandbox mode to
  `empty_folder` with explicit asset inclusion.

  '
context: 'This repository currently includes a dedicated reviewer intended to validate
  README onboarding in an isolated sandbox and treats it as a default reviewer in
  the fast loop profile.

  We want to delete that reviewer and all active references while keeping the ability
  to execute a reviewer in a clean, empty workspace and copy in only explicitly configured
  assets.

  Additionally, repository validation (`engineeringagent validate`) must enforce that
  removed reviewer identifiers and removed sandbox-mode names do not reappear in active
  (non-historical) files.

  Note: ripgrep (`rg`) is not available in this environment; purge checks must not
  depend on it.

  '
constraints:
- Do not edit archived specs under `docs/spec/features_done/`.
- Do not scrub historical telemetry/state under `progress/`.
- The dedicated README onboarding/process reviewer must not exist in `harness/reviewers.yaml`.
- The README onboarding/process reviewer prompt file must not exist under `harness/reviewers/prompts/`.
- '`engineeringagent reviewers init` must not scaffold the removed reviewer or its
  prompt.'
- Rename the existing clean-room sandbox mode enum value to `empty_folder`.
- '`empty_folder` sandbox behavior must start from an empty execution root.'
- '`empty_folder` sandbox must copy only the configured `prompt_file` plus any configured
  `sandbox.assets`.'
- '`empty_folder` must not implicitly inject assets (no automatic README/docs/CLI
  helper injection).'
- '`sandbox.assets` support remains restricted to `empty_folder` (other sandbox modes
  must reject assets).'
- Keep `temp_worktree_snapshot` sandbox behavior unchanged.
- Purge enforcement must be implemented as part of `engineeringagent validate` and
  must scan tracked files via `git ls-files`.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: repository default\
  \ reviewer configuration (`harness/reviewers.yaml`).\n  - Old behavior: repository\
  \ config includes a dedicated README onboarding reviewer and enables it in\n   \
  \ `profiles.loop_fast`.\n  - New behavior: repository config does not define that\
  \ reviewer and `profiles.loop_fast` does not include it.\n\n- Surface: reviewer\
  \ sandbox mode enum and semantics.\n  - Old behavior: a clean-room sandbox mode\
  \ exists that implicitly injects onboarding-related assets.\n  - New behavior: the\
  \ clean-room sandbox mode is renamed to `empty_folder` and has strict explicit-asset\n\
  \    semantics: create a fresh empty workspace and copy only `prompt_file` and `sandbox.assets`.\n\
  \n- Surface: validator behavior.\n  - Old behavior: `engineeringagent validate`\
  \ does not enforce repository-wide purge invariants.\n  - New behavior: `engineeringagent\
  \ validate` fails if removed reviewer ids or removed sandbox-mode names appear\n\
  \    anywhere in tracked files outside historical zones (`docs/spec/features_done/`\
  \ and `progress/`).\n\nCompatibility policy:\n- Breaking change: reviewer configs\
  \ using the removed clean-room sandbox-mode value must migrate to `empty_folder`.\n\
  - Breaking change: users relying on implicit sandbox asset injection must add those\
  \ paths explicitly to\n  `sandbox.assets` and accept that helper scripts may no\
  \ longer exist.\n\nMigration scope (this repo):\n- Remove the README onboarding\
  \ reviewer from `harness/reviewers.yaml` and delete its prompt file.\n- Update docs\
  \ and tests to avoid any mention of the removed reviewer id.\n- Update contract\
  \ validation, runtime sandbox builder, and reference docs to use `empty_folder`.\n"
acceptance:
- '`harness/reviewers.yaml` contains no dedicated README onboarding/process reviewer
  definition and does not include it in any profile.'
- The README onboarding/process reviewer prompt file is removed from `harness/reviewers/prompts/`.
- '`engineeringagent reviewers init` scaffolds only supported baseline reviewers and
  does not scaffold the removed reviewer.'
- 'Reviewer config validation accepts `sandbox.mode: empty_folder` and rejects the
  removed clean-room sandbox-mode name.'
- '`empty_folder` sandbox execution root is empty before copying assets and contains
  only `prompt_file` plus configured `sandbox.assets`.'
- '`engineeringagent validate` enforces purge invariants by scanning tracked files
  (`git ls-files`) and failing when removed reviewer ids or removed sandbox-mode names
  appear outside `docs/spec/features_done/` and `progress/`.'
- Active docs and active specs under `docs/spec/features/` contain no references to
  the removed reviewer id.
- '`uv run python -m engineeringagent.cli validate` passes.'
- '`uv run pytest -q` passes.'
artifacts:
  plan: plan.md
updated_at: '2026-02-16T00:00:00Z'
