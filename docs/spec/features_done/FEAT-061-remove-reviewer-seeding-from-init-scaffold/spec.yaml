id: FEAT-061
title: Remove reviewer seeding from init scaffold and keep reviewers repository-owned
type: chore
expected_commit_subject: 'chore: add FEAT-061 remove reviewer seeding from init scaffold'
planning_tier: planned
status: done
priority: low
objective: Stop generating reviewer config and prompt files from init scaffold so
  reviewer behavior is explicitly repository-owned and activated only through committed
  harness files or reviewer CLI commands.
context: Reviewer setup was introduced as optional scaffold output, but current direction
  is to avoid coupling reviewer policy defaults to generic scaffold generation. This
  keeps init minimal and reduces accidental reviewer contract drift across repositories.
constraints:
- Keep this work lower priority than code_simplifier activation and readme_process
  sandbox changes.
- Remove reviewer artifacts from init scaffold generation paths.
- Remove reviewer-specific init flags or options that imply scaffold ownership of
  reviewer policy.
- CLI interface contract for `init` must remove reviewer-seeding flags (including
  `--include-reviewers`) from parser help and command wiring.
- Preserve dedicated reviewer CLI workflows for explicit setup and inspection.
- CLI interface contract for `reviewers init` remains supported and continues to generate
  `harness/reviewers.yaml` plus prompt files when explicitly invoked.
- Preserve backward-compatible behavior for existing repositories that already have
  harness/reviewers.yaml.
- Update docs and tests to reflect reviewer setup via repository-owned harness config
  rather than init defaults.
implementation_notes: 'Delete reviewer manifest and prompt generation from init scaffold
  internals, and adjust command help text to avoid implying reviewer defaults are
  scaffolded by init. Keep `engineeringagent reviewers init` as the explicit opt-in
  setup surface.

  Ensure tests no longer expect reviewer files from baseline init behavior.'
acceptance:
- init scaffold no longer writes harness/reviewers.yaml or reviewer prompt files.
- init command help and docs do not advertise reviewer inclusion flags for scaffold
  output.
- engineeringagent init with --include-reviewers is rejected as unsupported input
  by the CLI parser after this change.
- Reviewer setup remains available via engineeringagent reviewers init.
- Existing repositories with committed reviewer configs continue to function unchanged.
- Init regression tests are updated to assert reviewer files are not scaffolded.
artifacts:
  plan: plan.md
updated_at: '2026-02-15T00:02:35Z'
