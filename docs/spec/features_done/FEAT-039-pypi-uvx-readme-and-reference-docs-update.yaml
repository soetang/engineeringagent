id: FEAT-039
title: Document PyPI-first uvx usage in README and reference docs
type: docs
expected_commit_subject: 'docs: add FEAT-039 pypi uvx readme and references update'
status: done
priority: high
objective: Update onboarding and reference documentation so users can run EngineeringAgent
  from the published PyPI package via `uvx` without cloning the repository, while
  keeping contributor-focused local workflow guidance clear.
context: The package is now published on PyPI and can be invoked directly with `uvx`,
  but current docs are centered on source checkout commands such as `uvx --from .`.
  We need a docs-only feature that introduces a clear first-run path for package users,
  includes both pinned and unpinned `uvx` usage examples, and keeps developer/contributor
  guidance explicit so local repository workflows remain understandable.
constraints:
- This feature is documentation-only; do not change CLI/runtime behavior.
- Scope is limited to `README.md` and relevant files under `docs/references/`.
- Include both unpinned and version-pinned `uvx` usage examples.
- Keep contributor/local development commands (for example `uvx --from .`) documented
  where appropriate and clearly separated from package-consumer commands.
- Preserve the human-vs-agent documentation audience boundaries established by prior
  docs architecture features.
implementation_notes: Add a PyPI-first quickstart path in README that demonstrates
  running commands with `uvx engineeringagent ...` and version pinning via `uvx engineeringagent@<version>
  ...`. In reference docs, align command examples and wording so readers can distinguish
  package consumption from contributor workflows. Keep command examples concise, practical,
  and internally consistent across README and reference pages.
acceptance:
- README includes a clear first-run path that works without repository checkout by
  using `uvx engineeringagent ...` commands.
- README includes guidance for version-pinned execution using `uvx engineeringagent@<version>
  ...` plus unpinned usage.
- Reference docs under `docs/references/` are updated so package-consumer and contributor
  command styles are explicit and non-contradictory.
- Documentation changes remain docs-only and introduce no runtime/CLI behavior changes.
- Markdown formatting checks for modified docs and `engineeringagent validate` pass.
subtasks:
- id: ST-001
  title: Define uvx command matrix for package users vs contributors
  status: done
  context: Establish the exact command patterns and terminology to use across docs
    so package-consumer (`uvx engineeringagent ...`) and contributor (`uvx --from
    . engineeringagent ...`) workflows are separated clearly.
  verification:
  - python3 -c "from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8').lower();
    assert 'uvx engineeringagent' in t; assert '--from .' in t; print('ok')"
- id: ST-002
  title: Update README with PyPI-first onboarding and pinning guidance
  status: done
  context: Revise getting-started content in README so a first-time user can run core
    commands from PyPI with `uvx`, including both unpinned and version-pinned examples.
  verification:
  - python3 -c "from pathlib import Path; t=Path('README.md').read_text(encoding='utf-8');
    assert 'uvx engineeringagent' in t; assert 'uvx engineeringagent@' in t; print('ok')"
- id: ST-003
  title: Align reference docs with package-consumer and contributor command styles
  status: done
  context: Update relevant files in `docs/references/` so command examples and wording
    consistently distinguish PyPI/uvx package usage from local contributor workflows.
  verification:
  - python3 -c "from pathlib import Path; p=Path('docs/references/uv-llms.md'); t=p.read_text(encoding='utf-8');
    assert 'uvx engineeringagent' in t; assert '--from .' in t; print('ok')"
- id: ST-004
  title: Run docs formatting and spec validation checks
  status: done
  context: Validate formatting and spec integrity for the documentation update using
    the requested lightweight verification level.
  verification:
  - uv run mdformat --check README.md docs/references/uv-llms.md
  - uvx --from . engineeringagent validate
