id: FEAT-999
title: Example bundled feature package
type: spec
expected_commit_subject: "feat: add FEAT-999 example bundled feature package"
planning_tier: planned
status: backlog
priority: medium
objective: >
  Demonstrate the proposed bundled feature package shape for active features.
context: >
  This example shows how `spec.yaml` stays canonical while companion planning artifacts
  live beside it in the same feature folder.
constraints:
  - "spec.yaml is the canonical source for feature identity, status, and acceptance."
  - "planning_tier must be one of `direct`, `planned`, or `researched`."
  - "plan.md is required for planning_tier: planned."
  - "Active bundled specs do not carry `subtasks`; sequencing lives in `plan.md` phases."
  - "artifact paths are relative to the feature folder."
acceptance:
  - "The bundled feature package is discoverable through `spec.yaml`."
  - "Required companion artifacts are linked through the artifacts block."
  - "Plan status and per-phase status may change during execution without replacing canonical feature status in `spec.yaml`."
  - "Acceptance remains outcome-oriented rather than phase-oriented."
artifacts:
  plan: plan.md
  supporting:
    - supporting/example-input.json
