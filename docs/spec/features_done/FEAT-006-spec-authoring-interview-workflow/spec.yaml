id: FEAT-006
title: Spec authoring interview workflow and documentation
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
planning_tier: planned
status: done
priority: high
objective: Require an interview-first workflow before writing new feature specs and
  document it in-repo for agents and humans.
context: 'We need stronger spec quality and better alignment before implementation
  starts. Agents currently can jump into drafting a feature without enough discussion.
  This feature formalizes an interview-first process and makes it discoverable through
  AGENTS.md.

  '
constraints:
- Before drafting a new FEAT spec, the agent must interview the user and confirm scope.
- Interview guidance must be documented in-repo and referenced from AGENTS.md.
- Spec output must continue to conform to docs/spec/schemas/feature.schema.json.
implementation_notes: 'Start with documentation and AGENTS references. Add lightweight
  validation or checklist enforcement only if it improves reliability without adding
  heavy friction.

  '
acceptance:
- A canonical spec-writing guide exists at docs/references/spec-writing.md.
- AGENTS.md explicitly requires interview-before-spec-writing and references the guide.
- Guide defines mandatory interview topics, confirmation step, and drafting rules.
- Spec-writing workflow is reproducible by another agent with no extra tribal knowledge.
artifacts:
  plan: plan.md
