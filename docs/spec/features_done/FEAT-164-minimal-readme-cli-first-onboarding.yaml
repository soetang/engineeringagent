id: FEAT-164
title: Simplify README to minimal spec-to-implement onboarding
type: docs
expected_commit_subject: 'docs: simplify readme to minimal spec-to-implement onboarding'
status: done
priority: high
objective: Rewrite `README.md` to a minimal user-onboarding surface centered on the
  primary flow (`spec -> implement`), while preserving the repository development
  warning and reducing contributor guidance to essential policy only.
context: "The current README is comprehensive but dense. This rewrite makes README\
  \ intentionally\nminimal for users and keeps agent-oriented guidance in AGENTS.\n\
  \nRequested direction:\n- make onboarding minimal and direct\n- keep the \"repo\
  \ under active development\" warning\n- keep only essential contributor policy guidance\n\
  - describe spec authoring as: start your favorite coding agent at repo root and\
  \ ask it\n  to write a spec\n- include AGENTS bootstrap fallback guidance (copyable\
  \ snippet) for repos that do not\n  want to fully edit AGENTS.md\n- do not route\
  \ users from README to `engineeringagent approach`; that surface is for agents\n"
constraints:
- 'Dependency: this README rewrite assumes FEAT-163 AGENTS bootstrap snippet contract
  exists (or is implemented in the same release window).'
- 'In scope: substantial content reduction and section reorganization in README.'
- 'In scope: preserve repository warning semantics at top of README.'
- 'In scope: keep only contributor policy essentials: no PRs accepted, code is written
  by agents, and users can open issues that can be promoted into specs.'
- 'Out of scope: changing CLI/runtime behavior; this feature updates docs only.'
implementation_notes: "Contract change declaration\n\nSurface:\n- `README.md`\n\n\
  Old behavior:\n- README contains broad detail across quickstart variants, schema\
  \ walkthroughs,\n  deep operational notes, and many command examples.\n\nNew behavior:\n\
  - README is intentionally minimal and does not route users to\n  `engineeringagent\
  \ approach`.\n- Primary onboarding message is explicit and short: `spec -> implement`.\n\
  - \"Write a spec\" guidance is agent-first: initialize repo, start coding agent\
  \ at repo\n  root, ask it to write a spec.\n- AGENTS fallback snippet is included\
  \ for users who do not want to manually curate\n  AGENTS.md content.\n- Contributor\
  \ section is reduced to policy-level guidance only.\n\nCompatibility policy:\n-\
  \ Documentation-only change; no API/runtime compatibility impact.\n\nDesign choices\n\
  \n1) README information architecture\n- Keep only core sections for first-run success:\n\
  \  - what engineeringagent is (1-2 short paragraphs)\n  - primary flow: `spec ->\
  \ implement`\n  - getting started (very short)\n  - AGENTS bootstrap fallback snippet\n\
  \  - contributor policy (kept, concise)\n  - safety warning (top of file)\n- Keep\
  \ procedural depth out of README; do not replace it with a user-facing redirect\n\
  \  to approach commands.\n\n2) Agent-vs-user documentation split\n- `engineeringagent\
  \ approach` is agent-oriented and should be described in AGENTS,\n  not as a primary\
  \ README path for users.\n- README may include AGENTS bootstrap snippet for convenience,\
  \ but should not present\n  approach commands as the user onboarding flow.\n\n3)\
  \ AGENTS fallback guidance\n- Include the exact copyable snippet for repos that\
  \ do not want to fully edit AGENTS.md:\n  - `In this repository, run EngineeringAgent\
  \ CLI commands with `uvx engineeringagent ...`.`\n  - `Use `engineeringagent approach`\
  \ for the overall workflow and guidance map.`\n  - `Use `engineeringagent approach\
  \ list` to discover topics, then open one (for example `engineeringagent approach\
  \ specifications`).`\n- Clarify in README that this snippet is the minimum bootstrap\
  \ if AGENTS is not\n  otherwise customized.\n\n4) Contributor policy-only guidance\n\
  - Keep only these contributor statements in README:\n  - pull requests are not accepted\n\
  \  - code changes are implemented through agents\n  - users can open issues and\
  \ specs can be drafted/promoted from issue proposals\n- Remove contributor operational\
  \ command walkthroughs (for example validate/lint/type/test\n  command lists) from\
  \ README.\n\n5) Agent permissions recommendation\n- README should include a concise\
  \ recommendation for repositories using restrictive\n  agent command allowlists.\n\
  - Recommend adding the following commands to approved bash/command permissions:\n\
  \  - `engineeringagent approach`\n  - `engineeringagent schema *`\n- Keep this recommendation\
  \ short and clearly framed as agent-setup guidance, not\n  user onboarding steps.\n\
  \nFitness-function impact assessment\n- no fitness-function changes required.\n"
acceptance:
- README top section preserves the repository active-development warning intent.
- README presents primary workflow as `spec -> implement` in a concise onboarding
  path.
- README getting-started section is minimal and does not route users to `engineeringagent
  approach`.
- 'README includes explicit "write specs with your coding agent" guidance: start agent
  at initialized repo root and ask it to write a spec.'
- 'README includes AGENTS fallback snippet with this exact text: "In this repository,
  run EngineeringAgent CLI commands with `uvx engineeringagent ...`." "Use `engineeringagent
  approach` for the overall workflow and guidance map." "Use `engineeringagent approach
  list` to discover topics, then open one (for example `engineeringagent approach
  specifications`)."'
- 'README contributor section keeps only policy essentials: pull requests are not
  accepted; code changes are implemented through agents; users can open issues and
  specs can be drafted from those issues.'
- README does not document contributor operational command walkthroughs (for example
  validate/lint/type/test command lists).
- 'README recommends allowlisting these agent commands in restrictive environments:
  `engineeringagent approach` and `engineeringagent schema *`.'
- The feature spec validates with `uv run engineeringagent validate --schema-only`.
