id: FEAT-043
title: Add root --version flag that reports the packaged CLI version
type: feature
expected_commit_subject: 'feat: add FEAT-043 root version flag from package metadata'
planning_tier: planned
status: done
priority: high
objective: Add root-level `--version` support so `uvx engineeringagent --version`
  prints the CLI version and that value stays aligned with the package version declared
  in `pyproject.toml`.
context: The CLI currently requires a subcommand and does not expose a root version
  flag. Users need a standard way to check the installed CLI version before running
  other commands. Scope is limited to `--version` on the root parser with version-only
  output and no additional aliases or subcommands.
constraints:
- Support only root `--version`; do not add a `version` subcommand.
- Do not add a `-V` alias.
- Output must be the version string only (plus trailing newline from standard printing).
- Resolve the value from installed package metadata using `importlib.metadata.version("engineeringagent")`.
- Do not read `pyproject.toml` at runtime to determine the displayed version.
- Keep existing command behavior unchanged when `--version` is not provided.
implementation_notes: Wire argparse root `--version` handling before subcommand dispatch,
  preserving current required-subcommand behavior for non-version invocations. Add
  targeted CLI tests that assert exact output format and metadata sourcing contract.
acceptance:
- Running `uvx engineeringagent --version` exits successfully and prints only the
  installed package version.
- The version shown by `--version` matches the installed distribution metadata version,
  which is sourced from `pyproject.toml` at package build/release time.
- Invocations without `--version` still require a subcommand and preserve current
  CLI behavior.
- No `version` subcommand or `-V` alias is introduced.
- Targeted CLI tests for version behavior and `uvx --from . engineeringagent validate`
  pass.
artifacts:
  plan: plan.md
