id: FEAT-087
title: Unify harness verification into harness/checks.yaml (contract + runtime)
type: feature
expected_commit_subject: 'feat: unify harness checks into checks.yaml'
planning_tier: planned
status: done
priority: high
objective: 'Replace the multi-surface harness configuration (gates/reviewers wiring
  plus

  implicit fitness execution conventions) with a single repo-owned contract:

  `harness/checks.yaml`.


  `engineeringagent run --all` must require and consume `harness/checks.yaml` to

  plan and execute repo-owned verification deterministically.


  Tool-owned contract validation (spec/schema/harness contract sanity) remains

  implicit and must not be configured as a repo-owned check.

  '
context: 'The primary operator workflow is:

  - write/update feature specs in chat using any agent

  - run `engineeringagent run --all`


  Users are not expected to operate `engineeringagent validate`, `engineeringagent
  fitness`,

  `engineeringagent gates`, or `engineeringagent reviewers` directly.


  Today, verification configuration is split across multiple harness files and

  planners:

  - `harness/gates.yaml` (command gates + on_change + profiles)

  - `harness/reviewers.yaml` (LLM reviewers + triggers + approval + sandbox)

  - `harness/fitness-functions/rules.yaml` (fitness registry; executed indirectly)


  We want a single, minimal, strict system-of-record (`harness/checks.yaml`) that

  supports command checks, fitness execution, and reviewer checks.


  This contract must align with FEAT-086 (simplify feature_done reviewers):

  reviewer configuration must not include advisory/blocking modes, and reviewer

  outcomes at feature completion must be enforceable (approve/request_changes).

  '
constraints:
- 'Breaking change allowed: `engineeringagent run` requires `harness/checks.yaml`;
  legacy harness inputs are not used by run.'
- Contract validation is tool-owned and implicit; `harness/checks.yaml` contains repo-owned
  checks only.
- 'The v1 contract must be language-agnostic: command checks are shell commands (strings)
  executed from the repo root.'
- Keep the v1 schema small and strict (extra fields forbidden) with deterministic
  defaults/normalization.
- Support consistent timing via `when.phase` in {iteration_end, feature_done, manual}.
- Support deterministic run/skip decisions via optional `when.on_change` globs for
  all check types.
- Reviewer execution and configuration must align with FEAT-086 (no approval mode;
  enforce approve/request_changes at feature_done; no advisory followup).
- The new contract must not introduce a `blocking` field; all repo-owned checks are
  enforceable and failing checks fail the iteration deterministically.
- Reviewer checks in `harness/checks.yaml` are only supported at `when.phase=feature_done`
  (or `manual`); do not add per-iteration reviewers as part of this feature.
- 'Legacy contract files must be removed from this repository: `harness/gates.yaml`
  and `harness/reviewers.yaml` must not exist after migration.'
- Init scaffolding must not create legacy harness contract files; it must scaffold
  only `harness/checks.yaml` as the repo-owned verification contract.
- 'The gate profile concept is removed: there must be no active code or non-spec documentation
  that depends on or references gate profiles (e.g. loop_fast/precommit) after migration.'
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: harness configuration\
  \ + loop verification orchestration.\n  - Old behavior: repo verification wiring\
  \ is distributed across `harness/gates.yaml`\n    and `harness/reviewers.yaml`,\
  \ and fitness is invoked indirectly.\n  - New behavior: `engineeringagent run` requires\
  \ and consumes `harness/checks.yaml`.\n    Repo-owned checks are declared once in\
  \ that file.\n\nWhat this replaces (explicit):\n\n- Replaces `harness/gates.yaml`\
  \ as the system-of-record for verification.\n  - Old: gate profiles (e.g. loop_fast/precommit)\
  \ select named gates.\n  - New: `harness/checks.yaml` selects checks by phase (and\
  \ optional on_change).\n  - Old: tool-owned spec validation is configured as a gate\
  \ (`spec_validate`).\n  - New: tool-owned contract validation runs implicitly at\
  \ run startup and is not a check.\n  - Old: fitness execution is configured as a\
  \ gate (`fitness_validate`).\n  - New: fitness execution is a repo-owned check (`type:\
  \ fitness`) when desired.\n\n- Replaces `harness/reviewers.yaml` as the system-of-record\
  \ for reviewers.\n  - Old: reviewers are configured separately with approval mode\
  \ (advisory/blocking).\n  - New: reviewers are configured as `type: reviewer` checks\
  \ in `harness/checks.yaml`.\n    Reviewer configuration does not include advisory/blocking\
  \ modes, matching FEAT-086.\n\n- Does NOT replace the fitness rule registry metadata.\n\
  \  - `harness/fitness-functions/rules.yaml` remains the registry/catalog source.\n\
  \  - `harness/checks.yaml` can reference fitness execution via `type: fitness`.\n\
  \n- Does NOT replace per-subtask `verification:` commands in feature specs.\n  -\
  \ Spec subtasks may continue to include `verification:` command lists.\n  - `harness/checks.yaml`\
  \ is the system-of-record for repo-owned verification\n    that runs at iteration/feature\
  \ boundaries independent of subtask transitions.\n\nFull contract (v1) for `harness/checks.yaml`:\n\
  \nYAML shape:\n\n```yaml\ncontract_version: \"1.0\"\n\ndefaults:\n  when:\n    phase:\
  \ iteration_end\n\nchecks:\n  <check_id>:\n    type: command|fitness|reviewer\n\
  \    when:\n      phase: iteration_end|feature_done|manual   # optional (defaults.when.phase)\n\
  \      on_change: [\"glob\", \"...\"]                # optional\n    # type-specific\
  \ fields below\n```\n\nTop-level keys:\n- `contract_version` (required): must be\
  \ exactly \"1.0\".\n- `defaults` (optional):\n  - `when` (optional):\n    - `phase`\
  \ (optional): iteration_end|feature_done|manual\n- `checks` (required): mapping\
  \ of string ids to check definitions.\n\nCommon field rules:\n- Extra/unknown fields\
  \ are forbidden everywhere (strict contract).\n- `blocking` is not part of the contract;\
  \ failing checks fail deterministically.\n- Check ids are user-defined, must be\
  \ unique, and must be non-empty strings.\n- `when.phase` defaults from `defaults.when.phase`\
  \ when omitted.\n\nType-specific fields:\n\n- `type: command`\n  - required: `command`\
  \ (string)\n\n- `type: fitness`\n  - exactly one of:\n    - `scope: all`\n    -\
  \ `rule_ids: [\"architecture.dep-directionality\", ...]`\n\n- `type: reviewer`\n\
  \  - required: `prompt_file` (repo-relative path under `harness/reviewers/prompts/`)\n\
  \  - optional: `feedback_context` (string)\n  - optional: `sandbox`:\n    - `mode`:\
  \ temp_worktree_snapshot|empty_folder\n    - `assets` (optional, list of strings,\
  \ min length 1): only supported when mode=empty_folder\n  - optional: `approval`:\n\
  \    - `first_feature_approval` (bool, default true)\n  - must align with FEAT-086\
  \ semantics:\n    - no advisory/blocking config mode (no approval mode)\n    - reviewer\
  \ decisions at feature_done are enforceable approve/request_changes\n    - no advisory\
  \ followup mechanism\n\nReviewer phase restriction (v1):\n- reviewer checks must\
  \ declare `when.phase: feature_done` (or manual). Any reviewer\n  configured for\
  \ iteration_end is rejected by validation.\n\nExecution semantics (high level):\n\
  - Tool-owned contract validation runs implicitly before loop execution.\n- Repo-owned\
  \ checks run at:\n  - `iteration_end`: after implement step succeeds\n  - `feature_done`:\
  \ after a feature transitions to done and before completion\n  - `manual`: never\
  \ automatically\n- `when.on_change` (if present) gates execution using deterministic\
  \ changed-path discovery.\n- There are no modes in the v1 contract; use `manual`\
  \ and `feature_done` phases\n  to control expensive checks, and optional `on_change`\
  \ to reduce unnecessary work.\n\nExample `harness/checks.yaml` (illustrative):\n\
  \n```yaml\ncontract_version: \"1.0\"\ndefaults:\n  when:\n    phase: iteration_end\n\
  \nchecks:\n  fitness_all:\n    type: fitness\n    scope: all\n\n  ruff:\n    type:\
  \ command\n    command: \"uv run ruff check src/engineeringagent\"\n    when:\n\
  \      on_change: [\"src/**/*.py\", \"tests/**/*.py\", \"harness/**/*.py\"]\n\n\
  \  onboarding_review:\n    type: reviewer\n    prompt_file: \"harness/reviewers/prompts/onboarding_review.md\"\
  \n    when:\n      phase: feature_done\n      on_change: [\"README.md\", \"docs/references/**/*.md\"\
  , \"docs/principles/**/*.md\"]\n    sandbox:\n      mode: empty_folder\n      assets:\
  \ [\"README.md\", \"docs\", \".opencode/agents\"]\n```\n\nCompatibility policy:\n\
  - Breaking. `engineeringagent run` requires `harness/checks.yaml`.\n- Legacy harness\
  \ inputs (`harness/gates.yaml`, `harness/reviewers.yaml`) are not\n  used by `run`\
  \ after this change.\n- `engineeringagent init` scaffolds `harness/checks.yaml`\
  \ as the setup/remediation\n  path.\n\nFitness-function impact assessment:\n- no\
  \ fitness-function changes required; existing fitness rules remain as-is.\n"
acceptance:
- '`harness/checks.yaml` v1 schema is defined with strict validation (extra fields
  forbidden).'
- The contract supports phases (`iteration_end`, `feature_done`, `manual`) and optional
  `on_change` globs with deterministic semantics.
- The contract has no `blocking` field; any `blocking` key present in checks.yaml
  is rejected by validation.
- Reviewer configuration in the contract does not include advisory/blocking modes
  (no approval mode); reviewer enforcement at feature_done is approve/request_changes
  only (aligns with FEAT-086).
- '`engineeringagent run --all` fails fast when `harness/checks.yaml` is missing and
  prints deterministic remediation: run `engineeringagent init`.'
- '`engineeringagent run --all` plans and runs checks from `harness/checks.yaml` deterministically
  (phase + on_change).'
- '`engineeringagent init` scaffolds `harness/checks.yaml` (new repos do not need
  `harness/gates.yaml` or `harness/reviewers.yaml`).'
- This repository is migrated to `harness/checks.yaml` as the single system-of-record
  for run-time verification.
- '`harness/gates.yaml` and `harness/reviewers.yaml` do not exist in this repository
  after the migration.'
- Tool validation fails (deterministically) if legacy harness contract files are present,
  with remediation guidance to migrate/remove them.
- Outside `docs/spec/**`, there are no references to gate profiles (e.g. `loop_fast`,
  `precommit`) in code or documentation.
- '`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass.'
artifacts:
  plan: plan.md
