id: FEAT-004
title: Ralph-style OpenCode loop mode
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
planning_tier: planned
status: done
priority: high
objective: Implement a Ralph-style loop mode that runs OpenCode against a feature
  spec directly, without subtask orchestration.
context: 'Current loop behavior is strict around nested subtasks and pre-selected
  subtask context. We need an alternative mode aligned with Ralph loop principles:
  one operator-guided goal per cycle, simple control flow, and fast retry with back-pressure.

  '
constraints:
- Agent must read the feature YAML file itself from disk during execution.
- Loop execution must not require next-subtask selection to proceed.
- This feature defines single feature-iteration execution; outer repeat/scheduling
  behavior is owned by FEAT-003.
implementation_notes: 'Keep existing feature schema compatibility, but add a runtime
  mode that treats a feature as the unit of work and delegates planning/execution
  details to OpenCode. Preserve run logging and gate checks as back-pressure.

  '
acceptance:
- A Ralph loop mode can run OpenCode using a selected feature file path as the primary
  input.
- Default prompt for Ralph mode instructs OpenCode to read and use the YAML file directly.
- Ralph mode does not fail on missing/blocked subtasks and does not require subtask
  transitions.
- Each Ralph iteration records runs.jsonl telemetry with feature id, result, failed
  gate, duration, and commit.
- Feature-level Ralph iteration can be invoked repeatedly by higher-level loop scheduling
  without subtask coupling.
artifacts:
  plan: plan.md
