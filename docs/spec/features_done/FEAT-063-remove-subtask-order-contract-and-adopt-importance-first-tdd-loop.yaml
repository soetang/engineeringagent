  - Added regression confirming done-transition verification ignores newly inserted
    done subtasks that lack a pre-implement status snapshot (stable-id diff only).
  - Added regression confirming done-transition verification executes at most one
    verification payload per stable subtask id when duplicate ids appear in post-implement
    feature data.
  - Added regression confirming pre-implement duplicate subtask ids use first-entry
    status for stable-id done-transition verification diffing.
  - Added validator regression requiring AGENTS boot-sequence wording to use importance-first
    subtask selection language and remove legacy "next eligible subtask" phrasing.
  - Updated AGENTS and harness engineering principles docs to align work-selection
