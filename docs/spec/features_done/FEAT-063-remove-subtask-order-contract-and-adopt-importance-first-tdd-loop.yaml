- id: ST-006
  title: Finalize regressions for new loop and spec contracts
  status: done
  context: Confirm end-to-end behavior for validator and loop runtime under the new
    contract.
  notes:
  - Added regression coverage for done-transition verification command filtering when
    non-string entries appear in subtask verification payloads.
  - Added prompt-contract regression requiring "most important open subtask first"
