id: FEAT-099
title: Complete checks migration by relocating fitness + retry_feedback and deleting
  legacy packages
type: feature
expected_commit_subject: 'feat: delete legacy checks packages after migration'
planning_tier: planned
status: done
priority: high
objective: 'Complete the refactor started in FEAT-097/FEAT-098 by relocating remaining
  check-related subsystems (fitness framework and retry-feedback) under `src/engineeringagent/checks/**`,
  enforcing that legacy modules/packages are unused by production code, and deleting
  the legacy paths.

  '
context: "Depends on FEAT-097 and FEAT-098.\nOrdering / dependencies (explicit): -\
  \ FEAT-097 must land before FEAT-098. - FEAT-098 must land before FEAT-099.\nSpec\
  \ package (explicit): - This larger refactor is intentionally split across multiple\
  \ specs:\n  FEAT-097, FEAT-098, FEAT-099.\n- You are here: FEAT-099.\nFEAT-097 introduces\
  \ the canonical `engineeringagent.checks` package and stable contracts. FEAT-098\
  \ migrates the CLI and loop runtime to use `engineeringagent.checks.run_checks(...)`.\
  \ This feature finishes the migration by moving remaining fitness and retry-feedback\
  \ internals behind `checks/**`, updating harness allowlist policy to permit the\
  \ new supported surface, and deleting the legacy modules/packages once unused by\
  \ production code.\n"
constraints:
- 'After this feature, production code MUST NOT import any of: `engineeringagent.harness_checks_runtime`,
  `engineeringagent.validator`, `engineeringagent.reviewers`, `engineeringagent.fitness`,
  `engineeringagent.retry_feedback`.'
- 'After this feature, the following paths MUST NOT exist in the repository:'
- '`src/engineeringagent/harness_checks_runtime.py`'
- '`src/engineeringagent/validator.py`'
- '`src/engineeringagent/reviewers.py`'
- '`src/engineeringagent/fitness/`'
- '`src/engineeringagent/retry_feedback/`'
- All relocated functionality must live under `src/engineeringagent/checks/**`.
- Keep OpenCode/subagent execution implementation under `src/engineeringagent/opencode/**`
  (checks orchestrates via injected callable only).
- Determinism invariants must be preserved (ordering, stable output, stable JSON envelopes,
  stable retry-feedback envelopes).
- Update harness fitness-function import allowlist rules to allow the new supported
  surface under `engineeringagent.checks` once `engineeringagent.fitness` is removed.
- 'Add a harness fitness function that enforces the supported checks import surface:
  production code outside `src/engineeringagent/checks/**` must not import `engineeringagent.checks.*`
  submodules and may only import allowed top-level names from `engineeringagent.checks`.'
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: Python module\
  \ locations for fitness and retry-feedback internals.\n  - Old behavior: production\
  \ code imports fitness framework from `engineeringagent.fitness.*`\n    and retry-feedback\
  \ contracts/builders from `engineeringagent.retry_feedback.*`.\n  - New behavior:\
  \ production code imports these capabilities from `engineeringagent.checks.*`\n\
  \    only. `engineeringagent.fitness.*` and `engineeringagent.retry_feedback.*`\
  \ no longer exist.\n\n- Surface: supported harness import surface for fitness-rule\
  \ scripts.\n  - Old behavior: harness fitness-rule scripts import from `engineeringagent.fitness.*`\n\
  \    (and an allowlist fitness rule enforces that surface).\n  - New behavior: harness\
  \ fitness-rule scripts import the supported helpers from\n    `engineeringagent.checks.*`\
  \ (at minimum `engineeringagent.checks.emit_fitness_result`),\n    and the harness\
  \ import-allowlist rule is updated accordingly.\n\nCompatibility policy:\n- Breaking\
  \ internal refactor: legacy Python import paths are removed.\n- End users should\
  \ be unaffected as long as they use CLI entrypoints; the supported\n  surface is\
  \ `engineeringagent.checks` and the CLI.\n\nFitness-function impact assessment:\n\
  - Requires updates:\n  - Update `harness/fitness-functions/check_harness_src_import_allowlist.py`\
  \ allowlist to\n    permit `engineeringagent.checks.*` (or a narrower prefix such\
  \ as `engineeringagent.checks.fitness.*`).\n  - Update harness fitness-rule scripts\
  \ (if any) that import `engineeringagent.fitness.envelope`\n    to import from `engineeringagent.checks`\
  \ instead.\n  - Add a new harness fitness function enforcing that `src/engineeringagent/**`\
  \ modules outside\n    `src/engineeringagent/checks/**` only import the supported\
  \ top-level checks API.\n"
acceptance:
- All functionality previously provided by `src/engineeringagent/fitness/**` is available
  under `src/engineeringagent/checks/**` and used by production code via `engineeringagent.checks.*`
  imports.
- All functionality previously provided by `src/engineeringagent/retry_feedback/**`
  is available under `src/engineeringagent/checks/**` and used by production code
  via `engineeringagent.checks.*` imports.
- 'Production code under `src/engineeringagent/**` contains zero imports from any
  of:'
- '`engineeringagent.harness_checks_runtime`'
- '`engineeringagent.validator`'
- '`engineeringagent.reviewers`'
- '`engineeringagent.fitness`'
- '`engineeringagent.retry_feedback`'
- 'The legacy paths do not exist after the change:'
- '`src/engineeringagent/harness_checks_runtime.py`'
- '`src/engineeringagent/validator.py`'
- '`src/engineeringagent/reviewers.py`'
- '`src/engineeringagent/fitness/`'
- '`src/engineeringagent/retry_feedback/`'
- Harness import allowlist fitness rule(s) allow the new checks surface and still
  prevent imports from orchestration internals.
- 'A new harness fitness function enforces the checks import surface: modules outside
  `src/engineeringagent/checks/**` do not import `engineeringagent.checks.*` submodules
  and only import the allowed top-level names from `engineeringagent.checks`.'
- '`uv run python -m engineeringagent.cli validate`, `uv run python -m engineeringagent.cli
  fitness run --format json`, and `uv run pytest -q` pass.'
artifacts:
  plan: plan.md
