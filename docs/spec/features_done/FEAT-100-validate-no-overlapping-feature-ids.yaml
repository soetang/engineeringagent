id: FEAT-100
title: Validate rejects overlapping feature IDs (with legacy done-spec opt-out)
type: feature
expected_commit_subject: 'feat: validate rejects overlapping feature ids'
status: done
priority: high
objective: 'Prevent ambiguous/overlapping feature spec identifiers by enforcing uniqueness
  and filename/frontmatter alignment, while providing a scoped opt-out for legacy
  archived specs so existing repositories can adopt the policy without rewriting history.

  '
context: 'We currently validate spec schema/structure, but we do not enforce that
  feature IDs are globally unique or that the frontmatter id matches the filename''s
  FEAT token. This can lead to confusing collisions like multiple specs effectively
  referring to the same feature number. Because engineeringagent is used by external
  repos, we need a strict default policy, but also a migration path for older archived
  specs.

  '
constraints:
- 'Default policy is strict: no duplicate base feature IDs across active + done specs.'
- Active specs under docs/spec/features/ MUST always be unique; there is no opt-out
  for active specs.
- A legacy opt-out exists only for archived specs under docs/spec/features_done/ and
  only for numeric FEAT ids below a configured threshold.
- Remediation messaging must clearly distinguish active vs done collisions and must
  mention the opt-out only for done/legacy cases.
- Do not require rewriting existing historical done specs; this repo must remain able
  to validate via config.
- Do not change the FeatureSpec 'id' schema pattern in this feature (still FEAT-[0-9]{3,}).
implementation_notes: "Terms:\n\n- \"Filename id token\": the leading \"<PREFIX>-<PRIMARY>\"\
  \ token in the filename before the\n  next '-' (e.g. FEAT-098 from FEAT-098-some-title.yaml).\n\
  - \"Base feature id\": the feature id used for collision detection.\n    - Current\
  \ contract only permits numeric IDs (FEAT-[0-9]{3,}), so base id == id.\n    - Collision\
  \ comparison must normalize numeric ids to avoid \"FEAT-098\" vs \"FEAT-98\"\n \
  \     drifting (normalize by int(primary) for comparisons only; keep original string\
  \ for display).\n\nNew validation behavior (validate command):\n\n1) Filename/frontmatter\
  \ id alignment\n   - For every feature spec under docs/spec/features/*.yaml and\
  \ docs/spec/features_done/*.yaml:\n     - Parse YAML and read frontmatter id.\n\
  \     - Extract filename id token.\n     - If they do not match exactly, emit a\
  \ deterministic validation error.\n\n2) No overlapping base feature ids\n   - Build\
  \ a map base_id -> list of (path, id) for all specs.\n   - Default: any base_id\
  \ with more than one entry is an error.\n   - Legacy done-spec opt-out:\n     -\
  \ A config setting may allow duplicates ONLY for docs/spec/features_done/ and ONLY\
  \ for\n       numeric base ids < threshold.\n     - Active specs never use this\
  \ opt-out.\n\nConfiguration (TOML):\n\n- Key: `allow-duplicate-done-base-ids-below`\
  \ (int) under the `specs` table.\n- Supported sources / precedence:\n    - engineeringagent.toml:\n\
  \        [specs]\n        allow-duplicate-done-base-ids-below = <int>\n    - pyproject.toml:\n\
  \        [tool.engineeringagent.specs]\n        allow-duplicate-done-base-ids-below\
  \ = <int>\n    - default: unset (strict everywhere)\n\nRemediation messaging requirements:\n\
  \n- If collision involves any active spec under docs/spec/features/:\n    - Do NOT\
  \ mention the opt-out.\n    - Remediation must say to rename/re-id to make active\
  \ feature ids unique.\n\n- If collision is entirely within docs/spec/features_done/:\n\
  \    - Remediation must include both options:\n        (a) Preferred: rename/re-id\
  \ archived specs to remove duplicates\n        (b) Legacy opt-out: set `[tool.engineeringagent.specs]\
  \ allow-duplicate-done-base-ids-below = <N>`\n            to allow duplicates for\
  \ archived specs only, and must explicitly state it does not apply to\n        \
  \    active specs and only applies to ids below the threshold.\n"
acceptance:
- validate fails when any two active specs under docs/spec/features/ share the same
  base feature id.
- validate fails when any spec filename's id token does not match its frontmatter
  id (active or done).
- By default (no config), validate fails on duplicate base feature ids in docs/spec/features_done/.
- When allow-duplicate-done-base-ids-below is set, validate allows duplicate base
  feature ids in docs/spec/features_done/ only for numeric ids < threshold.
- Even with the config set, validate still fails on duplicates in docs/spec/features/.
- Error output for done-only collisions mentions the legacy opt-out and clearly scopes
  it to done specs + ids below the threshold.
- '`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass.'
subtasks:
- id: ST-001
  title: Add spec id uniqueness + filename-id alignment checks to validator
  status: done
  context: 'Implement two new validations: (1) filename id token must match frontmatter
    id, and (2) base feature ids must be unique, with done-only legacy opt-out support.

    '
  verification:
  - uv run python -m engineeringagent.cli validate
  - uv run pytest -q
- id: ST-002
  title: Add TOML config support for tool.engineeringagent.specs.allow-duplicate-done-base-ids-below
  status: done
  context: 'Extend config loading to read the new specs threshold setting from engineeringagent.toml
    ([specs]) and pyproject.toml ([tool.engineeringagent.specs]), with deterministic
    precedence, and wire it into validator behavior.

    '
  verification:
  - uv run pytest -q
- id: ST-003
  title: Add validator tests for collisions and remediation messaging
  status: done
  context: 'Add meta tests that cover: active duplicates fail always, done duplicates
    fail by default, done duplicates pass when threshold opt-out applies, filename/frontmatter
    mismatch fails, and remediation strings include or omit the opt-out message appropriately.

    '
  verification:
  - uv run pytest -q
- id: ST-004
  title: Add legacy done-spec opt-out to this repo via pyproject.toml
  status: done
  context: "This repository contains historical duplicate FEAT ids under docs/spec/features_done/.\
    \ Add the following to pyproject.toml so validation remains strict for active\
    \ specs while permitting old archived duplicates:\n  [tool.engineeringagent.specs]\n\
    \  allow-duplicate-done-base-ids-below = 100\n"
  verification:
  - uv run python -m engineeringagent.cli validate
- id: ST-005
  title: Refactor feature id invariant validator to satisfy ruff
  status: done
  context: 'Refactor _append_feature_id_invariant_issues to reduce cyclomatic complexity
    and argument count without changing behavior.

    '
  verification:
  - uv run ruff check src/engineeringagent harness
  - uv run pytest -q
- id: ST-006
  title: Archive FEAT-100 spec to features_done
  status: done
  context: 'Completed feature specs must live under docs/spec/features_done/.

    '
  verification:
  - uv run python -m engineeringagent.cli validate
- id: ST-007
  title: Remove stdlib dataclasses from validator context models
  status: done
  context: 'Fitness rules forbid stdlib dataclasses in src/. Replace any internal
    validator context dataclasses with pydantic BaseModel without changing behavior.

    '
  verification:
  - uv run python -m engineeringagent.cli fitness run --format json
  - uv run engineeringagent validate
