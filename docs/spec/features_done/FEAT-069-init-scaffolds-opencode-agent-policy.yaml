    '
  verification:
  - uv run pytest -q tests/test_init_command.py::test_init_renders_scaffold_from_template_files
- id: ST-002
  title: Extend init scaffold manifest to write .opencode policy outputs
  status: done
  context: 'Update `build_baseline_scaffold_manifest` so init writes the new `.opencode/*`
    files for all scaffold profiles, respecting existing `--force` behavior.

    '
  verification:
  - uv run pytest -q tests/test_init_command.py
- id: ST-003
  title: Remove opencode.json requirement from hints, docs, and readme_process sandbox
  status: done
  context: 'Update remediation messaging, docs references, and readme_process reviewer
    prompt/config to stop requiring `opencode.json`, and adjust tests asserting sandbox
