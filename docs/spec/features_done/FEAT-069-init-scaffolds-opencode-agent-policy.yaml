id: FEAT-069
title: Init scaffolds OpenCode engineeringagent agent policy files
type: feature
expected_commit_subject: 'feat: add FEAT-069 init opencode agent policy scaffolding'
status: done
priority: high
objective: 'Make `engineeringagent init` produce a permission-viable, deterministic
  OpenCode default-agent setup by scaffolding `.opencode/agents/engineeringagent.md`
  and a minimal `.opencode/.gitignore`, without requiring `opencode.json`.

  '
context: 'The loop runtime and permission probe invoke OpenCode with a fixed agent
  name (`--agent engineeringagent`). Today, `engineeringagent init` does not scaffold
  any `.opencode/` artifacts, so newly scaffolded repositories lack the canonical
  agent-policy file and can fail default implement-mode prechecks.

  This repository also removed its committed `opencode.json`, but various docs, remediation
  hints, and the readme_process clean-room sandbox asset list still assume `opencode.json`
  exists. That makes README-based workflows and sandbox reviews brittle.

  '
constraints:
- Init scaffolding must create `.opencode/agents/engineeringagent.md` with Codex high
  defaults (`openai/gpt-5.3-codex`, `variant=high`) and allow-all permissions for
  `bash`.
- Init scaffolding must create `.opencode/.gitignore` that ignores `.opencode/node_modules`
  and OpenCode-managed package artifacts, but does not ignore `.opencode/agents`.
- Scaffold output must be idempotent; do not overwrite existing `.opencode/*` files
  unless `--force` is used.
- Keep scaffold payloads in `src/engineeringagent/scaffold_templates/` (no inline
  template bodies in source modules).
- Backward compatibility; do not require or generate `opencode.json` as part of init
  scaffolding.
- Documentation and remediation messaging must not claim that `opencode.json` is required
  for the default OpenCode agent contract.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `engineeringagent\
  \ init` scaffolded assets.\n  - Old behavior: init scaffolds harness/spec layout\
  \ only; no `.opencode/*` files.\n  - New behavior: init additionally scaffolds `.opencode/agents/engineeringagent.md`\n\
  \    and `.opencode/.gitignore` (idempotent unless `--force`).\n\n- Surface: default\
  \ OpenCode permission remediation guidance.\n  - Old behavior: remediation/hints\
  \ reference both `.opencode/agents/engineeringagent.md`\n    and `opencode.json`.\n\
  \  - New behavior: remediation/hints reference `.opencode/agents/engineeringagent.md`\n\
  \    as the required policy source; `opencode.json` is treated as optional/deprecated.\n\
  \nMigration scope:\n- Add new scaffold template files.\n- Extend init scaffold manifest\
  \ to include `.opencode/*` outputs.\n- Update docs/reviewer prompt/tests that assert\
  \ `opencode.json` presence.\n"
acceptance:
- Running `engineeringagent init` in an empty repo creates `.opencode/agents/engineeringagent.md`.
- Running `engineeringagent init` in an empty repo creates `.opencode/.gitignore`
  that ignores `.opencode/node_modules` and does not ignore `.opencode/agents`.
- Without `--force`, init does not overwrite existing `.opencode/*` files.
- Default-agent permission remediation messaging no longer claims `opencode.json`
  is required for allow-all permissions.
- Repository-owned readme_process reviewer sandbox assets and prompt no longer require
  `opencode.json` to be present.
- Specs validate and targeted unit tests pass.
subtasks:
