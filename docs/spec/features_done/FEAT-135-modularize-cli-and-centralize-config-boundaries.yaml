id: FEAT-135
title: Modularize CLI command handling and centralize config write boundaries
type: chore
expected_commit_subject: 'chore: add FEAT-135 modularize cli and config boundaries'
status: done
priority: medium
objective: Improve separation of concerns by splitting CLI wiring from command logic,
  moving config mutation into a dedicated config boundary, and removing duplicated
  utility helpers.
context: '`src/engineeringagent/cli.py` currently contains Typer wiring, command orchestration,
  file/config mutation, and output helper logic in one large module. This increases
  coupling and slows safe iteration across CLI and config behavior.'
constraints:
- Remove legacy/compatibility code touched by this work immediately; no temporary
  compatibility shims.
- When removing legacy CLI/config helper paths, remove tests that only verify those
  removed paths in the same change.
- Preserve command names, command options, and core command semantics unless an explicit
  contract delta is documented.
- Move TOML config mutation/writing behavior out of CLI and into a dedicated config
  domain module/surface.
- Keep behavior-preserving refactors as the default and allow only minor CLI UX/output
  cleanup that does not change workflow semantics.
- Deduplicate shared terminal/path/output helper logic instead of keeping duplicated
  local implementations.
- Do not change loop-triggered checks phase policy/default sequencing in this feature;
  that behavior is owned by FEAT-137.
- Do not change implement-prompt validation command policy in this feature; that behavior
  is owned by FEAT-136.
- Verification baseline for this feature is targeted tests plus `uv run engineeringagent
  validate`.
- no fitness-function changes required; this feature reorganizes module boundaries
  without changing existing architectural policy intent.
implementation_notes: "Contract change declaration\n\nSurface:\n- Internal CLI module\
  \ layout and handler/service boundaries.\n- Internal config mutation APIs for `engineeringagent.toml`\
  \ writes.\n\nOld behavior:\n- CLI command registration, orchestration, config mutation,\
  \ and output helper logic\n  are heavily co-located in `cli.py`.\n- Config reading\
  \ and writing responsibilities are split across unrelated modules.\n\nNew behavior:\n\
  - CLI wiring and command execution logic are separated into focused modules.\n-\
  \ Config write/mutation behavior is centralized under a dedicated config boundary.\n\
  - Shared utility helpers are deduplicated and reused.\n\nCompatibility policy:\n\
  - Internal API/module path changes may break direct internal imports.\n- No compatibility\
  \ shim layer for moved internal helper functions.\n\nMigration plan:\n- Extract\
  \ `init` and checks-related command orchestration into handler/service modules.\n\
  - Introduce shared config mutation helpers and migrate CLI call sites.\n- Split\
  \ Typer app wiring from command implementation logic.\n- Apply minor UX cleanup\
  \ only where output/help text clarity improves without semantic changes.\n\nVerification\
  \ evidence:\n- Targeted CLI/config tests + `uv run engineeringagent validate`.\n"
acceptance:
- CLI module structure separates Typer app wiring from command orchestration handlers.
- Config mutation/write logic for `engineeringagent.toml` is centralized outside `cli.py`.
- Duplicated helper logic (TTY detection, repo-relative path/output writing helpers)
  is deduplicated through shared utilities.
- Existing CLI command behavior remains stable, with only minor text/UX cleanup.
- Tests tied only to deleted legacy helpers are removed; remaining tests cover the
  new module boundaries and supported command behavior.
- 'Verification command passes: `uv run pytest -q tests/cli`.'
- 'Verification command passes: `uv run engineeringagent validate`.'
