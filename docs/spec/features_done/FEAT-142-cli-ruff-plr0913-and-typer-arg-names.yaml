id: FEAT-142
title: Relax Ruff PLR0913 for cli.py and align handler arg names with Typer parameters
type: chore
expected_commit_subject: 'chore: relax cli max-args and align typer arg names'
status: done
priority: medium
objective: 'Reduce friction from Ruff''s max-args policy in Typer command entrypoints
  while

  keeping the rule strict across the rest of the repo, and remove internal naming

  mismatches between Typer parameters and the `_HandlerArgs` attributes used by

  the `cmd_*` handlers.


  This should make `src/engineeringagent/cli.py` easier to maintain by:

  - scoping `PLR0913` relaxation only where Typer requires many parameters

  - avoiding aliasing/mismatched arg names (e.g. `format=output_format`, `all=run_all`)

  '
context: '`src/engineeringagent/cli.py` uses Typer command functions with many options,
  which

  naturally violates Ruff''s `PLR0913` ("too many arguments"). The file already routes

  into handlers that accept a single `_HandlerArgs` object, but Ruff still checks
  the

  Typer entrypoint signatures.


  Additionally, some Typer wrapper parameter names differ from the names stored on

  `_HandlerArgs` (e.g. `output_format` is passed as `format=...`). This creates avoidable

  cognitive overhead and makes it easier to accidentally reference the wrong attribute

  in handler code or tests.

  '
constraints:
- Add a Ruff configuration relaxation scoped only to `src/engineeringagent/cli.py`
  and only for `PLR0913` (do not change global `max-args`).
- 'Do not add inline/file-level `# noqa: PLR0913` suppressions in `src/engineeringagent/cli.py`;
  use Ruff config (`per-file-ignores`) instead.'
- Preserve CLI-visible behavior and help output (flags and semantics stay the same;
  this is internal naming + lint-scoping only).
- Keep Typer interfaces explicit per command (do not refactor to `ctx.params` pass-through).
- 'Align handler attribute names with the Typer wrapper parameter names:

  - Fitness commands use `args.output_format` (not `args.format`).

  - Run command uses `args.run_all` (not `args.all`).

  '
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: Ruff linting policy\
  \ scope.\n  - Old behavior: `src/engineeringagent/cli.py` is subject to repo-wide\
  \ `PLR0913` max-args enforcement and fails lint due to Typer command signatures.\n\
  \  - New behavior: `src/engineeringagent/cli.py` is exempt from `PLR0913` via Ruff\
  \ `per-file-ignores`, while all other files remain enforced by `max-args = 5`.\n\
  \n- Surface: Internal handler argument names (not CLI flags).\n  - Old behavior:\
  \ some Typer wrapper params are aliased when constructing `_HandlerArgs` (e.g. `output_format`\
  \ passed as `format`, `run_all` passed as `all`), and handlers reference `args.format`\
  \ / `args.all`.\n  - New behavior: `_HandlerArgs` keys match the Typer wrapper parameter\
  \ names; handlers reference `args.output_format` / `args.run_all`.\n\nCompatibility\
  \ policy:\n- CLI compatibility is required: no change to end-user flags/behavior.\n\
  - Internal Python call sites and tests that construct handler args must be updated\
  \ to the new attribute names.\n\nFitness-function impact assessment (required):\n\
  - no fitness-function changes required: this feature avoids inline Ruff suppressions\
  \ and preserves existing harness policies; it only adjusts Ruff config and internal\
  \ naming.\n"
acceptance:
- Ruff is configured with `per-file-ignores` so `src/engineeringagent/cli.py` ignores
  only `PLR0913` while the repo-wide `max-args = 5` remains unchanged.
- 'No inline/file-level `# noqa: PLR0913` suppressions are added to `src/engineeringagent/cli.py`.'
- '`cmd_fitness_list`, `cmd_fitness_run`, and `cmd_fitness_catalog` read `args.output_format`
  and the Typer wrappers pass `output_format=...` into `_exit_with_handler_code`.'
- '`cmd_run` reads `args.run_all` and the Typer wrapper passes `run_all=...` into
  `_exit_with_handler_code`.'
- CLI flags and help remain the same (e.g. fitness still uses `--format`, run still
  uses `--all`).
- '`uv run ruff check src/engineeringagent`, `uv run pytest -q`, and `uv run python
  -m engineeringagent.cli validate` pass.'
