id: FEAT-130
title: Add per-feature markdown handoff pipeline and progress artifact layout
type: spec
expected_commit_subject: 'spec: add FEAT-130 progress handoff markdown pipeline'
planning_tier: planned
status: done
priority: high
objective: 'Implement a deterministic handoff system where each iteration produces
  a concise, append-only Markdown handoff entry per feature, while preserving machine-readable
  progress telemetry and restructuring progress artifacts under feature-scoped folders.

  '
context: 'The current loop writes machine telemetry to `progress/runs.jsonl` and per-feature
  logs to `progress/run-feature-<FEATURE_ID>.txt`, but there is no durable, human-oriented
  handoff stream for the next developer iteration.

  We want a structured, inspectable handoff artifact that does not get committed,
  does not live forever by default policy, and is controlled by loop-owned append
  logic instead of ad-hoc agent file edits.

  User direction for this feature: - handoff artifact must be Markdown, - handoff
  append should be done by loop logic from a structured `output_type` envelope, -
  progress artifacts should be reorganized into dedicated folders, - cleanup/retention
  should be manual (operator-driven), not automatic TTL pruning, - path migration
  can be an immediate break (no dual-support window).

  '
constraints:
- Handoff artifact format is Markdown at `progress/features/<feature_id>/handoff.md`.
- Keep machine telemetry format stable and machine-friendly (`runs.jsonl`, `run.txt`),
  not Markdown.
- Agent must not write handoff files directly; loop/runtime owns append behavior.
- Implementation prompt must reference the feature handoff path and instruct the agent
  to read existing `handoff.md` context before doing new work.
- 'Implementation prompt must explicitly tell the agent: write the hand-off so that
  the next developer can easily continue the work.'
- Implement step must request structured output via `run_agent(..., output_type=ImplementProgressEnvelope)`;
  handoff extraction is schema validation, not delimiter parsing.
- Handoff envelope must use a lean contract with required fields `summary`, `completed_work`,
  `verification`, `remaining_work`, and optional `blockers`.
- Missing or malformed structured handoff output must not fail the iteration; append
  deterministic fallback content instead.
- 'Path migration is immediate break: remove reliance on legacy paths (`progress/runs.jsonl`,
  `progress/run-feature-*.txt`).'
- Keep progress artifacts out of git via `.gitignore` updates for new directories.
- Retention is manual only in this feature; do not add automatic TTL cleanup.
- Centralize all progress path construction in `engineeringagent.progress.paths` and
  writes in `engineeringagent.progress.logging`/handoff helpers.
- Keep loop/check behavior deterministic and append-only for handoff entries.
implementation_notes: "Contract change declaration (required)\n\nSurface:\n- Progress\
  \ artifact path layout in `engineeringagent.progress.paths`.\n- Loop telemetry outputs\
  \ and log references (`runs.jsonl`, per-feature run logs).\n- Implement prompt +\
  \ structured output contract for iteration-end handoff payload.\n- New handoff append\
  \ behavior and manual progress CLI helpers.\n- Repo docs and tests that reference\
  \ progress artifact paths.\n\nOld behavior:\n- Telemetry JSONL path is `progress/runs.jsonl`.\n\
  - Per-feature machine log path is `progress/run-feature-<FEATURE_ID>.txt`.\n- No\
  \ canonical Markdown handoff file exists.\n- Agent output has no enforced final\
  \ handoff block consumed by loop append logic.\n\nNew behavior:\n- Telemetry JSONL\
  \ path becomes `progress/runs/runs.jsonl`.\n- Per-feature machine log path becomes\
  \ `progress/features/<feature_id>/run.txt`.\n- Per-feature handoff Markdown path\
  \ becomes `progress/features/<feature_id>/handoff.md`.\n- Prompt includes the handoff\
  \ file path so the agent can read prior iteration context before implementation.\n\
  - Prompt explicitly says: write the hand-off so that the next developer can easily\
  \ continue the work.\n- Implement step requests `output_type=ImplementProgressEnvelope`\
  \ with a lean required schema:\n  `summary`, `completed_work`, `verification`, `remaining_work`\
  \ (+ optional `blockers`).\n- ImplementProgressEnvelope shape (exact contract):\n\
  \  ```json\n  {\n    \"summary\": \"string\",\n    \"completed_work\": [\"string\"\
  ],\n    \"verification\": [\"string\"],\n    \"remaining_work\": [\"string\"],\n\
  \    \"blockers\": [\"string\"]\n  }\n  ```\n- Required fields: `summary`, `completed_work`,\
  \ `verification`, `remaining_work`.\n- Optional field: `blockers` (default to empty\
  \ list when omitted).\n- All list fields are lists of non-empty strings.\n- Loop\
  \ validates the structured handoff envelope and appends one Markdown entry per iteration.\n\
  - If structured output validation fails, loop appends deterministic fallback handoff\
  \ entry (append-only continuity).\n- Add manual CLI surfaces for operator-driven\
  \ handoff append/prune workflows.\n\nPrompt contract wording (exact required phrases)\n\
  \n- Prompt must include this sentence exactly:\n  `Before doing new work, read prior\
  \ handoff context from progress/features/$feature_id/handoff.md when the file exists.`\n\
  - Prompt must include this sentence exactly:\n  `Write the hand-off so that the\
  \ next developer can easily continue the work.`\n- Prompt must include this sentence\
  \ exactly:\n  `Do not write the handoff file directly; loop/runtime owns handoff\
  \ file appends.`\n\nCompatibility policy:\n- Immediate break for legacy progress\
  \ file paths and references.\n- No temporary dual-write or read-shim compatibility\
  \ layer.\n\nMigration plan:\n- Refactor path helpers first and migrate all call\
  \ sites to centralized helpers.\n- Introduce handoff parser/renderer helper and\
  \ wire into loop telemetry observer flow.\n- Update prompt template contract and\
  \ prompt regression tests.\n- Add manual progress CLI commands for append/prune\
  \ operations.\n- Update docs, gitignore, and all affected tests/fixtures for new\
  \ path layout.\n- Update progress-log locality fitness implementation as needed\
  \ for new approved literals/helpers.\n\nFitness-function impact assessment:\n- Existing\
  \ rule `architecture.progress-log-path-locality` will need implementation updates\n\
  \  to recognize the new canonical path literals/helpers and continue enforcing locality.\n\
  - No new fitness policy intent is required; update existing rule/scripts/docs alignment.\n\
  \nVerification evidence:\n- Loop output/telemetry tests proving new paths and append-only\
  \ behavior.\n- Prompt tests proving handoff path and \"next developer can easily\
  \ continue\" instructions are present.\n- Handoff envelope validation/renderer tests\
  \ proving valid parse + fallback path determinism.\n- CLI tests for manual `progress`\
  \ helper commands.\n- Spec validation and iteration-end checks pass.\n"
acceptance:
- 'Progress artifacts use the new layout: `progress/runs/runs.jsonl`, `progress/features/<feature_id>/run.txt`,
  `progress/features/<feature_id>/handoff.md`, and `progress/reviewers/state.json`.'
- Loop/runtime writes one append-only Markdown handoff entry per iteration from structured
  implement output using `run_agent(..., output_type=ImplementProgressEnvelope)`.
- 'Handoff envelope contract is lean and deterministic: required `summary`, `completed_work`,
  `verification`, `remaining_work`; optional `blockers`.'
- '`ImplementProgressEnvelope` uses only string/list-of-string fields with required
  fields present and list items non-empty.'
- Prompt contract references `progress/features/<feature_id>/handoff.md`, directs
  the agent to read prior handoff entries when present, and explicitly says to write
  the hand-off so that the next developer can easily continue the work.
- Prompt contract contains the exact wording lines defined in implementation notes
  for handoff read guidance, handoff writing intent, and loop-owned append ownership.
- Missing/malformed structured handoff output results in deterministic fallback entry
  append, without hard-failing the iteration solely for handoff parse issues.
- Agent direct file writes for handoff are not required by prompt contract; loop remains
  the handoff writer.
- '`.gitignore` excludes the new `progress/` directory layout so progress artifacts
  remain untracked.'
- Manual CLI helper(s) exist for progress handoff append and feature-scope cleanup
  (no automatic TTL behavior).
- Existing progress-path references in docs and test fixtures are migrated to new
  paths.
- '`architecture.progress-log-path-locality` implementation remains enforced and aligned
  with new canonical paths/helpers.'
- '`uv run pytest -q tests/loop/test_loop_output.py tests/loop/test_loop_ralph_mode.py
  tests/reviewers/test_reviewers_state.py tests/reviewers/test_reviewers_state_cache.py
  tests/meta/test_progress_import_paths.py tests/cli/test_cli.py tests/cli/test_cli_checks.py`
  passes.'
- '`uv run engineeringagent checks run --checks fitness --phase iteration_end` passes.'
- '`uv run engineeringagent validate` passes.'
