id: FEAT-007
title: Path-first run CLI and engineeringagent hard rename
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
status: done
priority: high
objective: Replace ID-based loop invocation with a file-path-first run command and hard-rename the package, module, and CLI surface to engineeringagent.
context: >
  Current usage requires `--feature-id` and a nested `loop run` command shape. This
  is slower to autocomplete and adds avoidable command depth. We want a simpler UX
  centered on explicit spec file paths, plus a full project rename from
  `agent-harness`/`agent_harness` to `engineeringagent` with no legacy compatibility
  layer.
constraints:
  - "Primary run UX is `engineeringagent run <feature-spec-path> [feature-spec-path ...]` with positional file path input."
  - "Do not keep legacy `agent-harness` command, `agent_harness` module path, or `--feature-id` CLI contract."
  - "Feature selection candidates must be driven by explicit file paths, not FEAT ID lookup."
implementation_notes: >
  Keep command behavior deterministic and explicit: resolve and validate the provided
  feature file path before execution. Update wrappers, docs, and tests so the new
  naming and run contract are the only supported public interface.
acceptance:
  - "CLI supports `engineeringagent run <feature-spec-path> [feature-spec-path ...]` as the canonical run entrypoint."
  - "Run selection uses the provided feature YAML file path(s) directly and errors clearly for missing/invalid paths."
  - "Python package/module path is renamed to `engineeringagent` and imports/entrypoints are updated repo-wide."
  - "Legacy `agent-harness`/`agent_harness` naming and `--feature-id` run selection are removed from supported usage."
  - "Documentation and scripts reflect only the new naming and command contract."
subtasks:
  - id: ST-001
    title: Define and implement top-level run CLI contract
    status: done
    context: >
      Flatten run ergonomics so users call
      `engineeringagent run <feature-spec-path> [feature-spec-path ...]` without loop
      nesting and without feature-id flags.
    verification:
      - "uv run engineeringagent --help"
      - "uv run engineeringagent run --help"
    attempts: 0
    notes: []
  - id: ST-002
    title: Switch loop selection from feature ID to explicit file path
    status: done
    context: >
      Update run execution to resolve provided spec file path(s), load those features,
      and use feature `id` values only for telemetry/reporting.
    verification:
      - "uv run engineeringagent run docs/spec/features/FEAT-003-back-pressure-and-verification-pipeline.yaml --dry-run --skip-implement"
      - "uv run engineeringagent run docs/spec/features/FEAT-003-back-pressure-and-verification-pipeline.yaml docs/spec/features/FEAT-004-ralph-loop-opencode-mode.yaml --dry-run --skip-implement"
      - "uv run engineeringagent validate"
    attempts: 0
    notes: []
  - id: ST-003
    title: Perform full package and module rename to engineeringagent
    status: done
    context: >
      Rename pyproject package metadata, script entrypoint, source package directory,
      and import references from `agent_harness` to `engineeringagent`.
    verification:
      - "uv run python -c \"import engineeringagent.cli; print('ok')\""
      - "uv run pytest -q"
    attempts: 0
    notes: []
  - id: ST-004
    title: Update scripts and docs to hard-cutover command examples
    status: done
    context: >
      Replace old command references and examples so quickstart, wrappers, and
      references consistently use the new run contract.
    verification:
      - "uv run python scripts/validate_specs.py"
      - "uv run engineeringagent run docs/spec/features/FEAT-003-back-pressure-and-verification-pipeline.yaml --dry-run --skip-implement"
    attempts: 0
    notes: []
  - id: ST-005
    title: Add CLI contract tests for path-first run behavior
    status: done
    context: >
      Cover parser behavior and loop selection using one or many feature file paths,
      including invalid path handling and removal of legacy id-based invocation.
    verification:
      - "uv run pytest -q tests/test_loop_ralph_mode.py"
      - "uv run pytest -q"
    attempts: 0
    notes: []
