id: FEAT-134
title: Remove loop legacy seams and private coupling to runtime internals
type: chore
expected_commit_subject: 'chore: add FEAT-134 remove loop legacy seams'
status: done
priority: high
objective: Remove remaining loop compatibility seams and private module coupling so
  loop orchestration depends only on explicit runtime contracts.
context: Loop architecture improved with LoopRun context, but legacy compatibility
  seams and private-internal imports still increase maintenance cost and blur module
  boundaries.
constraints:
- Remove legacy loop seams immediately with no compatibility carryover.
- Preserve documented CLI behavior for `engineeringagent run` while cleaning Python/internal
  loop surfaces.
- Remove `loop_runtime/facade_signatures.py` and associated compatibility-only tests/allowlist
  references in this feature.
- When a legacy loop/runtime path is removed, remove tests that only verify that removed
  path in the same change.
- Remove loop compatibility artifacts such as `_require_clean_worktree` alias and
  the unused back-compat `opencode_prompt` parameter on feature-iteration entrypoints.
- Stop private symbol coupling from `loop.py` to runtime internals (for example, underscore-prefixed
  imports from `loop_runtime/feature_state.py`) by exposing explicit public service
  functions.
- Do not change done-spec archival ownership or schema-only implement-prompt validation
  policy in this feature; those behavior deltas are owned by FEAT-136.
- Do not change unconditional iteration-end checks sequencing or loop-trigger phase
  policy in this feature; those behavior deltas are owned by FEAT-137.
- Verification baseline for this feature is targeted tests plus `uv run engineeringagent
  validate`.
- no fitness-function changes required; existing no-facade and loop/checks boundary
  rules already cover this scope.
implementation_notes: "Contract change declaration\n\nSurface:\n- Internal Python\
  \ loop runtime APIs in `src/engineeringagent/loop.py` and\n  `src/engineeringagent/loop_runtime/**`.\n\
  \nOld behavior:\n- Loop keeps compatibility-oriented seams and aliases that are\
  \ not required by\n  the target architecture.\n- `loop.py` reaches into private\
  \ runtime helpers instead of depending on explicit\n  module-owned public seams.\n\
  \nNew behavior:\n- Legacy compatibility seams are removed.\n- Loop depends on explicit\
  \ runtime service boundaries only.\n\nCompatibility policy:\n- Immediate break for\
  \ removed internal Python compatibility surfaces.\n- No temporary compatibility\
  \ wrappers.\n\nMigration plan:\n- Remove legacy shim modules/aliases/unused parameters\
  \ and update tests in the same change.\n- Introduce explicit public helper exports\
  \ where loop previously imported private symbols.\n- Keep CLI behavior stable while\
  \ simplifying internal contracts.\n\nVerification evidence:\n- Targeted loop/runtime/CLI\
  \ tests + `uv run engineeringagent validate`.\n"
acceptance:
- Compatibility-only loop shim module `loop_runtime/facade_signatures.py` is removed.
- Legacy alias `_require_clean_worktree` and unused compatibility parameter `opencode_prompt`
  are removed from loop entry contracts.
- Tests that only asserted removed compatibility seams are deleted or rewritten to
  assert the remaining explicit LoopRun/runtime contracts.
- The `loop.py` module no longer imports private underscore-prefixed runtime helpers.
- Loop runtime behavior and iteration outcomes remain stable for existing CLI flows.
- 'Verification command passes: `uv run pytest -q tests/loop tests/cli/test_cli.py`.'
- 'Verification command passes: `uv run engineeringagent validate`.'
