id: FEAT-088
title: Revert OpenCode subprocess timeout behavior introduced in 9f9d792
type: chore
expected_commit_subject: 'chore: revert opencode timeout handling'
planning_tier: planned
status: done
priority: medium
objective: 'Remove the recently-added OpenCode subprocess timeout behavior so `engineeringagent`

  does not enforce a wall-clock timeout on `opencode run`, and does not expose a

  timeout env var contract.


  Keep loop behavior deterministic, but treat long-running/hung OpenCode invocations

  as an operator concern (interrupt / investigate) rather than an enforced timeout.

  '
context: "This spec reverts the OpenCode timeout behavior introduced in commit:\n\n\
  - 9f9d7927b22435aa9a06c3b92b8bf40190b42732 (\"chore: remove skip-implement mode\"\
  )\n\nTimeout-related changes in that commit touched:\n- src/engineeringagent/opencode/client.py\n\
  \  - added DEFAULT_OPENCODE_TIMEOUT_SEC\n  - added OPENCODE_TIMEOUT_ENV=ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC\n\
  \  - added resolve_opencode_timeout_sec(...)\n  - started passing timeout=... to\
  \ subprocess.run\n- src/engineeringagent/loop_runtime/implement.py\n  - prints timeout\
  \ guidance\n  - catches subprocess.TimeoutExpired and classifies failed_gate=opencode_timeout\n\
  - tests/test_loop_opencode_integration.py\n  - adds default timeout test\n  - adds\
  \ timeout telemetry test asserting failed_gate=opencode_timeout\n- README.md\n \
  \ - documents ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC usage\n\nThis spec reverts only\
  \ the timeout-specific behavior and its docs/tests, not the\nother unrelated changes\
  \ in 9f9d792.\n"
constraints:
- Revert only timeout-specific behavior; do not reintroduce removed loop flags (e.g.
  --skip-implement).
- Remove the env var contract `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC` from runtime
  behavior and docs.
- Do not pass `timeout=` to the OpenCode subprocess invocation in `engineeringagent.opencode.client`.
- Do not emit or rely on `failed_gate=opencode_timeout` in telemetry/progress logs.
- 'Keep the OpenCode invocation contract unchanged: `opencode run --agent engineeringagent`.'
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: OpenCode execution\
  \ defaults.\n  - Old behavior (pre-9f9d792): subprocess.run(...) without timeout;\
  \ no timeout env var.\n  - New behavior (in 9f9d792, to revert): default timeout\
  \ + env var override +\n    opencode_timeout failed_gate when subprocess.TimeoutExpired\
  \ is raised.\n  - Restored behavior (after this change): no OpenCode subprocess\
  \ timeout is enforced\n    by engineeringagent; operators can interrupt if needed.\n\
  \nCompatibility policy:\n- Breaking change for anyone who started relying on ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC\n\
  \  or on failed_gate=opencode_timeout since 9f9d792.\n- Restores the pre-9f9d792\
  \ OpenCode execution behavior.\n\nHow to inspect the exact introduction point:\n\
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- src/engineeringagent/opencode/client.py\n\
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- src/engineeringagent/loop_runtime/implement.py\n\
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- tests/test_loop_opencode_integration.py\n\
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- README.md\n\nEnforcement\
  \ guidance:\n- Prefer tests/docs assertions over a new fitness function unless we\
  \ intend a\n  permanent policy of \"engineeringagent must never set an OpenCode\
  \ timeout\".\n"
acceptance:
- Runtime code under `src/engineeringagent/` no longer references `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC`.
- '`src/engineeringagent/opencode/client.py` does not define timeout constants/helpers
  and does not pass `timeout=` to subprocess.run.'
- '`src/engineeringagent/loop_runtime/implement.py` does not treat subprocess.TimeoutExpired
  as a distinct OpenCode failure classification.'
- No test asserts opencode_timeout as a failed_gate for OpenCode execution.
- README no longer instructs using `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC`.
- '`uv run python -m engineeringagent.cli validate` passes.'
- '`uv run pytest -q` passes.'
artifacts:
  plan: plan.md
