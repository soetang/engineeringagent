id: FEAT-008
title: OpenCode allow-all permissions and batch command proof
status: done
priority: high
objective: Eliminate interactive permission rejections in loop runs by enforcing allow-all build-agent permissions and proving batch command execution works end to end.
context: >
  A recent loop execution auto-rejected a requested bash command (`git status --short`),
  which blocks autonomous runs. We need deterministic permission behavior for the
  build agent so OpenCode can execute required commands in non-interactive mode.
constraints:
  - "Build agent permissions must be configured as allow-all for loop execution."
  - "Verification must include a live OpenCode run that executes a batch bash command (`git status --short`)."
  - "Permission regressions must fail validation with clear, actionable output."
implementation_notes: >
  Keep permission policy repository-local and explicit. Add a machine-checkable
  permission probe that validates command execution and confirms no permission
  prompt rejection occurred.
acceptance:
  - "Repository OpenCode config declares allow-all permission policy for the build agent."
  - "A live OpenCode verification command runs `git status --short` successfully in batch mode."
  - "Verification fails if output indicates permission-request rejection or non-zero command execution."
  - "Loop documentation references the permission probe as required troubleshooting evidence."
subtasks:
  - id: ST-001
    title: Define allow-all build-agent permission contract
    status: done
    order: 1
    context: >
      Establish and implement one explicit allow-all policy in repository OpenCode
      configuration so loop runs do not rely on interactive approvals.
    verification:
      - "uv run python -c \"import json; cfg=json.load(open('opencode.json', encoding='utf-8')); perm=cfg['agent']['build']['permission']; assert perm.get('*')=='allow'; print('ok')\""
    attempts: 1
    notes:
      - "Set allow-all policy in opencode.json and added repo-local build agent override in .opencode/agents/build.md."
  - id: ST-002
    title: Add permission probe command for batch bash execution
    status: done
    order: 2
    context: >
      Create a reproducible probe that calls OpenCode build agent and requires a
      successful `git status --short` execution before returning a success token.
    verification:
      - "python3 -c \"import subprocess,sys; cmd=['opencode','run','--agent','build','Run exactly: git status --short. If it succeeds, reply PERMISSION_OK.']; p=subprocess.run(cmd,capture_output=True,text=True); out=(p.stdout or '')+(p.stderr or ''); print(out); ok=(p.returncode==0 and 'PERMISSION_OK' in out and 'permission requested' not in out.lower() and 'auto-reject' not in out.lower()); raise SystemExit(0 if ok else 1)\""
    attempts: 1
    notes:
      - "Added scripts/permission_probe.py and shared probe evaluator in src/agent_harness/opencode_permissions.py."
      - "Live opencode probe now executes git status --short and returns PERMISSION_OK."
  - id: ST-003
    title: Wire permission probe into explicit validation workflow
    status: done
    order: 3
    context: >
      Ensure there is a documented, repeatable validation path for permission health
      that can be run locally before loop execution.
    verification:
      - "uv run engineeringagent gates run --profile loop_fast"
      - "python3 -c \"import subprocess,sys; cmd=['opencode','run','--agent','build','Run exactly: git status --short. If it succeeds, reply PERMISSION_OK.']; p=subprocess.run(cmd,capture_output=True,text=True); out=(p.stdout or '')+(p.stderr or ''); raise SystemExit(0 if p.returncode==0 and 'PERMISSION_OK' in out else 1)\""
    attempts: 1
    notes:
      - "Wired opencode_permission_probe into harness/gates.yaml loop_fast profile."
      - "Updated README and docs/references/uv-llms.md with required troubleshooting evidence commands."
  - id: ST-004
    title: Add integration coverage for permission-failure signals
    status: done
    order: 4
    context: >
      Add test coverage around permission rejection detection and loop reporting so
      permission failures are visible as failed gates in summaries/telemetry.
    verification:
      - "uv run pytest -q tests/test_loop_opencode_integration.py"
      - "uv run pytest -q"
    attempts: 1
    notes:
      - "Added tests for permission rejection detection and failed_gate=opencode_permission telemetry reporting."
