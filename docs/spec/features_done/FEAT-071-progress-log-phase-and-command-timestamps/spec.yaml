id: FEAT-071
title: Add per-iteration phase and command timestamps to feature progress logs
type: feature
expected_commit_subject: 'feat: add phase and command timestamps to progress logs'
planning_tier: planned
status: done
priority: medium
objective: 'Make `progress/run-feature-<id>.txt` self-contained for answering:

  "what took the most time in this iteration?"


  Add per-phase and per-command start/end timestamps plus computed durations, and

  include a one-line `slowest=...` summary for each iteration.

  '
context: "Today, the loop writes two telemetry sinks:\n\n- `progress/runs.jsonl` (JSONL):\
  \ includes `ts` and `duration_sec` for an iteration.\n  - `ts` is written when iteration\
  \ telemetry is persisted (effectively end-of-iteration).\n  - `duration_sec` is\
  \ computed as `int(time.time() - started)` where `started` is\n    captured at the\
  \ beginning of the iteration pipeline.\n  - These fields are useful, but they do\
  \ not show which phase/command consumed the time.\n\n- `progress/run-feature-<id>.txt`\
  \ (text): includes outputs for implement/gates/\n  verification/reviewers and a\
  \ top-line `ts=...` header per iteration block.\n  - This `ts=...` header is also\
  \ end-of-iteration, so subtracting consecutive headers\n    only yields an approximation\
  \ of wall time between iteration ends, not a breakdown.\n\nAs a result, answering\
  \ \"what took most time in each iteration\" requires inference\nfrom adjacent iteration\
  \ headers and knowledge of which phases were active.\n\nWe want the per-feature\
  \ progress log to directly attribute time to phases and\ncommands without relying\
  \ on `runs.jsonl` or external analysis tools.\n"
constraints:
- 'Write timing data to `progress/run-feature-<feature_id>.txt` only.

  - Do not add or change fields in `progress/runs.jsonl`.

  '
- 'Record timestamps in UTC ISO-8601 format with second precision

  (e.g. 2026-02-15T13:45:11Z).

  '
- 'Record whole-second durations as `duration_sec`, computed from the captured

  boundaries.

  '
- 'Major phases must be timed at minimum:

  - initial_load

  - implement

  - verification

  - archive

  - gates

  - reviewers

  - completion_commit

  '
- 'Per-command timing must be recorded for executed commands/runs:

  - implement step (default OpenCode implement and custom `--implement-command`)

  - each executed gate command

  - each executed verification command

  - each executed reviewer run (per reviewer id)

  '
- 'Each iteration block must include a one-line summary identifying the longest

  single duration observed in that iteration:

  - `slowest=<phase|command> duration_sec=<n> started_at=<ts> ended_at=<ts>`

  '
- 'Existing progress-log section markers and output blocks must remain present and

  unchanged:

  - `implement_output_begin`/`implement_output_end`

  - `gate_output_begin`/`gate_output_end`

  - `verification_output_begin`/`verification_output_end`

  - `reviewer_output_begin`/`reviewer_output_end`

  Timing output must be additive.

  '
- 'Timing collection must not change loop behavior (logging only).

  '
- 'Keep output ASCII-only.

  '
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `progress/run-feature-<feature_id>.txt`\
  \ iteration content.\n  - Old behavior: progress logs include phase outputs but\
  \ have no per-phase/per-command\n    timestamps.\n  - New behavior: progress logs\
  \ include:\n    - per-phase `started_at`, `ended_at`, and `duration_sec` lines,\n\
  \    - per-command `started_at`, `ended_at`, and `duration_sec` lines for commands/runs,\n\
  \    - a one-line `slowest=...` summary per iteration.\n\nCompatibility policy:\n\
  - Additive-only within the progress log: do not remove or rename existing markers.\n\
  - `progress/runs.jsonl` remains unchanged.\n\nImplementation approach notes:\n-\
  \ Capture timing boundaries inside the iteration pipeline while phase boundaries\n\
  \  are known; render them once into the feature progress log.\n- Prefer a monotonic\
  \ clock for duration measurement and wall-clock UTC timestamps\n  for readability;\
  \ ensure `duration_sec` is non-negative.\n- Tests must not rely on real wall-clock\
  \ time; stub time sources so log output is\n  deterministic.\n"
acceptance:
- "Each iteration block in `progress/run-feature-<id>.txt` contains:\n- per-phase\
  \ `started_at`, `ended_at`, and `duration_sec` for all required phases\n- per-command\
  \ `started_at`, `ended_at`, and `duration_sec` for implement/gates/\n  verification/reviewers\
  \ when those commands run\n- the `slowest=...` one-line summary\n"
- 'Existing progress-log output markers remain present and unchanged.

  '
- '`progress/runs.jsonl` output schema and fields remain unchanged.

  '
- 'Unit tests cover timing rendering in the feature progress log and do not rely on

  wall-clock time.

  '
- 'Fitness-function impact: no fitness-function changes required (timing additions

  only affect progress log text).

  '
artifacts:
  plan: plan.md
