id: FEAT-091
title: Add real OpenCode hello-world smoke fitness function (temp repo + init slim
  + run loop)
type: test
expected_commit_subject: 'test: add real opencode hello-world smoke fitness function'
planning_tier: planned
status: done
priority: medium
objective: 'Add a fitness function that validates the full "real agent" integration
  path by

  running the engineering loop in an isolated temp git repository.


  The smoke test must:

  - create a temp git repo

  - run `engineeringagent init slim` in that repo

  - write a very tight hello-world Python feature spec with explicit interface + verification

  - run `engineeringagent run` so the real OpenCode agent performs the implementation

  - verify the loop completes and the interface contract holds

  '
context: 'We had a bad experience with the README reviewer: it produced unhelpful
  edits and

  its feedback contributed to introducing an OpenCode subprocess timeout, which caused

  the agent to stop mid-implementation.


  We want a stronger, repo-owned signal that the real agent loop still works end-to-end,

  using a tightly specified feature with deterministic verification.

  '
constraints:
- 'No runtime behavior change: do not add or reintroduce OpenCode subprocess timeout
  defaults in `src/engineeringagent/opencode/client.py`.'
- Do not run or require `engineeringagent reviewers init`; the temp repo setup must
  use only `engineeringagent init slim`.
- All mutations must be confined to the temp repo directory; no writes outside the
  temp directory.
- The harness fitness script must only import from `engineeringagent.fitness.*` plus
  stdlib (per harness import allowlist).
- 'The hello-world spec must be tight: explicit interface, explicit expected outputs,
  explicit verification commands.'
- The verification commands must be stdlib-only and must not rely on packaging/install
  (no `pip install`, no `uv add`, no build backend).
- The smoke run must be bounded to avoid hanging forever; configure a 15 minute budget
  for the fitness rule.
- 'The rule must be safe for environments without OpenCode configured: if `opencode`
  is missing or the run is not explicitly enabled, the rule must PASS with a deterministic
  ''skipped'' summary.'
implementation_notes: "Fitness-function impact assessment:\n- fitness-function changes\
  \ required: add a new harness script under `harness/fitness-functions/` and register\
  \ it in `harness/fitness-functions/rules.yaml`.\n\nExecution model:\n- The new fitness\
  \ rule is a command-adapter rule that runs a Python script which:\n  1) Creates\
  \ a temp directory and runs `git init`.\n  2) Runs `uv run python -m engineeringagent.cli\
  \ --project-root <tmp> init slim --no-precommit-install`.\n     - This must create\
  \ `.opencode/agents/engineeringagent.md` via init scaffolding.\n  3) Writes a new\
  \ feature spec under `<tmp>/docs/spec/features/FEAT-001-hello-world-smoke.yaml`\n\
  \     (id can be FEAT-001 since it is in the temp repo, not this repo).\n  4) Creates\
  \ a baseline commit so the loop can commit completion deterministically.\n  5) Runs\
  \ `uv run python -m engineeringagent.cli --project-root <tmp> run <feature_spec_path>\
  \ --max-iterations 3`.\n  6) Validates results:\n     - feature spec archived under\
  \ `<tmp>/docs/spec/features_done/` and has `status: done`\n     - the hello-world\
  \ interface contract passes (re-run verification commands after loop completion)\n\
  \nEnable/skip policy:\n- Use env var `ENGINEERINGAGENT_REAL_OPENCODE_SMOKE=1` to\
  \ enable the real-agent run.\n- If env var is missing, emit PASS with summary \"\
  skipped (set ENGINEERINGAGENT_REAL_OPENCODE_SMOKE=1)\".\n- If `opencode` is not\
  \ found on PATH, emit PASS with summary \"skipped (opencode not installed)\".\n\
  - If OpenCode returns a permission rejection, emit FAIL with a clear remediation\
  \ message pointing to `.opencode/agents/engineeringagent.md`.\n\nHello-world interface\
  \ contract (in the temp repo feature spec):\n- Create:\n  - `hello_world/__init__.py`\
  \ exporting `hello`\n  - `hello_world/__main__.py` providing `python -m hello_world`\n\
  - Contract:\n  - `hello(name: str) -> str` returns exactly `Hello, {name}!`\n  -\
  \ `hello(\"World\") == \"Hello, World!\"`\n  - `python -m hello_world` prints exactly\
  \ `Hello, World!` (newline allowed)\n\nExample verification commands for the temp\
  \ repo spec:\n- `python -c \"from hello_world import hello; assert hello('World')\
  \ == 'Hello, World!'\"`\n- `python -c \"import subprocess,sys; out=subprocess.check_output([sys.executable,'-m','hello_world'],\
  \ text=True); assert out.strip()=='Hello, World!'\"`\n\nNotes on timing:\n- The\
  \ rule's 15-minute budget exists to prevent indefinite hangs; the hello-world spec\
  \ is intentionally minimal to complete quickly in healthy setups.\n"
acceptance:
- 'A new fitness rule entry exists in `harness/fitness-functions/rules.yaml` for the
  real-agent hello-world smoke test with `timeout_seconds: 900`.'
- The harness script creates an isolated temp git repo, runs `engineeringagent init
  slim --no-precommit-install`, and does not use `engineeringagent reviewers init`.
- When `ENGINEERINGAGENT_REAL_OPENCODE_SMOKE` is not set, the rule reports PASS with
  a deterministic skipped summary (no external calls).
- When enabled and `opencode` is on PATH, the rule runs the real `engineeringagent
  run` loop and validates the hello-world interface via stdlib-only commands.
- 'The rule verifies the feature spec is archived to `docs/spec/features_done/` in
  the temp repo and has `status: done`.'
- '`uv run python -m engineeringagent.cli fitness run --format json` passes in this
  repo (including the skipped behavior when not enabled).'
artifacts:
  plan: plan.md
