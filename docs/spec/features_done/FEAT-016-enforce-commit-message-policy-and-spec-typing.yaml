    '
  verification:
  - python3 -c "from pathlib import Path; t=Path('AGENTS.md').read_text(encoding='utf-8').lower();
    assert 'docs/references/spec-writing-llms.md' in t and 'must follow' in t; print('ok')"
  - 'python3 -c "from pathlib import Path; t=Path(''docs/references/spec-writing-llms.md'').read_text(encoding=''utf-8'').lower();
    assert ''checklist'' in t and ''commit'' in t and ''type: summary'' in t; print(''ok'')"'
- id: ST-008
  title: Run targeted regression checks for validator loop and gate wiring
  status: done
  order: 8
  context: 'Execute focused tests for validator behavior, loop commit subject generation,
