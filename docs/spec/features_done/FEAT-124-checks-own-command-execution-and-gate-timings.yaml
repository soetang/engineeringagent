id: FEAT-124
title: Make checks own command execution and expose structured gate timing metadata
type: feature
expected_commit_subject: 'feat: make checks own command execution and gate timings'
status: done
priority: high
objective: 'Remove loop-owned shell-runner wiring for command checks and make checks
  the sole

  owner of command-check execution.


  Replace gate timing correlation based on textual output parsing with structured

  command invocation metadata returned from `engineeringagent.checks.run_checks(...)`.

  '
context: 'Gate execution currently injects `run_shell_command` from loop runtime into

  checks and wraps that callable for timing. Loop then re-correlates command timing

  to check ids by parsing command output lines.


  This creates an inverted ownership boundary: checks executes commands, but loop

  still provides part of the execution mechanism and depends on text output shape

  to recover structured facts.


  We want checks to own command execution and return structured command invocation

  facts directly so loop can consume deterministic metadata without output parsing.

  '
constraints:
- 'Breaking change allowed: do not preserve compatibility for `run_checks(..., run_shell_command=...)`.'
- Scope is gate/check command execution only; reviewer wiring remains unchanged in
  this feature.
- Checks command execution must be owned by checks runtime with default execution
  path through `engineeringagent.process.run_shell_command`.
- Loop gate phase must not parse `[check:<id>] command=...` lines to recover command/check
  correlation for timings.
- Keep deterministic checks failure semantics (`ok`, `failed_group`, `failed_check_id`,
  `failed_payload`) intact.
- 'Preserve per-feature progress-log timing behavior: gate command timing lines still
  include gate ids when command checks run.'
- 'Fitness-function impact assessment: no fitness-function changes required.'
implementation_notes: "Contract change declaration (required)\n\nSurface: `engineeringagent.checks.run_checks(...)`\
  \ supported kwargs and\n`ChecksRunResult` structured result contract.\n\nOld behavior:\n\
  - `run_checks(...)` supports `run_shell_command` override, and loop runtime passes\n\
  \  one during gate execution.\n- Loop gate timing correlation depends on parsing\
  \ command output lines to map\n  invocations back to check ids.\n\nNew behavior:\n\
  - `run_checks(...)` no longer accepts `run_shell_command` as a supported kwarg.\n\
  - Command checks execute via checks-owned runtime wiring (defaulting to\n  `engineeringagent.process.run_shell_command`).\n\
  - `ChecksRunResult` includes structured command invocation records for executed\n\
  \  command checks (at minimum: check identity + command identity + timing fields)\n\
  \  so loop can consume metadata directly.\n- Loop gate phase derives gate command\
  \ timings from structured checks result data,\n  not output-text parsing.\n\nCompatibility\
  \ policy:\n- Immediate break for callers passing `run_shell_command` into `run_checks(...)`.\n\
  - No compatibility shim.\n\nMigration plan:\n- Remove `run_shell_command` from checks\
  \ API supported kwargs and internal\n  plumbing.\n- Add typed command invocation\
  \ metadata to checks runtime outputs.\n- Remove gate-phase text-correlation helpers\
  \ and wire timing construction from\n  structured checks result metadata.\n- Update\
  \ tests that relied on `run_checks(..., run_shell_command=...)` to use\n  supported\
  \ seams (e.g., monkeypatch default process runner or test lower-level\n  command\
  \ runtime helpers directly).\n\nVerification evidence:\n- Targeted checks and loop\
  \ gate-timing tests.\n- Full test suite + `engineeringagent validate`.\n"
acceptance:
- '`engineeringagent.checks.run_checks(...)` rejects `run_shell_command` kwargs with
  deterministic unexpected-keyword failure behavior.'
- Command checks still execute successfully through checks-owned runtime wiring without
  loop-supplied shell-runner dependency.
- '`ChecksRunResult` exposes structured command invocation timing metadata for executed
  command checks, including check identity and command identity.'
- '`src/engineeringagent/loop_runtime/phases.py` no longer parses command output lines
  to correlate gate command timings.'
- Gate command timing records in progress logs continue to include gate ids for executed
  command checks.
- Reviewer path behavior remains unchanged in this feature.
