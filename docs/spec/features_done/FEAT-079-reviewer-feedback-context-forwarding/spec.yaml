id: FEAT-079
title: Allow reviewers.yaml to provide feedback context forwarded to implement agent
type: feature
expected_commit_subject: 'feat: forward reviewer feedback context'
planning_tier: planned
status: done
priority: medium
objective: 'Reduce incorrect overfitting to reviewer feedback (notably `readme_process`)
  by

  allowing repositories to attach explicit context about reviewer scope/limitations

  that is forwarded verbatim to the implement agent.


  This context should help the implement agent interpret feedback correctly: take

  reported errors seriously, but choose fixes that align with full codebase + specs

  even when the reviewer was executed with partial visibility (e.g. clean-room sandbox).

  '
context: 'The loop forwards reviewer feedback into the next implement pass via `hook_feedback`.

  In practice, implement can treat this feedback as authoritative even when the reviewer

  prompt/runtime is explicitly scoped or sandboxed.


  Example: `readme_process` runs in a clean-room sandbox that excludes `src/` and

  `tests/` by design. The reviewer is also instructed that it may not have full

  overview. Without forwarding this limitation, implement may apply changes in a way

  that is locally satisfying for the sandbox but suboptimal for the real repository.

  '
constraints:
- Extend the `harness/reviewers.yaml` contract with an optional per-reviewer string
  field named `feedback_context`.
- feedback_context must be a YAML string (single-line or multiline) located at `reviewers.<reviewer_id>.feedback_context`.
- "Concrete `harness/reviewers.yaml` shape example:\n\ncontract_version: \"1.0\"\n\
  profiles:\n  loop_fast:\n    - readme_process\nreviewers:\n  readme_process:\n \
  \   prompt_file: \"harness/reviewers/prompts/readme_process.md\"\n    feedback_context:\
  \ |\n      This reviewer runs with constrained context (e.g. a clean-room sandbox)\
  \ and may not\n      have access to the full codebase/specs. Treat failures as real,\
  \ but implement fixes in\n      a way that aligns with the feature spec and overall\
  \ repository architecture.\n    trigger:\n      phase: \"feature_done\"\n      on_change:\
  \ [\"README.md\"]\n    approval:\n      mode: \"blocking\"\n"
- Preserve backward compatibility; configs without `feedback_context` behave exactly
  as before.
- When present, `feedback_context` must be included in the forwarded reviewer feedback
  text that becomes the next-iteration `hook_feedback` (and thus appears in the implement
  prompt retry feedback block).
- Preserve existing telemetry parsing assumptions; the forwarded feedback must still
  start with the deterministic prefix `reviewer '` so reviewer-feedback detection
  continues to work.
- Do not change reviewer decision envelope schema; this feature is only about annotating
  forwarded feedback.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `harness/reviewers.yaml`\
  \ schema.\n  - Old behavior: reviewer definition does not support `feedback_context`.\n\
  \  - New behavior: reviewer definition optionally supports `feedback_context: <string>`.\n\
  \n- Surface: loop retry feedback forwarded to implement.\n  - Old behavior: forwarded\
  \ feedback contains reviewer id/mode/decision and the\n    decision summary/required\
  \ actions.\n  - New behavior: forwarded feedback additionally includes `feedback_context`\
  \ when\n    configured, so implement can interpret reviewer scope/limitations correctly.\n\
  \nNotes:\n- Keep formatting deterministic and stable. Add `feedback_context` as\
  \ an additional\n  line or block after the first-line prefix so existing `reviewer\
  \ '` detection and\n  human scanning remain consistent.\n"
acceptance:
- The reviewers.yaml contract accepts optional `reviewers.<id>.feedback_context`.
- When a reviewer returns `warning` or `request_changes`, forwarded feedback includes
  the configured `feedback_context`.
- When a reviewer returns `approve`, behavior is unchanged (no follow-up is triggered).
- Docs references (`docs/references/reviewer-agents.md` and reviewer authoring guide)
  document `feedback_context`.
- This repository's `harness/reviewers.yaml` sets `feedback_context` for `readme_process`
  to describe clean-room scope and interpretation guidance.
- '`uv run python -m engineeringagent.cli validate` and `uv run pytest -q` pass.'
artifacts:
  plan: plan.md
