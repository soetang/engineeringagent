  title: Move OpenCode backend package and update internal imports
  status: done
  verification:
  - uv run pytest -q
- id: ST-002
  title: Update fitness-rule allowlists/paths to new backend location
  status: done
  context: 'After relocating the OpenCode backend package, update the fitness enforcement
    that protects the agent/opencode dependency boundary (rule_id: `architecture.agents-opencode-boundary`)
    so that it continues to allow imports from the new backend location under `engineeringagent/agents/backends/opencode/**`
    and continues to forbid direct OpenCode usage elsewhere.

    '
  verification:
  - uv run pytest -q
  - uv run python harness/fitness-functions/check_agents_opencode_boundary.py
- id: ST-003
  title: Allowlist relocated OpenCode client for subprocess boundary rule
  status: done
  context: 'Relocating the OpenCode backend moved subprocess usage from the legacy
    `engineeringagent.opencode.client` module path to the new backend implementation
