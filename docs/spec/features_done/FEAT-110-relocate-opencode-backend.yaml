id: FEAT-110
title: Relocate OpenCode backend implementation under agents/backends
type: chore
expected_commit_subject: 'chore: relocate opencode backend under agents/backends'
status: done
priority: medium
objective: 'Move the OpenCode backend implementation from `src/engineeringagent/opencode/**`
  to `src/engineeringagent/agents/backends/opencode/**` while keeping the canonical
  `engineeringagent.agents.run_agent` contract unchanged. This aligns filesystem layout
  with architecture: OpenCode becomes an internal backend implementation detail.

  '
context: 'FEAT-109 establishes `engineeringagent.agents.run_agent` as the only supported
  agent invocation surface for production code. After that boundary is enforced by
  tests, relocating the OpenCode backend becomes a localized refactor that should
  not affect higher layers.

  '
constraints:
- 'Precondition: FEAT-109 is done and the `architecture.agents-opencode-boundary`
  fitness rule passes.'
- 'Keep the public agent contract stable: `engineeringagent.agents.run_agent` signature
  and behavior must remain unchanged.'
- 'Move implementation: relocate `src/engineeringagent/opencode/**` to `src/engineeringagent/agents/backends/opencode/**`.'
- No new compatibility shims are required for the old Python import paths (update
  internal imports in the same change).
- 'Determinism invariants remain: stable failure messages, stable retry templates,
  stable envelope emission.'
- 'Fitness-function impact assessment: maintain enforcement via fitness rule `architecture.agents-opencode-boundary`
  (update checker/tests if needed for relocation).'
implementation_notes: 'Contract delta (explicit)


  Surface: internal module layout only.


  Old behavior:

  - OpenCode backend code lives at `engineeringagent.opencode.*`.

  - `engineeringagent.agents` imports the backend from that location.


  New behavior:

  - OpenCode backend code lives at `engineeringagent.agents.backends.opencode.*`.

  - `engineeringagent.agents` continues to expose the same `run_agent` contract.

  - No other production modules depend on OpenCode backend module paths.

  '
acceptance:
- No modules remain under `src/engineeringagent/opencode/**` after relocation (directory
  removed).
- '`engineeringagent.agents.run_agent` behavior and signature are unchanged (verified
  by unit tests).'
- '`uv run pytest -q` passes.'
subtasks:
