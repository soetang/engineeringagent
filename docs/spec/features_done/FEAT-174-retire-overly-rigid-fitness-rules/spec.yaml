id: FEAT-174
title: Retire overly rigid fitness rules
type: chore
expected_commit_subject: 'chore: retire rigid feedback and catalog sync fitness rules'
planning_tier: planned
status: done
priority: high
objective: Remove fitness rules that enforce brittle implementation details or strict
  byte-level doc sync without proportional product value.
context: "Two active fitness rules are currently over-constraining:\n\n1) `architecture.feedback-no-truncation`\n\
  - Checker implementation targets specific file/function/helper names in prompt\n\
  \  renderer internals.\n- This is brittle against refactors and duplicates coverage\
  \ better handled by\n  unit/integration tests around feedback contract behavior.\n\
  \n2) `architecture.fitness-catalog-docs-sync`\n- Checker enforces byte-for-byte\
  \ equality for generated markdown catalog docs.\n- This catches formatting drift,\
  \ but imposes high maintenance overhead for\n  low-value non-semantic differences.\n\
  \nNote:\n- This catalog-sync rule is not a duplicate-doc finder; it is a strict\
  \ generated-doc\n  drift gate. The decision here is to retire that gate, not because\
  \ of duplicates,\n  but because byte-level enforcement is unnecessarily rigid.\n"
constraints:
- Remove both rule entries from `harness/fitness-functions/rules.yaml`.
- Delete `harness/fitness-functions/check_feedback_no_truncation.py`.
- Delete `harness/fitness-functions/check_fitness_catalog_docs_sync.py`.
- Remove or update tests dedicated to these removed rules.
- Regenerate fitness catalog docs after manifest changes.
- Do not change unrelated fitness rules in this feature.
implementation_notes: "Contract change declaration\n\nSurface:\n- active custom fitness\
  \ rule set and repo-maintainer quality gate behavior.\n\nOld behavior:\n- repo fails\
  \ fitness for violations from the two retired rule checkers.\n\nNew behavior:\n\
  - these two rule IDs are no longer evaluated by checks fitness runs.\n- docs/catalog\
  \ and tests reflect the reduced rule set.\n\nCompatibility policy:\n- repository-maintainer\
  \ policy change only; no end-user runtime contract impact.\n\nMigration plan:\n\
  - remove rule entries/scripts/tests in one change and regenerate catalog docs.\n\
  \nVerification evidence:\n- fitness test suite passes with removed rule artifacts.\n\
  \nFitness-function impact assessment:\n- remove existing rules:\n  - `architecture.feedback-no-truncation`\n\
  \  - `architecture.fitness-catalog-docs-sync`\n- Rationale: both rules are overly\
  \ rigid relative to architectural intent and\n  produce maintenance friction disproportionate\
  \ to enforcement value.\n"
acceptance:
- '`architecture.feedback-no-truncation` is absent from `harness/fitness-functions/rules.yaml`.'
- '`architecture.fitness-catalog-docs-sync` is absent from `harness/fitness-functions/rules.yaml`.'
- '`harness/fitness-functions/check_feedback_no_truncation.py` is removed.'
- '`harness/fitness-functions/check_fitness_catalog_docs_sync.py` is removed.'
- Dedicated rule tests are removed or rewritten to avoid asserting retired rule IDs.
- '`docs/fitness-functions/rules.md` is regenerated and no longer lists retired rule
  IDs.'
- '`uv run pytest -q tests/fitness` passes.'
artifacts:
  plan: plan.md
