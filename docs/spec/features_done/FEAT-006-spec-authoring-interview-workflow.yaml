id: FEAT-006
title: Spec authoring interview workflow and documentation
status: done
priority: high
objective: Require an interview-first workflow before writing new feature specs and document it in-repo for agents and humans.
context: >
  We need stronger spec quality and better alignment before implementation starts.
  Agents currently can jump into drafting a feature without enough discussion. This
  feature formalizes an interview-first process and makes it discoverable through AGENTS.md.
constraints:
  - "Before drafting a new FEAT spec, the agent must interview the user and confirm scope."
  - "Interview guidance must be documented in-repo and referenced from AGENTS.md."
  - "Spec output must continue to conform to docs/spec/schemas/feature.schema.json."
implementation_notes: >
  Start with documentation and AGENTS references. Add lightweight validation or
  checklist enforcement only if it improves reliability without adding heavy friction.
acceptance:
  - "A canonical spec-writing guide exists at docs/references/spec-writing-llms.md."
  - "AGENTS.md explicitly requires interview-before-spec-writing and references the guide."
  - "Guide defines mandatory interview topics, confirmation step, and drafting rules."
  - "Spec-writing workflow is reproducible by another agent with no extra tribal knowledge."
subtasks:
  - id: ST-001
    title: Define interview-first spec authoring guide
    status: done
    context: >
      Write a concise guide for LLM agents covering required interview topics,
      decision capture, and explicit user confirmation before drafting YAML.
    verification:
      - "python3 -c \"from pathlib import Path; p=Path('docs/references/spec-writing-llms.md'); assert p.exists(); t=p.read_text(encoding='utf-8'); assert 'Hard Rule' in t and 'Mandatory Interview Flow' in t; print('ok')\""
    attempts: 1
    notes: []
  - id: ST-002
    title: Wire AGENTS.md to the spec-writing guide
    status: done
    context: >
      Add explicit references in AGENTS.md so agents discover and read the guide
      before creating new feature specs.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('AGENTS.md').read_text(encoding='utf-8'); assert 'Interview before spec-writing' in t; assert 'docs/references/spec-writing-llms.md' in t; print('ok')\""
    attempts: 1
    notes: []
  - id: ST-003
    title: Define spec interview checklist for future features
    status: done
    context: >
      Include a reusable checklist/template in the guide so future spec requests
      consistently capture scope, constraints, and verification expectations.
    verification:
      - "python3 -c \"from pathlib import Path; t=Path('docs/references/spec-writing-llms.md').read_text(encoding='utf-8'); assert 'Suggested Interview Summary Template' in t; assert 'Definition of Ready for Spec Drafting' in t; print('ok')\""
    attempts: 1
    notes: []
