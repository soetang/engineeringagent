id: FEAT-063
title: Remove subtask order contract and adopt importance-first TDD loop behavior
type: feature
expected_commit_subject: 'feat: add FEAT-063 importance-first subtask selection and
  TDD loop contract'
planning_tier: planned
status: done
priority: high
objective: Replace ordered-subtask execution assumptions with importance-first agent
  selection, enforce an explicit TDD implementation prompt contract, and migrate repository
  specs to remove subtask order fields.
context: 'Current loop behavior and validation enforce ordered subtask progression
  (`order` contiguity and done-prefix-by-order), while prompt guidance says to pick
  the next eligible subtask. This prevents flexible importance-first execution and
  couples verification selection to ordering rather than observed progress transitions.

  Desired behavior is to let the agent choose the most important open subtask, execute
  with an explicit red-green-refactor TDD loop, and run verification only when a subtask
  transitions to `done` during the iteration. This feature is intentionally contract-changing
  and includes a one-time migration of all feature spec files to remove `subtasks[].order`.'
constraints:
- Remove order-based enforcement from validator, runtime selection logic, and implementation
  prompt language.
- Remove `subtasks[].order` from feature model and generated schema contract.
- Allow multiple subtasks in `in_progress`; do not retain the single-in-progress subtask
  invariant.
- Keep feature-level status-alignment invariants unless directly incompatible with
  this feature's scope.
- Verification phase must run only for subtasks whose status changed to `done` in
  the current iteration.
- If no subtask changes to `done` in the iteration, verification status must be `not_run`.
- Perform one-time migration removing `order` from all YAML specs under both docs/spec/features
  and docs/spec/features_done.
- Keep retry feedback, telemetry emission, and gate/reviewer/completion phase contracts
  stable except where verification-trigger semantics must change.
implementation_notes: "Contract/API deltas for this feature are explicit and intentional:\
  \ - Feature YAML contract: remove `subtasks[].order` from SubtaskSpec. - Validator\
  \ contract: remove contiguous-order and done-prefix-by-order invariants. - Runtime\
  \ loop contract: verification is triggered only by same-iteration subtask\n  transitions\
  \ to `done`; if no such transitions occur, verification status is\n  `not_run`.\n\
  - Prompt contract: implement step must select the most important open subtask and\n\
  \  follow explicit TDD sequence (red -> green -> refactor).\n- Compatibility policy:\
  \ no legacy fallback for `order`; perform one-time migration\n  across active and\
  \ archived feature specs.\n\nImplement done-transition verification by diffing subtask\
  \ status snapshots from before and after the implement step using stable subtask\
  \ ids. Build verification command lists from only newly-done subtasks and preserve\
  \ deterministic execution order using document order in the post-implement feature\
  \ payload.\nUpdate prompt templates and related guidance to explicitly require this\
  \ TDD loop for the chosen most-important subtask: (1) write/adjust test and observe\
  \ failure, (2) implement minimal code and observe pass, (3) refactor while keeping\
  \ tests green.\nMigration should be deterministic and repository-wide for active\
  \ and done feature specs so no legacy order fallback path is required."
acceptance:
- Validator no longer reports contiguous-order or done-prefix-by-order errors for
  subtasks.
- Subtask contract no longer requires or defines `order` in model/schema artifacts.
- Contract changes are documented in code and docs with explicit old/new behavior
  for schema, validator invariants, loop verification semantics, and implement prompt
  behavior.
- Loop runtime verification selection is driven by same-iteration `status -> done`
  transitions only.
- Iterations with no newly-done subtasks report verification as `not_run`.
- Implementation prompt contract directs the agent to choose the most important open
  subtask first and follow explicit red-green-refactor TDD steps.
- Repository feature specs in both active and done directories are migrated to remove
  `order` fields.
- Regression tests cover the new verification-trigger behavior, relaxed in-progress
  subtask constraints, and migrated spec validation behavior.
