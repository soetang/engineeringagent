id: FEAT-153
title: Remove legacy gates and reviewers contract remnants from codebase
type: spec
expected_commit_subject: 'spec: add FEAT-153 remove legacy gates and reviewers contracts'
planning_tier: planned
status: done
priority: high
objective: 'Fully remove obsolete `harness/gates.yaml` and `harness/reviewers.yaml`
  contract code paths so only `harness/checks.yaml`-based contracts remain in production
  code, tests, and contributor docs.

  '
context: 'The repository has already migrated to checks-based contracts, but legacy
  contract

  remnants still exist as dead models/helpers and compatibility text paths.


  Remaining remnants increase confusion, expand maintenance surface, and risk

  accidental reintroduction of unsupported workflows.


  This feature removes legacy gate/reviewer contract artifacts before introducing

  broader schema-discovery surfaces, so the schema inventory reflects only active
  contracts.

  '
constraints:
- 'In scope: remove legacy gate/reviewer contract models and helpers that target `harness/gates.yaml`
  and `harness/reviewers.yaml`.'
- 'In scope: remove validate/runtime branches that exist only for legacy gate/reviewer
  contract compatibility.'
- 'In scope: update tests and docs to stop referencing legacy contract files as supported
  surfaces.'
- 'Out of scope: changing active `harness/checks.yaml` planning/execution semantics.'
- 'Out of scope: changing reviewer decision envelope or fitness contract payload semantics.'
- Preserve deterministic behavior for active checks/validate command surfaces.
- Breaking changes are acceptable in this repository when they simplify architecture
  and remove dead compatibility seams.
implementation_notes: "Contract change declaration\n\nSurface:\n\n- Legacy contract\
  \ model/helpers in `engineeringagent.specs`.\n- Legacy compatibility branches in\
  \ validate/CLI paths.\n- Tests/docs that still encode legacy gate/reviewer contract\
  \ surfaces.\n\nOld behavior:\n\n- `specs.py` still contains legacy gate/reviewer\
  \ config models and issue helpers.\n- Some runtime/validate code still carries explicit\
  \ legacy gate/reviewer references,\n  even when behavior is effectively no-op.\n\
  - Test coverage still asserts legacy-remnant behavior and paths.\n\nNew behavior:\n\
  \n- Legacy gate/reviewer contract models/helpers are deleted.\n- Validate/runtime/CLI\
  \ retain only active checks-based contract behavior.\n- Tests/docs no longer treat\
  \ legacy files as part of maintained contract code.\n\nCompatibility policy:\n\n\
  - Intentional immediate removal of dead legacy contract code.\n- No staged dual-support\
  \ window for legacy contract types.\n\nMigration plan:\n\n- Delete legacy model\
  \ classes/helpers for gate/reviewer config contracts in specs module.\n- Remove\
  \ obsolete validator/runtime branches that reference legacy contract files.\n- Update\
  \ or remove tests tied exclusively to legacy contract APIs/paths.\n- Update docs\
  \ wording that implies legacy contract support.\n\nVerification evidence:\n\n- Checks,\
  \ reviewer, and validate test suites pass without legacy contract helpers.\n- `engineeringagent\
  \ validate` passes with deterministic output.\n- No production source references\
  \ to `harness/gates.yaml` or `harness/reviewers.yaml` remain.\n\nFitness-function\
  \ impact assessment:\n\n- no fitness-function changes required.\n- Rationale: this\
  \ feature removes dead compatibility code and clarifies active\n  contracts without\
  \ changing enforced architecture policy intent.\n"
acceptance:
- Legacy gate/reviewer contract models and related contract-issue helpers are removed
  from `src/engineeringagent/specs.py`.
- Validate code no longer contains legacy gate/reviewer compatibility-only branches.
- Tests that depended on removed legacy contract APIs are updated or deleted.
- Contributor-facing docs no longer imply legacy gate/reviewer contracts are active
  surfaces.
- No migration/deprecation guidance for legacy gate/reviewer contracts is retained
  in user or contributor docs.
- Repository docs do not reference `harness/gates.yaml` or `harness/reviewers.yaml`
  as supported, transitional, or deprecated paths.
- Active checks-based command behavior remains unchanged for supported workflows.
- 'Verification command passes: `uv run pytest -q tests/checks tests/reviewers tests/meta/test_validator.py
  tests/cli/test_cli.py`.'
- 'Verification command passes: `uv run engineeringagent validate`.'
artifacts:
  plan: plan.md
updated_at: '2026-02-27T15:36:47Z'
