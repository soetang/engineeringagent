id: FEAT-171
title: Remove AGENTS.md validation from validate
type: feature
expected_commit_subject: 'chore: remove AGENTS.md checks from validate'
planning_tier: planned
status: done
priority: high
objective: Remove all AGENTS.md content validation from `engineeringagent validate`
  so users can freely author AGENTS guidance without validator failures.
context: 'We currently enforce an AGENTS bootstrap contract during `engineeringagent
  validate`

  by requiring specific scaffold-template lines in repository `AGENTS.md`.


  This behavior was introduced in prior docs/approach work and now conflicts with

  product intent: AGENTS content should be user-owned and customizable. Init and

  README may suggest default AGENTS content, but validate must not enforce that

  content.


  We also want launcher flexibility (`engineeringagent ...`, `uv run engineeringagent
  ...`,

  or `uvx engineeringagent ...`) without AGENTS-content coupling in validate.

  '
constraints:
- Remove AGENTS.md checks from validate behavior entirely.
- Do not fail validate because AGENTS.md is missing, present, or custom-authored.
- Keep init AGENTS scaffolding support as guidance-only behavior (not a validation
  contract).
- Preserve init AGENTS file-creation semantics by creating/writing scaffold content
  when AGENTS.md is missing, and when user explicitly chooses overwrite in conflict
  flow.
- Preserve user-authored AGENTS.md when init conflict mode/path chooses preserve.
- Remove repository tests that assert AGENTS bootstrap text as a validate contract.
- Do not add/keep tests that treat this repository's AGENTS.md body as a policy input
  for validate outcomes.
- Remove fitness rule `architecture.repo-validators-boundary` because it hard-codes
  specific validator modules/function imports and can re-introduce policy coupling.
- Preserve all other validate functionality and non-AGENTS repo-policy checks.
- Keep change scope focused on validate path and associated tests/docs.
implementation_notes: "Contract change declaration\n\nSurface:\n- `engineeringagent\
  \ validate` repo-policy validation behavior.\n- Validate check output in CLI and\
  \ loop checks phases.\n\nOld behavior:\n- Validate runs AGENTS bootstrap contract\
  \ checks and emits failures such as\n  `AGENTS docs bootstrap contract missing required\
  \ line: ...`.\n\nNew behavior:\n- Validate performs no AGENTS.md content checks.\n\
  - AGENTS.md may contain any user-authored guidance (or be absent) without validate\
  \ failure.\n\nCandidate implementation approach:\n- Remove `append_agents_docs_map_issues(...)`\
  \ from repo validator composition.\n- Remove or retire `repo_policy_docs_map.py`\
  \ and its dedicated tests if no longer used.\n- Update tests that currently assert\
  \ AGENTS bootstrap validation failures.\n- Remove `architecture.repo-validators-boundary`\
  \ rule entry, checker script, and\n  dedicated fitness tests that enforce named\
  \ imports/functions.\n- Regenerate fitness catalog docs after manifest/rule removal.\n\
  - Update docs text that implies AGENTS content is validate-enforced.\n\nHistorical\
  \ provenance note:\n- The AGENTS bootstrap validation contract appears in completed\
  \ feature\n  `FEAT-163-cli-approach-doc-surface-and-init-slimming` (for example\
  \ validator\n  boundary notes and acceptance language).\n\nFitness-function impact\
  \ assessment:\n- no new fitness rules required.\n- remove existing `architecture.repo-validators-boundary`\
  \ rule because its enforcement\n  shape is too specific (named modules/functions)\
  \ and not a stable architectural invariant.\n"
acceptance:
- '`engineeringagent validate --schema-only` does not emit AGENTS.md content/contract
  errors for any AGENTS.md body, including custom text and missing bootstrap lines.'
- '`engineeringagent validate` does not emit AGENTS.md content/contract errors for
  any AGENTS.md body, including custom text and missing bootstrap lines.'
- AGENTS.md absence does not create validate failures.
- Init AGENTS behavior is unchanged; scaffold content is written when AGENTS.md is
  absent or overwrite is selected, and preserve mode keeps existing user-authored
  content.
- Existing non-AGENTS validate checks continue to run and report deterministically.
- Tests are updated to remove AGENTS bootstrap-contract expectations and to cover
  permissive AGENTS behavior.
- No remaining validate-focused test asserts exact AGENTS bootstrap snippet lines
  as required policy.
- '`architecture.repo-validators-boundary` is removed from `harness/fitness-functions/rules.yaml`,
  and `harness/fitness-functions/check_repo_validators_boundary.py` is removed.'
- Tests dedicated to the removed rule are deleted or replaced with broader, non-hardcoded
  coverage.
- '`uv run pytest -q tests/meta/test_validator.py tests/cli/test_cli.py tests/fitness`
  passes.'
artifacts:
  plan: plan.md
