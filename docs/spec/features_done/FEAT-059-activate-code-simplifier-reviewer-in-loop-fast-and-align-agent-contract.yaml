id: FEAT-059
title: Activate code_simplifier reviewer in loop_fast and align reviewer runner agent
  contract
type: bug
expected_commit_subject: 'fix: add FEAT-059 active code_simplifier reviewer wiring
  and agent alignment'
status: done
priority: high
objective: Ensure code_simplifier actually runs as part of normal loop execution in
  this repository, with strict JSON reviewer output guidance and correct default OpenCode
  agent usage.
context: Reviewer runtime and policy behavior were implemented in prior features,
  but this repository does not currently include an active `harness/reviewers.yaml`
  contract, so reviewer phase is effectively inert for loop runs. In addition, reviewer
  execution currently hard-codes `agent=build` instead of the repository default OpenCode
  agent contract. This bug focuses on making code_simplifier reliably active first,
  ahead of lower-priority reviewer and fitness refactors.
constraints:
- Treat code_simplifier activation as the highest-priority reviewer outcome for this
  cycle.
- Add and version-control a repository-owned `harness/reviewers.yaml` with `loop_fast`
  containing `code_simplifier`.
- 'Keep the reviewers config interface explicit: contract_version=1.0, profiles.loop_fast
  ordered list, and reviewers.code_simplifier object with prompt_file, trigger, and
  approval keys.'
- Keep `code_simplifier` trigger semantics at `iteration_end` with code-scoped `on_change`
  patterns for `src/**/*.py` and `tests/**/*.py`.
- Keep reviewer decision contract three-state (`approve`, `request_changes`, `warning`)
  with strict JSON parsing.
- Harden reviewer prompt guidance so `warning` and `request_changes` are explicit
  non-approval outcomes requiring follow-up action.
- Replace hard-coded reviewer runtime agent `build` usage with the default OpenCode
  agent contract used by loop runtime.
- Reviewer runtime interface must call `start_agent_fn(execution_root, composed_prompt,
  agent=<default_agent>)` where `<default_agent>` resolves to `engineeringagent` from
  the shared OpenCode client default.
- Do not depend on `init` scaffold output for reviewer activation in this repository.
- Preserve deterministic reviewer planning reasons, advisory follow-up behavior, and
  telemetry fields.
implementation_notes: 'Add repository-local reviewer configuration and prompt refinements
  that ensure code_simplifier is selected by `loop_fast` and produces parser-friendly
  JSON output. Update reviewer runtime invocation to use the same default agent contract
  as the rest of loop execution, removing stale hard-coded `build` behavior.

  Reviewer prompt/output interface for this feature: - Required output keys: `decision`,
  `summary`. - Optional output keys: `required_actions`, `confidence`, `scope_notes`.
  - Non-approve outcomes (`warning`, `request_changes`) must include at least one
  actionable `required_actions` entry in prompt guidance.

  Keep scope tight to activation and contract correctness: no sandbox redesign, no
  reviewer policy expansion, and no scaffold deprecation work in this feature.'
acceptance:
- Harness reviewers config exists in-repo at harness/reviewers.yaml and defines loop_fast
  with code_simplifier.
- Loop runs using `--gate-profile loop_fast` execute reviewer planning that includes
  `code_simplifier` when scoped code changes match.
- Reviewer runtime no longer hard-codes `agent=build` for reviewer execution.
- Reviewer runtime uses the shared OpenCode default agent constant and not an inline
  reviewer-specific agent literal.
- The code_simplifier prompt text clearly requires strict JSON output and clarifies
  approval vs non-approval outcomes.
- Advisory reviewer decisions (`warning` or `request_changes`) continue to require
  one follow-up implement pass before completion eligibility.
- Deterministic reviewer summary/telemetry fields remain present and parse-friendly.
- Repositories without harness/reviewers.yaml still keep baseline no-reviewer behavior
  unchanged.
