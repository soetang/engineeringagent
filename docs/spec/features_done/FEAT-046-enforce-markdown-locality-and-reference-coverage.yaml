id: FEAT-046
title: Enforce markdown locality and non-doc reference coverage with a built-in fitness
  rule
type: feature
expected_commit_subject: 'feat: add FEAT-046 markdown locality and reference coverage
  fitness rule'
status: done
priority: high
objective: Add a built-in fitness rule that restricts markdown files to approved repository
  locations and requires every markdown file outside `docs/` to have at least one
  in-repo reference.
context: Markdown content now spans docs, prompt templates, scaffold templates, and
  root onboarding files. Without an explicit locality contract, markdown files can
  drift into arbitrary paths and become orphaned. This feature introduces one deterministic
  architecture rule that (1) enforces allowed markdown locations and (2) verifies
  non-doc markdown files are referenced somewhere else in the repository.
constraints:
- Implement this as a built-in fitness rule (not only a custom command script).
- Primary approved markdown zones include `docs/`, prompt markdown under `src/engineeringagent/prompts/`,
  and scaffold/init markdown assets under `src/engineeringagent/scaffold_templates/`.
- Preserve existing root onboarding markdown files (`README.md`, `AGENTS.md`) as explicit
  allowlisted exceptions.
- 'Root-markdown exception scope is strict: only repository-root `README.md` and repository-root
  `AGENTS.md` are exempt from locality-path restrictions.'
- Root exceptions apply to locality only; reference coverage still applies to these
  files because they are outside `docs/`.
- Require at least one non-self reference for each markdown file outside `docs/`.
- Reference detection must be deterministic and path-based (for example relative path
  literals and package-resource path joins), not fuzzy semantic matching.
- Exclude generated/cache/vendor-style directories from both markdown discovery and
  reference scanning (for example `.venv/`, `.pytest_cache/`, `__pycache__/`, `dist/`,
  `tmp/`, `output/`).
- Diagnostics must be stable and sorted with actionable `path:line` style messages.
implementation_notes: Implement a new built-in rule id `architecture.markdown-locality-reference-coverage`
  in `engineeringagent.fitness.builtin_rules`. Phase A should discover markdown files
  under repository root with explicit ignore-directory filters. Phase B should enforce
  locality policy with an allowlist of approved roots plus explicit file exceptions.
  Phase C should build a lightweight repository reference index from text-like files
  (`.py`, `.md`, `.yaml`, `.toml`, `.json`, etc.) and record markdown-path mentions
  with line numbers; references from the markdown file to itself do not count. Phase
  D should return a deterministic result envelope with sorted violations and remediation
  guidance, then register the rule in built-in registry metadata, declare it in `harness/fitness-functions/rules.yaml`,
  and regenerate fitness catalog docs.
acceptance:
- Built-in rule `architecture.markdown-locality-reference-coverage` is implemented
  and registered.
- Rule fails when markdown files exist outside approved locations and allowed exceptions.
- Rule treats only repository-root `README.md` and `AGENTS.md` as locality exceptions;
  other root markdown files fail locality checks unless separately allowlisted.
- Rule fails when any markdown file outside `docs/` has zero non-self references.
- Rule passes when markdown locality and non-doc reference coverage contracts are
  satisfied.
- Rule output includes deterministic sorted violation messages with clear remediation.
- Rule declaration appears in `harness/fitness-functions/rules.yaml` and catalog/list
  surfaces.
- Focused fitness and registry tests cover both locality and reference-coverage pass/fail
  cases.
- Repository spec validation and final gate profile checks pass after integration.
