id: FEAT-088
title: Revert OpenCode subprocess timeout behavior introduced in 9f9d792
type: chore
expected_commit_subject: "chore: revert opencode timeout handling"
status: done
priority: medium
objective: |
  Remove the recently-added OpenCode subprocess timeout behavior so `engineeringagent`
  does not enforce a wall-clock timeout on `opencode run`, and does not expose a
  timeout env var contract.

  Keep loop behavior deterministic, but treat long-running/hung OpenCode invocations
  as an operator concern (interrupt / investigate) rather than an enforced timeout.
context: |
  This spec reverts the OpenCode timeout behavior introduced in commit:

  - 9f9d7927b22435aa9a06c3b92b8bf40190b42732 ("chore: remove skip-implement mode")

  Timeout-related changes in that commit touched:
  - src/engineeringagent/opencode/client.py
    - added DEFAULT_OPENCODE_TIMEOUT_SEC
    - added OPENCODE_TIMEOUT_ENV=ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC
    - added resolve_opencode_timeout_sec(...)
    - started passing timeout=... to subprocess.run
  - src/engineeringagent/loop_runtime/implement.py
    - prints timeout guidance
    - catches subprocess.TimeoutExpired and classifies failed_gate=opencode_timeout
  - tests/test_loop_opencode_integration.py
    - adds default timeout test
    - adds timeout telemetry test asserting failed_gate=opencode_timeout
  - README.md
    - documents ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC usage

  This spec reverts only the timeout-specific behavior and its docs/tests, not the
  other unrelated changes in 9f9d792.
constraints:
  - "Revert only timeout-specific behavior; do not reintroduce removed loop flags (e.g. --skip-implement)."
  - "Remove the env var contract `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC` from runtime behavior and docs."
  - "Do not pass `timeout=` to the OpenCode subprocess invocation in `engineeringagent.opencode.client`."
  - "Do not emit or rely on `failed_gate=opencode_timeout` in telemetry/progress logs."
  - "Keep the OpenCode invocation contract unchanged: `opencode run --agent engineeringagent`."
implementation_notes: |
  Contract/API delta (explicit):

  - Surface: OpenCode execution defaults.
    - Old behavior (pre-9f9d792): subprocess.run(...) without timeout; no timeout env var.
    - New behavior (in 9f9d792, to revert): default timeout + env var override +
      opencode_timeout failed_gate when subprocess.TimeoutExpired is raised.
    - Restored behavior (after this change): no OpenCode subprocess timeout is enforced
      by engineeringagent; operators can interrupt if needed.

  Compatibility policy:
  - Breaking change for anyone who started relying on ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC
    or on failed_gate=opencode_timeout since 9f9d792.
  - Restores the pre-9f9d792 OpenCode execution behavior.

  How to inspect the exact introduction point:
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- src/engineeringagent/opencode/client.py
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- src/engineeringagent/loop_runtime/implement.py
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- tests/test_loop_opencode_integration.py
  - git show 9f9d7927b22435aa9a06c3b92b8bf40190b42732 -- README.md

  Enforcement guidance:
  - Prefer tests/docs assertions over a new fitness function unless we intend a
    permanent policy of "engineeringagent must never set an OpenCode timeout".
acceptance:
  - "Runtime code under `src/engineeringagent/` no longer references `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC`."
  - "`src/engineeringagent/opencode/client.py` does not define timeout constants/helpers and does not pass `timeout=` to subprocess.run."
  - "`src/engineeringagent/loop_runtime/implement.py` does not treat subprocess.TimeoutExpired as a distinct OpenCode failure classification."
  - "No test asserts opencode_timeout as a failed_gate for OpenCode execution."
  - "README no longer instructs using `ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC`."
  - "`uv run python -m engineeringagent.cli validate` passes."
  - "`uv run pytest -q` passes."
subtasks:
  - id: ST-001
    title: Remove OpenCode timeout helper/env var and stop passing subprocess timeout
    status: done
    context: |
      Revert resolve_opencode_timeout_sec, DEFAULT_OPENCODE_TIMEOUT_SEC, and
      OPENCODE_TIMEOUT_ENV from src/engineeringagent/opencode/client.py, and remove
      passing timeout=... to subprocess.run.
    verification:
      - uv run pytest -q tests/test_loop_opencode_integration.py
  - id: ST-002
    title: Remove timeout-specific implement messaging and failed_gate classification
    status: done
    context: |
      Remove timeout messaging and the TimeoutExpired catch in
      src/engineeringagent/loop_runtime/implement.py so timeouts are not a distinct
      failed_gate classification.
    verification:
      - uv run pytest -q tests/test_loop_opencode_integration.py
  - id: ST-003
    title: Update tests and docs to remove timeout contract
    status: done
    context: |
      Remove or rewrite tests added for the timeout default and timeout telemetry,
      and remove README references to ENGINEERINGAGENT_OPENCODE_TIMEOUT_SEC.
    verification:
      - uv run python -m engineeringagent.cli validate
      - uv run pytest -q
  - id: ST-004
    title: Decide whether a fitness function is warranted
    status: done
    context: |
      Only add a new fitness rule if we want a permanent invariant that forbids
      reintroducing OpenCode timeouts. Otherwise, rely on existing tests and review.
    verification:
      - uv run python -m engineeringagent.cli fitness run --format json
updated_at: "2026-02-16T00:00:00Z"
