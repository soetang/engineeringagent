id: FEAT-023
title: Archive selected done feature before loop gate validation
type: bug
expected_commit_subject: 'fix: add FEAT-023 pre-gate archive ordering for done features'
status: done
priority: high
objective: 'Ensure `engineeringagent run` archives the selected feature spec immediately
  when it reaches `status: done`, before gate profile execution, so `spec_validate`
  does not block completion on a temporary done-in-active state.

  '
context: 'The current loop runs gates before archive/commit handling. In `loop_fast`,
  `spec_validate` executes first and rejects active feature specs marked `status:
  done`, even when that done state was produced by the same iteration and is intended
  to be archived right away.

  This creates repeated retries where the loop never reaches archive because gate
  execution fails first. The resulting operator experience is a noisy retry cycle
  with the same archive-policy failure text.

  User-confirmed scope for this feature: fix run-loop ordering and retry behavior
  only; keep validator and gate-profile policies unchanged; and add loop-focused regression
  coverage.

  '
constraints:
- Limit changes to run-loop behavior and loop-focused tests; do not change validator
  rules or gate profile definitions.
- 'When the selected feature becomes `status: done` in an iteration, archive it to
  `docs/spec/features_done/` before running gate profile commands.'
- If any gate fails after pre-gate archive, restore the archived feature spec back
  to its original active path for deterministic retry on the same selected path.
- 'Preserve existing completion semantics: feature completion still requires successful
  gate execution and successful completion commit.'
- Preserve existing retry-feedback behavior and deterministic telemetry fields (`result`,
  `failed_gate`, `next_action`).
- Keep archive rollback behavior for commit-failure paths compatible with the new
  pre-gate archive ordering.
implementation_notes: 'Re-sequence `_run_feature_iteration` so done-state detection
  and archive movement happen after implement/post-load handling but before gate execution.
  Introduce explicit rollback handling for gate-failure paths when archive has already
  occurred in the same iteration.

  Ensure loop state and terminal summaries continue to reflect actual outcomes: gate-failed
  iterations remain retries, and successful completion still requires the completion
  commit path.

  Add focused tests that exercise real ordering behavior around gate execution and
  archive rollback, including a regression that reproduces done-in-active + `spec_validate`
  failure in pre-fix behavior.

  '
acceptance:
- 'A selected feature that becomes `status: done` is archived before gate profile
  execution in the same iteration.'
- With unchanged `loop_fast` ordering (`spec_validate` first), the loop no longer
  fails solely because selected-feature done state is temporarily in `docs/spec/features/`.
- If a gate fails after pre-gate archive, the feature spec is restored to `docs/spec/features/<name>.yaml`
  for deterministic retry.
- Gate failure details still flow into next retry prompt exactly as latest-only feedback
  for the selected feature.
- Successful completion path still archives + commits deterministically and transitions
  to `next_action=select_next_feature` only after completion commit success.
- Targeted loop regression tests and schema validation pass.
