id: FEAT-086
title: Simplify feature_done reviewers and rename next_action for clear loop control-flow
type: chore
expected_commit_subject: 'chore: simplify reviewers and next_action'
planning_tier: planned
status: done
priority: medium
objective: 'Reduce wasted/ambiguous loop iterations by (1) making feature_done reviewers

  enforce changes only via an explicit blocking decision, and (2) renaming next_action

  values so telemetry and terminal output distinguish continue vs retry vs select-next.


  After this change:

  - A reviewer that wants code changes at feature completion must block completion.

  - A passed-but-not-completed iteration is labeled as continuation, not retry.

  '
context: 'Two issues show up in run logs:

  1) Reviewers: This repo generally runs reviewers at phase=feature_done, not on each

  iteration. In that regime, non-blocking advisory feedback cannot cause code changes

  because the feature completes immediately after.


  The current implementation includes an advisory follow-up mechanism

  (reviewer_advisory_followup) that can fail a completion iteration even when the

  reviewer outcome is otherwise considered passed, forcing extra iterations and

  confusing operators.

  2) next_action: The loop can emit result=passed while next_action=retry_same_feature

  when the feature is not yet completed/archived. This reads like a wasted retry,

  even though the loop is simply continuing work.


  This feature simplifies reviewer semantics at completion and clarifies next_action

  values to match actual control-flow.

  '
constraints:
- Reviewers are evaluated only at phase=feature_done for this feature (do not add
  or expand per-iteration reviewers here).
- Remove advisory vs blocking reviewer modes from the reviewers.yaml contract. There
  must not be a reviewer "mode" that yields non-blocking actionable feedback at feature_done.
- Remove all code paths and status strings that differentiate advisory vs blocking
  reviewers (including blocking exhausted/continue behaviors).
- Reviewer decisions at feature_done must be limited to approve and request_changes.
- approve means the reviewer phase passes and completion may proceed.
- request_changes means the iteration fails and the loop continues the same feature
  so the implement agent can apply changes.
- Any reviewer decision other than approve must not be treated as a non-blocking pass
  at feature_done. It must be normalized to request_changes or rejected as invalid.
- Remove the reviewer_advisory_followup gate behavior entirely; do not fail solely
  to enforce advisory follow-up when the reviewer phase is otherwise passed.
- Rename next_action values so passed continuation is not labeled as retry.
- Use next_action=continue_same_feature when result=passed and the feature is not
  yet completed.
- Use next_action=retry_same_feature when result=failed (any failed gate, including
  reviewer request_changes).
- Use next_action=select_next_feature when completion commit succeeded.
- Use next_action=stop for dry-run/no-work terminal states.
- next_action must be derived deterministically from final iteration state; do not
  rely on default values in phase helpers to encode meaning.
- Telemetry and progress logs must record the new next_action values deterministically.
- Update docs/references that describe reviewers.yaml fields and run-loop next_action
  semantics.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: `harness/reviewers.yaml`\
  \ schema.\n  - Old behavior: reviewer definitions may include `approval.mode` (advisory/blocking)\
  \ and the loop can\n    fail on `reviewer_advisory_followup` during feature_done\
  \ completion.\n  - New behavior: reviewer mode is removed. Reviewers that run at\
  \ `feature_done` produce enforceable\n    decisions: `approve` or `request_changes`.\n\
  \n- Surface: reviewer enforcement.\n  - Old behavior: advisory feedback at feature_done\
  \ could trigger an extra follow-up iteration via\n    `reviewer_advisory_followup`\
  \ while still labeling output as passed:advisory.\n  - New behavior: there is no\
  \ advisory follow-up mechanism. If a reviewer wants changes, it must return\n  \
  \  request_changes and block completion.\n\n- Surface: run-loop telemetry/output\
  \ `next_action` field.\n  - Old behavior: `retry_same_feature` is used for both\
  \ failures and passed-but-not-completed continuation.\n  - New behavior: `continue_same_feature`\
  \ is used for passed continuation; `retry_same_feature` is reserved\n    for failures;\
  \ `select_next_feature` remains for completed features.\n\nCompatibility policy:\n\
  - Breaking change: `harness/reviewers.yaml` configs that use approval.mode must\
  \ be migrated.\n- Breaking change: `progress/runs.jsonl` consumers that treat `next_action`\
  \ as a stable enum must be updated.\n  Optional mitigation: emit `next_action_legacy`\
  \ in telemetry for one transition window.\n\nMigration scope:\n- Update this repository's\
  \ reviewers configuration and docs references.\n- Update tests that assert reviewer\
  \ status strings, reviewer gates, or next_action values.\n"
acceptance:
- Reviewer configuration no longer supports advisory/blocking modes; this repo's `harness/reviewers.yaml`
  validates under the new contract.
- A feature_done reviewer can force code changes only by returning decision=request_changes,
  which fails the iteration and forwards feedback into the next implement pass via
  hook_feedback.
- The reviewer_advisory_followup gate is removed; no iteration fails solely to enforce
  advisory follow-up.
- Repository search for advisory/blocking mode artifacts returns matches only in archived
  specs under `docs/spec/features_done/` (and intentionally preserved historical snapshots).
- Artifact needles include `approval.mode`, `passed:advisory`, `reviewer_advisory_followup`,
  `blocking_exhausted`, `continue_on_exhausted`, `advisory_followup_required`.
- User-facing docs describe reviewers in their supported form only. They do not mention
  removed reviewer mode concepts or removed reviewer follow-up behavior.
- When result=passed and the feature is not completed, next_action=continue_same_feature.
- When result=failed, next_action=retry_same_feature.
- When completion commit succeeded, next_action=select_next_feature.
- '`uv run python -m engineeringagent.cli validate` passes.'
- '`uv run pytest -q` passes.'
