id: FEAT-005
title: Adopt uv project workflow
status: done
priority: medium
objective: Standardize this repository on uv for environment management, dependency sync, and command execution.
context: >
  The repo already uses uvx for packaged CLI examples, but local development still
  mixes python and pip-style workflows. We want a consistent uv-first developer
  experience aligned with Astral uv project guidance.
constraints:
  - "Keep pyproject.toml as the source of dependency intent."
  - "Use uv lockfile for reproducible installs across contributors and agents."
  - "Preserve existing script entrypoints while moving internals to uv-aware commands."
  - "Document uv workflow in-repo and keep AGENTS.md pointers current."
implementation_notes: >
  Follow uv project patterns: maintain pyproject.toml, check in uv.lock, use uv sync
  and uv run for local commands, and keep uvx examples for ephemeral tool execution.
acceptance:
  - "Repository includes a committed uv.lock generated from current project dependencies."
  - "Developer quickstart documents uv sync and uv run as default local workflow."
  - "A canonical uv workflow reference exists under docs/ and is referenced from AGENTS.md."
  - "Primary script wrappers and gate commands run via uv-managed environment."
  - "Core validation and loop commands are verifiable through uv run and uvx paths."
subtasks:
  - id: ST-001
    title: Add uv lockfile and baseline project pinning
    status: done
    context: >
      Generate and commit uv.lock for deterministic dependency resolution; add
      project Python version pinning if needed for consistent local behavior.
    verification:
      - "uv lock"
      - "uv sync"
    attempts: 1
    notes: []
  - id: ST-002
    title: Make script and gate commands uv-first
    status: done
    context: >
      Update scripts and harness gate commands to execute with uv run so they use
      the project environment without manual activation.
    verification:
      - "uv run python scripts/validate_specs.py"
      - "uv run python scripts/gates.py run --profile loop_fast"
    attempts: 1
    notes: []
  - id: ST-003
    title: Add uv docs and AGENTS.md references
    status: done
    context: >
      Create or update canonical uv workflow docs under docs/ (including quickstart
      and common commands), refresh README references, and ensure AGENTS.md points
      to the uv document in its documentation map.
    verification:
      - "uv run python scripts/validate_specs.py"
      - "python3 -c \"from pathlib import Path; p=Path('docs/references/uv-workflow.md'); assert p.exists(); t=Path('AGENTS.md').read_text(encoding='utf-8'); assert 'docs/references/uv-workflow.md' in t; print('ok')\""
      - "uvx --from . agent-harness --help"
    attempts: 1
    notes: []
  - id: ST-004
    title: Verify loop runner behavior under uv-managed environment
    status: done
    context: >
      Confirm loop dry-run and verification-only modes work when invoked through
      uv run after dependency sync.
    verification:
      - "uv run agent-harness loop run --feature-id FEAT-004 --dry-run --skip-implement"
      - "uv run agent-harness validate"
    attempts: 1
    notes: []
updated_at: "2026-02-12T14:52:03Z"
