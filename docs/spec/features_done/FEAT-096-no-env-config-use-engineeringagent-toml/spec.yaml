id: FEAT-096
title: Move configuration from env vars to engineeringagent.toml and forbid env-key
  reads
type: feature
expected_commit_subject: 'feat: move config from env vars into engineeringagent.toml'
planning_tier: planned
status: done
priority: high
objective: 'Stop using environment variables as configuration inputs for engineeringagent.
  All repo/operator configuration must be loaded from TOML (engineeringagent.toml,
  with pyproject fallback), and the codebase must enforce a policy that forbids reading
  env keys for behavior decisions.

  '
context: 'We started relying on environment variables (ENGINEERINGAGENT_*) to toggle
  behavior (harness fitness rule enablement and integration-test gating). This is
  hard to discover, hard to document, and encourages ad-hoc configuration surfaces.
  We already have a TOML config mechanism (engineeringagent.toml with pyproject fallback)
  for docs-root. We should expand that contract, migrate existing env-var toggles,
  and add a fitness function that prevents env-key reads from reappearing.

  '
constraints:
- 'Policy: code under src/, harness/, and tests/ must not read env keys (no os.getenv,
  no os.environ.get, no os.environ[''X''], no ''X'' in os.environ).'
- 'Exception: os.environ.copy() is allowed only for subprocess environment pass-through
  (inherit + mutate the copied dict is ok).'
- 'Runtime ANSI decision: must be TTY-only (do not consult NO_COLOR, TERM, or any
  env key).'
- 'Configuration precedence is deterministic: engineeringagent.toml -> pyproject.toml[tool.engineeringagent]
  -> defaults.'
- 'TOML naming: use tables by area; kebab-case keys.'
- Do not require or introduce a gitignored local overlay config file (no engineeringagent.local.toml).
- Avoid rewriting historical archived specs under docs/spec/features_done/; enforcement
  should not force editing past done-specs.
implementation_notes: "Configuration contract (new keys):\n\n- engineeringagent.toml\
  \ (repo root) uses tables:\n  - [harness.fitness]\n    - opencode-real-smoke = true|false\n\
  \  - [harness.pytest]\n    - opencode-integration = true|false\n\n- pyproject.toml\
  \ fallback uses nested tool tables:\n  - [tool.engineeringagent.harness.fitness]\n\
  \    - opencode-real-smoke = true|false\n  - [tool.engineeringagent.harness.pytest]\n\
  \    - opencode-integration = true|false\n\nDefaults (when unset in both files):\n\
  - opencode-real-smoke: false (smoke rule returns PASS \"skipped (disabled in engineeringagent.toml)\"\
  )\n- opencode-integration: false (integration tests skip deterministically)\n\n\
  Behavior deltas (explicit):\n- Real OpenCode smoke fitness rule:\n  - Old: enabled\
  \ only via env var ENGINEERINGAGENT_REAL_OPENCODE_SMOKE=1; otherwise PASS skipped.\n\
  \  - New: enabled only via TOML key; env var no longer supported.\n  - When enabled\
  \ and opencode is missing, treat as FAIL with remediation to install/configure opencode\
  \ or disable the TOML key.\n- OpenCode integration tests:\n  - Old: enabled only\
  \ via env var ENGINEERINGAGENT_OPENCODE_INTEGRATION=1; otherwise pytest.skip.\n\
  \  - New: enabled only via TOML key; env var no longer supported.\n- Run-loop ANSI\
  \ styling:\n  - Old: TTY gating + env-key reads (NO_COLOR, TERM).\n  - New: TTY\
  \ gating only.\n\nFitness-function impact assessment:\n- fitness-function changes\
  \ required:\n  - add a new harness fitness rule that fails on forbidden env-key\
  \ reads across src/, harness/, tests/\n  - update existing smoke rule docs/metadata\
  \ to remove env var remediation text and document TOML instead\n"
acceptance:
- No Python code under src/, harness/, or tests/ reads environment keys (no os.getenv,
  no os.environ.get, no os.environ['X'], no `'X' in os.environ`).
- os.environ.copy() remains allowed for subprocess env pass-through, and fitness/adapters
  continue to inherit environment for command adapter subprocesses.
- Real OpenCode smoke rule enablement uses TOML only; ENGINEERINGAGENT_REAL_OPENCODE_SMOKE
  is not referenced in code/docs (except historical done-spec archives).
- OpenCode integration test gating uses TOML only; ENGINEERINGAGENT_OPENCODE_INTEGRATION
  is not referenced in code/docs (except historical done-spec archives).
- Run-loop ANSI behavior is TTY-only; NO_COLOR and TERM env keys are not read.
- A new fitness function exists and is registered in harness/fitness-functions/rules.yaml
  to enforce the env-key read policy.
- This repository adds engineeringagent.toml enabling the opt-in smoke rule and integration
  tests.
artifacts:
  plan: plan.md
