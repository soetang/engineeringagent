id: FEAT-113
title: Agent backend registry and config-driven default backend selection
type: feature
expected_commit_subject: 'feat: add agent backend registry and config selection'
status: done
priority: high
objective: 'Make agent backend selection a repository configuration decision rather
  than a

  hard-coded OpenCode default.


  Introduce a small backend registry in `engineeringagent.agents` and extend the

  public agents surface with simple helper functions so higher layers can remain

  backend-agnostic while we add new backends.

  '
context: "`engineeringagent.agents.run_agent` exists and OpenCode is currently the\
  \ only\nbackend. The default backend is hard-coded inside `run_agent`, which prevents\n\
  switching backends based on repo configuration.\n\nThis feature adds the minimal\
  \ registry + config resolution necessary to\nsupport backend swaps without rewriting\
  \ callsites.\n\nRelated specs and sequencing:\n\n- FEAT-112 adds budgeted fitness\
  \ rules to measure backend coupling during the\n  refactor.\n- FEAT-114 (init backend\
  \ selection + backend-owned scaffolds) depends on the\n  backend registry and backend\
  \ list exported by this feature.\n- FEAT-115 (core loop backend-agnostic) depends\
  \ on config-driven backend\n  selection being available.\n"
constraints:
- 'Public API: keep `engineeringagent.agents.run_agent(project_root, prompt, *, output_type=...,
  backend=..., max_validation_retries=...)`.'
- When `backend` is None, `run_agent` must select a backend based on repo config under
  `engineeringagent.toml[agents] backend` (with `pyproject.toml[tool.engineeringagent.agents]
  backend` fallback), defaulting to a registry-defined backend id when unset.
- 'Add public helper functions under `engineeringagent.agents`:

  - `list_backends() -> tuple[str, ...]` (stable, sorted)

  - `resolve_backend_id(project_root: Path) -> str` (deterministic precedence)'
- 'Config reading must be backend-agnostic outside `agents/**`: add a config resolver
  that reads `[agents] backend = "..."` without embedding any specific backend id
  strings outside `src/engineeringagent/agents/**`.'
- Unknown backend id must fail deterministically with an actionable message that includes
  the configured value and the available backend ids.
- 'Fitness-function impact assessment: no new fitness rules required in this feature
  (existing boundary rules remain sufficient).'
- 'Recommended sequencing: implement FEAT-112 before FEAT-113 so coupling guardrails
  are active.'
implementation_notes: "Registry shape\n\n- Keep registration simple and explicit.\
  \ A static mapping in `engineeringagent.agents`\n  is sufficient.\n- The registry\
  \ should return the correct backend implementation depending on\n  whether structured\
  \ output is requested (e.g. OpenCode needs format=\"json\").\n\nConfiguration\n\n\
  - New config key in engineeringagent.toml:\n  - `[agents] backend = \"<id>\"`\n\
  - New config key in pyproject.toml (tool table):\n  - `[tool.engineeringagent.agents]\
  \ backend = \"<id>\"`\n- Precedence should match existing config conventions:\n\
  \  engineeringagent.toml -> pyproject.toml[tool.engineeringagent.*] -> default.\n"
acceptance:
- engineeringagent.agents.list_backends() returns a stable, sorted tuple including
  opencode.
- engineeringagent.agents.resolve_backend_id(project_root) reads [agents] backend
  from engineeringagent.toml and [tool.engineeringagent.agents] backend from pyproject.toml
  with deterministic precedence.
- engineeringagent.agents.run_agent(..., backend=None) uses the resolved backend id.
- Unknown configured backend id fails deterministically and lists available backends.
- uv run pytest -q passes.
subtasks:
- id: ST-001
  title: Add backend-id config resolver (backend-agnostic)
  status: done
  context: 'Add a new resolver in `engineeringagent.config` that reads `[agents] backend`.

    The resolver must not embed any concrete backend id string.

    '
  verification:
  - uv run pytest -q tests/config
- id: ST-002
  title: Implement backend registry mapping in engineeringagent.agents
  status: done
  context: 'Introduce a registry that maps backend ids to backend factories, including

    OpenCode.

    '
  verification:
  - uv run python -c "from engineeringagent import agents; print(agents.list_backends())"
  - uv run pytest -q
- id: ST-003
  title: Update run_agent to select default backend via registry + config
  status: done
  verification:
  - uv run pytest -q tests/agents
  - uv run pytest -q
- id: ST-004
  title: Add focused tests for config-driven default backend selection
  status: done
  context: "Add tests that:\n- write an engineeringagent.toml selecting a backend\
    \ id\n- verify run_agent chooses that backend when backend=None (use a test double\n\
    \  by monkeypatching the registry mapping)\n- verify unknown backend id produces\
    \ a deterministic error\n"
  verification:
  - uv run pytest -q tests/agents tests/config
