  status: done
  context: 'Implement command-backed checker script in harness/fitness-functions that
    scans only src/engineeringagent and returns deterministic machine-readable violations.

    '
  verification:
  - uv run pytest -q tests/test_fitness_adapters.py
  - uv run python -m engineeringagent.cli fitness run --format json
  notes:
  - Added harness/fitness-functions/check_no_stdlib_dataclasses_in_src.py to scan
