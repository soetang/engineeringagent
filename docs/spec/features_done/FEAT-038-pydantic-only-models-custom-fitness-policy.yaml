id: FEAT-038
title: Adopt Pydantic-only models in src and enforce custom no-dataclasses fitness
  policy
type: feature
expected_commit_subject: 'feat: add FEAT-038 pydantic-only models with custom dataclass
  fitness policy'
status: done
priority: high
objective: 'Standardize production models on Pydantic v2 BaseModel in src/engineeringagent
  and enforce a repository-local fitness rule that blocks stdlib dataclasses usage
  in src code.

  '
context: 'The codebase currently mixes stdlib dataclasses and Pydantic. This increases
  model-style drift and review overhead. We want one model contract (Pydantic v2 BaseModel)
  in production code, with enforcement implemented as a custom harness fitness rule
  so the policy remains local to this repository and is not forced on downstream users/scaffolds.

  '
constraints:
- Enforcement must be implemented as a custom rule under harness/fitness-functions,
  not as a built-in fitness rule in src/engineeringagent/fitness.
- Rule scope is src/engineeringagent only (tests, harness, and docs are out of scope
  for enforcement).
- Violations must be error severity and fail fitness and gates.
- 'No exceptions in scoped code: disallow stdlib dataclasses module imports, dataclass
  decorators, and dataclasses namespace usage.'
- Standard model pattern in scoped code is Pydantic v2 BaseModel (including ConfigDict
  and Field as needed).
- Use fixed custom rule_id architecture.no-stdlib-dataclasses-in-src for deterministic
  references in checks, docs, and tests.
- Keep init scaffolding and default framework behavior unchanged so this remains repository-specific
  policy.
implementation_notes: 'First migrate existing dataclass-based structures in src/engineeringagent
  to Pydantic v2 BaseModel equivalents, preserving behavior (immutability, validation,
  and serialization contracts). Then add a custom command-backed fitness check script
  under harness/fitness-functions that scans src/engineeringagent (AST-based detection
  preferred) and fails on stdlib dataclasses usage patterns (imports, decorators,
  and dataclasses references). Register this rule in harness/fitness-functions/rules.yaml
  as architecture.no-stdlib-dataclasses-in-src with severity error and remediation
  guidance to use Pydantic BaseModel. Regenerate fitness catalog docs after manifest
  updates.

  '
acceptance:
- src/engineeringagent no longer uses stdlib dataclasses patterns.
- A custom fitness check script exists under harness/fitness-functions and is the
  enforcement mechanism for this policy.
- Rule is declared in harness/fitness-functions/rules.yaml (custom manifest), not
  in built-in fitness rule registry.
- Rule declaration uses rule_id architecture.no-stdlib-dataclasses-in-src.
- Fitness output reports clear remediation directing contributors to Pydantic v2 BaseModel.
- Engineeringagent fitness and gate profiles fail when scoped dataclasses usage is
  introduced.
- Existing built-in fitness framework contracts and init scaffold defaults remain
  unchanged.
subtasks:
- id: ST-001
  title: Inventory and map all dataclasses usage in src/engineeringagent for migration
  status: done
  context: 'Identify every stdlib dataclass and dataclasses usage in scoped source
    files and define target Pydantic BaseModel replacements before guardrail activation.

    '
  verification:
  - uv run pytest -q tests/test_loop_contracts.py
  - uv run pytest -q tests/test_fitness_registry.py
  notes:
  - 'Inventory complete (scope: src/engineeringagent): loop_runtime/iteration.py (IterationPipelineDependencies),
    loop_runtime/phases.py (GatePhaseDependencies, CompletionPhaseDependencies, VerificationPhaseDependencies),
    loop_runtime/models.py (IterationOutcome, InitialFeatureLoadOutcome, PostImplementFeatureOutcome,
    ImplementStepInputs, FeatureIterationInputs, GatePhaseOutcome, VerificationPhaseOutcome,
    CompletionCommitOutcome, IterationTelemetryInputs), loop_runtime/presentation.py
    (RunOutputPresenter), fitness/registry.py (FitnessRuleDefinition + dataclasses.replace
    usage), fitness/runner.py (FitnessRunSummary), opencode_permissions.py (PermissionProbeResult),
    specs.py (ValidationIssue).'
  - 'Migration map: replace stdlib dataclass patterns with Pydantic v2 BaseModel in
    each listed module; use ConfigDict(frozen=True, extra="forbid") for current frozen
    dataclasses; replace dataclasses.replace(...) in fitness/registry.py with BaseModel
    model_copy(update=...).'
- id: ST-002
  title: Migrate scoped dataclass models to Pydantic v2 BaseModel
  status: done
  context: 'Refactor source models in src/engineeringagent from stdlib dataclasses
    to BaseModel, preserving behavior and call-site compatibility where practical.

    '
  verification:
  - uv run pytest -q
  - uv run pyright src/engineeringagent tests harness
  notes:
  - Migrated PermissionProbeResult in src/engineeringagent/opencode_permissions.py
    from stdlib dataclass to frozen Pydantic BaseModel.
  - Migrated FitnessRunSummary in src/engineeringagent/fitness/runner.py from stdlib
    dataclass to frozen Pydantic BaseModel.
  - Migrated ValidationIssue in src/engineeringagent/specs.py from stdlib dataclass
    to Pydantic BaseModel to keep spec-validation issue records on the unified model
    contract.
  - Migrated FitnessRuleDefinition in src/engineeringagent/fitness/registry.py from
    stdlib dataclass to frozen Pydantic BaseModel and replaced dataclasses.replace(...)
    cloning with model_copy(update=...).
  - Migrated RunOutputPresenter in src/engineeringagent/loop_runtime/presentation.py
    from frozen stdlib dataclass to frozen Pydantic BaseModel.
  - Migrated IterationPipelineDependencies in src/engineeringagent/loop_runtime/iteration.py
    from frozen stdlib dataclass to frozen Pydantic BaseModel.
  - Migrated GatePhaseDependencies, CompletionPhaseDependencies, and VerificationPhaseDependencies
    in src/engineeringagent/loop_runtime/phases.py from frozen stdlib dataclasses
    to frozen Pydantic BaseModel.
  - Migrated all remaining loop runtime data models in src/engineeringagent/loop_runtime/models.py
    (IterationOutcome, InitialFeatureLoadOutcome, PostImplementFeatureOutcome, ImplementStepInputs,
    FeatureIterationInputs, GatePhaseOutcome, VerificationPhaseOutcome, CompletionCommitOutcome,
    IterationTelemetryInputs) from frozen stdlib dataclasses to frozen Pydantic BaseModel.
