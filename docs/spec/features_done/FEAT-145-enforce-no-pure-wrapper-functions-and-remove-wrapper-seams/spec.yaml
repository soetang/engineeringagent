id: FEAT-145
title: Enforce no-pure-wrapper architecture policy and remove wrapper seams
type: spec
expected_commit_subject: 'spec: add FEAT-145 no-pure-wrapper policy and seam cleanup'
planning_tier: planned
status: done
priority: high
objective: Add a strict fitness function that defaults to no pure wrapper functions,
  then refactor existing wrapper-heavy areas so production and harness code conform
  without compatibility shims.
context: 'The codebase currently includes multiple single-return wrapper functions
  that primarily forward arguments to another function. This adds indirection and
  line count without adding domain logic.

  We need a deterministic policy that makes wrappers the exception, not the default,
  while still supporting explicit exceptions for rare cases where no better design
  exists.'
constraints:
- 'In scope: wrapper policy enforcement for `src/engineeringagent/**` and `harness/fitness-functions/**`.'
- 'Default policy is strict: pure wrappers are disallowed unless explicitly allowlisted.'
- Exception mechanism must exist, but default repository posture should be zero exceptions.
- Breaking changes are allowed in this repository; remove/rename wrapper APIs directly
  when needed.
- Do not keep compatibility wrapper shims after migration.
- Rule output must be deterministic and path:line actionable.
- Remediation guidance must be ordered and explicit so contributors resolve root causes
  instead of adding wrappers.
- Fitness and test updates must preserve existing checks architecture contracts and
  manifest conventions.
implementation_notes: "Contract change declaration\n\nSurface:\n- Function-shape architecture\
  \ policy for wrapper patterns in `src/engineeringagent/**` and\n  `harness/fitness-functions/**`.\n\
  - Existing wrapper-heavy runtime/helper modules that currently rely on pass-through\
  \ seams.\n- Public/internal helper names where wrappers are removed via direct canonical\
  \ exports.\n\nOld behavior:\n- Pure wrappers are allowed by default.\n- Multiple\
  \ modules expose one-line pass-through functions as stable seams even when no additional\n\
  \  domain logic exists.\n\nNew behavior:\n- Pure wrappers fail fitness checks by\
  \ default.\n- Contributors must remove wrappers or refactor ownership/boundaries\
  \ before code can pass.\n- Explicit exceptions are supported, but only through a\
  \ narrow allowlist with rationale.\n\nCompatibility policy:\n- Immediate break for\
  \ wrapper APIs that are removed or renamed.\n- No compatibility aliases, no transition\
  \ shims, and no deprecated dual-path support.\n\nMigration plan:\n- Add a new fitness\
  \ rule (`architecture.no-pure-wrapper-functions`) with deterministic AST-based\n\
  \  detection and a policy-backed allowlist.\n- Refactor current wrappers to canonical\
  \ direct implementations/exports so the default allowlist\n  remains empty if possible.\n\
  - Update callsites/tests/docs to match direct function ownership and names.\n\n\
  Verification evidence:\n- New rule tests prove deterministic pass/fail behavior\
  \ and exception handling.\n- Targeted runtime/checks/agents tests pass after wrapper\
  \ seam removal.\n- `uv run engineeringagent validate` and iteration-end checks pass.\n\
  \nFitness-function impact assessment:\n- This feature intentionally adds a new architecture\
  \ fitness rule and corresponding tests/docs.\n- Chosen path: adjust implementation\
  \ to satisfy the new rule, not weaken the rule baseline.\n- Affected assets include:\n\
  \  - `harness/fitness-functions/rules.yaml`\n  - new checker script under `harness/fitness-functions/`\n\
  \  - optional policy/allowlist file under `harness/fitness-functions/policies/`\n\
  \  - docs catalog sync output in `docs/fitness-functions/rules.md`\n\nRemediation\
  \ decision tree (ordered, first viable option wins):\n- <u>Option 1: Move logic\
  \ to the canonical domain</u> - if wrapper exists only to bridge domains,\n  relocate\
  \ the owned behavior so callers use the canonical function directly.\n- <u>Option\
  \ 2: Promote/rename the canonical function</u> - if wrapper exists for naming/export\
  \ only,\n  rename or export the underlying function directly (for example via module\
  \ `__init__` exports)\n  and delete the pass-through wrapper.\n- <u>Option 3: Replace\
  \ wrapper with explicit local logic</u> - if wrapper currently bakes constants\n\
  \  or field mapping, make that logic explicit at the callsite or in a non-wrapper\
  \ helper with\n  meaningful behavior.\n- <u>Option 4: Add an explicit exception</u>\
  \ - allowed only when options 1-3 are not viable; require\n  a concrete rationale\
  \ in allowlist metadata and deterministic follow-up remediation notes.\n"
acceptance:
- A new fitness rule `architecture.no-pure-wrapper-functions` is registered and enforced
  through `harness/fitness-functions/rules.yaml`.
- The rule scans both `src/engineeringagent/**` and `harness/fitness-functions/**`
  and reports deterministic sorted path:line violations for pure wrapper functions.
- The rule supports explicit exceptions, but the default policy state is zero exceptions
  unless a documented unavoidable case remains.
- Existing pure wrappers in scope are removed/refactored so repository checks pass
  under the new default policy without compatibility shims.
- Wrapper-removal refactors include migration of callsites/tests to direct canonical
  functions and immediate removal of obsolete wrapper names.
- Rule diagnostics include ordered remediation options that prioritize structural
  fixes over exception entries.
- 'Verification command passes: `uv run engineeringagent validate`.'
- 'Verification command passes: `uv run engineeringagent checks run --phase iteration_end`.'
- 'Verification command passes: `uv run pytest -q tests/fitness/test_fitness_rules_no_pure_wrapper_functions.py
  tests/fitness/test_fitness_manifest.py tests/checks/test_fitness_runtime.py tests/loop/test_loop_contracts.py
  tests/agents/test_agents_helpers.py tests/config/test_config_harness_toggles.py`.'
