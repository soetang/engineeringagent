id: FEAT-018
title: Handle mid-iteration feature archive without FileNotFoundError crashes
status: done
priority: high
objective: 'Make `engineeringagent run` resilient when the selected feature spec is
  moved from `docs/spec/features/` to `docs/spec/features_done/` during an iteration,
  so loop execution completes deterministically instead of crashing with FileNotFoundError.

  '
context: 'We observed a runtime crash in `_run_feature_iteration` when the selected
  feature path is loaded again after implementation/gate steps, but the file has already
  been moved to `features_done`. This currently raises FileNotFoundError and aborts
  the run loop even though archiving may have already happened as intended.

  The loop must tolerate this transition in both explicit single-feature path runs
  and `--all` startup snapshot runs. Missing selected feature paths should only be
  treated as successful completion when the matching archived file exists in `docs/spec/features_done/`;
  otherwise execution should fail fast with a clear, actionable error.

  '
constraints:
- No uncaught FileNotFoundError is emitted when selected feature path disappears mid-iteration.
- If selected feature file is missing and same filename exists in docs/spec/features_done,
  loop treats it as archived completion.
- If selected feature file is missing and no archive counterpart exists, loop fails
  with explicit operator-facing error including the missing path.
- Behavior is consistent for explicit feature-path runs and run --all startup snapshots.
- Do not weaken commit-gated completion semantics when feature file remains in active
  features directory.
- Add focused regression tests that reproduce both archive-success and missing-without-archive
  failure paths.
implementation_notes: 'Introduce explicit selected-feature path existence handling
  after implementation/gate execution and before any second load of the feature file.
  If the active path is missing, check for a same-name archived spec under `docs/spec/features_done/`.
  Treat archived-presence as a completion-compatible state and continue loop bookkeeping
  without attempting to reload from the missing active path.

  For missing-without-archive cases, return a deterministic failed gate/result and
  a clear next-action message so operators can recover. Add targeted regression coverage
  in existing loop tests for single-path and `--all` flows.

  '
acceptance:
- Running a loop iteration where implementation moves selected feature file to docs/spec/features_done
  does not crash.
- When archive counterpart exists, iteration reports completion-compatible outcome
  and loop proceeds correctly.
- When archive counterpart does not exist, loop exits with clear error that identifies
  missing selected feature path.
- run --all mode handles mid-run selected-path disappearance without traceback and
  without reselecting missing path.
- Single explicit feature-path mode handles archive-success and missing-without-archive
  outcomes deterministically.
- Targeted regression tests for these scenarios pass.
