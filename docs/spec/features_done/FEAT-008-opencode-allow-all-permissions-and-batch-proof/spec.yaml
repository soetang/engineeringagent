id: FEAT-008
title: OpenCode allow-all permissions and batch command proof
type: chore
expected_commit_subject: 'chore: legacy archived spec metadata backfill'
planning_tier: planned
status: done
priority: high
objective: Eliminate interactive permission rejections in loop runs by enforcing allow-all
  build-agent permissions and proving batch command execution works end to end.
context: 'A recent loop execution auto-rejected a requested bash command (`git status
  --short`), which blocks autonomous runs. We need deterministic permission behavior
  for the build agent so OpenCode can execute required commands in non-interactive
  mode.

  '
constraints:
- Build agent permissions must be configured as allow-all for loop execution.
- Verification must include a live OpenCode run that executes a batch bash command
  (`git status --short`).
- Permission regressions must fail validation with clear, actionable output.
implementation_notes: 'Keep permission policy repository-local and explicit. Add a
  machine-checkable permission probe that validates command execution and confirms
  no permission prompt rejection occurred.

  '
acceptance:
- Repository OpenCode config declares allow-all permission policy for the build agent.
- A live OpenCode verification command runs `git status --short` successfully in batch
  mode.
- Verification fails if output indicates permission-request rejection or non-zero
  command execution.
- Loop documentation references the permission probe as required troubleshooting evidence.
artifacts:
  plan: plan.md
