id: FEAT-095
title: Centralize reviewer response format contract with $responseformat and human
  reviewer authoring docs
type: feature
expected_commit_subject: 'feat: add FEAT-064 reviewer responseformat contract and
  authoring docs'
planning_tier: planned
status: done
priority: high
objective: Replace per-reviewer output-format instructions with a single mandatory
  $responseformat contract, enforce it through validation/runtime policy, and add
  clear human documentation for creating reviewers.
context: 'Reviewer prompts currently duplicate output-format instructions (including
  repo-specific edits in code_simplifier), which creates drift risk and inconsistent
  reviewer behavior. Product direction is to make output-format guidance canonical
  and centrally maintained, then require all reviewer markdown prompts to opt into
  that canonical contract using `$responseformat`.

  This is an intentional contract break: existing reviewer prompts that do not include
  `$responseformat` should fail validation until migrated.'
constraints:
- Use a literal `$responseformat` placeholder in reviewer markdown prompts as the
  only supported injection point for response-format instructions.
- Do not add runtime fallback behavior that appends response-format instructions when
  `$responseformat` is missing.
- Preserve reviewer decision envelope keys and semantics (`decision`, `summary`, optional
  `required_actions`, `confidence`, `scope_notes`).
- Runtime parser-failure behavior must remain deterministic (`request_changes` envelope
  with parser-failure summary) when reviewer output is malformed.
- Validator must fail when any markdown reviewer prompt under `harness/reviewers/prompts/*.md`
  does not include `$responseformat`.
- '`engineeringagent reviewers init` and scaffold reviewer prompt templates must emit
  prompts that include `$responseformat`.'
- Migrate repository-owned reviewer prompts away from bespoke output-format prose
  to token-based contract insertion.
- Add a human-facing reviewer authoring markdown guide and link it from `README.md`.
- Update spec-writing instructions to require explicit fitness-function impact assessment
  for every new spec, while allowing explicit "no fitness-function changes required"
  outcomes when justified.
- Keep changes focused on reviewer prompt contract/doc surfaces; do not expand reviewer
  approval policy semantics beyond current contract.
implementation_notes: "Contract/API deltas for this feature are explicit and intentional:\n\
  \n- Surface: Reviewer prompt markdown contract.\n  - Old behavior: Prompt files\
  \ could include ad-hoc output-format guidance and did\n    not require a canonical\
  \ placeholder.\n  - New behavior: Every reviewer markdown prompt under\n    `harness/reviewers/prompts/*.md`\
  \ must include `$responseformat`.\n\n- Surface: Reviewer runtime prompt composition.\n\
  \  - Old behavior: Runtime added generic JSON-output instructions and prompt-local\n\
  \    guidance could diverge.\n  - New behavior: Runtime injects one canonical JSON\
  \ decision-spec block at\n    `$responseformat` and treats missing placeholder as\
  \ a deterministic contract\n    failure.\n\n- Surface: Validation policy (`engineeringagent\
  \ validate`).\n  - Old behavior: Reviewer validation focused on YAML contract/path\
  \ constraints and\n    did not enforce reviewer markdown content token requirements.\n\
  \  - New behavior: Validation reports deterministic errors for reviewer markdown\n\
  \    prompts missing `$responseformat`.\n\n- Surface: Reviewer setup/scaffold API.\n\
  \  - Old behavior: Seeded reviewer prompts included inline output-format prose.\n\
  \  - New behavior: Seeded reviewer prompts include `$responseformat` and rely on\n\
  \    canonical injected contract text.\n\n- Surface: Human documentation.\n  - Old\
  \ behavior: Reviewer authoring instructions were mostly agent-facing and lacked\n\
  \    a dedicated human how-to document.\n  - New behavior: Add a human reviewer-authoring\
  \ markdown guide and README link.\n\nCompatibility policy:\n- Immediate break for\
  \ reviewer markdown prompts missing `$responseformat`.\n- No temporary dual-support\
  \ path and no append fallback.\n\nMigration scope:\n- One-time prompt migration\
  \ for all repository-owned reviewer markdown prompts.\n- Update tests and docs to\
  \ align with token contract.\n\nVerification evidence should include runtime tests\
  \ for prompt composition/failure,\nvalidator tests for placeholder enforcement,\
  \ scaffold/init tests for seeded prompt\ncontent, and repository validation.\n"
acceptance:
- Reviewer runtime injects one canonical JSON response-format contract at `$responseformat`
  for configured reviewers.
- Missing `$responseformat` in reviewer markdown prompts is treated as a deterministic
  contract failure (no fallback append behavior).
- '`engineeringagent validate` reports deterministic errors for any markdown reviewer
  prompt under `harness/reviewers/prompts/*.md` that lacks `$responseformat`.'
- Repository-owned reviewer prompts (including code_simplifier prompt) are migrated
  to token-based response-format insertion.
- '`engineeringagent reviewers init` and scaffold reviewer prompt templates generate
  prompts containing `$responseformat`.'
- New human-facing reviewer authoring doc exists under `docs/principles/` and explains
  how to create reviewers, use `$responseformat`, and migrate existing prompts.
- '`README.md` reviewer section links to the new human reviewer authoring doc.'
- '`docs/references/spec-writing.md` includes explicit guidance to assess fitness-function
  impact for each new spec and record either required changes or a justified no-change
  decision.'
- Regression tests cover runtime injection/failure, validator placeholder enforcement,
  and scaffold/init prompt generation alignment.
artifacts:
  plan: plan.md
