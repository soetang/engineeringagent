id: FEAT-044
title: Enforce OpenCode permission contract by proving bash command execution
type: bug
expected_commit_subject: 'fix: add FEAT-044 opencode precheck bash execution contract'
status: done
priority: high
objective: Ensure default OpenCode implement mode only proceeds when OpenCode can
  actually execute the required bash command (`git status --short`), not merely when
  the `opencode` binary exists.
context: The integration suite currently treats `opencode` CLI presence as sufficient
  to run an end-to-end loop test, but real runs can still fail at pre-run permission
  checks when bash execution is denied. This creates confusing failures (for example,
  missing `progress/runs.jsonl` because the run exits before feature selection). We
  need an explicit, deterministic contract that validates bash execution viability
  and aligns integration fixtures with that contract.
constraints:
- Keep fail-fast precheck behavior introduced in FEAT-026 (exit before feature selection
  when permission is not viable).
- Do not treat binary existence alone as success; success must require evidence that
  the probe command could run.
- Keep remediation output actionable and aligned with repository permission guidance.
- Ensure integration fixtures represent a permission-viable setup for default OpenCode
  implement mode.
- Preserve `--skip-implement` and `--implement-command` bypass behavior.
implementation_notes: Tighten probe success semantics and integration-fixture setup
  together so the contract is testable and deterministic. Update integration tests
  to assert the permission contract directly (including precheck behavior and telemetry
  expectations) and to fail with explicit permission context rather than indirect
  file-missing errors.
acceptance:
- Default implement-mode precheck fails when OpenCode cannot execute `git status --short`,
  even if `opencode` exists in PATH.
- Default implement-mode precheck passes only when the probe demonstrates executable
  bash permission viability.
- Integration fixture/setup for OpenCode loop integration reflects a permission-viable
  configuration (including both required OpenCode config surfaces).
- tests/test_loop_opencode_integration.py::test_loop_runs_opencode_integration no
  longer fails due to implicit permission misconfiguration assumptions.
- Precheck-failure output and run telemetry remain deterministic and actionable.
- uv run pytest -q tests/test_loop_opencode_integration.py passes in a permission-viable
  local environment.
subtasks:
