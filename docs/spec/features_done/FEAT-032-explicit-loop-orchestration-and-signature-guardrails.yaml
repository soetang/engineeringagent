id: FEAT-032
title: Make loop orchestration explicit with self-documenting extraction and argument-budget
  guardrails
type: feature
expected_commit_subject: 'feat: add FEAT-032 explicit loop orchestration and signature
  guardrails'
status: done
priority: high
objective: 'Improve loop readability and maintainability by keeping control flow explicit,
  moving non-control-flow logic behind self-documenting helpers, improving variable
  naming clarity, and enforcing a strict argument-budget guardrail to prevent regression.

  '
context: 'Graduated from POT-004 after user confirmation on scope and tradeoffs.

  User-confirmed scope: keep `engineeringagent.loop` as the public facade, preserve
  public signatures (especially `run_loop`) and CLI behavior, focus this feature on
  loop flow readability plus signature simplification, and use focused verification
  plus final `loop_fast` gate validation.

  Additional user request: include durable agent guidance for resolving wide signatures
  with generally applicable refactor patterns (for example context objects/dataclasses),
  plus the same self-documenting principle for variable names.

  Clarified preference: do not introduce a separate loop interface layer; keep `run_loop`
  and `_run_feature_iteration` as control-flow orchestrators and move non-control-flow
  logic out behind intention-revealing helper functions.

  '
constraints:
- Preserve `engineeringagent run` CLI surface and runtime semantics.
- Keep `src/engineeringagent/loop.py` as the compatibility facade for existing imports
  and tests.
- Keep control-flow orchestration centered in `run_loop` and `_run_feature_iteration`.
- Extract non-control-flow logic (I/O, lifecycle details, prompt/log formatting, command
  wrappers) into helpers or submodules with intention-revealing names.
- Preserve targeted monkeypatch seams used by loop tests unless explicitly migrated
  with equivalent coverage.
- Keep behavior stable for selection, retry, archive/restore, gate execution, completion
  commit, and telemetry outcomes.
- Enforce strict Ruff argument-budget checks with repository defaults (`PLR0913` at
  `max-args = 5`).
- Do not use broad per-file or module-wide suppressions for `PLR0913`; any boundary
  exception must be narrowly scoped and justified inline.
- Guidance updates must remain general and reusable across modules, not loop-specific
  prose only.
- Prefer self-documenting variable names over abbreviations or overloaded generic
  names in orchestration and extracted helpers.
implementation_notes: 'Keep `run_loop` and `_run_feature_iteration` readable as explicit
  phase control flow (select -> iterate -> decide). Move non-control-flow details
  into intention-revealing helpers; extraction may stay in `loop.py` or use small
  submodules when it improves scanability without adding an interface layer.

  Reduce internal argument fan-out with refactors such as phase extraction, cohesive
  parameter objects, keyword-only secondary controls, or typed result objects, choosing
  the simplest option that preserves readability and behavior.

  Apply the same self-documenting rule to variable names: prefer clear lifecycle and
  state names (for example selected_feature_path, archived_feature_path, iteration_outcome)
  over short or overloaded names.

  Add a short agent-facing guidance section for `PLR0913` remediation in `docs/references/python-uv-ruff.md`,
  and keep `AGENTS.md` concise by linking to that reference instead of duplicating
  long rules.

  '
acceptance:
- '`run_loop` and `_run_feature_iteration` read as explicit high-level control-flow
  phases with non-control-flow details delegated to clearly named helpers.'
- Internal loop helpers no longer rely on wide argument lists; repeated parameter
  bundles are reduced using maintainable refactor patterns without requiring a new
  interface layer.
- Orchestration and extracted helper variables use self-documenting names that communicate
  lifecycle/state intent.
- Strict Ruff `PLR0913` enforcement is enabled in repository configuration and integrated
  into existing lint gate paths.
- Any retained `PLR0913` exception is minimal, boundary-local, and documented with
  an inline rationale.
- Agent guidance for resolving wide signatures is documented in `docs/references/python-uv-ruff.md`
  with generally applicable patterns (phase extraction, context objects/dataclasses,
  keyword-only controls, typed result objects, narrow exceptions).
- Guidance content includes explicit sections for core intent, preferred refactor
  order, exception policy, and verification commands.
- Guidance content explicitly includes self-documenting variable naming examples for
  loop lifecycle/state values.
- '`AGENTS.md` includes a concise pointer to the detailed Ruff/signature guidance
  location.'
- Focused loop regression tests pass and final validation includes `uvx --from . engineeringagent
  gates run --profile loop_fast`.
