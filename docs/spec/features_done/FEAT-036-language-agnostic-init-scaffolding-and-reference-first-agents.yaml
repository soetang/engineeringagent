id: FEAT-036
title: Expand init scaffolding to language-agnostic baseline with file-based templates
  and reference-first AGENTS
type: feature
expected_commit_subject: 'feat: add FEAT-036 language-agnostic init scaffold templates'
status: done
priority: high
objective: 'Make `engineeringagent init` produce a language-agnostic default scaffold
  that reflects harness engineering principles, uses file-based template assets (not
  large inline Python strings), and ships a minimal reference-first `AGENTS.md` that
  teams can extend as their repository evolves.

  '
context: 'Current init scaffold generation is Python/uv-centric in key defaults and
  embeds several template bodies directly in Python source. We want a reusable, stack-neutral
  baseline plus optional stack-specific profiles, while keeping documentation audience
  boundaries clear (human onboarding docs vs agent execution references). The user
  also requested slimmer AGENTS content that keeps major principles but is mostly
  a references map rather than an encyclopedia.

  '
constraints:
- Keep this feature scoped to scaffold/template/docs architecture; do not implement
  docs-root runtime path plumbing here.
- Default scaffold profile must be language-agnostic and avoid Python/uv-specific
  command assumptions.
- Scaffold content must be sourced from template files on disk, not large embedded
  text blocks in Python.
- 'Keep audience split explicit: human-facing docs for onboarding, agent-facing docs
  for deterministic execution guidance.'
- Scaffolded `AGENTS.md` must be minimal and reference-first with major principles
  and explicit fill-in guidance.
- Ship tool-usage docs only; do not scaffold repository-specific internal docs.
- Preserve optional Python/uv-centric scaffold guidance as an explicit opt-in profile.
- Dogfood the same AGENTS structure in this repository `AGENTS.md`.
implementation_notes: 'Introduce scaffold profiles with `core` as the default language-agnostic
  mode and an optional `python_uv` profile for current Python-specific defaults. Move
  scaffold payloads into a template directory (for example `src/engineeringagent/scaffold_templates/`)
  and render with lightweight substitution for dynamic values like docs root and profile
  sections. Keep generated AGENTS concise and reference-driven, then apply the same
  structure to this repository AGENTS file. Add a fitness function that enforces template
  locality for scaffold content so inline template regressions are caught.

  '
acceptance:
- '`engineeringagent init` default output is language-agnostic and does not depend
  on Python/uv-specific commands.'
- Scaffold outputs are rendered from file-based templates; scaffold Python modules
  do not contain large embedded template payloads.
- Scaffolded `AGENTS.md` is concise, principle-led, and primarily references-based
  with clear placeholders for repo-specific additions.
- Scaffolded docs cover tool approach and workflow boundaries, and exclude repository-specific
  implementation internals.
- Optional `python_uv` profile is available and preserves Python/uv-oriented bootstrap
  guidance.
- This repository `AGENTS.md` is slimmed to reference-first structure while preserving
  operating principles and required references.
- Fitness rule `architecture.scaffold-template-locality` exists, is active in the
  fitness manifest, and fails when scaffold templates drift back inline.
- Validation, fitness checks, and precommit gates pass after changes.
subtasks:
