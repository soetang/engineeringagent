id: FEAT-117
title: Add Codex CLI backend using codex exec with native schema mode
type: feature
expected_commit_subject: 'feat: add codex backend using codex exec'
status: done
priority: high
objective: 'Implement a new `codex` agent backend that runs via `codex exec` and supports

  structured output using Codex CLI schema enforcement.


  The backend must be resolved internally through the existing agents backend registry

  and configuration path (no backend object override at `run_agent` callsites), and

  it must support backend-owned repository scaffolding via

  `.codex/config.toml` using Codex profiles.

  '
context: 'We already have an OpenCode backend under `src/engineeringagent/agents/backends/opencode/**`.

  FEAT-113 introduces backend registry + config-driven backend selection,

  FEAT-114 introduces backend-owned scaffolds, and FEAT-115 removes backend-specific

  coupling from loop runtime.


  Codex CLI non-interactive mode (`codex exec`) is suitable for this boundary:

  - prompt as positional argument

  - optional structured output via `--output-schema`

  - final message capture via `--output-last-message`

  - non-interactive execution for automation workflows


  Design decision for this feature:

  - Use Codex profiles (`.codex/config.toml`) for backend setup.

  - Do not implement Codex multi-agent role scaffolding in this feature.

  '
constraints:
- "Preconditions: - FEAT-113 must be complete (registry/config backend selection).\
  \ - FEAT-119 must be complete (run_agent has no backend override parameter and backend\n\
  \  resolution stays inside engineeringagent.agents).\n- FEAT-114 must be complete\
  \ before init/scaffold tasks in this feature. - FEAT-115 must be complete before\
  \ validating full loop-level backend switching."
- "Phase gates for execution safety:\n- Phase A (can execute once FEAT-113 is complete):\
  \ ST-001, ST-002, ST-003,\n  ST-005, ST-006, ST-008, ST-009, ST-010, ST-013, ST-014,\
  \ ST-016, ST-017,\n  ST-018.\n- Phase B (blocked on FEAT-114): ST-007.\n- Phase\
  \ C (blocked on FEAT-115): ST-011 and ST-015."
- 'Authentication assumption: users are already logged into Codex CLI. Do not add
  login bootstrap flows (`codex login`) to init or runtime.'
- 'Do not implement backend failover or fallback (for example: switching from codex
  to opencode after a codex failure). Backend selection is a configuration decision
  and must remain stable for the duration of a single run.'
- Backend selection and backend construction are internal to `engineeringagent.agents`;
  callers (including reviewers) must not provide backend objects or backend override
  parameters to `run_agent`.
- 'Repository safety: until ST-015, do not change this repository''s configured default
  backend to codex. ST-015 is the only subtask allowed to modify `engineeringagent.toml`
  `[agents] backend` for this repo.'
- 'Add a new backend package: - `src/engineeringagent/agents/backends/codex/__init__.py`
  - `src/engineeringagent/agents/backends/codex/client.py` - `src/engineeringagent/agents/backends/codex/backend.py`'
- "Codex command contract (normative): - text mode uses `codex exec` with workspace-write\
  \ sandbox and captures final\n  output via `--output-last-message <path>`.\n- structured\
  \ mode uses `codex exec --output-schema <schema.json>` and captures\n  final output\
  \ via `--output-last-message <path>`.\n- command execution uses `cwd=project_root`.\
  \ - final payload extraction is sourced from the output-last-message file path,\n\
  \  not from stdout event streams."
- Default Codex sandbox policy for this backend must allow edits required by engineeringagent
  (workspace-write equivalent), not read-only defaults.
- Introduce backend capability for native structured output enforcement so Codex can
  use `--output-schema` directly instead of prompt-wrapper retries.
- "Structured output behavior for Codex backend: - perform one Codex invocation per\
  \ `run_agent` call in structured mode - keep one local JSON parse + Pydantic validation\
  \ pass for safety - on parse/validation failure after Codex schema mode, raise\n\
  \  `AgentOutputValidationError` without retry loop\n- preserve existing retry behavior\
  \ for non-native-schema backends"
- "Codex structured-output payload capture contract: - In both text and structured\
  \ modes, codex backend must use\n  `--output-last-message <path>` and treat the\
  \ file contents as the sole\n  canonical output payload.\n- Stdout/stderr (including\
  \ `--json` event streams) must be treated as\n  non-canonical progress/debug output\
  \ and must not be parsed to obtain the final\n  payload.\n- In structured mode,\
  \ the output-last-message file is expected to contain a\n  single strict JSON value\
  \ compatible with the provided `--output-schema`."
- Register `codex` in the backend registry and ensure list/resolve behavior is deterministic
  and sorted.
- "Strategy-pattern requirement for FEAT-117: - backend selection from TOML and backend\
  \ construction must be owned by an\n  agents-layer runtime/strategy resolver (for\
  \ example `resolve_agent_strategy`)\n- `run_agent` must be a thin facade/delegator\
  \ and must not perform direct TOML\n  reads or backend-id branching\n- if FEAT-113\
  \ leaves selection logic inside `run_agent`, migrate it in FEAT-117"
- "Structured-output ownership requirement for FEAT-117:\n- each backend strategy\
  \ owns how structured output is requested, extracted,\n  and retried (if applicable)\n\
  - backend-owned behavior includes schema transport, prompt contract text,\n  invocation\
  \ count/retry policy, and backend-specific failure mapping\n- ownership is consumer-agnostic:\
  \ reviewers are only one caller; future\n  structured-output callers must use the\
  \ same backend strategy contract\n- `run_agent` must not contain backend-specific\
  \ structured-output prompt\n  wrappers or retry loops"
- 'Add backend-specific config resolution for Codex runtime options under: - engineeringagent.toml
  `[agents.codex]` - pyproject.toml `[tool.engineeringagent.agents.codex]` Minimum
  keys: - `profile` (string, optional) - `model` (string, optional) Precedence: -
  engineeringagent.toml `[agents.codex]` - pyproject.toml `[tool.engineeringagent.agents.codex]`
  - unset/default'
- Add backend-owned scaffold assets for Codex profiles under `src/engineeringagent/agents/backends/codex/**`
  and scaffold `.codex/config.toml` when backend=codex is selected during init.
- Multi-agent config (`[agents]` role tables in Codex config) is explicitly out of
  scope for this feature. Track as future enhancement once codex backend is stable.
- "Fitness-function impact assessment: - update subprocess boundary allowlist to include\
  \ Codex backend client module - keep backend boundary checks passing (imports from\
  \ backends remain inside\n  `src/engineeringagent/agents/**`)"
- "Reviewer `$responseformat` deprecation contract: - `$responseformat` is forbidden\
  \ in reviewer prompt files (no legacy support). - `engineeringagent validate` must\
  \ fail deterministically when `$responseformat`\n  appears in any configured reviewer\
  \ prompt file.\n- Reviewer execution must not require `$responseformat` at runtime.\
  \ - Reviewer output formatting is enforced via backend/strategy-owned structured\n\
  \  output schema handling, not reviewer prompt token injection."
implementation_notes: "Backend error mapping\n\n- Convert missing executable errors\
  \ (`FileNotFoundError`) into\n  `AgentBackendError(backend=\"codex\", message=\"\
  codex executable missing\")`.\n- Non-zero `codex exec` exit should raise `AgentBackendError`\
  \ with process\n  details: return code, stdout, stderr, command args.\n\nStructured\
  \ output integration\n\n- Avoid relying only on `--json` event streams for final\
  \ output extraction.\n- Use `--output-last-message <path>` as canonical final payload\
  \ capture in both\n  text and structured modes.\n- Parse backend payload from the\
  \ output-last-message file; treat stdout as\n  non-canonical progress channel.\n\
  - For structured mode, write schema JSON to a temp file and pass\n  `--output-schema\
  \ <temp_schema_path>`.\n\nObserved codex schema-mode behavior (hello-world validation)\n\
  \n- In codex-cli 0.104.0, `codex exec --output-schema <schema.json>` produced a\n\
  \  strict JSON object in the output-last-message file.\n- Schema constraints like\
  \ `enum` and `additionalProperties: false` were honored\n  even when the prompt\
  \ requested invalid values or extra keys.\n- The codex CLI may print additional\
  \ non-JSON progress/telemetry to stdout; this\n  reinforces treating output-last-message\
  \ as canonical.\n\nSession semantics\n\n- Codex backend can ignore `session_id`\
  \ for v1 and return `session_id=None`.\n- Resume/fork session behaviors are out\
  \ of scope.\n\nProfiles vs multi-agent\n\n- V1 setup uses profiles because this\
  \ is stable and directly maps to backend\n  model/sandbox defaults.\n- Codex multi-agent\
  \ is experimental and should not be scaffolded by default.\n\nStrategy ownership\
  \ and migration from FEAT-113\n\n- FEAT-117 is the place to finalize strategy ownership\
  \ in agents.\n- Introduce a runtime/strategy resolver in `engineeringagent.agents`\
  \ that reads\n  backend configuration and returns the selected execution strategy.\n\
  - Keep `run_agent` as a stable facade API, but move selection logic out of it.\n\
  - `run_agent` does not accept a backend override parameter. Tests must inject a\n\
  \  backend selection via repo config (`[agents] backend`) and registry mapping.\n\
  \nStructured output ownership by backend\n\n- Codex backend: use native `--output-schema`\
  \ and backend-owned single-invocation\n  policy with local validation guard.\n-\
  \ OpenCode backend: own structured-output prompt contract and bounded retry\n  policy\
  \ in the backend strategy (not in run_agent).\n- Keep shared contracts minimal:\
  \ typed errors and backend-normalized output.\n- Do not add reviewer-specific structured-output\
  \ branching in run_agent or\n  backend strategies; reviewers must consume the same\
  \ generic structured path.\n\nReviewer response-format deprecation\n\n- Remove reviewer\
  \ prompt reliance on `$responseformat`.\n- Remove any reviewer runtime injection/substitution\
  \ behavior for `$responseformat`.\n- Forbid `$responseformat` in repo reviewer prompt\
  \ files and fail validation if present.\n- Update reviewer authoring docs to state\
  \ `$responseformat` is not supported.\n"
acceptance:
- engineeringagent.agents.list_backends() includes codex and remains sorted.
- With `[agents] backend = "codex"` configured, `run_agent(..., output_type=str)`
  executes via codex exec command wiring and returns final text payload.
- With `[agents] backend = "codex"` configured, `run_agent(..., output_type=<model>)`
  uses output-schema mode and performs a single backend invocation.
- Codex command args include a workspace-write-equivalent sandbox policy for both
  text and structured modes.
- Default backend resolution from TOML is performed by an agents-layer strategy/runtime
  resolver, not in run_agent.
- run_agent default path delegates to resolved strategy without backend-id conditionals
  in run_agent.
- run_agent does not implement backend-specific structured-output wrappers or retry
  policy; structured-output behavior is implemented by backend strategies.
- 'Structured-output handling remains consumer-agnostic: reviewers and any future
  structured-output callers rely on the same backend strategy contract.'
- 'Codex runtime options resolve with deterministic precedence: engineeringagent.toml
  [agents.codex] over pyproject.toml [tool.engineeringagent.agents.codex].'
- Structured codex path raises `AgentOutputValidationError` without retry when returned
  payload still fails local parse/validation.
- Codex structured-output mode parses the output-last-message file as the final payload
  (not stdout) and validates it as strict JSON.
- OpenCode structured-output path remains functional after migration to backend-owned
  policy, with deterministic retry behavior covered by tests.
- Missing codex executable maps to deterministic `AgentBackendError` with backend
  id `codex`.
- Init scaffolds `.codex/config.toml` using Codex profile defaults when backend is
  codex (after FEAT-114 wiring).
- No login/bootstrap flow is added for Codex authentication.
- subprocess boundary fitness remains green after allowlist updates.
- Reviewer prompt files do not contain `$responseformat`, and `engineeringagent validate`
  fails deterministically if any configured reviewer prompt contains the token.
- 'Repository migration complete: this repository default backend is codex via engineeringagent.toml
  [agents] backend, and default-path agent tests no longer rely on opencode as repository
  default.'
- 'Non-goals remain enforced in v1: no Codex session resume/fork integration and no
  Codex multi-agent role scaffolding.'
- uv run pytest -q passes.
