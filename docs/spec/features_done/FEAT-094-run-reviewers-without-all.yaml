id: FEAT-094
title: Run feature_done reviewers whenever harness/checks.yaml exists (not only with
  --all)
type: bug
expected_commit_subject: 'fix: run reviewers without --all'
status: done
priority: high
objective: 'Ensure reviewer checks declared in harness/checks.yaml run at feature
  completion

  (phase=feature_done) whenever the harness contract exists, even when the loop is

  invoked with explicit feature paths (without --all).


  This removes an unintended coupling where reviewers are silently disabled unless

  run_all=true.

  '
context: "Today, gate checks are enabled whenever harness/checks.yaml exists, but\
  \ reviewer\nchecks are only planned/executed when iteration_inputs.run_all is true.\n\
  \nThis causes loop output like:\n- \"\U0001F440 Reviewer: not_configured\"\n\neven\
  \ when harness/checks.yaml contains reviewer checks and the feature has reached\n\
  completion (archived_in_iteration=true).\n\nThis behavior is surprising for operators\
  \ because --all is documented as selection\nbehavior (auto-discover specs), not\
  \ as a harness enablement switch.\n"
constraints:
- 'Do not change CLI semantics: keep --all behavior and CLI validation unchanged for
  now.'
- Do not change gate checks behavior (run_gate_phase) in this feature.
- Reviewers still only run at phase=feature_done (i.e. only when archived_in_iteration=true).
- When harness/checks.yaml is missing, reviewer_status must remain not_configured
  (do not fail).
- When harness/checks.yaml exists but no reviewer checks are planned for feature_done,
  reviewer_status should remain not_run.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: loop reviewer\
  \ execution policy.\n  - Old behavior: feature_done reviewers only run when iteration_inputs.run_all\
  \ is true.\n  - New behavior: feature_done reviewers run whenever harness/checks.yaml\
  \ exists,\n    regardless of iteration_inputs.run_all.\n\nImplementation sketch:\n\
  Files to change (expected):\n- src/engineeringagent/loop_runtime/phases.py\n  -\
  \ Function: run_reviewer_phase(...)\n  - Change: remove the iteration_inputs.run_all\
  \ guard for harness/checks.yaml-based reviewers.\n  - Add explicit checks.yaml presence\
  \ handling:\n    - If harness/checks.yaml is missing: return reviewer_status=not_configured\
  \ (do not fail).\n    - If harness/checks.yaml exists but is invalid: return failed:checks_config\
  \ (same as today when run_all=true).\n    - If harness/checks.yaml exists but no\
  \ reviewer checks are planned for phase=feature_done: return reviewer_status=not_run.\n\
  \n- tests/loop/test_loop_reviewers.py\n  - Update/replace: test_run_reviewer_phase_is_not_configured_without_run_all\n\
  \    - Old expectation: run_all=false => reviewer_status=not_configured.\n    -\
  \ New expectation: run_all=false + checks.yaml missing => not_configured; run_all=false\
  \ + checks.yaml present => use checks.yaml planning.\n  - Add test coverage that\
  \ writes a minimal tmp_path/harness/checks.yaml containing a reviewer check with\
  \ phase=feature_done,\n    then asserts reviewer_status is not_configured only when\
  \ the file is missing.\n"
acceptance:
- Given harness/checks.yaml exists and includes reviewer checks for phase=feature_done,
  completing a feature via engineeringagent run <path> (without --all) does not report
  reviewer_status=not_configured.
- Given harness/checks.yaml is missing, reviewer phase returns reviewer_status=not_configured
  and does not fail the iteration.
- Given harness/checks.yaml exists but yields no planned reviewer checks for feature_done,
  reviewer phase returns reviewer_status=not_run.
- uv run python -m engineeringagent.cli validate passes.
- uv run pytest -q passes.
subtasks:
- id: ST-001
  title: Enable reviewer planning/execution when checks.yaml exists (independent of
    run_all)
  status: done
  context: 'Update run_reviewer_phase to load harness/checks.yaml and plan reviewer
    checks

    whenever checks.yaml exists, not only when iteration_inputs.run_all is true.

    '
  verification:
  - uv run pytest -q tests/loop/test_loop_reviewers.py
- id: ST-002
  title: Update tests to cover reviewer enablement without --all
  status: done
  context: 'Update or replace the existing unit test that asserts reviewers are not_configured

    when run_all is false. Add a test that creates a minimal harness/checks.yaml

    with a reviewer check and asserts reviewer_status is not_configured only when

    checks.yaml is missing.

    '
  verification:
  - uv run pytest -q tests/loop/test_loop_reviewers.py
  - uv run pytest -q
