  \n      - \"tests/**/*.py\"\n  approval:\n    mode: \"advisory\"\n    first_feature_approval:\
  \ true\n    max_retries: 2\n    continue_on_exhausted: true"
acceptance:
- Default reviewer docs and scaffold include the exact `code_simplifier` YAML sample
  agreed in planning.
- '`code_simplifier` reviewer runs for matching code changes at `iteration_end` and
  is skipped deterministically for non-matching changes.'
- '`code_simplifier` advisory `warning` and advisory `request_changes` outcomes always
  require one follow-up implement pass before completion commit.'
- '`code_simplifier` does not hard-block completion by default and records advisory
  outcomes in telemetry and summaries.'
- '`code_simplifier` parse failures are handled deterministically as advisory follow-up-required
  outcomes.'
- '`harness/reviewers/prompts/code_simplifier.md` in repo matches `/home/soetang/.config/opencode/agent/code-simplifier.md`
  for initial rollout.'
- Reviewer prompt content for `code_simplifier` is plain English and includes explicit
  JSON response instructions.
- Reviewer prompt markdown under `harness/reviewers/prompts/` passes markdown locality/reference
  coverage fitness checks.
