id: FEAT-054
title: Add default code_simplifier advisory reviewer with required follow-up implement
  pass policy
type: feature
expected_commit_subject: 'feat: add FEAT-054 default code_simplifier reviewer configuration
  and policy behavior'
planning_tier: planned
status: done
priority: high
objective: Add a default `code_simplifier` reviewer that runs on code changes during
  `iteration_end`, provides advisory guidance, and always triggers at least one follow-up
  implement pass when advice is returned.
context: FEAT-050 establishes reviewer contract semantics and FEAT-051 establishes
  runtime enforcement. This feature delivers a concrete always-run reviewer profile
  for code simplification guidance using harness-managed prompt content and explicit
  advisory behavior.
constraints:
- The reviewer id is `code_simplifier` and its prompt source is `harness/reviewers/prompts/code_simplifier.md`.
- Seed `harness/reviewers/prompts/code_simplifier.md` as a verbatim copy of `/home/soetang/.config/opencode/agent/code-simplifier.md`,
  and document that upstream provenance in reviewer docs.
- Trigger at `iteration_end` phase.
- Trigger only when code-scoped files change (for example `src/**/*.py` and `tests/**/*.py`).
- Approval mode is advisory by default for this reviewer.
- Advisory outcomes (`warning` or `request_changes`) must require one follow-up implement
  pass before completion commit eligibility.
- '`code_simplifier` must not enforce hard blocking completion semantics by default.'
- Reviewer output must follow the v1 decision JSON envelope contract.
- Parse failures must be treated as deterministic advisory guidance requiring one
  follow-up pass.
- Allow markdown locality for `harness/reviewers/prompts/*.md` so reviewer prompt
  files do not violate repository markdown locality policy.
- Keep markdown-locality scope narrow to reviewer prompt markdown only; do not broaden
  unrelated markdown allowlists.
implementation_notes: "Deliver one concrete advisory reviewer profile entry, prompt\
  \ guidance, and runtime behavior coverage for code simplification scenario.\n- Add\
  \ default `code_simplifier` example in scaffold and docs exactly matching\n  agreed\
  \ contract shape.\n\n- Author `harness/reviewers/prompts/code_simplifier.md` with\
  \ plain-English\n  instructions for simplification review and strict JSON decision\
  \ output.\n\n- Copy `/home/soetang/.config/opencode/agent/code-simplifier.md` into\n\
  \  `harness/reviewers/prompts/code_simplifier.md` as the initial source content,\n\
  \  and keep wording aligned unless an explicit follow-up spec requests changes.\n\
  \n- Ensure planner schedules this reviewer only when code-scoped `on_change`\n \
  \ selectors match at `iteration_end`.\n\n- Ensure advisory advice drives hook feedback\
  \ and follow-up implement latch\n  behavior without default hard failure.\n\n- Update\
  \ markdown-locality allowlist implementation and tests so\n  `harness/reviewers/prompts/code_simplifier.md`\
  \ is policy-compliant.\n\nRequired integration touch points in this feature: - `src/engineeringagent/fitness/builtin_rules.py`\
  \ markdown locality allow roots/remediation text - `tests/test_fitness_rules_markdown_locality.py`\
  \ and `tests/test_fitness_rules_markdown_references.py` - `harness/reviewers/prompts/code_simplifier.md`\
