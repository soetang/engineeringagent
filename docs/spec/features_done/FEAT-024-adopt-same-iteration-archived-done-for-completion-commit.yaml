    '
  verification:
  - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_archived_done_without_completion_commit_fails
- id: ST-005
  title: Run targeted loop regressions and schema validation
  status: done
  order: 5
  context: 'Execute focused loop tests for adoption and rollback behavior plus schema
    validation before marking feature ready.

    '
  verification:
