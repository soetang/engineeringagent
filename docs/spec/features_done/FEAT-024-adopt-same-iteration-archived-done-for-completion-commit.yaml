  title: Add same-iteration archived-done adoption signal
  status: done
  order: 1
  context: 'Track whether selected feature was active at iteration start and became
    archived+done after implement, and use that signal to continue iteration flow
    rather than failing feature-missing.

    '
  verification:
  - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_selected_feature_moved_to_features_done_does_not_crash
- id: ST-002
  title: Continue gate and commit flow for adopted archived feature
  status: done
  order: 2
  context: 'Ensure adopted same-iteration archived features execute gate profile and
    completion commit flow with stable summary and telemetry behavior.

    '
  verification:
  - uv run pytest -q tests/test_loop_ralph_mode.py::test_run_loop_all_selected_feature_moved_to_features_done_continues
- id: ST-003
  title: Restore active path on gate and commit failures after adoption
  status: done
  order: 3
  context: 'Reuse restore helpers so adopted archive state rolls back to active path
