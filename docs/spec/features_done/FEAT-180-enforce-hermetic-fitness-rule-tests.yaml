id: FEAT-180
title: Enforce hermetic fitness-rule tests and isolate repo compliance to harness
  runs
type: spec
expected_commit_subject: 'spec: add FEAT-180 hermetic fitness rule test guardrail'
status: done
priority: high
objective: Prevent fitness-rule tests from scanning the live repository checkout by
  enforcing synthetic temp-repo fixtures for fitness pytest coverage, while reserving
  real-repo compliance evaluation for harness and gate execution paths only.
context: '`tests/fitness/**` already had a repository policy in FEAT-111: pytest should
  verify checker behavior on synthetic fixtures, while real repository compliance
  should be enforced by the harness and gate profiles. FEAT-176 regressed that boundary
  by adding many statement-budget tests that invoke the checker with `repo_root` as
  the scan target. That caused implementation pressure to refactor large parts of
  the live codebase merely to satisfy rule tests, producing broad repository churn
  unrelated to the intended feature scope.


  We need an explicit guardrail that blocks this pattern from recurring anywhere in
  `tests/fitness/**`, not just in one rule module. The rule must allow use of `repo_root`
  only for locating checker scripts or static resources, while requiring the scanned
  project root to be a synthetic temp fixture. Real-repo enforcement remains valid,
  but only through explicit harness/integration tests with a narrow allowlist and
  clear naming.'
constraints:
- 'In scope: add a new fitness guardrail that covers all tests under `tests/fitness/**`,
  with a narrow explicit allowlist for harness integration tests that intentionally
  exercise real-repo execution paths.'
- 'In scope: implement the guardrail as an AST-based checker over `tests/fitness/**/*.py`;
  do not rely on plain text grep alone.'
- 'In scope: define a finite enforcement surface with exactly two implementation rules:
  (1) a `repo_root`-taint rule for explicit checker scan-target sinks, and (2) a forwarding-wrapper
  rule for local helpers that pass values into those same sinks.'
- 'In scope: keep the explicit sink list finite and named in the spec: `_run_checker(...,
  project_root/cwd)`, `execute_rule_definition(..., project_root=...)`, and `subprocess`
  execution with `cwd=...`.'
- 'In scope: treat direct checker subprocess tests and adapter-driven fitness tests
  as hermetic by default; the scanned `project_root`/`cwd` must be a synthetic temp
  fixture rather than `repo_root`.'
- 'In scope: allow `repo_root` to resolve checker scripts, static test resources,
  or manifest fixtures only; it must not be used as the project root passed to checker
  execution.'
- 'In scope: make the rule target the coupling pattern rather than banning path names;
  synthetic fixtures may still create artificial `src/engineeringagent/**`, `tests/**`,
  or `harness/**` paths inside temp repos.'
- 'In scope: require explicit integration-test affordances for any permitted real-repo
  fitness execution path, such as a dedicated allowlisted module or clearly named
  integration marker.'
- 'In scope: store explicit integration-test exceptions in a small policy allowlist
  file under `harness/fitness-functions/policies/`; avoid hardcoding file exceptions
  inside the checker.'
- 'In scope: keep FEAT-180 implementation harness-local; do not add new `src/engineeringagent/checks/**`
  modules solely to support this rule.'
- 'In scope: update or replace tests that currently assert live-repo compliance from
  pytest so they instead validate deterministic behavior on synthetic fixtures.'
- 'Out of scope: exploratory loophole hunting beyond the finite sink list and representative
  test scenarios named in this spec.'
- 'Out of scope: adding new syntactic edge-case coverage only because another possible
  aliasing or forwarding form might exist; new cases should be added only when they
  are needed to satisfy one of the explicit rules or when a concrete repository violation
  appears.'
- 'Out of scope: changing the production behavior of existing fitness checker scripts
  beyond what is needed to support hermetic testing and explicit harness integration
  coverage.'
- 'Out of scope: salvaging or preserving the current FEAT-176 implementation diff;
  restart should assume those uncommitted implementation changes are discarded wholesale.'
implementation_notes: 'Contract change declaration


  Surface:

  - Fitness pytest authoring policy under `tests/fitness/**`.

  - Harness-level ownership of real-repo compliance enforcement.

  - New repository fitness rule guarding against non-hermetic fitness tests.

  - Harness-local policy/config parsing for this rule.


  Old behavior:

  - Some fitness tests execute checker scripts with `repo_root` as the scan target.

  - Pytest can accidentally become a repository-compliance ratchet instead of a behavior-contract
  test suite.

  - Features can expand into broad live-repo refactors merely to satisfy rule tests.


  New behavior:

  - Fitness tests are hermetic by default: checker executions scan only synthetic
  temp repos.

  - `repo_root` is allowed only for locating scripts/resources, not as the scanned
  project root.

  - Real-repo compliance checks occur only through harness/gate execution or a small
  explicit integration-test allowlist.

  - A dedicated guardrail fitness rule fails if `tests/fitness/**` reintroduces the
  forbidden live-repo scan pattern.

  - The rule remains harness-local and uses only the existing `engineeringagent.checks`
  fitness envelope; it does not expand `src/engineeringagent/checks/**` with new FEAT-180-specific
  helpers.

  - Existing active rules do not already cover this gap: `architecture.no-doc-content-tests`
  only forbids brittle README/docs wording assertions, and harness smoke rules such
  as `check_real_opencode_hello_world_smoke.py` intentionally operate through temp
  repos plus live-CLI invocation rather than pytest-driven live-repo scans.


  Compatibility policy:

  - No end-user runtime behavior change.

  - Repository test-authoring policy becomes stricter by design.


  Migration plan:

  1) Add the new guardrail rule and document the allowed hermetic-testing pattern.

  2) Refactor violating fitness tests to use synthetic temp repos only.

  3) Keep any legitimate real-repo cases in explicit allowlisted integration coverage.

  4) After the guardrail lands, discard the current FEAT-176 implementation diff and
  restart FEAT-176 under the new rule.


  Verification evidence:

  - The new guardrail rule fails on representative scenarios for each explicit implementation
  rule and passes on the approved hermetic scenarios.

  - `tests/fitness/**` no longer runs checkers with `repo_root` as the scan target
  except in explicit allowlisted integration cases.

  - FEAT-180 is complete when the finite rules below are implemented, their named
  representative scenarios pass, violating pytest modules are rewritten, and the listed
  verification commands pass. The feature does not remain open for additional exploratory
  loophole discovery once that bar is met.


  Fitness-function impact assessment:


  - fitness-function changes required.

  - Add a new guardrail rule covering hermetic fitness test execution.

  - Update any affected catalog/docs entry for the new rule.

  - Update violating test modules under `tests/fitness/**` to match the approved pattern.

  - Keep any policy loader/model for this rule inside `harness/fitness-functions/`
  rather than adding new checks-owned modules.

  Recommended enforcement shape:

  - parse `tests/fitness/**/*.py` with `ast` and analyze call sites rather than relying
  on substring matching alone;

  - implement only these two enforcement rules: 1) `repo_root`-taint rule: treat `repo_root`
  and simple values derived from it as forbidden when passed into an explicit scan-target
  sink; 2) forwarding-wrapper rule: treat local helpers as violations when they forward
  a value into one of those same explicit scan-target sinks;

  - keep the sink list finite and named: `_run_checker(..., project_root/cwd)`, `execute_rule_definition(...,
  project_root=...)`, and `subprocess` execution with `cwd=...`;

  - treat these representative patterns as sufficient verification evidence for the
  two rules rather than as an open-ended loophole inventory: - direct helper call
  with `repo_root` as scan target; - direct adapter or subprocess call with `repo_root`
  as scan target; - one `repo_root` alias or derived-value case reaching a sink; -
  one kwargs or forwarding case reaching a sink; - one allowed script/resource lookup
  case; - one allowlisted integration case;

  - permit `repo_root` when used only to build checker script paths under `harness/fitness-functions/`;

  - load allowlisted integration modules from a small policy file (for example a YAML
  list of test-file paths) so exceptions are explicit and reviewable;

  - parse that allowlist inside the harness checker or a harness-local helper, not
  a new `src/engineeringagent/checks/**` module;

  - emit concise violations in the form `<path>:<line> fitness tests must not use
  repo_root as checker scan target (<pattern>)`.

  '
acceptance:
- A new fitness guardrail fails when tests under `tests/fitness/**` execute a checker
  against `repo_root` or otherwise use the live repository as the scan target, unless
  the test module is explicitly allowlisted as an integration case.
- The guardrail does not ban synthetic fixture paths such as artificial `src/engineeringagent/**`;
  it specifically bans scanning the real checkout.
- '`repo_root` usage limited to locating checker scripts/resources remains allowed.'
- 'The checker implementation is AST-based and implements exactly two explicit enforcement
  rules: a `repo_root`-taint rule for named scan-target sinks, and a forwarding-wrapper
  rule for local helpers that pass values into those same sinks.'
- 'The checker explicitly detects the finite sink list named by this spec: `_run_checker(...,
  project_root/cwd)`, `execute_rule_definition(..., project_root=...)`, and `subprocess`
  execution with `cwd=...`.'
- Equivalent helper/wrapper calls that forward `repo_root` into one of those named
  sinks are also detected.
- Explicit integration exceptions are loaded from a small policy allowlist file rather
  than hardcoded in checker logic.
- FEAT-180 introduces no new `src/engineeringagent/checks/**` modules; the checker
  uses the existing fitness envelope imports only.
- Violation strings identify the offending test file and line and name the forbidden
  pattern concisely.
- Existing violating fitness tests are rewritten or removed so pytest covers checker
  behavior on temp fixtures rather than repository-wide compliance.
- Real-repo compliance responsibility is clearly reserved for harness/gate execution
  paths and any small explicit integration-test allowlist.
- Fitness rule docs/catalog text is updated consistently for the new guardrail.
- FEAT-180 completion does not require additional exploratory loophole hunting once
  the named rules, representative scenarios, test rewrites, and verification commands
  are complete.
- 'Verification command passes: `uv run pytest -q tests/fitness`.'
- 'Verification command passes: `uv run engineeringagent checks catalog --format markdown
  --output docs/fitness-functions/rules.md`.'
- 'Verification command passes: `uv run engineeringagent validate --schema-only`.'
