id: FEAT-120
title: Add manifest-native fitness policy config and catalog discoverability
type: feature
expected_commit_subject: 'feat: add manifest-native fitness policy config support'
status: done
priority: high
objective: Make fitness-rule policy configuration declarative and discoverable by
  adding manifest-native config-file support for command rules, surfacing policy-file
  paths in generated checks catalog output, and migrating long inline rule arguments
  into repository-owned policy YAML files.
context: 'Current command-backed fitness rules keep policy in two places: code defaults
  and long command arg lists inside `harness/fitness-functions/rules.yaml`. This is
  hard to review and drifts as backend/policy surfaces evolve. We also have semgrep
  rule YAML adjacent to scripts with naming that does not clearly signal policy ownership.


  This feature introduces a first-class `config_file` field in the fitness manifest
  contract and makes generated catalog output point to each configured policy file
  so operators can jump directly to rule configuration.'
constraints:
- 'Additive contract only: existing manifest entries without `config_file` remain
  valid and behaviorally unchanged.'
- '`config_file` paths are repository-local and resolved deterministically relative
  to the manifest location.'
- Command-adapter rules with `config_file` must receive that path through a stable
  adapter contract (`--config-file <path>`), not ad hoc per-rule wiring.
- Generated catalog outputs must include policy-file location for discoverability
  in both markdown and json formats.
- Move long inline policy args for `architecture.no-non-ignorable-ruff-suppressions`
  into a YAML policy file under `harness/fitness-functions/policies/`.
- Rename subprocess semgrep rule asset to policy-oriented naming and keep loop subprocess
  behavior unchanged.
- Keep rule IDs stable in this feature; no boundary-rule merge/removal in this cycle.
- 'Fitness-function impact assessment: this feature intentionally changes fitness
  contracts/docs and must update affected tests for manifest schema, registry, adapters,
  and catalog generation.'
implementation_notes: 'Contract change declaration (required)


  Surface: custom fitness manifest schema (`harness/fitness-functions/rules.yaml`),
  rule-definition runtime model, command adapter invocation contract, and checks catalog
  output contract.


  Old behavior:

  - Manifest entries define only command/env/timeout and cannot declare a separate
  policy file.

  - Rule-specific policy often lives in long inline command args.

  - Catalog output does not expose where policy configuration lives.

  - Loop subprocess semgrep YAML filename does not explicitly communicate policy ownership.


  New behavior:

  - Manifest entries may set optional `config_file`.

  - Command adapter appends `--config-file <resolved-path>` when `config_file` is
  present.

  - Catalog markdown/json output includes `config_file` (when present) so operators
  can locate policy directly.

  - Ruff suppression rule loads blocked IDs/scan roots/rule_id from policy YAML.

  - Loop subprocess checker accepts `--config-file` and reads semgrep policy from
  a renamed policy file path.


  Compatibility policy:

  - Backward compatible additive contract for manifest entries: existing entries remain
  valid.

  - Rule scripts should continue accepting existing explicit CLI args; config-file
  mode is additive and preferred.


  Migration plan:

  - Add policy files under `harness/fitness-functions/policies/`.

  - Update manifest entries to set `config_file` and remove equivalent inline args
  where migrated.

  - Rename semgrep YAML to policy-oriented filename and update checker references/tests/docs.


  Out of scope for FEAT-120:

  - Merging/removing overlapping backend-boundary rules (`architecture.agents-opencode-boundary`
  vs `architecture.agents-backends-boundary`).

  - General backend-literal policy refactor beyond introducing config-file plumbing.'
acceptance:
- '`engineeringagent.checks.fitness.contracts.CustomRuleManifestEntry` accepts optional
  `config_file` and rejects invalid types/empty values.'
- '`engineeringagent.checks.fitness.registry` carries `config_file` into rule definitions
  with deterministic path resolution.'
- Command adapter appends `--config-file <path>` only for rules that define `config_file`.
- '`architecture.no-non-ignorable-ruff-suppressions` policy is defined in YAML under
  `harness/fitness-functions/policies/` and no longer encoded as long inline arg chains
  in manifest.'
- Loop subprocess semgrep policy file is renamed to policy-oriented naming and checker
  behavior remains equivalent.
- '`engineeringagent checks catalog --format markdown` shows a per-rule config-file
  path when configured.'
- '`engineeringagent checks catalog --format json` includes `config_file` field in
  each rule payload (nullable or present-by-contract as implemented).'
- Existing manifest entries without `config_file` still run and pass unchanged.
- '`uv run pytest -q tests/fitness tests/cli/test_cli_checks_catalog.py tests/checks/test_fitness_runtime.py`
  passes.'
- '`uv run engineeringagent validate` passes.'
