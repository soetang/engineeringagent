id: FEAT-083
title: Relocate commit subject policy validation into harness fitness-functions
type: chore
expected_commit_subject: 'chore: move commit message policy into harness'
status: done
priority: medium
objective: 'Treat commit subject policy validation as harness-owned policy code by
  moving the

  commit message parsing/validation module out of `src/engineeringagent` and into

  `harness/fitness-functions/`, keeping the policy close to the harness script that

  enforces it.

  '
context: 'The commit subject policy module `src/engineeringagent/commit_messages.py`
  is used

  by the harness script `harness/fitness-functions/validate_commit_messages.py` and

  by tests. It is not used by loop runtime or CLI orchestration.


  Since this policy is enforced via harness tooling, it is clearer and more

  discoverable to keep the policy implementation in the harness zone.

  '
constraints:
- Do not add non-YAML regular files to the harness root; keep the existing `architecture.harness-root-yaml-only`
  rule satisfied.
- The harness commit message validator must continue to support both `--commit-msg-file`
  and `--commit-range` modes.
- Update tests to validate policy behavior without importing `engineeringagent.commit_messages`.
implementation_notes: "Contract/API delta (explicit):\n\n- Surface: internal Python\
  \ import path for commit subject policy.\n  - Old behavior: policy logic imported\
  \ from `engineeringagent.commit_messages`.\n  - New behavior: policy logic imported\
  \ locally by the harness script from\n    `harness/fitness-functions/commit_messages.py`.\n\
  \nCompatibility policy:\n- No change to CLI behavior.\n- The harness validator script\
  \ remains the supported entrypoint for policy enforcement.\n"
acceptance:
- Commit subject policy logic lives at `harness/fitness-functions/commit_messages.py`.
- '`harness/fitness-functions/validate_commit_messages.py` imports the policy logic
  locally and continues to behave the same.'
- Repository tests validate commit subject policy behavior without importing `engineeringagent.commit_messages`.
- '`uv run pytest -q` passes and gate wiring referencing `validate_commit_messages.py`
  remains valid.'
subtasks:
- id: ST-001
  title: Move commit message policy module into harness
  status: done
  context: 'Move `src/engineeringagent/commit_messages.py` to

    `harness/fitness-functions/commit_messages.py`.

    '
  verification:
  - uv run python harness/fitness-functions/validate_commit_messages.py --help
- id: ST-002
  title: Update harness validator script to import policy locally
  status: done
  context: 'Update `harness/fitness-functions/validate_commit_messages.py` to import

    from `commit_messages` in the same directory.

    '
  verification:
  - uv run python harness/fitness-functions/validate_commit_messages.py --commit-range
    HEAD~1..HEAD
- id: ST-003
  title: Update tests to cover harness commit policy entrypoint
  status: done
  context: 'Update tests that previously imported `engineeringagent.commit_messages`
    to

    validate behavior via subprocess invocation of the harness validator script.

    '
  verification:
  - uv run pytest -q tests/test_commit_message_validation.py
- id: ST-004
  title: Confirm harness root YAML-only rule still passes
  status: done
  context: 'Ensure no new regular files were added directly under `harness/` and existing

    harness rules still pass after the move.

    '
  verification:
  - uv run python -m engineeringagent.cli fitness run --format json
- id: ST-005
  title: Apply reviewer cleanup to harness commit policy
  status: done
  context: 'Incorporate small clarity/maintenance simplifications after relocating

    the commit subject policy into the harness fitness-functions zone.

    '
  verification:
  - uv run pytest -q tests/test_commit_message_validation.py
